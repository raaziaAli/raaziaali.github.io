  /* ── drawing ── */

  .bis{stroke:var(--green);stroke-width:2.8;fill:none;stroke-linecap:round}
  .circum{stroke:var(--violet);stroke-width:2.2;fill:none;opacity:.7;stroke-dasharray:8 6}

  .lbl.acc{fill:#C24E12} .lbl.vio{fill:var(--violet)} .lbl.grn{fill:var(--green)}
  .lbl.c1{fill:var(--s1)} .lbl.c2{fill:var(--s2)} .lbl.c3{fill:var(--s3)}

    <h1 class="mark">Compass &amp; Straightedge <em>Studio</em></h1>

  <nav class="tabs" id="tabs" role="tablist"></nav>

  <div class="stage">
    <section class="board">
      <div class="board-head">
        <h2 id="boardTitle">—</h2>
        <span class="hint" id="boardHint">Drag the amber points</span>
      </div>

<script>
(function(){
"use strict";

/* ============================ geometry ============================ */
const V = {w:700, h:480};
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]];
const mul=(a,k)=>[a[0]*k,a[1]*k];
const len=a=>Math.hypot(a[0],a[1]);
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const unit=a=>{const L=len(a)||1;return [a[0]/L,a[1]/L];};
const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
const perp=a=>[-a[1],a[0]];
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

// intersections of two circles -> [p1,p2] or []
function circleCircle(c1,r1,c2,r2){
  const d=dist(c1,c2);
  if(d===0||d>r1+r2||d<Math.abs(r1-r2)) return [];
  const a=(r1*r1-r2*r2+d*d)/(2*d);
  const h=Math.sqrt(Math.max(0,r1*r1-a*a));
  const u=unit(sub(c2,c1));
  const m=add(c1,mul(u,a));
  const p=perp(u);
  return [add(m,mul(p,h)), add(m,mul(p,-h))];
}
// intersection of ray (P + t*dir, t>0) with circle -> nearest positive t point
function rayCircle(P,dir,c,r){
  const u=unit(dir), f=sub(P,c);
  const b=2*(f[0]*u[0]+f[1]*u[1]);
  const cc=f[0]*f[0]+f[1]*f[1]-r*r;
  const disc=b*b-4*cc;
  if(disc<0) return null;
  const s=Math.sqrt(disc);
  const ts=[(-b-s)/2,(-b+s)/2].filter(t=>t>0.0001).sort((x,y)=>x-y);
  if(!ts.length) return null;
  return add(P,mul(u,ts[0]));
}
function footOnLine(P,a,b){
  const ab=sub(b,a), t=((P[0]-a[0])*ab[0]+(P[1]-a[1])*ab[1])/(ab[0]*ab[0]+ab[1]*ab[1]);
  return add(a,mul(ab,t));
}
function circumcenter(A,B,C){
  const d=2*(A[0]*(B[1]-C[1])+B[0]*(C[1]-A[1])+C[0]*(A[1]-B[1]));
  if(Math.abs(d)<1e-9) return null;
  const a2=A[0]*A[0]+A[1]*A[1], b2=B[0]*B[0]+B[1]*B[1], c2=C[0]*C[0]+C[1]*C[1];
  return [(a2*(B[1]-C[1])+b2*(C[1]-A[1])+c2*(A[1]-B[1]))/d,
          (a2*(C[0]-B[0])+b2*(A[0]-C[0])+c2*(B[0]-A[0]))/d];
}
function incenter(A,B,C){
  const a=dist(B,C), b=dist(C,A), c=dist(A,B), s=a+b+c;
  return [(a*A[0]+b*B[0]+c*C[0])/s,(a*A[1]+b*B[1]+c*C[1])/s];
}
// pick the intersection farther from / nearer to a reference point
const farther=(pair,ref)=> pair.length? (dist(pair[0],ref)>=dist(pair[1],ref)?pair[0]:pair[1]) : null;
const nearer =(pair,ref)=> pair.length? (dist(pair[0],ref)< dist(pair[1],ref)?pair[0]:pair[1]) : null;
// pick the intersection on a chosen side of directed line a->b
function sideOf(pair,a,b,sign){
  if(!pair.length) return null;
  const cr=p=>(b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0]);
  return (Math.sign(cr(pair[0]))===sign)?pair[0]:pair[1];
}

/* ======================= element constructors ===================== */
let KEY=0;
const C  =(s,c,r,cls)=>({step:s,type:'circle',c,r,cls:cls||'arc'});
const SEG=(s,a,b,cls)=>({step:s,type:'seg',a,b,cls:cls||'given'});
const RAY=(s,a,b,cls)=>({step:s,type:'ray',a,b,cls:cls||'given'});
const LIN=(s,a,b,cls)=>({step:s,type:'line',a,b,cls:cls||'given'});
const PT =(s,p,label,cls,ref)=>({step:s,type:'point',p,label,cls:cls||'',ref:ref||[V.w/2,V.h/2]});
const HND=(s,p,id,label,ref)=>({step:s,type:'point',p,label,cls:'node',drag:id,ref:ref||[V.w/2,V.h/2]});
const RA =(s,at,d1,d2)=>({step:s,type:'rightangle',at,d1,d2});
const ARC=(s,c,r,a1,a2,cls)=>({step:s,type:'arc',c,r,a1,a2,cls:cls||'arc'});
const TXT=(s,p,text,cls)=>({step:s,type:'text',p,text,cls:cls||'cap'});
const D2R=Math.PI/180;
const polar=(c,r,d)=>[c[0]+r*Math.cos(d*D2R), c[1]-r*Math.sin(d*D2R)];
function arcD(c,r,a1,a2){
  const s1=polar(c,r,a1), e1=polar(c,r,a2), sw=((a2-a1)%360+360)%360;
  return 'M '+s1[0]+' '+s1[1]+' A '+r+' '+r+' 0 '+(sw>180?1:0)+' 0 '+e1[0]+' '+e1[1];
}
const POLY=(s,pts,cls)=>({step:s,type:'poly',pts,cls:cls||'result'});

/* ============================= modules ============================ */
const MODULES = [];

/* --- 1. Equilateral triangle (Euclid, Proposition 1) --- */
MODULES.push({
  id:'equilateral', accent:'var(--yellow)',
  tab:'Equilateral triangle',
  title:'Construct an equilateral triangle',
  hint:'Drag J or S',
  pts:{J:[215,330], S:[440,330]},
  why:`<p>Both circles are drawn with the <b>same radius</b>, <i>JS</i>.</p>
       <p><i>JM</i> is a radius of circle <i>J</i>, so <i>JM</i> = <i>JS</i>. <i>SM</i> is a radius of circle <i>S</i>, so <i>SM</i> = <i>SJ</i>.</p>
       <p>Two segments equal to the same segment are equal to each other, so <i>JS</i> = <i>JM</i> = <i>SM</i> — the triangle is equilateral no matter where you drag <i>J</i> and <i>S</i>.</p>`,
  build(P){
    const J=P.J, S=P.S, r=dist(J,S);
    const ix=circleCircle(J,r,S,r);
    const M=ix.length? (ix[0][1]<ix[1][1]?ix[0]:ix[1]) : null;
    const ctr=mid(J,S);
    const st=[];
    st.push({t:'Draw circle <i>J</i>: center <i>J</i>, radius <i>JS</i>.', els:[C(0,J,r)]});
    st.push({t:'Draw circle <i>S</i>: center <i>S</i>, radius <i>SJ</i>.', els:[C(1,S,r)]});
    st.push({t:'Label one intersection as <i>M</i>.', els: M?[PT(2,M,'M','',ctr)]:[]});
    st.push({t:'Join <i>S</i>, <i>J</i>, <i>M</i>.', els: M?[POLY(3,[J,S,M])]:[]});
    const base=[HND(0,J,'J','J',[V.w/2,V.h+120]), HND(0,S,'S','S',[V.w/2,V.h+120])];
    return {steps:st, base};
  }
});

/* --- 2. Angle bisector --- */
MODULES.push({
  id:'bisect', accent:'var(--cyan)',
  tab:'Bisect an angle',
  title:'Construct an angle bisector',
  hint:'Drag A or either arm',
  pts:{A:[110,400], H1:[380,95], H2:[640,375]},
  why:`<p>Circle <i>A</i> forces <i>AB</i> = <i>AC</i>. Circles <i>B</i> and <i>C</i> share the radius <i>BC</i>, so <i>BD</i> = <i>CD</i>.</p>
       <p>Triangles <i>ABD</i> and <i>ACD</i> therefore have three pairs of equal sides, so the two halves of the angle are equal.</p>
       <p><b>Key fact for Lesson 5:</b> every point on the bisector is <span class="term">equidistant</span> from the two rays of the angle.</p>`,
  build(P){
    const A=P.A;
    const d1=sub(P.H1,A), d2=sub(P.H2,A);
    const r=clamp(Math.min(len(d1),len(d2))*0.55,60,185);
    const B=add(A,mul(unit(d1),r)), Cp=add(A,mul(unit(d2),r));
    const rr=dist(B,Cp);
    const D=farther(circleCircle(B,rr,Cp,rr),A);
    const st=[];
    st.push({t:'Label the vertex of the angle as <i>A</i>.', els:[PT(0,A,'A','',[V.w,V.h])]});
    st.push({t:'Draw circle <i>A</i>: center <i>A</i>, any size radius.', els:[C(1,A,r)]});
    st.push({t:'Label the intersections of circle <i>A</i> with the rays of the angle as <i>B</i> and <i>C</i>.',
             els:[PT(2,B,'B','',A), PT(2,Cp,'C','',A)]});
    st.push({t:'Draw circle <i>B</i>: center <i>B</i>, radius <i>BC</i>.', els:[C(3,B,rr)]});
    st.push({t:'Draw circle <i>C</i>: center <i>C</i>, radius <i>CB</i>.', els:[C(4,Cp,rr)]});

  why:`<p>Four words are never defined: <b>point</b>, <b>line</b>, <b>plane</b>, and <b>distance along a line</b> (along with betweenness, space, and distance around a circular arc).</p>
       <p>They are given intuitive descriptions only — a point is a location, a line runs on forever in both directions. Everything else on this list is built out of them.</p>

    [96,164].forEach(x=>e.push(SEG(0,[x,330],[x,346],'result')));
    e.push(PT(0,[62,338],'A','',[130,404]), PT(0,[130,338],'M','',[130,300]), PT(0,[198,338],'B','',[130,404]));

    // 5 · perpendicular bisector & equidistant

    cap(572,424,'COLLINEAR  /  NONCOLLINEAR'); sub(572,446,'is there one line through all three?');
    return {steps:[{t:'',els:e}], base:[]};

      '<div class="lsn">Lesson 1 · segments and circles</div>'+
      D('Segment','The segment between points <i>A</i> and <i>B</i> is the set consisting of <i>A</i>, <i>B</i>, and all points on line <i>AB</i> between them.')+

      D('Radius','A segment from the center of a circle to a point on the circle. Because a circle is defined by a distance, "radius <i>AB</i>" may name the distance or the segment.')+

      D('Circumcenter','The point of concurrency of the three perpendicular bisectors of a triangle. It is the center of the circle that circumscribes the triangle, and it can fall outside the triangle.')+

MODULES.push({
  id:'facts', tab:'Assumptions & facts', title:'What may we assume, and what may the tools do?',
  hint:'Drag the amber points', accent:'var(--mint)', live:true, ref:true,
  panelTitle:'Two circles: how many points in common?', whyTitle:'What the two tools may do',
  why:`<p><span class="tag">Straightedge</span> Given any two points <i>A</i> and <i>B</i>, draw line <i>AB</i> or segment <i>AB</i>.</p>
       <p><span class="tag">Compass</span> Given any two points <i>C</i> and <i>B</i>, draw the circle with center <i>C</i> passing through <i>B</i>. Written: <b>Draw circle C: center C, radius CB.</b></p>
       <p><span class="tag">Mark</span> Select and label a point where lines or circles intersect.</p>
       <p>That is the whole toolkit. Every construction in this studio is only these three moves, repeated — which is why each step must name its center and its radius.</p>`,
  pts:{A:[252,252], B:[252,122], Cc:[432,252], D:[432,142]},
  build(P){
    const A=P.A, B=P.B, Cq=P.Cc, Dq=P.D;
    const r1=dist(A,B), r2=dist(Cq,Dq), d=dist(A,Cq);
    let ix=circleCircle(A,r1,Cq,r2);
    if(ix.length===2 && dist(ix[0],ix[1])<3) ix=[mid(ix[0],ix[1])];   // tangent: one point, not two
    const e=[C(0,A,r1,'arc1'), C(0,Cq,r2,'arc2'),
             SEG(0,A,B,'result'), SEG(0,Cq,Dq,'result'), SEG(0,A,Cq,'aux')];
    ix.forEach((p,i)=>e.push(PT(0,p,ix.length===1?'X':(i?'Y':'X'),'hot',mid(A,Cq))));
    if(ix.length===0 && Math.abs(d)>1) e.push(TXT(0,[mid(A,Cq)[0],mid(A,Cq)[1]-18],'no points in common','cap sm'));
    e.push(HND(0,A,'A','A',B), HND(0,B,'B','B',A), HND(0,Cq,'Cc','C',Dq), HND(0,Dq,'D','D',Cq));
    return {steps:[{t:'',els:e}], base:[], data:{r1:r1,r2:r2,d:d,n:ix.length}};
  },
  refPanel(){
    const s=state[modIndex], b=MODULES[modIndex].build(s.pts), D=b.data;
    const r1=D.r1, r2=D.r2, d=D.d, n=D.n;
    const f=v=>Math.round(v);
    let verdict, cond;
    if(Math.abs(d)<1 && Math.abs(r1-r2)<1){ verdict='every point in common'; cond='Same center and equal radii — the circles coincide.'; }
    else if(n===2){ verdict='two points in common'; cond='AC &lt; AB + CD  and  CD &lt; AB + AC  and  AB &lt; CD + AC'; }
    else if(n===1){ verdict='one point in common'; cond='AB + CD = AC, or AC + AB = CD, or AC + CD = AB'; }
    else { verdict='no points in common'; cond='AB + CD &lt; AC, or AB + AC &lt; CD, or CD + AC &lt; AB'; }
    return '<div class="readout" style="border-top:none">'+
      '<div><span>AB &nbsp;(radius of circle A)</span><b>'+f(r1)+'</b></div>'+
      '<div><span>CD &nbsp;(radius of circle C)</span><b>'+f(r2)+'</b></div>'+
      '<div><span>AC &nbsp;(between centers)</span><b>'+f(d)+'</b></div>'+
      '<div><span>AB + CD</span><b>'+f(r1+r2)+'</b></div>'+
      '<div class="verdict"><b style="color:#fff">'+verdict.toUpperCase()+'</b><br>'+cond+'</div></div>'+
      '<div class="prose" style="border-top:1px solid var(--edge)"><p>Every construction here rests on the middle case. An equilateral triangle exists because two circles of radius <i>AB</i> drawn from <i>A</i> and <i>B</i> <b>must</b> cross in two points — drag the radii small and watch the construction become impossible.</p></div>'+
      '<div class="lsn" style="padding:16px 20px 6px;font-family:var(--display);font-weight:600;font-size:13px;color:var(--yellow)">Assumed about points and lines</div>'+
      '<ol class="rules">'+
      '<li>Given any two distinct points, there is <b>exactly one line</b> that contains them.</li>'+
      '<li>Every plane contains at least <b>three noncollinear points</b>.</li>'+
      '<li>To every pair of points <i>A</i>, <i>B</i> there corresponds a number dist(<i>A</i>,<i>B</i>) ≥ 0, with dist(<i>A</i>,<i>B</i>) = dist(<i>B</i>,<i>A</i>), equal to 0 exactly when the points coincide.</li>'+
      '<li>Every line has a <b>coordinate system</b> — it can be treated as a number line, and the distance between two of its points is the absolute value of the difference of their numbers.</li>'+
      '</ol>'+
      '<div class="lsn" style="padding:6px 20px 6px;font-family:var(--display);font-weight:600;font-size:13px;color:var(--yellow)">Assumed about angles</div>'+
      '<ol class="rules">'+
      '<li>A line splits the rest of the plane into <b>two half-planes</b>; each is convex, and a segment joining a point of one to a point of the other crosses the line.</li>'+
      '<li>For any point <i>C</i> in the interior of ∠<i>AOB</i>, ray <i>OC</i> intersects segment <i>AB</i>.</li>'+
      '<li>To every ∠<i>AOB</i> there corresponds a measure with <b>0° &lt; m∠AOB &lt; 180°</b>.</li>'+
      '<li>If <i>C</i> is in the interior of ∠<i>AOB</i>, then m∠<i>AOC</i> + m∠<i>COB</i> = m∠<i>AOB</i>.</li>'+
      '<li>If two angles form a <b>linear pair</b>, they are supplementary.</li>'+
      '<li>For every <i>r</i> with 0° &lt; <i>r</i>° &lt; 180°, there is exactly one ray on a given side of a line making an angle of <i>r</i>° with it.</li>'+
      '</ol>';
  }
});

/* ============================== render ============================ */
const svgNS='http://www.w3.org/2000/svg';
const canvas=document.getElementById('canvas');
const tabsEl=document.getElementById('tabs');
const controlsEl=document.getElementById('controls');
const stepListEl=document.getElementById('stepList');
const whyEl=document.getElementById('whyText');
const titleEl=document.getElementById('boardTitle');
const hintEl=document.getElementById('boardHint');
const panelTitle=document.getElementById('stepPanelTitle');

let modIndex=0, step=-1, drawn=new Set(), playing=null, drag=null;
const state=MODULES.map(m=>({pts:JSON.parse(JSON.stringify(m.pts)),
  opt:(m.options||[]).reduce((o,x)=>(o[x.id]=x.on,o),{})}));

function extend(a,b,both){
  const u=unit(sub(b,a)), L=2200;
  return both? [add(a,mul(u,-L)), add(a,mul(u,L))] : [a, add(a,mul(u,L))];
}

function build(){
  const m=MODULES[modIndex], s=state[modIndex];
  return m.build(s.pts, s.opt);
}

function keyOf(e,i){
  return [e.type,e.cls||'',e.label||'',e.drag||'',i].join('|');
}

function render(animate){
  const m=MODULES[modIndex];
  document.documentElement.style.setProperty('--accent', m.accent||'var(--cyan)');
  const res=build();
  const els=[...res.base];
  res.steps.forEach((st,i)=>{ if(m.live||i<=step) els.push(...st.els); });

  canvas.innerHTML='';
  const defs=document.createElementNS(svgNS,'defs');
  defs.innerHTML='<clipPath id="frame"><rect x="0" y="0" width="'+V.w+'" height="'+V.h+'"/></clipPath>'+
    '<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">'+
    '<path d="M32 0H0V32" fill="none" stroke="var(--grid)" stroke-width="1" opacity="0.75"/></pattern>';
  canvas.appendChild(defs);
  const bg=document.createElementNS(svgNS,'rect');
  bg.setAttribute('width',V.w);bg.setAttribute('height',V.h);bg.setAttribute('fill','url(#grid)');
  canvas.appendChild(bg);

  const g=document.createElementNS(svgNS,'g');
  g.setAttribute('clip-path','url(#frame)');
  canvas.appendChild(g);

  const fresh=[];
  els.forEach((e,i)=>{
    const k=keyOf(e,i);
    const isNew=animate && !drawn.has(k);
    const nodes=drawEl(e,g);
    nodes.forEach(n=>{ if(isNew) fresh.push({n,e}); });
    drawn.add(k);
  });

  fresh.forEach(({n,e})=>{
    if(n.dataset.anim==='stroke'){
      n.classList.add('draw');
      n.style.strokeDashoffset='100';
      requestAnimationFrame(()=>requestAnimationFrame(()=>{n.style.strokeDashoffset='0';}));
      if(e.type==='circle') compassArm(g,e,n);
    }else if(n.dataset.anim==='pop'){
      n.classList.add('pop');
      n.style.opacity='0'; n.style.transform='scale(.2)';
      requestAnimationFrame(()=>requestAnimationFrame(()=>{n.style.opacity='1';n.style.transform='scale(1)';}));
    }
  });
}

function compassArm(g,e,src){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const arm=document.createElementNS(svgNS,'line');
  arm.setAttribute('class','arm');
  if(src) arm.style.stroke=getComputedStyle(src).stroke;
  arm.setAttribute('x1',e.c[0]); arm.setAttribute('y1',e.c[1]);
  g.appendChild(arm);
  const t0=performance.now(), T=760;
  (function tick(now){
    const p=Math.min(1,(now-t0)/T), a=p*Math.PI*2;
    arm.setAttribute('x2',e.c[0]+e.r*Math.cos(a));
    arm.setAttribute('y2',e.c[1]+e.r*Math.sin(a));
    if(p<1) requestAnimationFrame(tick);
    else arm.remove();
  })(performance.now());
}

function drawEl(e,g){
  const made=[];
  const mk=(tag,attrs,anim)=>{
    const n=document.createElementNS(svgNS,tag);
    for(const k in attrs) n.setAttribute(k,attrs[k]);
    if(anim){n.setAttribute('pathLength',100);n.style.strokeDasharray='100';n.dataset.anim='stroke';}
    g.appendChild(n); made.push(n); return n;
  };
  if(e.type==='circle'){
    mk('circle',{cx:e.c[0],cy:e.c[1],r:Math.max(1,e.r),class:e.cls},true);
  }else if(e.type==='seg'){
    mk('line',{x1:e.a[0],y1:e.a[1],x2:e.b[0],y2:e.b[1],class:e.cls},true);
  }else if(e.type==='ray'||e.type==='line'){
    const [p,q]=extend(e.a,e.b,e.type==='line');
    mk('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],class:e.cls},true);
  }else if(e.type==='poly'){
    const pts=e.pts.map(p=>p.join(',')).join(' ');
    mk('polygon',{points:pts,class:e.cls,fill:e.cls==='result'?'rgba(217,144,43,.10)':'rgba(43,63,74,.05)'},true);
  }else if(e.type==='rightangle'){
    const s=13, a=mul(unit(e.d1),s), b=mul(unit(e.d2),s);
    const p1=add(e.at,a), p2=add(add(e.at,a),b), p3=add(e.at,b);
    mk('polyline',{points:[p1,p2,p3].map(p=>p.join(',')).join(' '),
      fill:'none',stroke:'var(--graphite)','stroke-width':1.3,opacity:.85});
  }else if(e.type==='arc'){
    mk('path',{d:arcD(e.c,e.r,e.a1,e.a2),class:e.cls,fill:'none'},true);
  }else if(e.type==='text'){
    const n=document.createElementNS(svgNS,'text');
    n.setAttribute('x',e.p[0]);n.setAttribute('y',e.p[1]);n.setAttribute('class',e.cls||'lbl');
    n.textContent=e.text; g.appendChild(n); made.push(n);
  }else if(e.type==='measure'){
    const put=(from,to,txt)=>{
      const m=mid(from,to), n=document.createElementNS(svgNS,'text');
      n.setAttribute('x',m[0]+8);n.setAttribute('y',m[1]-6);
      n.setAttribute('class','lbl acc');n.setAttribute('font-size','12.5');n.setAttribute('font-style','normal');
      n.textContent=txt; g.appendChild(n); made.push(n);
    };
    put(e.p,e.a,'PA = '+Math.round(dist(e.p,e.a)));
    put(e.p,e.b,'PB = '+Math.round(dist(e.p,e.b)));
  }else if(e.type==='point'){
    if(e.drag){
      const h=document.createElementNS(svgNS,'circle');
      h.setAttribute('cx',e.p[0]);h.setAttribute('cy',e.p[1]);h.setAttribute('r',17);
      h.setAttribute('class','handle');h.dataset.drag=e.drag;
      g.appendChild(h);
    }
    const d=document.createElementNS(svgNS,'circle');
    d.setAttribute('cx',e.p[0]);d.setAttribute('cy',e.p[1]);d.setAttribute('r',e.drag?6:5.4);
    d.setAttribute('class','dot '+(e.cls||''));
    d.dataset.anim='pop';
    g.appendChild(d); made.push(d);
    if(e.label){
      let u=unit(sub(e.p,e.ref));
      if(!isFinite(u[0])||!isFinite(u[1])||(u[0]===0&&u[1]===0)) u=[0,-1];
      const L=add(e.p,mul(u,26));
      const t=document.createElementNS(svgNS,'text');
      t.setAttribute('x',L[0]);t.setAttribute('y',L[1]+5);
      t.setAttribute('text-anchor','middle');
      const LC={hot:'vio',hot2:'grn',node:'acc',s1:'c1',s2:'c2',s3:'c3'};
      t.setAttribute('class','lbl '+(LC[e.cls]||''));
      t.textContent=e.label; g.appendChild(t);
    }
  }
  return made;
}

/* ============================ interface =========================== */
function renderTabs(){
  tabsEl.innerHTML='';
  MODULES.forEach((m,i)=>{
    const b=document.createElement('button');
    b.setAttribute('role','tab');
    b.setAttribute('aria-selected',i===modIndex);
    b.innerHTML='<span class="n">'+(i+1)+'</span>'+m.tab;
    b.onclick=()=>{modIndex=i;reset();};
    tabsEl.appendChild(b);
  });
}

function renderPanel(){
  const m=MODULES[modIndex], s=state[modIndex];
  titleEl.textContent=m.title;
  hintEl.textContent=m.hint;
  whyEl.innerHTML=m.why;
  document.querySelector('#whyPanel h3').textContent = m.whyTitle || 'Why it works';

  if(m.ref){
    const r0=document.getElementById('readout'); if(r0) r0.remove();
    panelTitle.textContent=m.panelTitle||'Reference';
    document.getElementById('stepList').outerHTML='<div id="stepList"></div>';
    document.getElementById('stepList').innerHTML=m.refPanel();
    return;
  }
  if(m.live){
    panelTitle.textContent='Show on the figure';
    document.getElementById('stepList').outerHTML='<div class="toggles" id="stepList"></div>';
    const box=document.getElementById('stepList');
    m.options.forEach(o=>{
      const l=document.createElement('label');
      const c=document.createElement('input');
      c.type='checkbox'; c.checked=s.opt[o.id];
      c.onchange=()=>{s.opt[o.id]=c.checked;render(false);readout();};
      l.appendChild(c);
      l.appendChild(document.createTextNode(o.label));
      const sw=document.createElement('span');
      sw.className='swatch'; sw.style.background=o.color;
      l.appendChild(sw);
      box.appendChild(l);
    });
    let r=document.getElementById('readout');
    if(!r){ r=document.createElement('div'); r.className='readout'; r.id='readout';
      document.getElementById('stepPanel').appendChild(r); }
  }else{
    const r=document.getElementById('readout'); if(r) r.remove();
    panelTitle.textContent='Steps';
    const holder=document.getElementById('stepList');
    holder.outerHTML='<ol class="steps" id="stepList"></ol>';
    const ol=document.getElementById('stepList');
    build().steps.forEach((st,i)=>{
      const li=document.createElement('li');
      li.className=i<step?'done':i===step?'now':'';
      li.innerHTML='<span class="num">'+(i+1)+'</span><span>'+st.t+'</span>';
      if(st.col) li.querySelector('.num').style.color=st.col;
      li.onclick=()=>{step=i;drawn=new Set();render(true);renderPanel();renderControls();};
      li.style.cursor='pointer';
      ol.appendChild(li);
    });
  }
}

function readout(){
  const m=MODULES[modIndex]; if(!m.live) return;
  const box=document.getElementById('readout'); if(!box) return;
  const {O,I,A,B,C:Cc}=build().data;
  const s=state[modIndex].opt;
  let h='';
  if(s.perpb&&O){
    h+='<div><span>PA</span><b>'+dist(O,A).toFixed(1)+'</b></div>'+
       '<div><span>PB</span><b>'+dist(O,B).toFixed(1)+'</b></div>'+
       '<div><span>PC</span><b>'+dist(O,Cc).toFixed(1)+'</b></div>';
  }
  if(s.angb&&I){
    const d1=dist(I,footOnLine(I,A,B)),d2=dist(I,footOnLine(I,B,Cc)),d3=dist(I,footOnLine(I,Cc,A));
    h+='<div><span>Q to AB</span><b>'+d1.toFixed(1)+'</b></div>'+
       '<div><span>Q to BC</span><b>'+d2.toFixed(1)+'</b></div>'+
       '<div><span>Q to CA</span><b>'+d3.toFixed(1)+'</b></div>';
  }
  // classify the triangle
  const sides=[dist(B,Cc),dist(Cc,A),dist(A,B)].sort((x,y)=>x-y);
  const t=sides[2]*sides[2]-(sides[0]*sides[0]+sides[1]*sides[1]);
  const kind=Math.abs(t)<180?'right':t>0?'obtuse':'acute';
  const where=kind==='obtuse'?'outside the triangle':kind==='right'?'on the hypotenuse':'inside the triangle';
  h+='<div class="verdict">Triangle is '+kind+' — the circumcenter sits '+where+'. The incenter is always inside.</div>';
  box.innerHTML=h;
}

function renderControls(){
  const m=MODULES[modIndex];
  controlsEl.innerHTML='';
  if(m.ref){
    if(m.id==='facts'){
      const b=document.createElement('button');
      b.textContent='Reset circles';
      b.onclick=()=>{state[modIndex].pts=JSON.parse(JSON.stringify(m.pts));render(false);renderPanel();};
      controlsEl.appendChild(b);
    }
    const n=document.createElement('span');
    n.className='counter';
    n.textContent = m.id==='facts' ? 'Drag A, B, C or D' : 'Reference — nothing to step through';
    controlsEl.appendChild(n);
    return;
  }
  if(m.live){
    const b=document.createElement('button');
    b.textContent='Reset triangle';
    b.onclick=()=>{state[modIndex].pts=JSON.parse(JSON.stringify(m.pts));render(false);readout();};
    controlsEl.appendChild(b);
    const note=document.createElement('span');
    note.className='counter'; note.textContent='Drag A, B or C';
    controlsEl.appendChild(note);
    return;
  }
  const total=build().steps.length;
  const mkBtn=(label,fn,cls,dis)=>{
    const b=document.createElement('button');
    b.textContent=label; b.onclick=fn; if(cls)b.className=cls; b.disabled=!!dis;
    controlsEl.appendChild(b); return b;
  };
  mkBtn('Next step',()=>go(step+1),'primary',step>=total-1);
  mkBtn('Back',()=>go(step-1),'',step<0);
  mkBtn(playing?'Pause':'Play all',togglePlay);
  mkBtn('Start over',()=>{stop();step=-1;drawn=new Set();render(false);renderPanel();renderControls();});
  const c=document.createElement('span');
  c.className='counter';
  c.textContent = step<0 ? 'Given figure' : 'Step '+(step+1)+' of '+total;
  controlsEl.appendChild(c);
}

function go(i){
  const total=build().steps.length;
  const next=clamp(i,-1,total-1);
  if(next<step){ drawn=new Set(); step=next; render(false); }
  else { step=next; render(true); }
  renderPanel(); renderControls();
  if(step>=total-1) stop();
}
function togglePlay(){
  if(playing){stop();renderControls();return;}
  if(step>=build().steps.length-1){step=-1;drawn=new Set();render(false);}
  playing=setInterval(()=>{
    const total=build().steps.length;
    if(step>=total-1){stop();renderControls();return;}
    go(step+1);
  },1150);
  go(step+1);
  renderControls();
}
function stop(){ if(playing){clearInterval(playing);playing=null;} }

function reset(){
  stop(); step=-1; drawn=new Set();
  renderTabs(); renderPanel(); renderControls();
  render(false);
  const M=MODULES[modIndex];
  if(M.live && !M.ref) readout();
}

/* ============================= dragging =========================== */
function svgPoint(evt){
  const r=canvas.getBoundingClientRect();
  return [ (evt.clientX-r.left)*V.w/r.width, (evt.clientY-r.top)*V.h/r.height ];
}
canvas.addEventListener('pointerdown',e=>{
  const id=e.target.dataset && e.target.dataset.drag;
  if(!id) return;
  drag=id; canvas.setPointerCapture(e.pointerId); stop();
  e.preventDefault();
});
canvas.addEventListener('pointermove',e=>{
  if(!drag) return;
  const p=svgPoint(e), s=state[modIndex];
  s.pts[drag]=[clamp(p[0],14,V.w-14),clamp(p[1],14,V.h-14)];
  render(false);
  const M=MODULES[modIndex];
  if(M.ref){ if(M.refPanel) renderPanel(); }
  else if(M.live) readout();
});
canvas.addEventListener('pointerup',()=>{drag=null;});
canvas.addEventListener('pointercancel',()=>{drag=null;});

document.addEventListener('keydown',e=>{
  if(MODULES[modIndex].live) return;
  if(e.key==='ArrowRight'){go(step+1);e.preventDefault();}
  if(e.key==='ArrowLeft'){go(step-1);e.preventDefault();}
});

reset();
})();
</script>
