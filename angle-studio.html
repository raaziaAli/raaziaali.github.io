<style>
  :root{
    --bg:#0A0A1F; --bg-lift:#13132B; --card:#1C1C3A; --card-2:#242449;
    --cyan:#00E5FF; --magenta:#FF3D8A; --yellow:#FFD93D; --lavender:#C4B5FD;
    --coral:#FF6B6B; --mint:#5EEAD4;
    --accent:var(--cyan);
    --text:#F8F9FF; --dim:#A5A5C9; --edge:rgba(196,181,253,.20);

    --board:#FFFFFF; --grid:#DCE6F7;
    --ink:#14213D; --graphite:#22314F;
    --vert:#7C3AED; --lin:#EA580C; --corr:#0284C7; --alt:#059669;
    --altx:#DB2777; --same:#DC2626; --samex:#0891B2;
    --unk:#E11D48; --hand:#FF6B35;

    --display:"Unbounded","Trebuchet MS",system-ui,sans-serif;
    --ui:"DM Sans",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);font-family:var(--ui);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;position:relative;min-height:100vh;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse at 12% 8%,rgba(0,229,255,.13),transparent 55%),
               radial-gradient(ellipse at 88% 22%,rgba(255,61,138,.12),transparent 55%),
               radial-gradient(ellipse at 50% 105%,rgba(196,181,253,.10),transparent 60%);}
  .wrap{max-width:1220px;margin:0 auto;padding:26px 20px 70px;position:relative;z-index:1}

  header.masthead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .mark{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.6vw,38px);margin:0;letter-spacing:-.01em;
    background:linear-gradient(92deg,var(--cyan),var(--lavender) 55%,var(--magenta));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .eyebrow{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .masthead .eyebrow{margin-left:auto;text-align:right;
    border:1px solid var(--edge);border-radius:100px;padding:7px 15px;background:rgba(255,255,255,.03)}

  nav.tabs{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:20px}
  nav.tabs button{
    font-family:var(--ui);font-size:15px;font-weight:500;
    background:var(--card);color:var(--dim);border:1px solid var(--edge);border-radius:100px;
    padding:11px 19px;cursor:pointer;transition:transform .16s,color .16s,box-shadow .16s,background .16s;
  }
  nav.tabs button:hover{color:#fff;transform:translateY(-2px);background:var(--card-2)}
  nav.tabs button[aria-selected="true"]{
    color:#0A0A1F;background:var(--accent);border-color:var(--accent);font-weight:700;
    box-shadow:0 0 26px -4px var(--accent);
  }
  nav.tabs button .n{font-family:var(--mono);font-size:12px;font-weight:700;opacity:.6;margin-right:9px}
  nav.tabs button:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

  .stage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(330px,1fr);gap:22px;align-items:start}
  @media (max-width:960px){.stage{grid-template-columns:1fr}}

  .board{background:var(--card);border:1px solid var(--edge);border-radius:20px;overflow:hidden;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.8)}
  .board-head{display:flex;align-items:center;gap:12px;padding:16px 20px;flex-wrap:wrap;
    background:linear-gradient(90deg,var(--card-2),var(--card));border-bottom:1px solid var(--edge)}
  .board-head h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0;color:#fff;line-height:1.3}
  .board-head .lsn{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em;
    color:var(--accent);border:1px solid var(--accent);border-radius:100px;padding:5px 13px;white-space:nowrap}
  svg.canvas{display:block;width:100%;height:auto;background:linear-gradient(170deg,#FFFFFF 0%,#EEF4FF 100%);touch-action:none}

  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:15px 20px;background:var(--card-2);border-top:1px solid var(--edge)}
  .bar button,.seg button{font-family:var(--ui);font-size:14.5px;font-weight:600;border:1px solid var(--edge);
    background:rgba(255,255,255,.06);color:var(--text);padding:10px 17px;border-radius:100px;cursor:pointer;transition:.16s}
  .bar button:hover,.seg button:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
  .bar button.primary{background:var(--accent);color:#0A0A1F;border-color:var(--accent);box-shadow:0 0 22px -6px var(--accent)}
  .seg{display:inline-flex;gap:6px}

  .bar label.chk{display:inline-flex;align-items:center;gap:9px;font-size:14.5px;color:var(--text);cursor:pointer;

  .bar label.chk input{accent-color:var(--accent);width:17px;height:17px}
  .bar .spacer{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--dim)}
  .bar select{width:auto;max-width:340px}
  .chiprow{display:flex;flex-wrap:wrap;gap:7px;width:100%;margin-bottom:2px}
  .chiprow button{font-family:var(--ui);font-size:13.5px;font-weight:600;cursor:pointer;
    padding:8px 14px;border-radius:100px;background:rgba(255,255,255,.05);
    border:1.5px solid var(--c);color:#E7E9FA;transition:.15s;display:flex;align-items:center;gap:8px}
  .chiprow button::before{content:"";width:10px;height:10px;border-radius:10px;background:var(--c)}
  .chiprow button:hover{background:rgba(255,255,255,.12)}
  .chiprow button[aria-pressed="true"]{background:var(--c);color:#0A0A1F;font-weight:700}
  .chiprow button[aria-pressed="true"]::before{background:rgba(10,10,31,.55)}
  .rel[data-pair]{cursor:pointer}
  .rel[data-pair]:hover{background:rgba(255,255,255,.05)}
  .rel.active{background:rgba(255,255,255,.09);box-shadow:inset 3px 0 0 var(--accent)}
  .note{margin:0 20px 16px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.55;
    background:rgba(255,217,61,.10);border:1px solid rgba(255,217,61,.35);color:#FBEFC9}
  .note b{color:#fff}

  .panel{border:1px solid var(--edge);border-radius:18px;background:var(--card);margin-bottom:16px;overflow:hidden}
  .panel h3{margin:0;padding:15px 20px;font-family:var(--display);font-weight:600;font-size:14px;

    border-bottom:1px solid var(--edge)}
  .pad{padding:16px 20px;font-size:15px;color:#CFCFEA}
  .pad p{margin:0 0 11px} .pad p:last-child{margin-bottom:0}
  .pad b{color:#fff;font-weight:700}
  .term{font-weight:700;color:var(--accent)}

  .eq{font-family:var(--mono);font-size:14.5px;font-weight:600;color:#fff;background:rgba(0,0,0,.28);
    border:1px solid var(--edge);border-left:4px solid var(--accent);padding:13px 15px;margin:12px 0;
    border-radius:0 12px 12px 0;overflow-x:auto;white-space:pre-wrap;line-height:1.75}
  .eq small{display:block;font-family:var(--ui);font-size:13px;font-weight:400;color:var(--dim);margin-top:7px}

    padding:13px 20px;border-bottom:1px solid rgba(196,181,253,.12);font-size:15px}

  .rel .dot{width:13px;height:13px;border-radius:13px}
  .rel .nm{color:#fff;font-weight:500}
  .rel .nm em{font-style:normal;color:var(--dim);font-size:13px;display:block;font-weight:400}
  .rel .val{font-family:var(--mono);font-size:13.5px;font-weight:600;white-space:nowrap}

  select,input[type=number],input[type=text]{
    font-family:var(--ui);font-size:15px;background:#0F0F26;color:#fff;
    border:1px solid var(--edge);border-radius:12px;padding:12px 13px;width:100%;}
  select:focus,input:focus{outline:3px solid var(--accent);outline-offset:1px}
  label.fld{display:block;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.1em;
    text-transform:uppercase;color:var(--accent);margin:16px 20px 7px}
  .fldwrap{padding:0 20px}
  .go{width:100%;font-family:var(--ui);font-size:16px;font-weight:700;background:var(--accent);color:#0A0A1F;
    border:none;padding:14px;border-radius:100px;cursor:pointer;box-shadow:0 0 26px -6px var(--accent);transition:.16s}
  .go:hover{transform:translateY(-2px)}
  .ghost{font-family:var(--ui);font-size:15px;font-weight:600;background:transparent;color:var(--dim);
    border:1px solid var(--edge);padding:14px 18px;border-radius:100px;cursor:pointer}
  .ghost:hover{color:#fff}
  .verdict{margin:16px 20px;padding:14px 16px;border-radius:14px;font-size:15px;line-height:1.6}
  .verdict.good{background:rgba(94,234,212,.13);border:1px solid rgba(94,234,212,.45);color:#D7FBF3}
  .verdict.bad{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.4);color:#FFDCDA}
  .verdict b{color:#fff}

  table.facts{width:100%;border-collapse:collapse;font-size:14.5px}
  table.facts td{padding:12px 20px;border-bottom:1px solid rgba(196,181,253,.11);vertical-align:top}
  table.facts .ab{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--accent);white-space:nowrap}
  table.facts .st{color:#DDDDF2}
  table.facts .st i{display:block;color:var(--dim);font-style:normal;font-size:13px;margin-top:4px}
  .cathead{padding-top:18px!important;padding-bottom:6px!important;font-family:var(--display);font-weight:600;
    font-size:13px;letter-spacing:.02em;color:var(--yellow);border-bottom:none!important}
  .chip{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.09em;
    text-transform:uppercase;padding:4px 10px;border-radius:100px;margin-right:9px}
  .chip.assume{background:rgba(255,217,61,.18);color:var(--yellow)}
  .chip.proved{background:rgba(94,234,212,.16);color:var(--mint)}
  ol.chain{margin:0;padding:6px 20px 18px 38px;font-size:15px;color:#CFCFEA}
  ol.chain li{padding:8px 0} ol.chain li::marker{color:var(--accent);font-weight:700}
  ol.chain li b{color:#fff}

  .steps{width:100%;border-collapse:collapse;font-size:15px}
  .steps td{padding:12px 20px;border-bottom:1px solid rgba(196,181,253,.11);vertical-align:middle}
  .steps .stmt{font-family:var(--mono);font-size:14px;font-weight:600;color:#fff;white-space:nowrap}
  .steps .why{width:56%}
  .steps tr.right .stmt{color:var(--mint)}
  .steps tr.right select{border-color:rgba(94,234,212,.6)}
  .steps tr.wrong select{border-color:var(--coral)}

  /* ── drawing ── */
  .line{stroke:var(--graphite);stroke-width:2.8;fill:none;stroke-linecap:round}
  .thin{stroke:var(--graphite);stroke-width:1.8;fill:none}
  .aux{stroke:var(--corr);stroke-width:2.4;fill:none;stroke-dasharray:9 6}
  .wedge{stroke-width:2.4;fill-opacity:.17;cursor:pointer}
  .wedge.flat{cursor:default}
  .mk{font-family:var(--display);font-weight:600;font-size:20px;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
  .num{font-family:var(--mono);font-weight:700;font-size:16px;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
  .dot{fill:var(--ink);stroke:#fff;stroke-width:2}
  .grab{fill:rgba(255,107,53,.20);stroke:var(--hand);stroke-width:2;stroke-dasharray:4 3;cursor:grab}
  .grab:hover{fill:rgba(255,107,53,.35)}
  .rt{stroke:var(--graphite);stroke-width:1.8;fill:none;opacity:.9}
  footer.foot{margin-top:30px;padding-top:18px;border-top:1px solid var(--edge);font-size:14px;color:var(--dim)}
</style>

<script>
(function(){
"use strict";
/* ══════════════════════ helpers ══════════════════════ */
const NS="http://www.w3.org/2000/svg";
const VW=700, VH=460;
const cv=document.getElementById("cv"), bar=document.getElementById("bar"),
      side=document.getElementById("side"), tabsEl=document.getElementById("tabs"),
      bTitle=document.getElementById("bTitle"), bLesson=document.getElementById("bLesson");

const D2R=Math.PI/180;
const norm=d=>((d%360)+360)%360;
const PT=(c,r,deg)=>[c[0]+r*Math.cos(deg*D2R), c[1]-r*Math.sin(deg*D2R)];
const angOf=(c,p)=>norm(Math.atan2(-(p[1]-c[1]), p[0]-c[0])/D2R);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r1=v=>Math.round(v*10)/10;
const fmt=v=>{const s=r1(v); return (Math.abs(s-Math.round(s))<0.05? String(Math.round(s)) : s.toFixed(1));};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];

function E(tag,attrs){const n=document.createElementNS(NS,tag);for(const k in attrs)n.setAttribute(k,attrs[k]);return n;}
function clear(){while(cv.firstChild)cv.removeChild(cv.firstChild);}
function bg(){
  const d=E("defs");
  d.innerHTML='<pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">'+
    '<path d="M32 0H0V32" fill="none" stroke="var(--grid)" stroke-width="1" opacity="0.75"/></pattern>'+
    '<clipPath id="fr"><rect width="'+VW+'" height="'+VH+'"/></clipPath>';
  cv.appendChild(d);
  cv.appendChild(E("rect",{width:VW,height:VH,fill:"url(#g)"}));
  const g=E("g",{"clip-path":"url(#fr)"}); cv.appendChild(g); return g;
}
// full line through c at angle a
function fullLine(g,c,a,cls){
  const p=PT(c,2000,a), q=PT(c,2000,a+180);
  g.appendChild(E("line",{x1:p[0],y1:p[1],x2:q[0],y2:q[1],class:cls||"line"}));
}
function ray(g,c,a,len,cls){
  const p=PT(c,len,a);
  g.appendChild(E("line",{x1:c[0],y1:c[1],x2:p[0],y2:p[1],class:cls||"line"}));
}
function seg(g,p,q,cls){ g.appendChild(E("line",{x1:p[0],y1:p[1],x2:q[0],y2:q[1],class:cls||"line"})); }
function dot(g,p){ g.appendChild(E("circle",{cx:p[0],cy:p[1],r:5,class:"dot"})); }
function txt(g,p,s,cls,color,anchor){
  const t=E("text",{x:p[0],y:p[1],class:cls||"mk","text-anchor":anchor||"middle","dominant-baseline":"middle"});
  if(color)t.setAttribute("fill",color);
  t.textContent=s; g.appendChild(t); return t;
}
function grab(g,p,id){ g.appendChild(E("circle",{cx:p[0],cy:p[1],r:16,class:"grab","data-drag":id})); dot(g,p); }
// wedge from a1 counter-clockwise to a2
function wedge(g,c,a1,a2,r,color,opts){
  opts=opts||{};
  const s=PT(c,r,a1), e=PT(c,r,a2), sw=norm(a2-a1);
  const d="M "+c[0]+" "+c[1]+" L "+s[0]+" "+s[1]+" A "+r+" "+r+" 0 "+(sw>180?1:0)+" 0 "+e[0]+" "+e[1]+" Z";
  const p=E("path",{d:d,class:"wedge"+(opts.flat?" flat":""),stroke:color,fill:color});
  if(opts.dim){p.setAttribute("fill-opacity",.05);p.setAttribute("opacity",.5);}
  if(opts.id)p.setAttribute("data-ang",opts.id);
  g.appendChild(p);
  if(opts.label!==undefined&&opts.label!==null){
    const lp=PT(c,r+26,a1+sw/2);
    txt(g,lp,opts.label,opts.labelClass||"num",color);
  }
  return p;
}
function rightMark(g,c,a,size){
  size=size||13;
  const p1=PT(c,size,a), p3=PT(c,size,a+90);
  const p2=[p1[0]+(p3[0]-c[0]), p1[1]+(p3[1]-c[1])];
  g.appendChild(E("polyline",{points:[p1,p2,p3].map(p=>p.join(",")).join(" "),class:"rt"}));
}
// classify the 4 regions made by a line (angle L) and a transversal (angle T) at a point
function regions(L,T){
  const bounds=[norm(L),norm(L+180),norm(T),norm(T+180)].sort((a,b)=>a-b);
  const out={};
  const u=[Math.cos(T*D2R),Math.sin(T*D2R)];      // transversal, math coords
  const v=[Math.cos(L*D2R),Math.sin(L*D2R)];      // line, math coords
  for(let i=0;i<4;i++){
    const a1=bounds[i], a2=(i===3? bounds[0]+360 : bounds[i+1]);
    const m=(a1+a2)/2, p=[Math.cos(m*D2R),Math.sin(m*D2R)];
    const leftOfT = (u[0]*p[1]-u[1]*p[0])>0;      // left of transversal
    const above   = (v[0]*p[1]-v[1]*p[0])>0;      // above the line
    out[(above?"n":"s")+(leftOfT?"w":"e")]=[a1,a2];
  }
  return out;
}
const spanOf=r=>norm(r[1]-r[0]);

/* ══════════════════════ the fact bank ══════════════════════ */
const FACTS=[
 {id:"given", cat:"Setup", ab:"", st:"Given"},
 {id:"constr",cat:"Setup", ab:"", st:"Construction"},
 {id:"vert",  cat:"Angles at a point", ab:"vert. ∠s", st:"Vertical angles are equal in measure.", short:"Vertical angles"},
 {id:"add",   cat:"Angles at a point", ab:"∠s add",  st:"Angle addition postulate", short:"Angle addition"},
 {id:"line",  cat:"Angles at a point", ab:"∠s on a line", st:"Linear pairs form supplementary angles.", short:"Linear pair"},
 {id:"lineN", cat:"Angles at a point", ab:"∠s on a line", st:"Consecutive adjacent angles on a line sum to 180°.", short:"Angles on a line"},
 {id:"point", cat:"Angles at a point", ab:"∠s at a point", st:"Angles at a point sum to 360°.", short:"Angles at a point"},
 {id:"supDef",cat:"Angles at a point", ab:"", st:"Definition of supplementary angles"},
 {id:"sum",   cat:"Triangles", ab:"∠ sum of △", st:"The sum of the angle measures in a triangle is 180°.", short:"Triangle sum"},
 {id:"rtSum", cat:"Triangles", ab:"∠ sum of rt. △", st:"Acute angles in a right triangle sum to 90°."},
 {id:"ext",   cat:"Triangles", ab:"ext. ∠ of △", st:"The exterior angle of a triangle equals the sum of the two opposite interior angles.", short:"Exterior angle"},
 {id:"isos",  cat:"Triangles", ab:"base ∠s of isos. △", st:"Base angles of an isosceles triangle are equal in measure."},
 {id:"equil", cat:"Triangles", ab:"equilat. △", st:"All angles in an equilateral triangle have equal measure."},
 {id:"corr",  cat:"Parallel lines", ab:"corr. ∠s", st:"If parallel lines are cut by a transversal, then corresponding angles are equal in measure.", short:"Corresponding angles"},
 {id:"alt",   cat:"Parallel lines", ab:"alt. ∠s",  st:"If parallel lines are cut by a transversal, then alternate interior angles are equal in measure.", short:"Alternate interior angles"},
 {id:"int",   cat:"Parallel lines", ab:"int. ∠s",  st:"If parallel lines are cut by a transversal, then interior angles on the same side are supplementary.", short:"Same-side interior angles"},
 {id:"altx",  cat:"Parallel lines", ab:"alt. ext. ∠s", st:"If parallel lines are cut by a transversal, then alternate exterior angles are equal in measure.", short:"Alternate exterior angles", derived:"corresponding angles, then vertical angles"},
 {id:"samex", cat:"Parallel lines", ab:"ext. ∠s same side", st:"If parallel lines are cut by a transversal, then exterior angles on the same side are supplementary.", short:"Same-side exterior angles", derived:"corresponding angles, then a linear pair"},
 {id:"corrC", cat:"Converses (proving lines parallel)", ab:"corr. ∠s converse", st:"If two lines are cut by a transversal such that a pair of corresponding angles are equal in measure, then the lines are parallel."},
 {id:"altC",  cat:"Converses (proving lines parallel)", ab:"alt. ∠s converse",  st:"If two lines are cut by a transversal such that a pair of alternate interior angles are equal in measure, then the lines are parallel."},
 {id:"intC",  cat:"Converses (proving lines parallel)", ab:"int. ∠s converse",  st:"If two lines are cut by a transversal such that a pair of interior angles on the same side are supplementary, then the lines are parallel."},
 {id:"perp90",cat:"Perpendicular", ab:"", st:"Perpendicular lines form 90° angles."},
 {id:"perpDef",cat:"Perpendicular",ab:"", st:"If two lines intersect to form a right angle, then the two lines are perpendicular."},
 {id:"refl",  cat:"Properties of equality", ab:"", st:"Reflexive property"},

// rays from one point; spec.rays = [{a, full}], spec.marks = [{from,to,text,color,r}]
function drawPointFigure(g,c,spec){
  (spec.rays||[]).forEach(rr=>{ rr.full? fullLine(g,c,rr.a) : ray(g,c,rr.a,rr.len||190); });
  (spec.marks||[]).forEach(m=>{
    wedge(g,c,m.from,m.to,m.r||46,m.color||"var(--graphite)",{label:m.text,flat:true,labelClass:m.cls||"num"});
  });
  dot(g,c);
}
// two parallel lines + transversal, honest to theta
function transversalFrame(g,opt){
  const y1=opt.y1||140, y2=opt.y2||330, th=opt.theta, tilt=opt.tilt||0;
  const Q=[opt.tx||350,(y1+y2)/2];
  const t=[Math.cos(th*D2R),-Math.sin(th*D2R)];
  const P1=[Q[0]+(Q[1]-y1)/Math.sin(th*D2R)*Math.cos(th*D2R), y1];
  // second line: through (350,y2) with direction tilt
  const L2p=[350,y2], d2=[Math.cos(tilt*D2R),-Math.sin(tilt*D2R)];
  // intersect transversal (through P1 dir t) with line 2
  const den=t[0]*d2[1]-t[1]*d2[0];
  const w=[L2p[0]-P1[0],L2p[1]-P1[1]];
  const s=(w[0]*d2[1]-w[1]*d2[0])/den;
  const P2=[P1[0]+t[0]*s, P1[1]+t[1]*s];
  fullLine(g,[350,y1],0); fullLine(g,L2p,tilt); fullLine(g,P1,th);
  return {P1:P1,P2:P2,th:th,tilt:tilt,y1:y1,y2:y2};
}
// triangle from base BC and interior angles at B and C
function triangleFromAngles(B,C,angB,angC){
  const base=Math.atan2(-(C[1]-B[1]),C[0]-B[0])/D2R;
  const dB=base+angB, dC=base+180-angC;
  const u=[Math.cos(dB*D2R),-Math.sin(dB*D2R)], v=[Math.cos(dC*D2R),-Math.sin(dC*D2R)];
  const den=u[0]*v[1]-u[1]*v[0], w=[C[0]-B[0],C[1]-B[1]];
  const s=(w[0]*v[1]-w[1]*v[0])/den;
  return [B[0]+u[0]*s, B[1]+u[1]*s];
}
// build a triangle with the given base angles, scaled to fit a box
function fitTriangle(angB,angC,opt){
  opt=opt||{};
  const b0=[0,0], c0=[100,0];
  const a0=triangleFromAngles(b0,c0,angB,angC);
  const pts=[b0,c0,a0];
  if(opt.ext)pts.push([c0[0]+34,0]);
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const w=Math.max.apply(null,xs)-Math.min.apply(null,xs);
  const h=Math.max.apply(null,ys)-Math.min.apply(null,ys);
  const s=Math.min((opt.w||420)/w,(opt.h||250)/h);
  const cx=(Math.max.apply(null,xs)+Math.min.apply(null,xs))/2;
  const by=Math.max.apply(null,ys);
  const ox=(opt.cx||350), oy=(opt.baseY||350);
  const M=p=>[ox+(p[0]-cx)*s, oy+(p[1]-by)*s];
  return {A:M(a0),B:M(b0),C:M(c0)};
}
function interiorAngle(V,P,Q){ // angle at V in triangle, returns [a1,a2] ccw and measure
  const a=angOf(V,P), b=angOf(V,Q);
  const d=norm(b-a);
  return d<=180? {from:a,to:b,m:d} : {from:b,to:a,m:360-d};
}

  fig:{k:"trans2",theta:58,labels:{d:"∠BGH",c:"∠AGH",f:"∠DHG"}},
  plan:"You already have alternate interior angles. Pair one of them with a linear pair on the top line.",
  steps:[{s:"AB ∥ CD",r:"given"},
         {s:"m∠BGH + m∠AGH = 180°",r:"line"},
         {s:"m∠AGH = m∠DHG",r:"alt"},
         {s:"∴ m∠BGH + m∠DHG = 180°",r:"subst"}]},
 {id:"corr", name:"Corresponding angles are equal in measure",
  given:"AB ∥ CD; vertical angles and alternate interior angles are equal.", prove:"x = w",
  fig:{k:"trans2",theta:64,labels:{c:"x",f:"z",g:"w"}},
  plan:"You cannot reach x and w in one hop. Go through z: one step is vertical angles, the other is alternate interior angles.",
  steps:[{s:"AB ∥ CD",r:"given"},
         {s:"w = z",r:"vert"},
         {s:"z = x",r:"alt"},
         {s:"∴ x = w",r:"subst"}]},
 {id:"perp", name:"Two lines perpendicular to the same line are parallel",
  given:"AB ⊥ EF and CD ⊥ EF", prove:"AB ∥ CD",
  fig:{k:"perp"},
  plan:"Both right angles measure 90°, so they are equal to each other. Where they sit makes them a corresponding pair — now run a converse.",
  steps:[{s:"AB ⊥ EF, CD ⊥ EF",r:"given"},
         {s:"m∠AGH = 90°, m∠CHF = 90°",r:"perp90"},
         {s:"m∠AGH = m∠CHF",r:"trans"},
         {s:"∴ AB ∥ CD",r:"corrC"}]}
];
const PROOF_REASONS=["given","constr","vert","line","lineN","point","add","sum","ext","corr","alt","altx","int","samex","corrC","altC","intC","perp90","perpDef","trans","subst","subP","addP","part"];

function drawProofFigure(g,f){
  if(f.k==="cross"){
    const c=[350,230];
    fullLine(g,c,20); fullLine(g,c,115);
    const R=regions(20,115);
    wedge(g,c,R.nw[0],R.nw[1],46,"var(--vert)",{label:f.labels.nw,flat:true,labelClass:"mk"});
    wedge(g,c,R.ne[0],R.ne[1],46,"var(--lin)",{label:f.labels.ne,flat:true,labelClass:"mk"});
    wedge(g,c,R.se[0],R.se[1],46,"var(--vert)",{label:f.labels.se,flat:true,labelClass:"mk"});
    wedge(g,c,R.sw[0],R.sw[1],46,"var(--lin)",{label:f.labels.sw,flat:true,labelClass:"mk"});
    dot(g,c);
  } else if(f.k==="triProof"){
    const T=fitTriangle(f.B,f.C,{ext:!!f.labels.ext,w:380,h:210,baseY:345});
    const A=T.A,B=T.B,C=T.C;
    if(f.labels.ext){
      const D=[C[0]+(C[0]-B[0])*0.36,C[1]];
      seg(g,B,D,"line"); txt(g,[D[0]+16,D[1]+4],"D","mk");
    }
    seg(g,A,B,"line"); seg(g,B,C,"line"); seg(g,C,A,"line");
    const an={A:interiorAngle(A,B,C),B:interiorAngle(B,C,A),C:interiorAngle(C,A,B)};
    if(f.aux){
      const p=[650,A[1]], q=[50,A[1]];
      seg(g,q,p,"aux");
      txt(g,[q[0]-4,q[1]-16],"J","mk","var(--corr)"); txt(g,[p[0]+4,p[1]-16],"K","mk","var(--corr)");
      wedge(g,A,dir+180,angOf(A,B),32,"var(--alt)",{label:"d",flat:true,labelClass:"mk"});
      wedge(g,A,angOf(A,C),dir,32,"var(--same)",{label:"e",flat:true,labelClass:"mk"});
    }
    if(f.labels.A)wedge(g,A,an.A.from,an.A.to,40,"var(--corr)",{label:f.labels.A,flat:true,labelClass:"mk"});
    if(f.labels.B)wedge(g,B,an.B.from,an.B.to,40,"var(--alt)",{label:f.labels.B,flat:true,labelClass:"mk"});
    if(f.labels.C)wedge(g,C,an.C.from,an.C.to,40,"var(--same)",{label:f.labels.C,flat:true,labelClass:"mk"});
    if(f.labels.Cin)wedge(g,C,an.C.from,an.C.to,40,"var(--same)",{label:f.labels.Cin,flat:true,labelClass:"mk"});
    if(f.labels.ext)wedge(g,C,angOf(C,[C[0]+1,C[1]]),angOf(C,A),58,"var(--unk)",{label:f.labels.ext,flat:true,labelClass:"mk"});
    txt(g,[A[0],A[1]-24],"A","mk"); txt(g,[B[0]-22,B[1]+16],"B","mk"); txt(g,[C[0]-4,C[1]+24],"C","mk");
  } else if(f.k==="trans2"){
    const th=f.theta,y1=150,y2=330;
    const P1=[350+(240-y1)/Math.sin(th*D2R)*Math.cos(th*D2R),y1];
    const t=[Math.cos(th*D2R),-Math.sin(th*D2R)];
    const s=(y2-P1[1])/t[1], P2=[P1[0]+t[0]*s,y2];
    fullLine(g,[350,y1],0); fullLine(g,[350,y2],0); fullLine(g,P1,th);
    [[200,y1],[500,y1],[200,y2],[500,y2]].forEach(c=>{
      g.appendChild(E("polyline",{points:(c[0]-7)+","+(c[1]-6)+" "+(c[0]+5)+","+c[1]+" "+(c[0]-7)+","+(c[1]+6),class:"rt"}));
    });
    const R=regions(0,th);
    const map={a:[P1,R.nw,"var(--corr)"],b:[P1,R.ne,"var(--corr)"],c:[P1,R.sw,"var(--alt)"],d:[P1,R.se,"var(--lin)"],
               e:[P2,R.nw,"var(--alt)"],f:[P2,R.ne,"var(--vert)"],g:[P2,R.sw,"var(--corr)"],h:[P2,R.se,"var(--same)"]};
    for(const k in f.labels){const [c,rr,col]=map[k];
      wedge(g,c,rr[0],rr[1],40,col,{label:f.labels[k],flat:true,labelClass:"mk"});}
    dot(g,P1);dot(g,P2);
    txt(g,[74,y1-16],"A","mk");txt(g,[630,y1-16],"B","mk");
    txt(g,[74,y2+22],"C","mk");txt(g,[630,y2+22],"D","mk");
    txt(g,[P1[0]+Math.cos(th*D2R)*120-14,P1[1]-Math.sin(th*D2R)*120-8],"E","mk");
    txt(g,[P2[0]-Math.cos(th*D2R)*110+8,P2[1]+Math.sin(th*D2R)*110+12],"F","mk");
    txt(g,[P1[0]-16,P1[1]+18],"G","mk"); txt(g,[P2[0]-16,P2[1]+20],"H","mk");
  } else if(f.k==="perp"){
    const y=250, x1=270, x2=470;
    fullLine(g,[350,y],0);
    fullLine(g,[x1,y],90); fullLine(g,[x2,y],90);
    rightMark(g,[x1,y],0,14); rightMark(g,[x2,y],0,14);
    dot(g,[x1,y]); dot(g,[x2,y]);
    txt(g,[x1,60],"A","mk"); txt(g,[x1,442],"B","mk");
    txt(g,[x2,60],"C","mk"); txt(g,[x2,442],"D","mk");
    txt(g,[70,y-18],"E","mk"); txt(g,[636,y-18],"F","mk");
    txt(g,[x1-16,y+20],"G","mk"); txt(g,[x2-16,y+20],"H","mk");
    txt(g,[x1+52,y-34],"∠AGH","num","var(--corr)"); txt(g,[x2+52,y-34],"∠CHF","num","var(--corr)");
  }
}
const M5={
  tab:"Proof builder", lesson:"Lessons 9–11", accent:"var(--lavender)",
  title:()=>"Give a reason for every step",
  s:{i:0,checked:false,reveal:false},
  bar(){
    const sel=document.createElement("select");
    
    PROOFS.forEach((p,i)=>{const o=document.createElement("option");o.value=i;o.textContent=(i+1)+". "+p.name;sel.appendChild(o);});
    sel.value=M5.s.i;
    sel.onchange=()=>{M5.s.i=+sel.value;M5.s.checked=false;M5.s.reveal=false;render();};
    bar.appendChild(sel);
    const b=document.createElement("button"); b.textContent="Clear";
    b.onclick=()=>{M5.s.checked=false;M5.s.reveal=false;render();};
    bar.appendChild(b);
  },
  draw(){ const g=bg(); drawProofFigure(g,PROOFS[M5.s.i].fig); },
  panel(){
    const p=PROOFS[M5.s.i];
    side.innerHTML=`<div class="panel"><h3>Given / Prove</h3><div class="pad">
        <p><b>Given:</b> ${p.given}</p><p><b>Prove:</b> ${p.prove}</p>
        <p style="margin-top:12px"><b style="color:var(--accent)">Make a plan.</b> ${p.plan}</p></div></div>
      <div class="panel"><h3>The proof</h3><table class="steps" id="tbl"></table>
        <div class="fldwrap" style="margin:16px 0 4px;display:flex;gap:10px">
          <button id="ck" class="go" style="flex:1">Check reasons</button>
          <button id="rv" class="ghost">Reveal</button>
        </div><div id="fb2"></div></div>`;
    const tbl=document.getElementById("tbl");
    p.steps.forEach((st,i)=>{
      const tr=document.createElement("tr");
      const td1=document.createElement("td"); td1.className="stmt"; td1.textContent=st.s;
      const td2=document.createElement("td"); td2.className="why";
      td2.appendChild(reasonSelect(PROOF_REASONS, M5.s.reveal? st.r : ""));
      tr.appendChild(td1); tr.appendChild(td2); tbl.appendChild(tr);
    });
    document.getElementById("rv").onclick=()=>{M5.s.reveal=true;render();};
    document.getElementById("ck").onclick=()=>{
      const rows=tbl.querySelectorAll("tr"); let right=0;
      p.steps.forEach((st,i)=>{
        const sel=rows[i].querySelector("select");
        const ok=sel.value===st.r;
        rows[i].className=sel.value? (ok?"right":"wrong") : "";
        if(ok)right++;
      });
      const all=right===p.steps.length;
      document.getElementById("fb2").innerHTML= all
        ? `<div class="verdict good"><b>Every step is justified.</b> That is a complete proof — no gaps, nothing assumed that was not already established. You may now add "${p.name}" to your list of known facts and use it in later proofs.</div>`
        : `<div class="verdict bad"><b>${right} of ${p.steps.length} reasons correct.</b> Look again at the rows outlined in red. Ask of each one: which single fact makes this line follow from the one above it?</div>`;
    };
  }
};

/* ══════════════════════ MODULE 6 · fact bank ══════════════════════ */
const M6={
  tab:"Fact bank", lesson:"Reference", accent:"var(--coral)",
  title:()=>"What you may assume, and what you must prove",
  s:{},
  bar(){ const sp=document.createElement("span"); sp.className="spacer";
    sp.textContent="These are the exact words to cite in a proof"; bar.appendChild(sp); },
  draw(){
    const g=bg();
    const cell=(cx,cy,cap,fn)=>{ fn([cx,cy]); txt(g,[cx,cy+92],cap,"num","var(--graphite)"); };
    // 1 · vertical angles
    cell(128,120,"vert. ∠s  ·  equal",c=>{
      const R=regions(20,118);
      fullLine(g,c,20); fullLine(g,c,118);
      wedge(g,c,R.nw[0],R.nw[1],24,"var(--vert)",{flat:true});
      wedge(g,c,R.se[0],R.se[1],24,"var(--vert)",{flat:true});
      dot(g,c);
    });
    // 2 · angles on a line
    cell(350,120,"∠s on a line  ·  180°",c=>{
      fullLine(g,c,0); ray(g,c,52,74); ray(g,c,118,74);
      wedge(g,c,0,52,22,"var(--lin)",{flat:true});
      wedge(g,c,52,118,34,"var(--lin)",{flat:true});
      wedge(g,c,118,180,22,"var(--lin)",{flat:true});
      dot(g,c);
    });
    // 3 · angles at a point
    cell(572,120,"∠s at a point  ·  360°",c=>{
      [18,96,182,268].forEach(a=>ray(g,c,a,66));
      [[18,96],[96,182],[182,268],[268,378]].forEach((q,i)=>
        wedge(g,c,q[0],q[1],i%2?30:22,"var(--same)",{flat:true}));
      dot(g,c);
    });
    // 4 · triangle sum
    cell(128,330,"∠ sum of △  ·  180°",c=>{
      const T=fitTriangle(62,54,{w:150,h:96,cx:c[0],baseY:c[1]+48});
      seg(g,T.A,T.B,"line");seg(g,T.B,T.C,"line");seg(g,T.C,T.A,"line");
      const an={A:interiorAngle(T.A,T.B,T.C),B:interiorAngle(T.B,T.C,T.A),C:interiorAngle(T.C,T.A,T.B)};
      wedge(g,T.A,an.A.from,an.A.to,18,"var(--corr)",{flat:true});
      wedge(g,T.B,an.B.from,an.B.to,18,"var(--alt)",{flat:true});
      wedge(g,T.C,an.C.from,an.C.to,18,"var(--same)",{flat:true});
    });
    // 5 · parallel lines cut by a transversal
    cell(350,330,"alt. ∠s · corr. ∠s · int. ∠s",c=>{
      const th=62, dy=44;
      const dx=dy/Math.tan(th*Math.PI/180);
      const P1=[c[0]+dx,c[1]-dy], P2=[c[0]-dx,c[1]+dy];
      seg(g,[c[0]-95,c[1]-dy],[c[0]+95,c[1]-dy],"line");
      seg(g,[c[0]-95,c[1]+dy],[c[0]+95,c[1]+dy],"line");
      seg(g,PT(P1,88,th),PT(P2,88,th+180),"line");
      const R=regions(0,th);
      wedge(g,P1,R.sw[0],R.sw[1],19,"var(--alt)",{flat:true});
      wedge(g,P2,R.ne[0],R.ne[1],19,"var(--alt)",{flat:true});
      wedge(g,P1,R.se[0],R.se[1],30,"var(--corr)",{flat:true});
      wedge(g,P2,R.se[0],R.se[1],30,"var(--corr)",{flat:true});
      dot(g,P1);dot(g,P2);
      [[c[0]-60,c[1]-dy],[c[0]-60,c[1]+dy]].forEach(q=>
        g.appendChild(E("polyline",{points:(q[0]-6)+","+(q[1]-5)+" "+(q[0]+4)+","+q[1]+" "+(q[0]-6)+","+(q[1]+5),class:"rt"})));
    });
    // 6 · exterior angle
    cell(572,330,"ext. ∠ of △  ·  remote sum",c=>{
      const T=fitTriangle(56,60,{w:130,h:90,cx:c[0]-16,baseY:c[1]+48});
      seg(g,T.A,T.B,"line");seg(g,T.B,T.C,"line");seg(g,T.C,T.A,"line");
      seg(g,T.C,[T.C[0]+52,T.C[1]],"line");
      const an={A:interiorAngle(T.A,T.B,T.C),B:interiorAngle(T.B,T.C,T.A)};
      wedge(g,T.A,an.A.from,an.A.to,16,"var(--corr)",{flat:true});
      wedge(g,T.B,an.B.from,an.B.to,16,"var(--alt)",{flat:true});
      wedge(g,T.C,0,angOf(T.C,T.A),24,"var(--unk)",{flat:true});
    });
    txt(g,[350,32],"The facts you may cite by name","num","var(--graphite)");
  },
  panel(){
    let h=`<div class="panel"><h3>Build order — Lesson 11's big question</h3><div class="pad">
      <p>"What is the absolute shortest list of facts from which all other facts can be derived?" Here is the chain this course builds:</p></div>
      <ol class="chain">
        <li><span class="chip assume">assume</span><b>Angles on a line sum to 180°</b> and <b>angles at a point sum to 360°</b>, plus angle addition.</li>
        <li><span class="chip assume">assume</span><b>The parallel postulate</b> — if parallel lines are cut by a transversal, corresponding angles are equal.</li>
        <li><span class="chip proved">proved</span><b>Vertical angles are equal</b> — from two linear pairs (Lesson 9).</li>
        <li><span class="chip proved">proved</span><b>Alternate interior angles are equal</b> — corresponding + vertical.</li>
        <li><span class="chip proved">proved</span><b>Same-side interior angles are supplementary</b> — alternate interior + linear pair.</li>
        <li><span class="chip proved">proved</span><b>Triangle sum is 180°</b> — auxiliary parallel line + alternate interior (Lesson 11).</li>
        <li><span class="chip proved">proved</span><b>Exterior angle theorem</b> — triangle sum + linear pair.</li>
      </ol>
      <div class="pad"><p>Each proved fact may be cited freely once it is proved. That is the whole point of building the list in order: you never use a fact to prove itself.</p></div></div>`;
    let cur="";
    h+=`<div class="panel"><h3>Cite it in these words</h3><table class="facts">`;
    FACTS.forEach(f=>{
      if(f.cat!==cur){cur=f.cat;h+=`<tr><td colspan="2" class="cathead">${f.cat}</td></tr>`;}
      h+=`<tr><td class="ab">${f.ab||"&nbsp;"}</td><td class="st">${f.st}${f.short?'<i>short name: '+f.short+'</i>':''}${f.derived?'<i style="color:var(--yellow)">not on the Eureka list — derive it in two steps: '+f.derived+'</i>':''}</td></tr>`;
    });
    h+=`</table></div>`;
    side.innerHTML=h;
  }
};

/* ══════════════════════ controller ══════════════════════ */
const MODS=[M1,M2,M3,M4,M5,M6];
let cur=0;
function render(){
  const M=MODS[cur];
  document.documentElement.style.setProperty("--accent",M.accent||"var(--cyan)");
  bTitle.textContent=M.title(); bLesson.textContent=M.lesson;
  clear(); M.draw();
  bar.innerHTML=""; M.bar();
  M.panel();
  dragHandler=M.drag? M.drag : null;
  window.__angClick = (M===M2)? (k=>M2.click(k)) : null;
  [...tabsEl.children].forEach((b,i)=>b.setAttribute("aria-selected",i===cur));
}
MODS.forEach((M,i)=>{
  const b=document.createElement("button"); b.setAttribute("role","tab");
  b.innerHTML='<span class="n">'+(i+1)+'</span>'+M.tab;
  b.onclick=()=>{cur=i;render();};
  tabsEl.appendChild(b);
});
render();
})();
</script>
