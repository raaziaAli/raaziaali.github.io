<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volume Lab — Geometry Unit 4</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A0A1F'/%3E%3Cpath d='M14 24 L32 14 L50 24 L50 44 L32 54 L14 44Z M14 24 L32 34 L50 24 M32 34 L32 54' fill='none' stroke='%2300E5FF' stroke-width='3.5' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A1F; --bg-lift:#13132B; --card:#1C1C3A; --card-2:#242449;
    --cyan:#00E5FF; --magenta:#FF3D8A; --yellow:#FFD93D; --lavender:#C4B5FD;
    --coral:#FF6B6B; --mint:#5EEAD4;
    --accent:var(--cyan);
    --text:#F8F9FF; --dim:#A5A5C9; --edge:rgba(196,181,253,.20);

    --board:#FFFFFF; --grid:#DCE6F7;
    --ink:#14213D; --graphite:#22314F;
    --vert:#7C3AED; --lin:#EA580C; --corr:#0284C7; --alt:#059669;
    --altx:#DB2777; --same:#DC2626; --samex:#0891B2;
    --unk:#E11D48; --hand:#FF6B35;

    --display:"Unbounded","Trebuchet MS",system-ui,sans-serif;
    --ui:"DM Sans",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);font-family:var(--ui);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;position:relative;min-height:100vh;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse at 12% 8%,rgba(0,229,255,.13),transparent 55%),
               radial-gradient(ellipse at 88% 22%,rgba(255,61,138,.12),transparent 55%),
               radial-gradient(ellipse at 50% 105%,rgba(196,181,253,.10),transparent 60%);}
  .wrap{max-width:1220px;margin:0 auto;padding:26px 20px 70px;position:relative;z-index:1}

  header.masthead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .mark{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.6vw,38px);margin:0;letter-spacing:-.01em;
    background:linear-gradient(92deg,var(--cyan),var(--lavender) 55%,var(--magenta));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .eyebrow{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .masthead .eyebrow{margin-left:auto;text-align:right;
    border:1px solid var(--edge);border-radius:100px;padding:7px 15px;background:rgba(255,255,255,.03)}

  nav.tabs{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:20px}
  nav.tabs button{
    font-family:var(--ui);font-size:15px;font-weight:500;
    background:var(--card);color:var(--dim);border:1px solid var(--edge);border-radius:100px;
    padding:11px 19px;cursor:pointer;transition:transform .16s,color .16s,box-shadow .16s,background .16s;
  }
  nav.tabs button:hover{color:#fff;transform:translateY(-2px);background:var(--card-2)}
  nav.tabs button[aria-selected="true"]{
    color:#0A0A1F;background:var(--accent);border-color:var(--accent);font-weight:700;
    box-shadow:0 0 26px -4px var(--accent);
  }
  nav.tabs button .n{font-family:var(--mono);font-size:12px;font-weight:700;opacity:.6;margin-right:9px}
  nav.tabs button:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

  .stage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(330px,1fr);gap:22px;align-items:start}
  @media (max-width:960px){.stage{grid-template-columns:minmax(0,1fr)}}

  .board{background:var(--card);border:1px solid var(--edge);border-radius:20px;overflow:hidden;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.8)}
  .board-head{display:flex;align-items:center;gap:12px;padding:16px 20px;flex-wrap:wrap;
    background:linear-gradient(90deg,var(--card-2),var(--card));border-bottom:1px solid var(--edge)}
  .board-head h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0;color:#fff;line-height:1.3}
  .board-head .lsn{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em;
    color:var(--accent);border:1px solid var(--accent);border-radius:100px;padding:5px 13px;white-space:nowrap}
  svg.canvas{display:block;width:100%;height:auto;background:linear-gradient(170deg,#FFFFFF 0%,#EEF4FF 100%);touch-action:none;user-select:none;-webkit-user-select:none}

  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:15px 20px;background:var(--card-2);border-top:1px solid var(--edge)}
  .bar button,.seg button{font-family:var(--ui);font-size:14.5px;font-weight:600;border:1px solid var(--edge);
    background:rgba(255,255,255,.06);color:var(--text);padding:10px 17px;border-radius:100px;cursor:pointer;transition:.16s}
  .bar button:hover,.seg button:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
  .bar button.primary{background:var(--accent);color:#0A0A1F;border-color:var(--accent);box-shadow:0 0 22px -6px var(--accent)}
  .seg{display:inline-flex;gap:6px;flex-wrap:wrap}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#0A0A1F;border-color:var(--accent);font-weight:700}
  .bar label.chk{display:inline-flex;align-items:center;gap:9px;font-size:14.5px;color:var(--text);cursor:pointer;
    background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:100px;padding:9px 16px}
  .bar label.chk:hover{background:rgba(255,255,255,.1)}
  .bar label.chk input{accent-color:var(--accent);width:17px;height:17px}
  .bar .spacer{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--dim)}
  .bar select{width:auto;max-width:340px}
  .note{margin:0 20px 16px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.55;
    background:rgba(255,217,61,.10);border:1px solid rgba(255,217,61,.35);color:#FBEFC9}
  .note b{color:#fff}

  .panel{border:1px solid var(--edge);border-radius:18px;background:var(--card);margin-bottom:16px;overflow:hidden}
  .panel h3{margin:0;padding:15px 20px;font-family:var(--display);font-weight:600;font-size:14px;
    letter-spacing:.01em;color:#fff;background:linear-gradient(90deg,var(--card-2),transparent);
    border-bottom:1px solid var(--edge)}
  .pad{padding:16px 20px;font-size:15px;color:#CFCFEA}
  .pad p{margin:0 0 11px} .pad p:last-child{margin-bottom:0}
  .pad b{color:#fff;font-weight:700}
  .term{font-weight:700;color:var(--accent)}

  .eq{font-family:var(--mono);font-size:14.5px;font-weight:600;color:#fff;background:rgba(0,0,0,.28);
    border:1px solid var(--edge);border-left:4px solid var(--accent);padding:13px 15px;margin:12px 0;
    border-radius:0 12px 12px 0;overflow-x:auto;white-space:pre-wrap;line-height:1.75}
  .eq small{display:block;font-family:var(--ui);font-size:13px;font-weight:400;color:var(--dim);margin-top:7px}
  .panel > .eq{margin:16px 20px}

  .rel{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;
    padding:13px 20px;border-bottom:1px solid rgba(196,181,253,.12);font-size:15px}
  .rel:last-child{border-bottom:none}
  .rel .dot{width:13px;height:13px;border-radius:13px}
  .rel .nm{color:#fff;font-weight:500}
  .rel .nm em{font-style:normal;color:var(--dim);font-size:13px;display:block;font-weight:400}
  .rel .val{font-family:var(--mono);font-size:13.5px;font-weight:600;white-space:nowrap;text-align:right}
  .ok{color:var(--mint)} .no{color:var(--coral)}

  select,input[type=number],input[type=text]{
    font-family:var(--ui);font-size:15px;background:#0F0F26;color:#fff;
    border:1px solid var(--edge);border-radius:12px;padding:12px 13px;width:100%;}
  select:focus,input:focus{outline:3px solid var(--accent);outline-offset:1px}
  label.fld{display:block;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.1em;
    text-transform:uppercase;color:var(--accent);margin:16px 20px 7px}
  .fldwrap{padding:0 20px}
  .go{width:100%;font-family:var(--ui);font-size:16px;font-weight:700;background:var(--accent);color:#0A0A1F;
    border:none;padding:14px;border-radius:100px;cursor:pointer;box-shadow:0 0 26px -6px var(--accent);transition:.16s}
  .go:hover{transform:translateY(-2px)}
  .ghost{font-family:var(--ui);font-size:15px;font-weight:600;background:transparent;color:var(--dim);
    border:1px solid var(--edge);padding:11px 18px;border-radius:100px;cursor:pointer}
  .ghost:hover{color:#fff}
  .verdict{margin:16px 20px;padding:14px 16px;border-radius:14px;font-size:15px;line-height:1.6}
  .verdict.good{background:rgba(94,234,212,.13);border:1px solid rgba(94,234,212,.45);color:#D7FBF3}
  .verdict.bad{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.4);color:#FFDCDA}
  .verdict.info{background:rgba(255,217,61,.10);border:1px solid rgba(255,217,61,.35);color:#FBEFC9}
  .verdict b{color:#fff}

  /* ── drawing ── */
  .mk{font-family:var(--display);font-weight:600;font-size:20px;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
  .num{font-family:var(--mono);font-weight:700;font-size:15px;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
  .dot{fill:var(--ink);stroke:#fff;stroke-width:2}
  .grab{fill:rgba(255,107,53,.20);stroke:var(--hand);stroke-width:2;stroke-dasharray:4 3;cursor:grab}
  .grab:hover{fill:rgba(255,107,53,.35)}
  .rt{stroke:var(--graphite);stroke-width:1.8;fill:none;opacity:.9}
  footer.foot{margin-top:30px;padding-top:18px;border-top:1px solid var(--edge);font-size:14px;color:var(--dim)}

  /* ── Rigid Motions Lab extensions ── */
  .vl{font-family:var(--display);font-weight:600;font-size:17px;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
  .cl{font-family:var(--mono);font-weight:600;font-size:11.5px;paint-order:stroke;stroke:#fff;stroke-width:4;stroke-linejoin:round}
  .tk{font-family:var(--mono);font-size:10.5px;fill:#7A8AAD}
  footer.foot a{color:var(--cyan);text-decoration:none;font-weight:600}
  footer.foot a:hover{text-decoration:underline}
  footer.foot .links{display:flex;gap:20px;flex-wrap:wrap;margin-top:8px}
  body.embed header.masthead, body.embed footer.foot{display:none}
  body.embed .wrap{padding:10px}
  .bar button:focus-visible,.seg button:focus-visible,.go:focus-visible,.ghost:focus-visible,.opt:focus-visible,.xbtn:focus-visible,footer.foot a:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  .rng{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13.5px;font-weight:600;color:var(--text);
    background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:100px;padding:7px 15px;max-width:100%}
  .rng input{accent-color:var(--accent);width:170px;max-width:42vw}
  .rng span{min-width:64px;white-space:nowrap}
  table.meas{width:100%;border-collapse:collapse;font-size:14px}
  table.meas th{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
    text-align:left;padding:12px 20px 6px;font-weight:600}
  table.meas td{padding:8px 20px;border-top:1px solid rgba(196,181,253,.11);font-family:var(--mono);font-size:13.5px;color:#fff;white-space:nowrap}
  table.meas td:first-child{font-family:var(--ui);color:#CFCFEA;white-space:normal}
  .steprow{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px 10px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(196,181,253,.12)}
  .steprow:first-child{padding-top:0}
  .steprow .sn{font-family:var(--mono);font-weight:700;font-size:15px}
  .steprow .params{grid-column:2/4;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:14px;color:var(--dim)}
  .steprow .params label{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12.5px}
  input.sm,select.sm{width:72px;padding:8px 9px;font-size:14px;border-radius:10px}
  select.sm.wide{width:auto}
  .xbtn{font-family:var(--ui);font-size:18px;line-height:1;width:34px;height:34px;border-radius:34px;border:1px solid var(--edge);
    background:transparent;color:var(--dim);cursor:pointer}
  .xbtn:hover{color:#fff;border-color:var(--coral)}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap}
  .opt{display:block;width:100%;text-align:left;font-family:var(--ui);font-size:15px;font-weight:500;background:rgba(255,255,255,.04);
    color:#E7E9FA;border:1px solid var(--edge);border-radius:14px;padding:12px 15px;margin:0 0 9px;cursor:pointer;transition:.15s}
  .opt:hover{background:rgba(255,255,255,.09)}
  .opt[aria-pressed="true"]{border-color:var(--accent);background:rgba(255,255,255,.1);box-shadow:inset 3px 0 0 var(--accent);color:#fff}
  .opt.right{border-color:var(--mint);box-shadow:inset 3px 0 0 var(--mint)}
  .opt.wrong{border-color:var(--coral);box-shadow:inset 3px 0 0 var(--coral)}
  .q{font-size:16px;color:#fff;line-height:1.55}
  .inrow{display:flex;gap:12px;padding:0 20px}
  .inrow > div{flex:1;min-width:0}
  .inrow label.fld{margin-left:0;margin-right:0}
  .pad ul{margin:0 0 10px;padding-left:20px} .pad li{margin:3px 0}
  .key{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  @media (max-width:520px){
    .wrap{padding:16px 12px 50px}
    .bar{padding:12px 14px}
    .board-head{padding:13px 14px}
    .board-head .lsn{margin-left:0}
    .pad{padding:14px 16px}
    .rel{padding:12px 16px}
    table.meas th,table.meas td{padding-left:14px;padding-right:14px}
    .bar .spacer{margin-left:0;width:100%}
    nav.tabs button{padding:9px 14px;font-size:14px}
  }
  /* ── Volume Lab extensions ── */
  svg.canvas{cursor:grab}
  svg.canvas.rotating{cursor:grabbing}
  svg.canvas:focus-visible{outline:3px solid var(--yellow);outline-offset:-3px}
  .bar select{font-size:14px;padding:9px 12px;border-radius:100px}
  .bar .grp{display:flex;gap:10px;flex-wrap:wrap;align-items:center;width:100%}
  .xs{font-family:var(--mono);font-size:11.5px;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:4;stroke-linejoin:round}
  .hint{font-family:var(--ui);font-size:12.5px;fill:#5B6B8F}
  .big{font-family:var(--mono);font-weight:700;font-size:15px;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
  .tt{font-family:var(--display);font-weight:600;font-size:13px;fill:#22314F;letter-spacing:.02em}
  .vbig{font-family:var(--mono);font-weight:700;font-size:20px;color:#fff}
  @media (max-width:520px){ .rng input{width:120px} }
  .e3{stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .e3h{stroke:var(--ink);stroke-width:1.3;fill:none;stroke-dasharray:6 5;opacity:.5;stroke-linecap:round}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1 class="mark">Volume Lab</h1>
    <div class="eyebrow">Geometry · Unit 4 · Area &amp; Volume</div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Lessons"></nav>
  <div class="stage">
    <section class="board">
      <div class="board-head">
        <h2 id="bTitle">—</h2>
        <span class="lsn" id="bLesson"></span>
      </div>
      <svg class="canvas" id="cv" viewBox="0 0 700 500" role="img" tabindex="0" aria-label="Three-dimensional solid; drag to rotate"></svg>
      <div class="bar" id="bar"></div>
    </section>
    <aside id="side"></aside>
  </div>
  <footer class="foot">Every solid is live: drag the board to turn it, move a slider and every area and volume is recomputed from the figure. Vocabulary follows Common Core G-GMD and G-MG and Eureka Math / EngageNY Geometry Module 3.
    <div class="links"><a href="/geometry/">← Geometry course</a><a href="/math/#geometry">Mrs. Ali's Classroom</a></div>
  </footer>
</div>
<script>
(function(){
"use strict";
/* ══════════════════════ helpers ══════════════════════ */
const VW=700, VH=500;
const $=id=>document.getElementById(id);
const cv=$("cv"), bar=$("bar"), side=$("side"), tabsEl=$("tabs"), bTitle=$("bTitle"), bLesson=$("bLesson");
const D2R=Math.PI/180, PI=Math.PI;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function fm(v,d){ d=d==null?1:d; const k=Math.pow(10,d); const r=Math.round(v*k)/k; return String(Math.abs(r)<1e-12?0:r); }
function fmc(v,d){ d=d==null?1:d; return (Math.abs(v)<1e-12?0:v).toLocaleString("en-US",{maximumFractionDigits:d,minimumFractionDigits:0}); }
function fracStr(x){
  for(let d=1;d<=12;d++){const n=x*d; if(Math.abs(n-Math.round(n))<1e-7) return d===1? String(Math.round(n)) : Math.round(n)+"/"+d;}
  return fm(x,2);
}
// c·π written exactly when c is a simple fraction
function piStr(c){
  for(let d=1;d<=12;d++){const n=c*d; if(Math.abs(n-Math.round(n))<1e-7){const N=Math.round(n);
    const top=(N===1?"":N===-1?"−":String(N))+"π"; return d===1? top : top+"/"+d;}}
  return fm(c,2)+"π";
}
const sup=s=>s; // placeholder for readability
const COL={ink:"#14213D", blue:"#0284C7", green:"#059669", purple:"#7C3AED", orange:"#EA580C", pink:"#DB2777",
  teal:"#0891B2", red:"#DC2626", gold:"#D97706", gold2:"#F59E0B", water:"#0EA5E9", plane:"#64748B", hand:"#FF6B35",
  gray:"#94A3B8", sec:"#E11D48", slate:"#475569"};

/* vectors */
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const mul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len=a=>Math.hypot(a[0],a[1],a[2]);
const nrm=a=>{const l=len(a)||1;return [a[0]/l,a[1]/l,a[2]/l];};
const avg=P=>{const s=[0,0,0];P.forEach(p=>{s[0]+=p[0];s[1]+=p[1];s[2]+=p[2];});return mul(s,1/P.length);};
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
function newell(P){const n=[0,0,0],m=P.length;for(let i=0;i<m;i++){const a=P[i],b=P[(i+1)%m];
  n[0]+=(a[1]-b[1])*(a[2]+b[2]); n[1]+=(a[2]-b[2])*(a[0]+b[0]); n[2]+=(a[0]-b[0])*(a[1]+b[1]);}return n;}
function area2(P){let s=0;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];s+=a[0]*b[1]-b[0]*a[1];}return s/2;}

/* colour shading */
const rgbCache={};
function hex2rgb(h){ if(rgbCache[h])return rgbCache[h]; const s=h.replace("#",""); return rgbCache[h]=[0,2,4].map(i=>parseInt(s.substr(i,2),16)); }
function shade(h,t){const c=hex2rgb(h);return "rgb("+c.map(v=>Math.round(t>0? v+(255-v)*t : v*(1+t))).join(",")+")";}

/* ══════════════════════ tiny 3D engine ══════════════════════ */
// A mesh is a list of vertices and polygon faces. Faces are oriented so their Newell normal points out of the solid.
function mesh(o){return Object.assign({V:[],F:[],fe:new Set(),op:.5,bop:.1,col:COL.blue,layer:2,opaque:false,open:false,two:false,
  hid:true,ew:2,ec:COL.ink,all:false},o||{});}
function addV(m,p){m.V.push(p);return m.V.length-1;}
function ekey(i,j){return i<j? i+"_"+j : j+"_"+i;}
function feat(m,i,j){ if(i!==j) m.fe.add(ekey(i,j)); }
function featLoop(m,idx){for(let k=0;k<idx.length;k++)feat(m,idx[k],idx[(k+1)%idx.length]);}
function addF(m,idx,ref,extra){
  const id=[]; idx.forEach(i=>{ if(id[id.length-1]!==i) id.push(i); }); if(id.length>1&&id[0]===id[id.length-1]) id.pop();
  if(id.length<3) return null;
  let f=Object.assign({i:id},extra||{});
  if(ref){ const n=newell(id.map(i=>m.V[i])); if(dot(n,ref)<0){ f.i=id.slice().reverse(); if(f.h) f.h=f.h.map(h=>h.slice().reverse()); } }
  m.F.push(f); return f;
}
const circ=(r,n,c,a0)=>{c=c||[0,0];a0=a0||0;const P=[];for(let k=0;k<n;k++){const t=a0+2*PI*k/n;P.push([c[0]+r*Math.cos(t),c[1]+r*Math.sin(t)]);}return P;};
const cen2=P=>{let x=0,z=0;P.forEach(p=>{x+=p[0];z+=p[1];});return [x/P.length,z/P.length];};

// prism / cylinder: base polygon in the xz-plane (points [x,z]) from y0 to y1, top shifted by [sx,sz]
function prism(base,y0,y1,o,shift){
  o=o||{}; shift=shift||[0,0]; const m=mesh(o), n=base.length, c=cen2(base);
  const off=o.at||[0,0,0];
  const b=base.map(p=>addV(m,[p[0]+off[0],y0+off[1],p[1]+off[2]])), t=base.map(p=>addV(m,[p[0]+shift[0]+off[0],y1+off[1],p[1]+shift[1]+off[2]]));
  addF(m,b,[0,-1,0],o.baseFace); addF(m,t,[0,1,0],o.topFace);
  for(let k=0;k<n;k++){const k1=(k+1)%n, mx=(base[k][0]+base[k1][0])/2-c[0], mz=(base[k][1]+base[k1][1])/2-c[1];
    addF(m,[b[k],b[k1],t[k1],t[k]],[mx,0,mz],o.sideFace);}
  featLoop(m,b); featLoop(m,t); if(!o.smooth) for(let k=0;k<n;k++) feat(m,b[k],t[k]);
  return m;
}
// pyramid / cone: base polygon at height y0, apex point (3D); open:true leaves the base off (a container)
function pyramid(base,y0,apex,o){
  o=o||{}; const m=mesh(o), n=base.length, c=cen2(base), off=o.at||[0,0,0];
  const b=base.map(p=>addV(m,[p[0]+off[0],y0+off[1],p[1]+off[2]])), a=addV(m,add(apex,off));
  const down=apex[1]>y0? -1:1;
  if(!o.noBase) addF(m,b,[0,down,0],o.baseFace);
  for(let k=0;k<n;k++){const k1=(k+1)%n, mx=(base[k][0]+base[k1][0])/2-c[0], mz=(base[k][1]+base[k1][1])/2-c[1];
    addF(m,[b[k],b[k1],a],[mx,-down*0.3*Math.hypot(mx,mz),mz],o.sideFace);}
  featLoop(m,b); if(!o.smooth) for(let k=0;k<n;k++) feat(m,b[k],a);
  return m;
}
// convex polyhedron from 3D vertices + face index lists (auto-oriented outward)
function convex(Vs,Fs,o){ const m=mesh(o); Vs.forEach(p=>addV(m,p)); const c=avg(Vs);
  Fs.forEach(f=>{const fc=avg(f.map(i=>Vs[i])); addF(m,f,sub(fc,c)); if(m.all) featLoop(m,f);}); return m; }
// sphere or hemisphere (dome above its centre)
function sphere(c,r,o,hemi,nLat,nLon){
  o=o||{}; nLat=nLat||(hemi?8:14); nLon=nLon||32; const m=mesh(o);
  const lat0=hemi?0:-PI/2, rows=[];
  for(let i=0;i<=nLat;i++){const la=lat0+(PI/2-lat0)*i/nLat, row=[];
    if(i===nLat){const p=addV(m,[c[0],c[1]+r,c[2]]);for(let j=0;j<nLon;j++)row.push(p);}
    else if(!hemi&&i===0){const p=addV(m,[c[0],c[1]-r,c[2]]);for(let j=0;j<nLon;j++)row.push(p);}
    else for(let j=0;j<nLon;j++){const th=2*PI*j/nLon;row.push(addV(m,[c[0]+r*Math.cos(la)*Math.cos(th),c[1]+r*Math.sin(la),c[2]+r*Math.cos(la)*Math.sin(th)]));}
    rows.push(row);}
  for(let i=0;i<nLat;i++)for(let j=0;j<nLon;j++){const j1=(j+1)%nLon;const q=[rows[i][j],rows[i][j1],rows[i+1][j1],rows[i+1][j]];
    addF(m,q,sub(avg(q.map(k=>m.V[k])),c));}
  if(hemi){ addF(m,rows[0].slice(),[0,-1,0],o.baseFace); featLoop(m,rows[0]); }
  if(o.equator&&!hemi){ featLoop(m,rows[Math.floor(nLat/2)]); }
  return m;
}
// solid of revolution: closed profile [[x,y]] (x ≥ 0) swept about the y-axis through phi degrees
function revolve(prof,phiDeg,o,corners){
  o=o||{}; const m=mesh(o); const full=phiDeg>=359.999, phi=Math.min(phiDeg,360)*D2R;
  const N=Math.max(2,Math.ceil(Math.max(phiDeg,1)/9)), cols=full?N:N+1, n=prof.length;
  const ccw=area2(prof)>0;
  const G=prof.map(p=>{ if(Math.abs(p[0])<1e-9){const v=addV(m,[0,p[1],0]);return new Array(cols).fill(v);}
    const r=[];for(let j=0;j<cols;j++){const t=phi*j/N;r.push(addV(m,[p[0]*Math.cos(t),p[1],p[0]*Math.sin(t)]));}return r;});
  for(let e=0;e<n;e++){const e1=(e+1)%n, a=prof[e], b=prof[e1];
    if(Math.abs(a[0])<1e-9&&Math.abs(b[0])<1e-9) continue;
    const dx=b[0]-a[0], dy=b[1]-a[1]; const out=ccw?[dy,-dx]:[-dy,dx];
    for(let j=0;j<N;j++){const j1=full?(j+1)%N:j+1, t=phi*(j+.5)/N;
      addF(m,[G[e][j],G[e1][j],G[e1][j1],G[e][j1]],[out[0]*Math.cos(t),out[1],out[0]*Math.sin(t)],o.sideFace);}}
  if(!full){ const c0=G.map(r=>r[0]), c1=G.map(r=>r[cols-1]);
    addF(m,c0,[0,0,-1],o.capFace); addF(m,c1,[-Math.sin(phi),0,Math.cos(phi)],o.capFace); featLoop(m,c0); featLoop(m,c1); }
  (corners||[]).forEach(k=>{const r=G[k]; for(let j=0;j<cols-1;j++)feat(m,r[j],r[j+1]); if(full)feat(m,r[cols-1],r[0]);});
  return m;
}
// flat polygon (two-sided), optionally with holes
function flat(P,o,holes){const m=mesh(Object.assign({two:true,hid:false},o||{}));const idx=P.map(p=>addV(m,p));
  const h=(holes||[]).map(H=>H.map(p=>addV(m,p))); const f=addF(m,idx,null,{}); if(f&&h.length)f.h=h;
  featLoop(m,idx); h.forEach(H=>featLoop(m,H)); return m;}
const ring3=(r,y,n,c)=>{c=c||[0,0,0];const P=[];for(let k=0;k<n;k++){const t=2*PI*k/n;P.push([c[0]+r*Math.cos(t),c[1]+y,c[2]+r*Math.sin(t)]);}return P;};

function scene(){return {meshes:[],lines:[],labels:[],top:""};}
// cam: {s (px per unit), cx, cy, target, D (perspective distance), view:{yaw,pitch}}
function render3D(sc,cam){
  const yaw=cam.view.yaw*D2R, pit=cam.view.pitch*D2R, cyw=Math.cos(yaw), syw=Math.sin(yaw), cp=Math.cos(pit), sp=Math.sin(pit);
  const T=cam.target||[0,0,0], D=cam.D||40, eye=[0,0,D];
  const rot=v=>{const x1=v[0]*cyw+v[2]*syw, z1=-v[0]*syw+v[2]*cyw; return [x1, v[1]*cp-z1*sp, v[1]*sp+z1*cp];};
  const tr=p=>rot(sub(p,T));
  const pr=c=>{const k=D/(D-c[2]);return [cam.cx+cam.s*c[0]*k, cam.cy-cam.s*c[1]*k];};
  const P=p=>pr(tr(p));
  const Lt=nrm([-0.35,0.8,0.55]);
  const items=[]; const S2=p=>p[0].toFixed(1)+" "+p[1].toFixed(1);
  sc.meshes.forEach(m=>{
    const C=m.V.map(tr), S=C.map(pr);
    const fr=[], nn=[];
    m.F.forEach((f,fi)=>{const Pc=f.i.map(i=>C[i]); let n=nrm(newell(Pc)); const ce=avg(Pc);
      let front=dot(n,sub(eye,ce))>0; if(m.two&&!front){n=mul(n,-1);front=true;} fr[fi]=front; nn[fi]={n:n,c:ce};});
    const emap=new Map();
    m.F.forEach((f,fi)=>{[f.i].concat(f.h||[]).forEach(L=>{for(let k=0;k<L.length;k++){const key=ekey(L[k],L[(k+1)%L.length]);
      if(!emap.has(key))emap.set(key,[]); emap.get(key).push(fi);}});});
    const fEdges=m.F.map(()=>[]), hidden=[];
    emap.forEach((fs,key)=>{const isF=m.all||m.fe.has(key), bnd=fs.length===1;
      const anyF=fs.some(i=>fr[i]), allF=fs.every(i=>fr[i]), sil=fs.length>=2&&anyF&&!allF&&!m.two;
      if(!(isF||sil||(bnd&&m.open)))return;
      if(anyF||(bnd&&m.open)){ const fi=fs.find(i=>fr[i]); fEdges[fi==null?fs[0]:fi].push(key); }
      else if(isF&&m.hid&&!m.opaque) hidden.push(key);});
    const edgePath=keys=>keys.map(k=>{const ab=k.split("_");return "M"+S2(S[+ab[0]])+"L"+S2(S[+ab[1]]);}).join("");
    m.F.forEach((f,fi)=>{const front=fr[fi]; if(m.opaque&&!front)return;
      const col=f.c||m.col; let fill;
      if(front){const I=Math.max(0,dot(nn[fi].n,Lt)); fill=shade(col,(m.flatShade? .1 : -0.28+0.62*I));}
      else fill=shade(col,.25);
      const fo=front?(f.op!=null?f.op:m.op):(f.bop!=null?f.bop:m.bop);
      let d="M"+f.i.map(i=>S2(S[i])).join("L")+"Z"; (f.h||[]).forEach(H=>{d+="M"+H.map(i=>S2(S[i])).join("L")+"Z";});
      let s='<path d="'+d+'" fill="'+fill+'" fill-opacity="'+fo+'" fill-rule="evenodd" stroke="'+(m.opaque?fill:"none")+'" stroke-width="'+(m.opaque?.6:0)+'"/>';
      if(fEdges[fi].length) s+='<path d="'+edgePath(fEdges[fi])+'" stroke="'+(f.ec||m.ec)+'" stroke-width="'+(front?m.ew:m.ew*.7)+'" fill="none" stroke-linecap="round" stroke-linejoin="round"'+(front?"":' opacity=".55"')+'/>';
      items.push({L:front?m.layer:(m.blayer!=null?m.blayer:0), z:nn[fi].c[2]+(f.dz||0), s:s});});
    if(hidden.length) items.push({L:-1,z:0,s:'<path d="'+edgePath(hidden)+'" stroke="'+m.ec+'" stroke-width="1.3" fill="none" stroke-dasharray="6 5" opacity=".5" stroke-linecap="round"/>'});
  });
  sc.lines.forEach(l=>{
    const pts=l.pts||[l.a,l.b]; const C=pts.map(tr); let L=l.L!=null?l.L:5, dash=l.dash, op=l.op!=null?l.op:1;
    if(l.n){const nc=rot(l.n); const front=dot(nc,sub(eye,avg(C)))>0; if(!front){L=-1;dash="4 5";op=.45;} else L=l.Lf!=null?l.Lf:2.5;}
    const d="M"+C.map(c=>S2(pr(c))).join("L")+(l.close?"Z":"");
    items.push({L:L,z:avg(C)[2],s:'<path d="'+d+'" fill="'+(l.fill||"none")+'"'+(l.fill?' fill-opacity="'+(l.fo||.3)+'"':"")+' stroke="'+(l.col||COL.ink)+'" stroke-width="'+(l.w||2)+'"'+(dash?' stroke-dasharray="'+dash+'"':"")+' opacity="'+op+'" stroke-linecap="round" stroke-linejoin="round"/>'});
  });
  items.sort((a,b)=>a.L-b.L||a.z-b.z);
  let out=items.map(i=>i.s).join("");
  sc.labels.forEach(l=>{const q=P(l.p); const x=q[0]+(l.dx||0), y=q[1]+(l.dy||0);
    out+='<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" class="'+(l.cls||"num")+'" fill="'+(l.col||COL.ink)+'" text-anchor="'+(l.anchor||"middle")+'" dominant-baseline="middle">'+l.t+'</text>';});
  return {svg:out, P:P};
}

    '<rect width="'+VW+'" height="'+VH+'" fill="url(#g)"/>';

function poly2(P,fill,stroke,fo,extra){return '<path d="M'+P.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join("L")+'Z" fill="'+fill+'" fill-opacity="'+(fo==null?.35:fo)+'" fill-rule="evenodd" stroke="'+stroke+'" stroke-width="2.4" stroke-linejoin="round"'+(extra||"")+'/>';}

/* ══════════════════════ bar helpers ══════════════════════ */
function btn(label,fn,cls,parent){const b=document.createElement("button");b.type="button";b.textContent=label;if(cls)b.className=cls;b.onclick=fn;(parent||bar).appendChild(b);return b;}
function segBtns(opts,curv,fn,label){
  const s=document.createElement("div");s.className="seg";s.setAttribute("role","group");if(label)s.setAttribute("aria-label",label);
  opts.forEach(([k,l])=>{const b=document.createElement("button");b.type="button";b.textContent=l;b.dataset.k=k;
    b.setAttribute("aria-pressed",String(k===curv));b.onclick=()=>fn(k);s.appendChild(b);});
  bar.appendChild(s);return s;
}
function chk(label,obj,key,fn){
  const l=document.createElement("label");l.className="chk";
  const i=document.createElement("input");i.type="checkbox";i.checked=!!obj[key];
  i.onchange=()=>{obj[key]=i.checked;(fn||redraw)();};
  l.appendChild(i);l.appendChild(document.createTextNode(label));bar.appendChild(l);return i;
}
function spacer(text,id){const s=document.createElement("span");s.className="spacer";if(id)s.id=id;s.textContent=text;bar.appendChild(s);return s;}
function range(min,max,step,val,show,fn,aria){
  const l=document.createElement("label");l.className="rng";
  const o=document.createElement("span");o.textContent=show(val);
  const r=document.createElement("input");r.type="range";r.min=min;r.max=max;r.step=step;r.value=val;r.setAttribute("aria-label",aria);
  r.oninput=()=>{const v=fn(+r.value);o.textContent=show(v==null?+r.value:v);};
  l.appendChild(o);l.appendChild(r);bar.appendChild(l);return r;
}
function selectBox(opts,val,fn,aria){const s=document.createElement("select");s.setAttribute("aria-label",aria);
  opts.forEach(([k,l])=>{const o=document.createElement("option");o.value=k;o.textContent=l;s.appendChild(o);});
  s.value=val;s.onchange=()=>fn(s.value);bar.appendChild(s);return s;}
function resetBtn(M){btn("↺ Reset view",()=>{M.view.yaw=M.view0.yaw;M.view.pitch=M.view0.pitch;redraw();});}
function row(name,val,em){return '<tr><td>'+name+(em?'<br><span style="color:var(--dim);font-size:12.5px">'+em+'</span>':'')+'</td><td>'+val+'</td></tr>';}
function table(rows){return '<table class="meas"><tr><th>Measure</th><th>Value</th></tr>'+rows.join("")+'</table>';}

/* animation */
let animId=null;
function stopAnim(){if(animId){cancelAnimationFrame(animId);animId=null;}}
function tween(obj,key,to,ms,done){stopAnim();const from=obj[key],t0=performance.now();
  const step=now=>{const u=Math.min(1,(now-t0)/ms);obj[key]=from+(to-from)*u;redraw();
    if(u<1)animId=requestAnimationFrame(step);else{animId=null;if(done)done();}};
  animId=requestAnimationFrame(step);}
const ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;

/* shared camera builder: fit a solid of extent ext (units) into the board */
function camFor(M,ext,target,cx,cy,px){
  return {s:(px||300)/ext, cx:cx==null?350:cx, cy:cy==null?250:cy, target:target||[0,0,0], D:ext*4.2, view:M.view};
}
const lab=(sc,p,t,col,cls,dx,dy)=>sc.labels.push({p:p,t:t,col:col,cls:cls||"big",dx:dx,dy:dy});
// solve for the y on the vertical line (x,·,z) whose projection has screen y = sy
function yFromScreen(P,x,z,sy,y0,y1){
  let a=y0,b=y1; const fa=P([x,a,z])[1]-sy;
  for(let i=0;i<40;i++){const m=(a+b)/2, fm_=P([x,m,z])[1]-sy; if((fm_>0)===(fa>0))a=m; else b=m;}
  return (a+b)/2;
}
// a horizontal plane quad at height y
const hPlane=(x0,x1,z0,z1,y)=>[[x0,y,z0],[x1,y,z0],[x1,y,z1],[x0,y,z1]];

/* ══════════════════════ TAB 1 · prisms & cylinders ══════════════════════ */
const T1={kind:"rect",l:6,w:4,h:5,b:6,a:4,s:2.5,r:3,t:1,layers:true};
function baseOf1(){
  const k=T1.kind;
  if(k==="rect") return {P:[[-T1.l/2,-T1.w/2],[T1.l/2,-T1.w/2],[T1.l/2,T1.w/2],[-T1.l/2,T1.w/2]], B:T1.l*T1.w,
    Bs:fm(T1.l)+" × "+fm(T1.w), Bf:"B = l · w", name:"rectangular prism", span:Math.hypot(T1.l,T1.w)};
  if(k==="tri"){const b=T1.b,a=T1.a; return {P:[[-b/2,a/2],[b/2,a/2],[-b/2+0.3*b,-a/2]], B:b*a/2,
    Bs:"½ × "+fm(b)+" × "+fm(a), Bf:"B = ½ · b · a", name:"triangular prism", span:Math.max(b,a)*1.15};}
  if(k==="hex"){const s=T1.s; return {P:circ(s,6), B:3*Math.sqrt(3)/2*s*s, Bs:"(3√3 ⁄ 2) × "+fm(s)+"²", Bf:"B = (3√3 ⁄ 2) · s²", name:"regular hexagonal prism", span:2*s};}
  return {P:circ(T1.r,48), B:PI*T1.r*T1.r, Bs:"π × "+fm(T1.r)+"²", Bf:"B = π r²", name:"cylinder", span:2*T1.r, cyl:true};
}
const M1={
  tab:"Prisms & cylinders", lesson:"G-GMD.A.1 · A.3", accent:"var(--cyan)", view:{yaw:-32,pitch:24}, view0:{yaw:-32,pitch:24},
  title:()=>"V = B · h: stack the base", aria:"Prism or cylinder; drag to rotate",
  bar(){
    segBtns([["rect","Rectangular"],["tri","Triangular"],["hex","Hexagonal"],["cyl","Cylinder"]],T1.kind,k=>{stopAnim();T1.kind=k;T1.t=1;render();},"Solid");
    const g=T1.kind;
    if(g==="rect"){range(1,9,.5,T1.l,v=>"l = "+fm(v),v=>{T1.l=v;update();},"Length");range(1,7,.5,T1.w,v=>"w = "+fm(v),v=>{T1.w=v;update();},"Width");}
    if(g==="tri"){range(1,9,.5,T1.b,v=>"b = "+fm(v),v=>{T1.b=v;update();},"Triangle base");range(1,7,.5,T1.a,v=>"a = "+fm(v),v=>{T1.a=v;update();},"Triangle altitude");}
    if(g==="hex")range(1,4.5,.5,T1.s,v=>"s = "+fm(v),v=>{T1.s=v;update();},"Hexagon side");
    if(g==="cyl")range(1,4.5,.5,T1.r,v=>"r = "+fm(v),v=>{T1.r=v;update();},"Radius");
    range(1,9,1,T1.h,v=>"h = "+fm(v),v=>{stopAnim();T1.h=v;T1.t=1;update();},"Height");
    btn("▶ Stack the layers",()=>{T1.t=0;tween(T1,"t",1,900*T1.h,()=>update());},"primary");
    chk("Layer lines",T1,"layers");
    resetBtn(M1);
  },
  draw(){
    const b=baseOf1(), h=T1.h, sc=scene();
    const ext=Math.max(b.span,h,4)*1.25, cam=camFor(M1,ext,[0,h/2,0],350,255,330);
    const n=Math.ceil(h-1e-9), shown=T1.t*n;
    const opts={col:COL.blue,op:.32,bop:.08,smooth:b.cyl};
    if(T1.t>=1){
      sc.meshes.push(prism(b.P,0,h,Object.assign({},opts,{baseFace:{c:COL.orange,op:.55,bop:.35}})));
      if(T1.layers) for(let k=1;k<n;k++){ const P=b.P, m=P.length, c=cen2(P);
        for(let i=0;i<m;i++){const i1=(i+1)%m, nx=(P[i][0]+P[i1][0])/2-c[0], nz=(P[i][1]+P[i1][1])/2-c[1];

// answer parser: numbers, fractions, π / pi, implicit multiplication ("36pi", "4/3 pi", "2(3)"), ^ powers
function parseAns(str){
  let s=String(str).toLowerCase().replace(/π/g,"pi").replace(/×|·/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/,/g,"");
  s=s.replace(/(cubic|square|units?|cm|mm|in|ft|m|kg|g|l)(\^?[23³²])?\b/g," ").replace(/[³²]/g,"");
  s=s.replace(/\s+/g,"");
  if(!s) return NaN;
  if(/[^0-9.+\-*/^()pi]/.test(s)) return NaN;
  let i=0;
  const peek=()=>s[i];
  function num(){let st=i; while(i<s.length&&/[0-9.]/.test(s[i]))i++; const v=parseFloat(s.slice(st,i)); if(isNaN(v))throw 0; return v;}
  function atom(){
    if(peek()==="("){i++;const v=expr();if(peek()!==")")throw 0;i++;return v;}
    if(s.startsWith("pi",i)){i+=2;return PI;}
    if(/[0-9.]/.test(peek()||""))return num();
    throw 0;
  }
  function power(){let v=atom(); if(peek()==="^"){i++;v=Math.pow(v,unary());} return v;}
  function unary(){if(peek()==="-"){i++;return -unary();} if(peek()==="+"){i++;return unary();} return power();}
  function term(){let v=unary(); for(;;){const c=peek();
    if(c==="*"){i++;v*=unary();} else if(c==="/"){i++;v/=unary();}
    else if(c==="("||c==="p"||(c&&/[0-9.]/.test(c))){v*=unary();} else break;} return v;}
  function expr(){let v=term(); for(;;){const c=peek(); if(c==="+"){i++;v+=term();} else if(c==="-"){i++;v-=term();} else break;} return v;}
  try{const v=expr(); if(i!==s.length)return NaN; return v;}catch(e){return NaN;}
}

  fb.innerHTML=ok? '<div class="verdict good"><b>Correct.</b> '+p.ex+'<div class="btnrow" style="margin-top:12px"><button type="button" class="ghost" id="next7">Next problem →</button></div></div>'
    : '<div class="verdict bad"><b>Not yet.</b>'+note+' '+p.ex+'</div>';
  if($("next7")){$("next7").onclick=()=>{newProblem();render();};$("next7").focus();}
}

/* ══════════════════════ pointer: rotate the view or drag a handle ══════════════════════ */
let dragId=null, rot=null;
function svgPt(e){const m=cv.getScreenCTM(); if(!m) return [0,0]; const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse()); return [p.x,p.y];}
cv.addEventListener("pointerdown",e=>{
  const id=e.target.dataset&&e.target.dataset.drag;
  cv.setPointerCapture(e.pointerId); e.preventDefault();
  if(id&&MODS[cur].drag){dragId=id;return;}
  stopAnim2(); rot={x:e.clientX,y:e.clientY,yaw:MODS[cur].view.yaw,pitch:MODS[cur].view.pitch}; cv.classList.add("rotating");
});
cv.addEventListener("pointermove",e=>{
  const M=MODS[cur];
  if(dragId&&M.drag){stopAnim(); M.drag(dragId,svgPt(e)); update(); return;}
  if(!rot)return;
  const r=cv.getBoundingClientRect(), k=360/Math.max(300,r.width);
  M.view.yaw=rot.yaw+(e.clientX-rot.x)*k*0.8;
  M.view.pitch=clamp(rot.pitch+(e.clientY-rot.y)*k*0.6,M.pitchMin!=null?M.pitchMin:-80,85);
  redraw();
});
["pointerup","pointercancel","lostpointercapture"].forEach(ev=>cv.addEventListener(ev,()=>{dragId=null;rot=null;cv.classList.remove("rotating");}));
cv.addEventListener("keydown",e=>{const M=MODS[cur]; let used=true;
  if(e.key==="ArrowLeft")M.view.yaw-=6; else if(e.key==="ArrowRight")M.view.yaw+=6;
  else if(e.key==="ArrowUp")M.view.pitch=clamp(M.view.pitch-5,M.pitchMin!=null?M.pitchMin:-80,85);
  else if(e.key==="ArrowDown")M.view.pitch=clamp(M.view.pitch+5,M.pitchMin!=null?M.pitchMin:-80,85); else used=false;
  if(used){e.preventDefault();redraw();}});
function stopAnim2(){ /* rotating does not stop lesson animations */ }

/* ══════════════════════ controller ══════════════════════ */
const MODS=[M1,M2,M3,M4,M5,M6,MC];
let cur=0;
function redraw(){ MODS[cur].draw(); }
function update(){ MODS[cur].draw(); const y=window.scrollY; MODS[cur].panel(); if(window.scrollY!==y) window.scrollTo(0,y); }
function render(){
  stopAnim(); dragId=null; rot=null;
  const M=MODS[cur];
  document.documentElement.style.setProperty("--accent",M.accent||"var(--cyan)");
  if(M===MC&&!T7.p)newProblem();
  bTitle.textContent=M.title(); bLesson.textContent=M.lesson; cv.setAttribute("aria-label",M.aria+"; drag or use arrow keys to rotate");
  M.draw();
  bar.innerHTML=""; M.bar();
  M.panel();
  [...tabsEl.children].forEach((b,i)=>{b.setAttribute("aria-selected",String(i===cur));b.tabIndex=i===cur?0:-1;});
}
function go(i,updateHash){
  cur=clamp(i,0,MODS.length-1); render();
  if(updateHash){ try{history.replaceState(null,"","#tab-"+(cur+1));}catch(_){location.hash="tab-"+(cur+1);} }
}
MODS.forEach((M,i)=>{
  const b=document.createElement("button"); b.type="button"; b.setAttribute("role","tab");
  b.innerHTML='<span class="n">'+String(i+1).padStart(2,"0")+'</span>'+M.tab;
  b.onclick=()=>go(i,true);
  b.addEventListener("keydown",e=>{
    if(e.key==="ArrowRight"||e.key==="ArrowLeft"){const j=(cur+(e.key==="ArrowRight"?1:MODS.length-1))%MODS.length;go(j,true);tabsEl.children[j].focus();}
  });
  tabsEl.appendChild(b);
});
if(new URLSearchParams(location.search).has("embed")) document.body.classList.add("embed");
function fromHash(){const m=/^#tab-(\d+)$/.exec(location.hash);return m?(+m[1])-1:null;}
window.addEventListener("hashchange",()=>{const h=fromHash();if(h!=null&&h!==cur)go(h,false);});
const h0=fromHash(); go(h0==null?0:h0,false);
})();
</script>
