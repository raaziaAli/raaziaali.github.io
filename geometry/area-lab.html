<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Area Lab — Geometry Unit 4</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A0A1F'/%3E%3Cpath d='M6 24 L12 8 L26 8 L20 24 Z' fill='%2300E5FF' fill-opacity='.35' stroke='%2300E5FF' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A1F; --bg-lift:#13132B; --card:#1C1C3A; --card-2:#242449;
    --cyan:#00E5FF; --magenta:#FF3D8A; --yellow:#FFD93D; --lavender:#C4B5FD;
    --coral:#FF6B6B; --mint:#5EEAD4;
    --accent:var(--cyan);
    --text:#F8F9FF; --dim:#A5A5C9; --edge:rgba(196,181,253,.20);

    --board:#FFFFFF; --grid:#DCE6F7;
    --ink:#14213D; --graphite:#22314F;
    --vert:#7C3AED; --lin:#EA580C; --corr:#0284C7; --alt:#059669;
    --altx:#DB2777; --same:#DC2626; --samex:#0891B2;
    --unk:#E11D48; --hand:#FF6B35;

    --display:"Unbounded","Trebuchet MS",system-ui,sans-serif;
    --ui:"DM Sans",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);font-family:var(--ui);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;position:relative;min-height:100vh;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse at 12% 8%,rgba(0,229,255,.13),transparent 55%),
               radial-gradient(ellipse at 88% 22%,rgba(255,61,138,.12),transparent 55%),
               radial-gradient(ellipse at 50% 105%,rgba(196,181,253,.10),transparent 60%);}
  .wrap{max-width:1220px;margin:0 auto;padding:26px 20px 70px;position:relative;z-index:1}

  header.masthead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .mark{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.6vw,38px);margin:0;letter-spacing:-.01em;
    background:linear-gradient(92deg,var(--cyan),var(--lavender) 55%,var(--magenta));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .eyebrow{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .masthead .eyebrow{margin-left:auto;text-align:right;
    border:1px solid var(--edge);border-radius:100px;padding:7px 15px;background:rgba(255,255,255,.03)}

  nav.tabs{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:20px}
  nav.tabs button{
    font-family:var(--ui);font-size:15px;font-weight:500;
    background:var(--card);color:var(--dim);border:1px solid var(--edge);border-radius:100px;
    padding:11px 19px;cursor:pointer;transition:transform .16s,color .16s,box-shadow .16s,background .16s;
  }
  nav.tabs button:hover{color:#fff;transform:translateY(-2px);background:var(--card-2)}
  nav.tabs button[aria-selected="true"]{
    color:#0A0A1F;background:var(--accent);border-color:var(--accent);font-weight:700;
    box-shadow:0 0 26px -4px var(--accent);
  }
  nav.tabs button .n{font-family:var(--mono);font-size:12px;font-weight:700;opacity:.6;margin-right:9px}
  nav.tabs button:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

  .stage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(330px,1fr);gap:22px;align-items:start}
  @media (max-width:960px){.stage{grid-template-columns:1fr}}

  .board{background:var(--card);border:1px solid var(--edge);border-radius:20px;overflow:hidden;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.8)}
  .board-head{display:flex;align-items:center;gap:12px;padding:16px 20px;flex-wrap:wrap;
    background:linear-gradient(90deg,var(--card-2),var(--card));border-bottom:1px solid var(--edge)}
  .board-head h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0;color:#fff;line-height:1.3}
  .board-head .lsn{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em;
    color:var(--accent);border:1px solid var(--accent);border-radius:100px;padding:5px 13px;white-space:nowrap}
  svg.canvas{display:block;width:100%;height:auto;background:linear-gradient(170deg,#FFFFFF 0%,#EEF4FF 100%);touch-action:none;
    -webkit-user-select:none;user-select:none}

  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:15px 20px;background:var(--card-2);border-top:1px solid var(--edge)}
  .bar button,.seg button{font-family:var(--ui);font-size:14.5px;font-weight:600;border:1px solid var(--edge);
    background:rgba(255,255,255,.06);color:var(--text);padding:10px 17px;border-radius:100px;cursor:pointer;transition:.16s}
  .bar button:hover,.seg button:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
  .bar button.primary{background:var(--accent);color:#0A0A1F;border-color:var(--accent);box-shadow:0 0 22px -6px var(--accent)}
  .seg{display:inline-flex;gap:6px;flex-wrap:wrap}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#0A0A1F;border-color:var(--accent);font-weight:700}
  .bar label.chk{display:inline-flex;align-items:center;gap:9px;font-size:14.5px;color:var(--text);cursor:pointer;
    background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:100px;padding:9px 16px}
  .bar label.chk:hover{background:rgba(255,255,255,.1)}
  .bar label.chk input{accent-color:var(--accent);width:17px;height:17px}
  .bar .spacer{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--dim)}
  .bar select{width:auto;max-width:340px;padding:9px 12px;border-radius:100px}
  .bar .rng{display:inline-flex;align-items:center;gap:10px;font-size:14px;color:var(--text);
    background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:100px;padding:6px 15px}
  .bar .rng input{accent-color:var(--accent);width:150px;max-width:38vw}
  .bar .rng output{font-family:var(--mono);font-weight:700;font-size:13.5px;min-width:3.4em;color:#fff}
  .bar button:focus-visible,.seg button:focus-visible,.go:focus-visible,.ghost:focus-visible,
  .bar label.chk:focus-within,.bar .rng:focus-within{outline:3px solid var(--yellow);outline-offset:2px}
  .note{margin:0 20px 16px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.55;
    background:rgba(255,217,61,.10);border:1px solid rgba(255,217,61,.35);color:#FBEFC9}
  .note b{color:#fff}

  .panel{border:1px solid var(--edge);border-radius:18px;background:var(--card);margin-bottom:16px;overflow:hidden}
  .panel h3{margin:0;padding:15px 20px;font-family:var(--display);font-weight:600;font-size:14px;
    letter-spacing:.01em;color:#fff;background:linear-gradient(90deg,var(--card-2),transparent);
    border-bottom:1px solid var(--edge)}
  .pad{padding:16px 20px;font-size:15px;color:#CFCFEA}
  .pad p{margin:0 0 11px} .pad p:last-child{margin-bottom:0}
  .pad b{color:#fff;font-weight:700}
  .term{font-weight:700;color:var(--accent)}

  .eq{font-family:var(--mono);font-size:14.5px;font-weight:600;color:#fff;background:rgba(0,0,0,.28);
    border:1px solid var(--edge);border-left:4px solid var(--accent);padding:13px 15px;margin:12px 0;
    border-radius:0 12px 12px 0;overflow-x:auto;white-space:pre-wrap;line-height:1.75}
  .eq small{display:block;font-family:var(--ui);font-size:13px;font-weight:400;color:var(--dim);margin-top:7px}

  .rel{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;
    padding:13px 20px;border-bottom:1px solid rgba(196,181,253,.12);font-size:15px}
  .rel:last-child{border-bottom:none}
  .rel .dot{width:13px;height:13px;border-radius:13px}
  .rel .nm{color:#fff;font-weight:500}
  .rel .nm em{font-style:normal;color:var(--dim);font-size:13px;display:block;font-weight:400}
  .rel .val{font-family:var(--mono);font-size:13.5px;font-weight:600;white-space:nowrap}
  .ok{color:var(--mint)} .no{color:var(--coral)}

  select,input[type=number],input[type=text]{
    font-family:var(--ui);font-size:15px;background:#0F0F26;color:#fff;
    border:1px solid var(--edge);border-radius:12px;padding:12px 13px;width:100%;}
  select:focus,input:focus{outline:3px solid var(--accent);outline-offset:1px}
  label.fld{display:block;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.1em;
    text-transform:uppercase;color:var(--accent);margin:16px 20px 7px}
  .fldwrap{padding:0 20px}
  .ansrow{display:flex;gap:8px}
  .ansrow .ghost{padding:10px 16px;font-size:17px;flex:none}
  .go{width:100%;font-family:var(--ui);font-size:16px;font-weight:700;background:var(--accent);color:#0A0A1F;
    border:none;padding:14px;border-radius:100px;cursor:pointer;box-shadow:0 0 26px -6px var(--accent);transition:.16s}
  .go:hover{transform:translateY(-2px)}
  .ghost{font-family:var(--ui);font-size:15px;font-weight:600;background:transparent;color:var(--dim);
    border:1px solid var(--edge);padding:14px 18px;border-radius:100px;cursor:pointer}
  .ghost:hover{color:#fff}
  .verdict{margin:16px 20px;padding:14px 16px;border-radius:14px;font-size:15px;line-height:1.6}
  .verdict.good{background:rgba(94,234,212,.13);border:1px solid rgba(94,234,212,.45);color:#D7FBF3}
  .verdict.bad{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.4);color:#FFDCDA}
  .verdict b{color:#fff}
  .verdict .w{display:block;margin-top:8px;font-family:var(--mono);font-size:13.5px;white-space:pre-wrap}

  table.tbl{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:13px}
  table.tbl th{font-weight:700;color:var(--accent);text-align:right;padding:9px 14px;border-bottom:1px solid var(--edge);font-size:12px;letter-spacing:.04em}
  table.tbl td{text-align:right;padding:7px 14px;border-bottom:1px solid rgba(196,181,253,.10);color:#DDDDF2;white-space:nowrap}
  table.tbl th:first-child,table.tbl td:first-child{text-align:left}
  table.tbl tr.hi td{background:rgba(255,255,255,.08);color:#fff;font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
  .tblwrap{overflow-x:auto}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;padding:0 20px 16px}
  .grid2 label.fld{margin:12px 0 6px;font-size:11px}
  .grid2 input,.grid2 select{padding:10px 11px}
  .sub{font-family:var(--display);font-size:12.5px;font-weight:600;color:var(--yellow);padding:14px 20px 0;letter-spacing:.02em}

  /* ── drawing ── */
  .line{stroke:var(--graphite);stroke-width:2.8;fill:none;stroke-linecap:round}
  .thin{stroke:var(--graphite);stroke-width:1.6;fill:none}
  .aux{stroke:var(--corr);stroke-width:2.2;fill:none;stroke-dasharray:8 6}
  .ghost-s{fill:none;stroke:#8A94B0;stroke-width:1.8;stroke-dasharray:6 5}
  .mk{font-family:var(--display);font-weight:600;font-size:18px;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
  .num{font-family:var(--mono);font-weight:700;font-size:16px;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
  .sm{font-family:var(--mono);font-weight:600;font-size:13px;paint-order:stroke;stroke:#fff;stroke-width:4;stroke-linejoin:round}
  .cap{font-family:var(--ui);font-weight:500;font-size:14.5px;fill:var(--graphite);paint-order:stroke;stroke:#fff;stroke-width:4;stroke-linejoin:round}
  .ban{font-family:var(--mono);font-weight:700;font-size:16.5px;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:6;stroke-linejoin:round}
  .dot{fill:var(--ink);stroke:#fff;stroke-width:2}
  .grab{fill:rgba(255,107,53,.20);stroke:var(--hand);stroke-width:2;stroke-dasharray:4 3;cursor:grab}
  .grab:hover{fill:rgba(255,107,53,.35)}
  .rt{stroke:var(--graphite);stroke-width:1.8;fill:none;opacity:.9}
  footer.foot{margin-top:30px;padding-top:18px;border-top:1px solid var(--edge);font-size:14px;color:var(--dim);
    display:flex;gap:18px;flex-wrap:wrap}
  footer.foot a{color:var(--cyan);text-decoration:none;font-weight:600}
  footer.foot a:hover{text-decoration:underline}
  footer.foot a:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

  body.embed header.masthead, body.embed footer.foot{display:none}
  body.embed .wrap{padding:10px}
  @media (max-width:520px){
    .wrap{padding:18px 12px 50px}
    .bar{padding:12px}
    .bar .spacer{margin-left:0;width:100%}
    .masthead .eyebrow{margin-left:0;text-align:left}
    .board-head .lsn{margin-left:0;white-space:normal}
    .grid2{grid-template-columns:1fr 1fr}
    table.tbl th,table.tbl td{padding:7px 9px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1 class="mark">Area <em>Lab</em></h1>
    <div class="eyebrow">Geometry · Unit 4 · Area &amp; Volume</div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Lessons"></nav>
  <div class="stage">
    <section class="board">
      <div class="board-head">
        <h2 id="bTitle">—</h2>
        <span class="lsn" id="bLesson"></span>
      </div>
      <svg class="canvas" id="cv" viewBox="0 0 700 460" role="img" aria-label="Area figure"></svg>
      <div class="bar" id="bar"></div>
    </section>
    <aside id="side"></aside>
  </div>
  <footer class="foot">
    <span>Every figure is live — drag the amber handles and every length, area and cost is recomputed from the drawing.</span>
    <a href="/geometry/">← Geometry course</a>
    <a href="/math/#geometry">Mrs. Ali's Classroom</a>
  </footer>
</div>

<script>
(function(){

/* ══════════════════════ helpers ══════════════════════ */
const NS="http://www.w3.org/2000/svg", VW=700, VH=460, PI=Math.PI;
const cv=document.getElementById("cv"), bar=document.getElementById("bar"),
      side=document.getElementById("side"), tabsEl=document.getElementById("tabs"),
      bTitle=document.getElementById("bTitle"), bLesson=document.getElementById("bLesson");
const BLUE="#0284C7", ORANGE="#EA580C", GREEN="#059669", VIOLET="#7C3AED", PINK="#DB2777", RED="#DC2626", INK="#22314F", TEAL="#0891B2";

const ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
const hyp=(a,b)=>Math.hypot(a,b);
function fmt(v,d){ if(d===undefined)d=1; const m=Math.pow(10,d); let x=Math.round(v*m)/m; if(Math.abs(x)<1e-12)x=0;
  return x.toLocaleString("en-US",{maximumFractionDigits:d}).replace("-","−"); }
const fp=(v,d)=>v<0?"("+fmt(v,d)+")":fmt(v,d);
const money=v=>"$"+v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function E(tag,a,par){const n=document.createElementNS(NS,tag); if(a)for(const k in a)n.setAttribute(k,a[k]); if(par)par.appendChild(n); return n;}

function T(g,x,y,s,o){o=o||{};
  if(o.fit){const w=String(s).length*(o.size||13)*0.62, an=o.a||"middle";
    if(an==="end")x=clamp(x,w+4,VW-4); else if(an==="start")x=clamp(x,4,VW-w-4); else x=clamp(x,w/2+4,VW-w/2-4);
    y=clamp(y,12,VH-10);}
  const t=E("text",{x:x.toFixed(1),y:y.toFixed(1),class:o.cls||"num","text-anchor":o.a||"middle","dominant-baseline":"middle"},g);
  if(o.c)t.setAttribute("fill",o.c); if(o.size)t.style.fontSize=o.size+"px";
  if(o.rot!==undefined)t.setAttribute("transform","rotate("+o.rot+" "+x.toFixed(1)+" "+y.toFixed(1)+")");
  t.textContent=s; return t;}
const ptsAttr=pts=>pts.map(p=>p[0].toFixed(2)+","+p[1].toFixed(2)).join(" ");
function P(g,pts,a){a=Object.assign({},a||{}); a.points=ptsAttr(pts); return E("polygon",a,g);}
function fillP(g,pts,col,op,extra){return P(g,pts,Object.assign({fill:col,"fill-opacity":op===undefined?.22:op,stroke:col,"stroke-width":2.6,"stroke-linejoin":"round"},extra||{}));}
function Ln(g,p,q,cls,extra){const a={x1:p[0].toFixed(2),y1:p[1].toFixed(2),x2:q[0].toFixed(2),y2:q[1].toFixed(2)};

  for(const k in (extra||{})){ if(cls==="")n.setAttribute(k,extra[k]); else st+=k+":"+extra[k]+";"; }
  if(st)n.setAttribute("style",st); return n;}
function dot(g,p,r){E("circle",{cx:p[0],cy:p[1],r:r||4.5,class:"dot"},g);}
function grab(g,p,id){E("circle",{cx:p[0],cy:p[1],r:16,class:"grab","data-drag":id},g); dot(g,p);}
function rtMark(g,c,u,v,sz){sz=sz||12;
  const a=[c[0]+u[0]*sz,c[1]+u[1]*sz], b=[a[0]+v[0]*sz,a[1]+v[1]*sz], d=[c[0]+v[0]*sz,c[1]+v[1]*sz];
  E("polyline",{points:ptsAttr([a,b,d]),class:"rt"},g);}
// dimension line: positive off is to the right of travel direction in screen coords (below for left→right)
function dimLine(g,p,q,label,off,o){o=o||{};
  const dx=q[0]-p[0], dy=q[1]-p[1], L=hyp(dx,dy)||1, nx=-dy/L, ny=dx/L;

}
function banner(g,s,y){T(g,18,y||28,s,{cls:"ban",a:"start"});}
function gridLines(g,U,ox,oy,box,col){
  box=box||{x0:0,y0:0,x1:VW,y1:VH};
  const st={stroke:col||"#DCE6F7","stroke-width":1};
  for(let x=ox-Math.floor((ox-box.x0)/U)*U; x<=box.x1+0.01; x+=U) Ln(g,[x,box.y0],[x,box.y1],"",st);
  for(let y=oy-Math.floor((oy-box.y0)/U)*U; y<=box.y1+0.01; y+=U) Ln(g,[box.x0,y],[box.x1,y],"",st);
}
function centroid(pts){let x=0,y=0;pts.forEach(p=>{x+=p[0];y+=p[1];});return [x/pts.length,y/pts.length];}
function signedArea(pts){let s=0;for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];s+=a[0]*b[1]-b[0]*a[1];}return s/2;}
function perimeter(pts){let s=0;for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];s+=hyp(b[0]-a[0],b[1]-a[1]);}return s;}
// labels at side midpoints pushed away from the centroid (screen px points)
function sideLabels(g,px,labels,o){o=o||{}; const c=centroid(px), off=o.off||16;
  for(let i=0;i<px.length;i++){ if(labels[i]===null||labels[i]===undefined)continue;
    const a=px[i], b=px[(i+1)%px.length], m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    const dx=b[0]-a[0], dy=b[1]-a[1], L=hyp(dx,dy)||1; let nx=-dy/L, ny=dx/L;
    if((m[0]-c[0])*nx+(m[1]-c[1])*ny<0){nx=-nx;ny=-ny;}

function simplifyRoot(n){let out=1,inn=n;for(let f=2;f*f<=inn;f++){while(inn%(f*f)===0){inn/=f*f;out*=f;}}return [out,inn];}
function radical(d2){ // exact-ish string for √d2 when d2 integer
  const r=Math.sqrt(d2);

  const n=Math.round(d2); if(Math.abs(r-Math.round(r))<1e-9) return fmt(r,0);
  const [o,i]=simplifyRoot(n); return (o>1?o:"")+"√"+i+" ≈ "+fmt(r);
}
function segX(p1,p2,p3,p4){
  const o=(a,b,c)=>{const v=(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);return Math.abs(v)<1e-9?0:(v>0?1:-1);};
  const on=(a,b,c)=>Math.min(a[0],b[0])-1e-9<=c[0]&&c[0]<=Math.max(a[0],b[0])+1e-9&&Math.min(a[1],b[1])-1e-9<=c[1]&&c[1]<=Math.max(a[1],b[1])+1e-9;

  if(d1!==d2&&d3!==d4&&d1&&d2&&d3&&d4)return true;
  if(d1===0&&on(p1,p2,p3))return true; if(d2===0&&on(p1,p2,p4))return true;
  if(d3===0&&on(p3,p4,p1))return true; if(d4===0&&on(p3,p4,p2))return true;
  return false;
}
function isSimple(pts){const n=pts.length;
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){ if(pts[i][0]===pts[j][0]&&pts[i][1]===pts[j][1])return false; }
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
    if(j===i+1||(i===0&&j===n-1))continue;
    if(segX(pts[i],pts[(i+1)%n],pts[j],pts[(j+1)%n]))return false;}
  if(Math.abs(signedArea(pts))<1e-9)return false;
  return true;}
function isConvex(pts,strict){let sg=0;const n=pts.length;
  for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n],c=pts[(i+2)%n];

    if(Math.abs(cr)<1e-9){if(strict)return false;continue;}
    const s=cr>0?1:-1; if(!sg)sg=s; else if(s!==sg)return false;}
  return true;}

  const iT=best((a,b)=>a[1]>b[1]||(a[1]===b[1]&&a[0]<b[0]));

  const pieces=[];

              :[{v:r*r*PI,m:"That is the area (πr²). Circumference is 2πr."},{v:r*PI,m:"Circumference is 2πr = πd — you used πr."},{v:4*r*PI,m:"You doubled the diameter. C = πd = "+2*r+"π."}],
    draw(g){const c=[350,250],R=150;
      E("circle",{cx:c[0],cy:c[1],r:R,fill:area?BLUE:"none","fill-opacity":.14,stroke:area?BLUE:ORANGE,"stroke-width":area?2.6:4},g); dot(g,c,4);
      if(useD){Ln(g,[c[0]-R,c[1]],[c[0]+R,c[1]],"line",{"stroke-width":2.2});T(g,c[0],c[1]-16,(2*r)+" "+u,{cls:"num"});}

function genCoord(){
  let pts; for(let t=0;t<300;t++){const n=Math.random()<0.5?3:4;
    pts=[];for(let i=0;i<n;i++)pts.push([rnd(-7,7),rnd(-5,5)]);
    if(!isSimple(pts)||!isConvex(pts,true))continue; if(Math.abs(signedArea(pts))<8)continue; break;}
  if(signedArea(pts)<0)pts.reverse();
  const n=pts.length, nm=NAMES.slice(0,n), list=pts.map((p,i)=>nm[i]+"("+fmt(p[0])+", "+fmt(p[1])+")").join(", ");
  const per=n===3&&Math.random()<0.4;
  let sum=0,terms=[];for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n],t=a[0]*b[1]-b[0]*a[1];sum+=t;terms.push(fmt(t));}
  const A=Math.abs(sum)/2, Pm=perimeter(pts);
  const B=boxPieces(pts); let bw=`box ${B.W} · ${B.H} = ${B.W*B.H}`; B.pieces.forEach(pc=>bw+=pc.type==="tri"?` − ${fmt(pc.area,2)}`:` − ${fmt(pc.area,2)}`); bw+=` = ${fmt(A,2)}`;
  const sides=[];for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];sides.push(nm[i]+nm[(i+1)%n]+" = "+radical((b[0]-a[0])**2+(b[1]-a[1])**2));}
  return {ask:per?`Triangle ${list}. Find its perimeter to the nearest tenth.`:`Find the area of ${n===3?"triangle":"quadrilateral"} ${nm} with vertices ${list}.`,
    ans:per?Pm:A,unit:per?"units":"square units",tol:per?Math.max(0.1,0.003*Pm):0.05,
    work:per?sides.join("\n")+`\nP ≈ ${fmt(Pm,1)}`:`Box and subtract: ${bw}\nShoelace: ½|${terms.join(" + ").replace(/\+ −/g,"− ")}| = ½|${fmt(sum)}| = ${fmt(A,2)}`,
    traps:per?[]:[{v:Math.abs(sum),m:"Don't forget the ½ in the shoelace formula."},{v:B.W*B.H,m:"That's the bounding box — subtract the corner triangles."}],
    draw(g){const U=28,O=[350,248], q=p=>[O[0]+p[0]*U,O[1]-p[1]*U];
      gridLines(g,U,O[0],O[1],{x0:350-8*U,y0:248-6.5*U,x1:350+8*U,y1:248+6.5*U});
      Ln(g,[350-8*U,O[1]],[350+8*U,O[1]],"thin",{stroke:"#7D8AA8"}); Ln(g,[O[0],248-6.5*U],[O[0],248+6.5*U],"thin",{stroke:"#7D8AA8"});
      for(let x=-8;x<=8;x+=2)if(x)T(g,q([x,0])[0],O[1]+12,fmt(x),{cls:"sm",size:10.5,c:"#7D8AA8"});
      for(let y=-6;y<=6;y+=2)if(y)T(g,O[0]-5,q([0,y])[1],fmt(y),{cls:"sm",size:10.5,c:"#7D8AA8",a:"end"});
      const px=pts.map(q); fillP(g,px,BLUE,.2); const c=centroid(px);
      px.forEach((p,i)=>{dot(g,p);const dx=p[0]-c[0],dy=p[1]-c[1],L=hyp(dx,dy)||1;T(g,p[0]+dx/L*22,p[1]+dy/L*18,nm[i]+"("+fmt(pts[i][0])+", "+fmt(pts[i][1])+")",{cls:"sm",fit:true,a:Math.abs(dx/L)<0.35?"middle":dx>0?"start":"end"});});}};
}
function genScale(){
  const u=pick(["cm","in","ft"]), U2s=u+"²", v=pick(["k","sides","ratio"]);
  const tri=(g,lab1,lab2,s1,s2,k)=>{const base=[[0,0],[4,0],[1.4,2.6]], s=Math.min(28,50/Math.max(k,1));
    const a=base.map(p=>[110+p[0]*s*1.2,380-p[1]*s*1.2]), b=base.map(p=>[300+p[0]*s*1.2*k,380-p[1]*s*1.2*k]);
    fillP(g,a,BLUE,.22); fillP(g,b,PINK,.18);
    T(g,centroid(a)[0],centroid(a)[1]+4,lab1,{cls:"sm",c:BLUE}); T(g,centroid(b)[0],centroid(b)[1]+4,lab2,{cls:"num",c:PINK});
    if(s1)dimLine(g,a[0],a[1],s1,18,{cls:"sm"}); if(s2)dimLine(g,b[0],b[1],s2,18,{cls:"sm"});};
  if(v==="k"){const k=pick([2,3,4,0.5,1.5,2.5]), A=k<1?rnd(6,20)*4:rnd(4,30), ans=A*k*k;
    return {ask:`A triangle has area ${A} ${U2s}. It is dilated by a scale factor of ${k}. What is the area of the image?`,ans,unit:U2s,
      work:`Area scales by k²:\nA' = k² · A = ${k}² · ${A} = ${fmt(k*k,4)} · ${A} = ${fmt(ans,2)} ${U2s}`,
      traps:[{v:A*k,m:"Lengths scale by k, but area scales by k²."},{v:A*2*k,m:"Square the scale factor: k² = "+fmt(k*k,4)+"."}],
      draw(g){tri(g,"A = "+A,"A' = ?",null,null,Math.min(k,2.4));T(g,350,60,"scale factor k = "+k,{cls:"cap"});}};}
  if(v==="sides"){const a=rnd(2,6), b=a+rnd(1,6), A=rnd(3,20), ans=A*(b/a)**2;
    return {ask:`Two similar triangles have corresponding sides ${a} ${u} and ${b} ${u}. The smaller triangle has area ${A} ${U2s}. Find the area of the larger triangle (nearest tenth).`,ans,unit:U2s,tol:Math.max(0.06,0.003*ans),
      work:`k = ${b} ÷ ${a} = ${fmt(b/a,4)}\nA' = k² · A = (${b}/${a})² · ${A} = ${fmt(ans,2)} ${U2s}`,
      traps:[{v:A*b/a,m:"The area ratio is the square of the side ratio."}],
      draw(g){tri(g,"A = "+A,"A' = ?",a+" "+u,b+" "+u,Math.min(b/a,2.4));}};}
  const pr=pick([[1,2],[2,3],[1,3],[3,4],[2,5],[3,5],[1,4]]), m=rnd(1,4), A1=pr[0]*pr[0]*m*2, A2=pr[1]*pr[1]*m*2, ans=pr[1]/pr[0];
  return {ask:`Two similar figures have areas ${A1} ${U2s} and ${A2} ${U2s}. What is the scale factor from the smaller to the larger? (A fraction like 3/2, or a decimal rounded to the hundredth.)`,ans,unit:"",tol:0.011,
    work:`k² = ${A2} ÷ ${A1} = ${fmt(A2/A1,4)}\nk = √${fmt(A2/A1,4)} = ${pr[1]}/${pr[0]} ≈ ${fmt(ans,3)}`,
    traps:[{v:A2/A1,m:"That ratio is k². Take the square root to get k."}],
    draw(g){tri(g,"A = "+A1,"A = "+A2,null,null,Math.min(ans,2.4));T(g,350,60,"scale factor k = ?",{cls:"cap"});}};
}
function genDens(){
  const kind=pick(["rect","circle","tri"]), P=rnd(12,240)*250;
  let area, dims, work, draw;
  if(kind==="rect"){const a=rnd(4,30),b=rnd(4,30); area=a*b; dims=`a rectangular county ${a} mi by ${b} mi`; work=`area = ${a} · ${b} = ${area} sq mi`;
    draw=g=>{const M=fitMap([[0,0],[a,0],[a,b],[0,b]]),px=[[0,0],[a,0],[a,b],[0,b]].map(M);fillP(g,px,VIOLET,.2);dimLine(g,px[0],px[1],a+" mi",22);dimLine(g,px[3],px[0],b+" mi",22);
      T(g,centroid(px)[0],centroid(px)[1],P.toLocaleString("en-US")+" people",{cls:"num"});};}
  else if(kind==="circle"){const r=rnd(3,15); area=PI*r*r; dims=`a circular region within ${r} mi of a town center`; work=`area = πr² = π(${r})² ≈ ${fmt(area,2)} sq mi`;
    draw=g=>{const c=[350,245],R=150;E("circle",{cx:c[0],cy:c[1],r:R,fill:VIOLET,"fill-opacity":.18,stroke:VIOLET,"stroke-width":2.6},g);dot(g,c);
      Ln(g,c,[c[0]+R,c[1]],"line",{"stroke-width":2});T(g,c[0]+R/2,c[1]-14,r+" mi",{cls:"num"});T(g,c[0],c[1]+40,P.toLocaleString("en-US")+" people",{cls:"num"});};}
  else {const b=rnd(8,30),h=rnd(6,24); area=b*h/2; dims=`a triangular region with base ${b} mi and height ${h} mi`; work=`area = ½ · ${b} · ${h} = ${fmt(area,2)} sq mi`;
    draw=g=>{const s=rnd(2,b-2)||b/2,M=fitMap([[0,0],[b,0],[s,h]]),A=M([0,0]),B=M([b,0]),C=M([s,h]),F=M([s,0]);fillP(g,[A,B,C],VIOLET,.2);Ln(g,C,F,"aux");rtMark(g,F,[1,0],[0,-1],10);
      dimLine(g,A,B,b+" mi",22);T(g,F[0]+10,(C[1]+F[1])/2,h+" mi",{a:"start",c:BLUE});T(g,centroid([A,B,C])[0]+(s<b/2?40:-40),centroid([A,B,C])[1]+20,P.toLocaleString("en-US")+" people",{cls:"num"});};}

const GENS={poly:genPoly,comp:genComp,circ:genCirc,coord:genCoord,scale:genScale,dens:genDens};
function newProblem(){const k=S6.kind==="mix"?pick(["poly","poly","comp","circ","circ","coord","coord","scale","dens"]):S6.kind; const p=GENS[k](); p.kind=k; return p;}
function parseAns(raw){
  let s=String(raw).toLowerCase().replace(/\s+/g,"").replace(/,/g,"").replace(/\$/g,"").replace(/pi/g,"π").replace(/[×·]/g,"*");
  const lead=/^[-0-9.π*\/]+/.exec(s); if(!lead)return null;
  const rest=s.slice(lead[0].length); if(rest&&!/^[a-z²]/.test(rest))return null;
  s=lead[0].replace(/[*\/]+$/,"");
  let m;
  if((m=/^(-?[0-9]*\.?[0-9]*)\*?π(?:\/([0-9]*\.?[0-9]+))?$/.exec(s))){let c=m[1]===""?1:m[1]==="-"?-1:parseFloat(m[1]); if(!isFinite(c))return null; if(m[2])c/=parseFloat(m[2]); return {v:c*PI,pi:true,coef:c};}
  if((m=/^π\*?([0-9]*\.?[0-9]+)$/.exec(s))){const c=parseFloat(m[1]);return {v:c*PI,pi:true,coef:c};}
  if((m=/^(-?[0-9]*\.?[0-9]+)\/([0-9]*\.?[0-9]+)$/.exec(s))){const d=parseFloat(m[2]);if(!d)return null;return {v:parseFloat(m[1])/d,pi:false};}
  if(!/^-?[0-9]*\.?[0-9]+$/.test(s))return null;
  return {v:parseFloat(s),pi:false};
}
