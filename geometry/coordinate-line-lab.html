<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coordinate Line Lab — Geometry Unit 1</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A0A1F'/%3E%3Cpath d='M10 50L54 14' stroke='%2300E5FF' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='10' cy='50' r='6' fill='%23FF3D8A'/%3E%3Ccircle cx='54' cy='14' r='6' fill='%23FFD93D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A1F; --bg-lift:#13132B; --card:#1C1C3A; --card-2:#242449;
    --cyan:#00E5FF; --magenta:#FF3D8A; --yellow:#FFD93D; --lavender:#C4B5FD;
    --coral:#FF6B6B; --mint:#5EEAD4;
    --accent:var(--cyan);
    --text:#F8F9FF; --dim:#A5A5C9; --edge:rgba(196,181,253,.20);

    --board:#FFFFFF; --grid:#DCE6F7;
    --ink:#14213D; --graphite:#22314F;
    --vert:#7C3AED; --lin:#EA580C; --corr:#0284C7; --alt:#059669;
    --altx:#DB2777; --same:#DC2626; --samex:#0891B2;
    --unk:#E11D48; --hand:#FF6B35;

    --display:"Unbounded","Trebuchet MS",system-ui,sans-serif;
    --ui:"DM Sans",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);font-family:var(--ui);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;position:relative;min-height:100vh;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse at 12% 8%,rgba(0,229,255,.13),transparent 55%),
               radial-gradient(ellipse at 88% 22%,rgba(255,61,138,.12),transparent 55%),
               radial-gradient(ellipse at 50% 105%,rgba(196,181,253,.10),transparent 60%);}
  .wrap{max-width:1220px;margin:0 auto;padding:26px 20px 70px;position:relative;z-index:1}

  header.masthead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .mark{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.6vw,38px);margin:0;letter-spacing:-.01em;
    background:linear-gradient(92deg,var(--cyan),var(--lavender) 55%,var(--magenta));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .eyebrow{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .masthead .eyebrow{margin-left:auto;text-align:right;
    border:1px solid var(--edge);border-radius:100px;padding:7px 15px;background:rgba(255,255,255,.03)}

  nav.tabs{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:20px}
  nav.tabs button{
    font-family:var(--ui);font-size:15px;font-weight:500;
    background:var(--card);color:var(--dim);border:1px solid var(--edge);border-radius:100px;
    padding:11px 19px;cursor:pointer;transition:transform .16s,color .16s,box-shadow .16s,background .16s;
  }
  nav.tabs button:hover{color:#fff;transform:translateY(-2px);background:var(--card-2)}
  nav.tabs button[aria-selected="true"]{
    color:#0A0A1F;background:var(--accent);border-color:var(--accent);font-weight:700;
    box-shadow:0 0 26px -4px var(--accent);
  }
  nav.tabs button .n{font-family:var(--mono);font-size:12px;font-weight:700;opacity:.6;margin-right:9px}
  nav.tabs button:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

  .stage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(330px,1fr);gap:22px;align-items:start}
  @media (max-width:960px){.stage{grid-template-columns:1fr}}

  .board{background:var(--card);border:1px solid var(--edge);border-radius:20px;overflow:hidden;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.8)}
  .board-head{display:flex;align-items:center;gap:12px;padding:16px 20px;flex-wrap:wrap;
    background:linear-gradient(90deg,var(--card-2),var(--card));border-bottom:1px solid var(--edge)}
  .board-head h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0;color:#fff;line-height:1.3}
  .board-head .lsn{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em;
    color:var(--accent);border:1px solid var(--accent);border-radius:100px;padding:5px 13px;white-space:nowrap}
  svg.canvas{display:block;width:100%;height:auto;background:linear-gradient(170deg,#FFFFFF 0%,#EEF4FF 100%);touch-action:none}

  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:15px 20px;background:var(--card-2);border-top:1px solid var(--edge)}
  .bar button,.seg button{font-family:var(--ui);font-size:14.5px;font-weight:600;border:1px solid var(--edge);
    background:rgba(255,255,255,.06);color:var(--text);padding:10px 17px;border-radius:100px;cursor:pointer;transition:.16s}
  .bar button:hover,.seg button:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
  .bar button.primary{background:var(--accent);color:#0A0A1F;border-color:var(--accent);box-shadow:0 0 22px -6px var(--accent)}
  .seg{display:inline-flex;gap:6px}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#0A0A1F;border-color:var(--accent);font-weight:700}
  .bar label.chk{display:inline-flex;align-items:center;gap:9px;font-size:14.5px;color:var(--text);cursor:pointer;
    background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:100px;padding:9px 16px}
  .bar label.chk:hover{background:rgba(255,255,255,.1)}
  .bar label.chk input{accent-color:var(--accent);width:17px;height:17px}
  .bar .spacer{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--dim)}
  .bar select{width:auto;max-width:340px}
  .chiprow{display:flex;flex-wrap:wrap;gap:7px;width:100%;margin-bottom:2px}
  .chiprow button{font-family:var(--ui);font-size:13.5px;font-weight:600;cursor:pointer;
    padding:8px 14px;border-radius:100px;background:rgba(255,255,255,.05);
    border:1.5px solid var(--c);color:#E7E9FA;transition:.15s;display:flex;align-items:center;gap:8px}
  .chiprow button::before{content:"";width:10px;height:10px;border-radius:10px;background:var(--c)}
  .chiprow button:hover{background:rgba(255,255,255,.12)}
  .chiprow button[aria-pressed="true"]{background:var(--c);color:#0A0A1F;font-weight:700}
  .chiprow button[aria-pressed="true"]::before{background:rgba(10,10,31,.55)}
  .rel[data-pair]{cursor:pointer}
  .rel[data-pair]:hover{background:rgba(255,255,255,.05)}
  .rel.active{background:rgba(255,255,255,.09);box-shadow:inset 3px 0 0 var(--accent)}
  .note{margin:0 20px 16px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.55;
    background:rgba(255,217,61,.10);border:1px solid rgba(255,217,61,.35);color:#FBEFC9}
  .note b{color:#fff}

  .panel{border:1px solid var(--edge);border-radius:18px;background:var(--card);margin-bottom:16px;overflow:hidden}
  .panel h3{margin:0;padding:15px 20px;font-family:var(--display);font-weight:600;font-size:14px;
    letter-spacing:.01em;color:#fff;background:linear-gradient(90deg,var(--card-2),transparent);
    border-bottom:1px solid var(--edge)}
  .pad{padding:16px 20px;font-size:15px;color:#CFCFEA}
  .pad p{margin:0 0 11px} .pad p:last-child{margin-bottom:0}
  .pad b{color:#fff;font-weight:700}
  .term{font-weight:700;color:var(--accent)}

  .eq{font-family:var(--mono);font-size:14.5px;font-weight:600;color:#fff;background:rgba(0,0,0,.28);
    border:1px solid var(--edge);border-left:4px solid var(--accent);padding:13px 15px;margin:12px 0;
    border-radius:0 12px 12px 0;overflow-x:auto;white-space:pre-wrap;line-height:1.75}
  .eq small{display:block;font-family:var(--ui);font-size:13px;font-weight:400;color:var(--dim);margin-top:7px}

  .rel{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;
    padding:13px 20px;border-bottom:1px solid rgba(196,181,253,.12);font-size:15px}
  .rel:last-child{border-bottom:none}
  .rel .dot{width:13px;height:13px;border-radius:13px}
  .rel .nm{color:#fff;font-weight:500}
  .rel .nm em{font-style:normal;color:var(--dim);font-size:13px;display:block;font-weight:400}
  .rel .val{font-family:var(--mono);font-size:13.5px;font-weight:600;white-space:nowrap}
  .ok{color:var(--mint)} .no{color:var(--coral)}

  select,input[type=number],input[type=text]{
    font-family:var(--ui);font-size:15px;background:#0F0F26;color:#fff;
    border:1px solid var(--edge);border-radius:12px;padding:12px 13px;width:100%;}
  select:focus,input:focus{outline:3px solid var(--accent);outline-offset:1px}
  label.fld{display:block;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.1em;
    text-transform:uppercase;color:var(--accent);margin:16px 20px 7px}
  .fldwrap{padding:0 20px}
  .go{width:100%;font-family:var(--ui);font-size:16px;font-weight:700;background:var(--accent);color:#0A0A1F;
    border:none;padding:14px;border-radius:100px;cursor:pointer;box-shadow:0 0 26px -6px var(--accent);transition:.16s}
  .go:hover{transform:translateY(-2px)}
  .ghost{font-family:var(--ui);font-size:15px;font-weight:600;background:transparent;color:var(--dim);
    border:1px solid var(--edge);padding:14px 18px;border-radius:100px;cursor:pointer}
  .ghost:hover{color:#fff}
  .verdict{margin:16px 20px;padding:14px 16px;border-radius:14px;font-size:15px;line-height:1.6}
  .verdict.good{background:rgba(94,234,212,.13);border:1px solid rgba(94,234,212,.45);color:#D7FBF3}
  .verdict.bad{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.4);color:#FFDCDA}
  .verdict b{color:#fff}

  table.facts{width:100%;border-collapse:collapse;font-size:14.5px}
  table.facts td{padding:12px 20px;border-bottom:1px solid rgba(196,181,253,.11);vertical-align:top}
  table.facts .ab{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--accent);white-space:nowrap}
  table.facts .st{color:#DDDDF2}
  table.facts .st i{display:block;color:var(--dim);font-style:normal;font-size:13px;margin-top:4px}
  .cathead{padding-top:18px!important;padding-bottom:6px!important;font-family:var(--display);font-weight:600;
    font-size:13px;letter-spacing:.02em;color:var(--yellow);border-bottom:none!important}
  .chip{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.09em;
    text-transform:uppercase;padding:4px 10px;border-radius:100px;margin-right:9px}
  .chip.assume{background:rgba(255,217,61,.18);color:var(--yellow)}
  .chip.proved{background:rgba(94,234,212,.16);color:var(--mint)}
  ol.chain{margin:0;padding:6px 20px 18px 38px;font-size:15px;color:#CFCFEA}
  ol.chain li{padding:8px 0} ol.chain li::marker{color:var(--accent);font-weight:700}
  ol.chain li b{color:#fff}

  .steps{width:100%;border-collapse:collapse;font-size:15px}
  .steps td{padding:12px 20px;border-bottom:1px solid rgba(196,181,253,.11);vertical-align:middle}
  .steps .stmt{font-family:var(--mono);font-size:14px;font-weight:600;color:#fff;white-space:nowrap}
  .steps .why{width:56%}
  .steps tr.right .stmt{color:var(--mint)}
  .steps tr.right select{border-color:rgba(94,234,212,.6)}
  .steps tr.wrong select{border-color:var(--coral)}

  /* ── drawing ── */
  .line{stroke:var(--graphite);stroke-width:2.8;fill:none;stroke-linecap:round}
  .thin{stroke:var(--graphite);stroke-width:1.8;fill:none}
  .aux{stroke:var(--corr);stroke-width:2.4;fill:none;stroke-dasharray:9 6}
  .wedge{stroke-width:2.4;fill-opacity:.17;cursor:pointer}
  .wedge.flat{cursor:default}
  .mk{font-family:var(--display);font-weight:600;font-size:20px;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
  .num{font-family:var(--mono);font-weight:700;font-size:16px;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
  .dot{fill:var(--ink);stroke:#fff;stroke-width:2}
  .grab{fill:rgba(255,107,53,.20);stroke:var(--hand);stroke-width:2;stroke-dasharray:4 3;cursor:grab}
  .grab:hover{fill:rgba(255,107,53,.35)}
  .rt{stroke:var(--graphite);stroke-width:1.8;fill:none;opacity:.9}
  footer.foot{margin-top:30px;padding-top:18px;border-top:1px solid var(--edge);font-size:14px;color:var(--dim)}

  /* ── Coordinate Line Lab additions ── */
  body.embed header.masthead, body.embed footer.foot{display:none}
  body.embed .wrap{padding:10px}
  footer.foot a{color:var(--cyan);text-decoration:none;font-weight:600}
  footer.foot a:hover{text-decoration:underline}
  footer.foot .links{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}
  .bar button:focus-visible,.seg button:focus-visible,.chiprow button:focus-visible,.go:focus-visible,.ghost:focus-visible,.choice:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  .rng{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:14px;font-weight:600;color:var(--text);
    background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:100px;padding:7px 15px}
  .rng input{accent-color:var(--accent);width:110px}
  .rng output{min-width:16px;text-align:right;color:var(--accent)}
  svg.canvas{-webkit-user-select:none;user-select:none}
  svg.canvas text{pointer-events:none}
  @media (max-width:560px){ svg.canvas .sm{font-size:21px;stroke-width:5} svg.canvas .mk{font-size:27px} svg.canvas .num{font-size:22px} svg.canvas .ax{font-size:16px} }
  .sm{font-family:var(--mono);font-weight:600;font-size:13.5px;paint-order:stroke;stroke:#fff;stroke-width:4;stroke-linejoin:round}
  .ax{font-family:var(--mono);font-size:11px;fill:#7C8AAB}
  .leg{stroke-width:3;fill:none;stroke-dasharray:8 5;stroke-linecap:round}
  .tick{stroke:var(--graphite);stroke-width:2.2}
  .ghostdot{fill:#9AA8C7;stroke:#fff;stroke-width:2}
  .nt{position:relative;display:inline-block;padding-top:.42em;line-height:1.05;font-family:var(--mono);font-weight:700;color:#fff;white-space:nowrap}
  .nt::before{content:"";position:absolute;left:.06em;right:.06em;top:.2em;border-top:2px solid currentColor}
  .nt.ray::after,.nt.line::after{content:"";position:absolute;right:-.12em;top:calc(.2em - 3.5px);border-left:7px solid currentColor;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
  .nt.line .la{position:absolute;left:-.12em;top:calc(.2em - 3.5px);border-right:7px solid currentColor;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
  .uterms{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
  .uterms span{font-family:var(--mono);font-size:12px;font-weight:600;padding:5px 11px;border-radius:100px;
    border:1px solid var(--edge);color:var(--dim);opacity:.55}
  .uterms span.on{opacity:1;color:#0A0A1F;background:var(--accent);border-color:var(--accent)}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 20px}
  .choice{font-family:var(--ui);font-size:15px;font-weight:600;background:rgba(255,255,255,.06);color:var(--text);
    border:1px solid var(--edge);border-radius:14px;padding:13px 12px;cursor:pointer;text-align:left;line-height:1.5;transition:.15s}
  .choice:hover{background:rgba(255,255,255,.12)}
  .choice.right{border-color:var(--mint);background:rgba(94,234,212,.16)}
  .choice.wrong{border-color:var(--coral);background:rgba(255,107,107,.14)}
  .choice small{display:block;font-weight:400;color:var(--dim);font-size:12.5px}
  .stepl{list-style:none;margin:0;padding:6px 0}
  .stepl li{padding:10px 20px;border-left:3px solid transparent;color:var(--dim);font-size:14.5px}
  .stepl li.on{border-left-color:var(--accent);background:rgba(255,255,255,.05);color:#fff}
  .stepl li.done{color:#CFCFEA}
  .stepl li .sn{color:var(--accent);font-family:var(--mono);font-weight:700;margin-right:8px}
  .stepl li b{color:#fff}
  .ansrow{display:flex;gap:12px;padding:0 20px;flex-wrap:wrap}
  .ansrow > div{flex:1 1 120px}
  .ansrow label.fld{margin:14px 0 7px}
  .prob{font-size:15.5px;color:#E7E9FA}
  .prob b{color:#fff}
  @media (max-width:560px){
    .choices{grid-template-columns:1fr}
    .masthead .eyebrow{margin-left:0;text-align:left}
    .rng input{width:84px}
    .bar{padding:13px 14px}
    .pad{padding:14px 16px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1 class="mark">Coordinate Line Lab</h1>
    <div class="eyebrow">Geometry · Unit 1 · Points, Lines &amp; Angles</div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Lessons"></nav>
  <div class="stage">
    <section class="board" role="tabpanel">
      <div class="board-head">
        <h2 id="bTitle">—</h2>
        <span class="lsn" id="bLesson"></span>
      </div>
      <svg class="canvas" id="cv" viewBox="0 0 700 460" role="img" aria-label="Coordinate geometry figure"></svg>
      <div class="bar" id="bar"></div>
    </section>
    <aside id="side"></aside>
  </div>
  <footer class="foot">Every figure is live and every number is computed from the drawing — drag a point and the work follows. Vocabulary follows Common Core / Eureka Math (EngageNY) Geometry.
    <div class="links"><a href="/geometry/">← Geometry course</a><a href="/math/#geometry">Mrs. Ali's Classroom</a></div>
  </footer>
</div>

<script>
(function(){
"use strict";
/* ══════════════════════ helpers ══════════════════════ */
const NS="http://www.w3.org/2000/svg";
const VW=700, VH=460, S=30, OX=350, OY=230;     // 1 grid unit = 30 svg px, origin at board centre
const XL=11, YL=7;                              // usable coordinate range
const cv=document.getElementById("cv"), bar=document.getElementById("bar"),
      side=document.getElementById("side"), tabsEl=document.getElementById("tabs"),
      bTitle=document.getElementById("bTitle"), bLesson=document.getElementById("bLesson");
if(new URLSearchParams(location.search).has("embed")) document.body.classList.add("embed");

const D2R=Math.PI/180;
const norm=d=>((d%360)+360)%360;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const isInt=v=>Math.abs(v-Math.round(v))<1e-9;
const near=(a,b,e)=>Math.abs(a-b)<(e||1e-9);
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a||1;};
const minus=s=>String(s).replace(/-/g,"−");
function num(v,dp){ dp=(dp==null?1:dp); const f=Math.pow(10,dp); let s=Math.round(v*f)/f; if(Object.is(s,-0)||Math.abs(s)<1e-12)s=0; return minus(String(s)); }
function frac(v){
  for(let d=1;d<=24;d++){ const n=Math.round(v*d);
    if(Math.abs(n/d-v)<1e-7){ const g=gcd(n,d), N=n/g, D=d/g; return D===1? minus(String(N)) : minus(N+"/"+D); } }
  return null;
}
let snap=true, FS=1;           // shared snap-to-grid setting (tabs 2–5)
let cur=0;
// exact fraction when coordinates are on the grid, decimals otherwise
function fx(v){ const f=frac(v); return (f&&(snap||cur===5))? f : num(v,2); }
function fxa(v){ const s=fx(v); return s.indexOf("/")>=0? s+" ≈ "+num(v,2) : s; }
const par=(v,f)=>{ const s=(f||fx)(v); return v<-1e-12? "("+s+")" : s; };
const nm=v=>num(v,2);
const pt=p=>"("+nm(p[0])+", "+nm(p[1])+")";
function rootStr(n){
  n=Math.round(n); if(n===0)return "0";
  let k=1,r=n;
  for(let i=Math.floor(Math.sqrt(n));i>1;i--){ if(n%(i*i)===0){k=i;r=n/(i*i);break;} }
  if(r===1)return String(k);
  return (k>1?k:"")+"√"+r;
}
const W2S=p=>[OX+p[0]*S, OY-p[1]*S];
const S2W=p=>[(p[0]-OX)/S, (OY-p[1])/S];
function snapW(sp,free){
  const w=S2W(sp); let x=clamp(w[0],-XL,XL), y=clamp(w[1],-YL,YL);
  if(snap&&!free){x=Math.round(x);y=Math.round(y);} else {x=Math.round(x*10)/10;y=Math.round(y*10)/10;}
  return [x,y];
}

function distWork(A,B,n){

  t+=`   = √(${par(I.dx,nm)}² + ${par(I.dy,nm)}²)\n`;
  t+=`   = √(${nm(I.dx*I.dx)} + ${nm(I.dy*I.dy)})\n`;
  if(I.exact){ t+=`   = √${nm(I.s)}`; if(I.exact!=="√"+nm(I.s))t+=` = ${I.exact}`; if(!isInt(I.d))t+=` ≈ ${num(I.d)}`; }

    nota:()=>`${ntLine("A","B")} ∥ ${ntLine("C","D")}`,
    tryit:`Tilt D slightly off parallel. The lines now meet — maybe far off the board. The panel tells you where.`}

const DEF1={
  point:{A:[350,230]}, line:{A:[230,290],B:[470,170]}, segment:{A:[200,320],B:[500,140]},
  ray:{A:[180,310],B:[400,200]}, plane:{A:[230,300],B:[480,330],C:[420,160]},
  angle:{A:[500,120],B:[250,320],C:[560,330]}, circle:{O:[350,235],A:[500,235],B:[0,0]},
  perp:{A:[140,330],B:[560,170],C:[290,110],D:[402,397]}, par:{A:[140,170],B:[520,110],C:[170,340],D:[512,286]}
};
const U1=30; // tab-1 unit: one grid square
const M1={
  tab:"Undefined terms", lesson:"G-CO.A.1", accent:"var(--cyan)",
  title:()=>"Build it: "+TOOLS[M1.s.tool].label.toLowerCase(),
  s:{tool:"segment",pts:null,bAng:110,quiz:null,pick:null,score:{r:0,t:0},built:null},
  init(){ M1.reset(); },
  reset(){ const d=DEF1[M1.s.tool]; M1.s.pts={}; for(const k in d)M1.s.pts[k]=d[k].slice(); M1.s.bAng=110; if(M1.s.tool==="circle")M1.fixB(); },
  fixB(){ const P=M1.s.pts; if(P.O&&P.A&&P.B){ const r=len(sub(P.A,P.O)); P.B=PT(P.O,r,M1.s.bAng);} },
  bar(){
    const row=document.createElement("div"); row.className="chiprow";
    Object.keys(TOOLS).forEach(k=>{ const b=document.createElement("button"); b.type="button"; b.style.setProperty("--c","var(--cyan)");
      b.textContent=TOOLS[k].label; b.setAttribute("aria-pressed",String(M1.s.tool===k));
      b.onclick=()=>{M1.s.tool=k; M1.reset(); render();}; row.appendChild(b); });
    bar.appendChild(row);
    btn("Clear & place points",()=>{M1.s.pts={}; update();});
    btn("Reset figure",()=>{M1.reset(); update();});
    spacer("Tap the board to place · drag to move");
  },
  place(p){
    const T=TOOLS[M1.s.tool], P=M1.s.pts; const k=T.need.find(n=>!P[n]); if(!k)return;
    p=[clamp(p[0],14,VW-14),clamp(p[1],14,VH-14)];
    if(M1.s.tool==="circle"&&k==="B"){ M1.s.bAng=angOf(P.O,p); P.B=[0,0]; M1.fixB(); return; }
    P[k]=p;
  },
  drag(id,p){
    const P=M1.s.pts, t=M1.s.tool; p=[clamp(p[0],14,VW-14),clamp(p[1],14,VH-14)];
    if(t==="circle"){
      if(id==="B"){ M1.s.bAng=angOf(P.O,p); M1.fixB(); return; }
      P[id]=p; if(len(sub(P.A,P.O))<20)return false; M1.fixB(); return;
    }
    // snapping assists for perpendicular / parallel
    if((t==="perp"||t==="par")&&id==="D"&&P.A&&P.B&&P.C){
      const u=unit(sub(P.B,P.A)), w=sub(p,P.C), L=len(w);
      if(L>20){ const a=Math.acos(clamp(Math.abs((u[0]*w[0]+u[1]*w[1])/L),0,1))/D2R;
        if(t==="perp"&&a>87){ const n=[-u[1],u[0]], s=Math.sign(n[0]*w[0]+n[1]*w[1])||1; p=[P.C[0]+n[0]*L*s,P.C[1]+n[1]*L*s]; }
        if(t==="par"&&a<3){ const s=Math.sign(u[0]*w[0]+u[1]*w[1])||1; p=[P.C[0]+u[0]*L*s,P.C[1]+u[1]*L*s]; } }
    }
    for(const k in P){ if(k!==id&&P[k]&&len(sub(P[k],p))<10)return false; }
    P[id]=p;
  },
  info(){ // live measures for the current tool
    const P=M1.s.pts, t=M1.s.tool, T=TOOLS[t], ok=T.need.every(k=>P[k]); if(!ok)return null;
    const L=(a,b)=>len(sub(P[b],P[a]))/U1;
    const r={};
    if(t==="segment")r.AB=L("A","B");
    if(t==="angle"||t==="plane"){ const v1=sub(P.A,P.B), v2=sub(P.C,P.B); r.cross=(v1[0]*v2[1]-v1[1]*v2[0])/(len(v1)*len(v2));
      let d=Math.abs(angOf(P.B,P.A)-angOf(P.B,P.C)); if(d>180)d=360-d; r.ang=d; }
    if(t==="circle"){ r.r=L("O","A"); r.th=norm(M1.s.bAng-angOf(P.O,P.A)); r.arc=r.r*r.th*D2R; }
    if(t==="perp"||t==="par"){
      const d1=sub(P.B,P.A), d2=sub(P.D,P.C); const cr=d1[0]*d2[1]-d1[1]*d2[0];
      let a=Math.abs(angOf([0,0],d2)-angOf([0,0],d1))%180; r.ang=a; r.cross=cr/(len(d1)*len(d2));
      if(Math.abs(r.cross)>1e-6){ const w=sub(P.C,P.A); const s=(w[0]*d2[1]-w[1]*d2[0])/cr; r.X=add(P.A,mul(d1,s)); }
    }
    return r;
  },
  draw(){
    const g=gridBg(false), P=M1.s.pts, t=M1.s.tool, T=TOOLS[t], I=M1.info(), ink="var(--graphite)", blue="var(--corr)";
    const have=T.need.filter(k=>P[k]);
    const cen=have.length? [have.reduce((s,k)=>s+P[k][0],0)/have.length, have.reduce((s,k)=>s+P[k][1],0)/have.length] : [350,230];
    const drawLine=(a,b,c,both)=>{ const cl=clipLine(a,b,22,both?null:0); if(!cl)return; sseg(g,cl[0],cl[1],c,3);
      const d=unit(sub(b,a)); arrowHead(g,add(cl[1],mul(d,8)),d,c); if(both)arrowHead(g,add(cl[0],mul(d,-8)),[-d[0],-d[1]],c); return cl; };
    if(I){
      if(t==="line")drawLine(P.A,P.B,ink,true);
      if(t==="segment"){ sseg(g,P.A,P.B,ink,3.4); const n=normalAway(S2W(P.A),S2W(P.B),[0,-20]); sideLabel(g,P.A,P.B,[n[0],n[1]],"AB = "+num(I.AB)+" units","var(--corr)"); }
      if(t==="ray")drawLine(P.A,P.B,ink,false);
      if(t==="plane"){
        const c=[(P.A[0]+P.B[0]+P.C[0])/3,(P.A[1]+P.B[1]+P.C[1])/3];
        if(Math.abs(I.cross)>0.08){
          const u=sub(P.B,P.A), v=sub(P.C,P.A); const k=1.25;
          const corners=[add(c,add(mul(u,-k*.7),mul(v,-k*.7))),add(c,add(mul(u,k*.8),mul(v,-k*.7))),add(c,add(mul(u,k*.8),mul(v,k*.8))),add(c,add(mul(u,-k*.7),mul(v,k*.8)))];
          g.appendChild(E("polygon",{points:corners.map(p=>p.join(",")).join(" "),style:"fill:rgba(2,132,199,.10);stroke:var(--corr)","stroke-width":2,"stroke-dasharray":"7 5"}));
          stext(g,[clamp(corners[2][0],60,640),clamp(corners[2][1]-14,20,440)],"plane 𝓜","mk","var(--corr)");
        } else stext(g,[350,30],"A, B, C are collinear — many planes contain them","sm","var(--unk)");
      }
      if(t==="angle"){
        drawLine(P.B,P.A,ink,false); drawLine(P.B,P.C,ink,false);
        if(Math.abs(I.cross)>0.01){
          let a1=angOf(P.B,P.A), a2=angOf(P.B,P.C); if(norm(a2-a1)>180){const tt=a1;a1=a2;a2=tt;}
          const sw=norm(a2-a1), r=42, s=PT(P.B,r,a1), e=PT(P.B,r,a2);
          if(near(I.ang,90,0.5)) { const u1=unit(sub(P.A,P.B)),u2=unit(sub(P.C,P.B)); rightMark(g,P.B,u1,u2,16); }
          else g.appendChild(E("path",{d:`M ${P.B[0]} ${P.B[1]} L ${s[0]} ${s[1]} A ${r} ${r} 0 0 0 ${e[0]} ${e[1]} Z`,style:"fill:var(--vert);stroke:var(--vert)","fill-opacity":.17,"stroke-width":2.4}));
          stext(g,PT(P.B,r+30,a1+sw/2),num(I.ang)+"°","num","var(--vert)");
        } else stext(g,[350,30],"Rays are collinear — not an angle by definition","sm","var(--unk)");
      }
      if(t==="circle"){
        const r=len(sub(P.A,P.O));
        g.appendChild(E("circle",{cx:P.O[0],cy:P.O[1],r:r,style:"fill:none;stroke:var(--graphite)","stroke-width":2.8}));
        sseg(g,P.O,P.A,blue,2.6,"8 5");
        const nO=unit(sub(P.A,P.O)); sideLabel(g,P.O,P.A,[-nO[1],-nO[0]],"r = "+num(I.r),"var(--corr)");
        const a1=angOf(P.O,P.A), sw=I.th;
        if(sw>0.5){ g.appendChild(E("path",{d:`M ${P.A[0]} ${P.A[1]} A ${r} ${r} 0 ${sw>180?1:0} 0 ${P.B[0]} ${P.B[1]}`,style:"fill:none;stroke:var(--magenta)","stroke-width":6,"stroke-linecap":"round",opacity:.85}));
          const lp=PT(P.O,r+(r>150?-34:34),a1+sw/2); stext(g,[clamp(lp[0],60,640),clamp(lp[1],16,444)],"arc AB ≈ "+num(I.arc),"sm","#C0185F"); }
      }
      if(t==="perp"||t==="par"){
        drawLine(P.A,P.B,ink,true); drawLine(P.C,P.D,"var(--lin)",true);
        const X=I.X;
        if(X&&X[0]>0&&X[0]<VW&&X[1]>0&&X[1]<VH){
          if(t==="perp"&&near(I.ang,90,0.05)){ const u1=unit(sub(P.B,P.A)),u2=unit(sub(P.D,P.C)); rightMark(g,X,u1,u2,16); }
          else { const a1=angOf([0,0],sub(P.B,P.A)), a2=a1+I.ang, r=34, s=PT(X,r,a1), e=PT(X,r,a2);
            g.appendChild(E("path",{d:`M ${X[0]} ${X[1]} L ${s[0]} ${s[1]} A ${r} ${r} 0 0 0 ${e[0]} ${e[1]} Z`,style:"fill:var(--vert);stroke:var(--vert)","fill-opacity":.17,"stroke-width":2.2}));
            stext(g,PT(X,r+24,a1+I.ang/2),num(I.ang)+"°","num","var(--vert)"); }
          sdot(g,X,"var(--vert)",4);
        }
        if(t==="par"&&Math.abs(I.cross)<1e-6){
          [[P.A,P.B,ink],[P.C,P.D,"var(--lin)"]].forEach(([a,b,c])=>{ const m=[(a[0]+b[0])/2,(a[1]+b[1])/2], d=unit(sub(b,a));
            [0,9].forEach(o=>{ const tip=add(m,mul(d,o+6)); const n=[-d[1],d[0]], bb=add(tip,mul(d,-9));
              g.appendChild(E("polyline",{points:[add(bb,mul(n,6)),tip,add(bb,mul(n,-6))].map(p=>p.join(",")).join(" "),style:"fill:none;stroke:"+c,"stroke-width":2.4})); }); });
        }
      }
    }
    if(t==="point"&&P.A) stext(g,[P.A[0],P.A[1]+34],"point A","sm","var(--corr)");
    // handles + labels
    T.need.forEach(k=>{ if(!P[k])return; sgrab(g,P[k],k,k==="O"||(k==="B"&&t==="angle")?"var(--vert)":null);
      let d=sub(P[k],cen); if(len(d)<5)d=[-1,-1.2]; smartLabel(g,P[k],d,k,"var(--ink)","mk"); });
    const miss=T.need.filter(k=>!P[k]);
    if(miss.length) stext(g,[350,VH-24],"Tap the board to place point "+miss[0]+(t==="circle"&&miss[0]==="B"?" (it lands on the circle)":""),"sm","var(--unk)");
  },
  live(){
    const I=M1.info(), t=M1.s.tool, el=document.getElementById("t1live"); if(!el)return;
    if(!I){ el.innerHTML=`<p>Place the remaining points to finish the figure.</p>`; return; }
    let h="";
    if(t==="point")h=`<p>A point has a position but <b>no size</b>: the dot is just so we can see it.</p>`;
    if(t==="line")h=`<p>Two points, one line. The arrows remind you the line keeps going past the board.</p>`;
    if(t==="segment")h=`<p>Length <b>AB = ${num(I.AB)}</b> units (1 unit = 1 grid square). This is the <b>distance along a line</b> from A to B.</p>`;
    if(t==="ray")h=`<p>Endpoint <b>A</b>; the ray runs through B and on forever. A point on the other side of A is <b>not</b> on ${ntRay("A","B")}.</p>`;
    if(t==="plane")h=Math.abs(I.cross)>0.08?`<p>A, B, C are non-collinear, so they determine exactly one plane.</p>`:`<div class="verdict bad" style="margin:0"><b>Collinear.</b> Infinitely many planes contain line AB, so these points do not name a single plane.</div>`;
    if(t==="angle")h=Math.abs(I.cross)>0.01?`<p><b>m∠ABC = ${num(I.ang)}°</b> — ${I.ang<89.95?"acute":I.ang<90.05?"right":"obtuse"}.</p>`:`<div class="verdict bad" style="margin:0"><b>Collinear rays.</b> The definition needs non-collinear rays, so this is not an angle.</div>`;
    if(t==="circle")h=`<p>Radius <b>r = ${num(I.r)}</b>. Every point on the circle is ${num(I.r)} units from O.</p><p>Central angle ${num(I.th)}°, so arc AB = r · θ(in radians) ≈ <b>${num(I.arc)}</b> units — the <b>distance around a circular arc</b>.</p>`;
    if(t==="perp"){ const ok=near(I.ang,90,0.05); h=`<p>Angle at the intersection: <b>${num(I.ang)}°</b> (and ${num(180-I.ang)}°).</p>`+
      (ok?`<div class="verdict good" style="margin:0"><b>Perpendicular.</b> The lines meet at a right angle: ${ntLine("A","B")} ⊥ ${ntLine("C","D")}.</div>`:`<div class="verdict bad" style="margin:0"><b>Not perpendicular.</b> Drag D until the angle is 90°.</div>`); }
    if(t==="par"){ const ok=Math.abs(I.cross)<1e-6;
      h= ok?`<div class="verdict good" style="margin:0"><b>Parallel.</b> These lines never meet: ${ntLine("A","B")} ∥ ${ntLine("C","D")}.</div>`
          : `<div class="verdict bad" style="margin:0"><b>Not parallel.</b> The lines meet at an angle of ${num(Math.min(I.ang,180-I.ang))}°, ${I.X&&I.X[0]>0&&I.X[0]<VW&&I.X[1]>0&&I.X[1]<VH?"right here on the board":"off the board, about "+num(len(sub(I.X,[350,230]))/U1,0)+" units from the centre"}.</div>`; }
    el.innerHTML=h;
  },
  newQuiz(){
    const L="ABCDEFGHJKLMNPQRSTWXYZ".split(""); const a=L.splice(rnd(0,L.length-1),1)[0], b=L.splice(rnd(0,L.length-1),1)[0], c=L.splice(rnd(0,L.length-1),1)[0];
    const type=pick(["seg","ray","rayR","line","angle"]);
    const words={seg:"segment",ray:"ray",line:"line"};
    let opts, ans;
    if(type==="angle"){
      opts=[["ang1",`∠${a}${b}${c}`,"vertex "+b],["ang2",`∠${b}${a}${c}`,"vertex "+a],["ang3",`∠${a}${c}${b}`,"vertex "+c],["r",ntRay(b,a),"ray "+b+a]]; ans="ang1";
    } else {
      opts=[["seg",ntSeg(a,b),"segment "+a+b],["ray",ntRay(a,b),"ray "+a+b],["rayR",ntRay(b,a),"ray "+b+a],["line",ntLine(a,b),"line "+a+b]]; ans=type;
    }
    opts.sort(()=>Math.random()-.5);
    M1.s.quiz={type,a,b,c,opts,ans,flip:Math.random()<.5}; M1.s.pick=null;
    void words;
  },
  quizSvg(q){
    const W=320,H=130; let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Figure to name" style="display:block;background:linear-gradient(170deg,#fff,#EEF4FF);border-radius:12px">`;
    const ink="#22314F", lab=(p,t,dy)=>`<text x="${p[0]}" y="${p[1]+(dy||-16)}" text-anchor="middle" font-family="Unbounded,sans-serif" font-weight="600" font-size="16" fill="#14213D" stroke="#fff" stroke-width="4" paint-order="stroke">${t}</text>`;
    const dot=p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#14213D" stroke="#fff" stroke-width="2"/>`;
    const arrow=(tip,d)=>{const n=[-d[1],d[0]],b=[tip[0]-d[0]*13,tip[1]-d[1]*13];return `<polygon points="${tip} ${b[0]+n[0]*6},${b[1]+n[1]*6} ${b[0]-n[0]*6},${b[1]-n[1]*6}" fill="${ink}"/>`;};
    const ln=(p,q)=>`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>`;
    if(q.type==="angle"){
      const B=q.flip?[250,100]:[70,100], A=q.flip?[110,30]:[210,30], C=q.flip?[90,108]:[230,108];
      const dA=unit(sub(A,B)), dC=unit(sub(C,B)), eA=add(A,mul(dA,28)), eC=add(C,mul(dC,22));
      s+=ln(B,eA)+arrow(add(eA,mul(dA,6)),dA)+ln(B,eC)+arrow(add(eC,mul(dC,6)),dC)+dot(A)+dot(B)+dot(C)+lab(A,q.a)+lab(B,q.b,22)+lab(C,q.c,22);
    } else {
      let P=[80,92],Q=[230,48]; if(q.flip){P=[240,92];Q=[90,48];}
      // for "rayR" the figure is the ray from the second-named point
      let st=P,en=Q,nmS=q.a,nmE=q.b; if(q.type==="rayR"){st=Q;en=P;}
      const d=unit(sub(en,st));
      if(q.type==="seg")s+=ln(P,Q);
      if(q.type==="ray"||q.type==="rayR"){ const e=add(en,mul(d,50)); s+=ln(st,e)+arrow(add(e,mul(d,6)),d); }
      if(q.type==="line"){ const e1=add(Q,mul(unit(sub(Q,P)),50)), e0=add(P,mul(unit(sub(P,Q)),50)); s+=ln(e0,e1)+arrow(add(e1,mul(unit(sub(Q,P)),6)),unit(sub(Q,P)))+arrow(add(e0,mul(unit(sub(P,Q)),6)),unit(sub(P,Q))); }
      s+=dot(P)+dot(Q)+lab(P,nmS,24)+lab(Q,nmE);
    }
    return s+"</svg>";
  },
  panel(full){
    const t=M1.s.tool, T=TOOLS[t];
    if(!full&&M1.s.built===t){ M1.live(); return; }
    M1.s.built=t; if(!M1.s.quiz)M1.newQuiz();
    const q=M1.s.quiz, sc=M1.s.score;
    let h=`<div class="panel"><h3>Definition · ${T.label}</h3><div class="pad">${T.def}
      <p style="margin-top:12px"><b>Notation:</b> ${T.nota()}</p>
      <p style="margin:12px 0 4px;font-size:13px;color:var(--dim)">Built from these undefined notions:</p>
      <div class="uterms">${UT.map(([k,l])=>`<span class="${T.terms.indexOf(k)>=0?"on":""}">${l}</span>`).join("")}</div></div></div>
      <div class="panel"><h3>On the board</h3><div class="pad" id="t1live"></div></div>
      <div class="panel"><h3>Quick check · name it <span style="float:right;font-family:var(--mono);font-size:12px;color:var(--dim)">${sc.r}/${sc.t}</span></h3>
        <div class="pad" style="padding-bottom:0">${M1.quizSvg(q)}<p style="margin-top:12px">${q.type==="angle"?"Which name is correct for the angle shown?":"Which name describes this figure exactly?"}</p></div>
        <div class="choices" id="qch"></div><div id="qfb"></div>
        <div class="fldwrap" style="padding-bottom:16px"><button class="ghost" id="qnext" type="button" style="width:100%">Next figure</button></div></div>`+
      tryPanel(T.tryit);
    side.innerHTML=h;
    const box=document.getElementById("qch");
    q.opts.forEach(([k,html,sm])=>{ const b=document.createElement("button"); b.type="button"; b.className="choice"; b.innerHTML=html+`<small>${sm}</small>`;
      if(M1.s.pick){ if(k===q.ans)b.classList.add("right"); else if(k===M1.s.pick)b.classList.add("wrong"); }
      b.onclick=()=>{ if(M1.s.pick)return; M1.s.pick=k; sc.t++; if(k===q.ans)sc.r++; M1.panel(true); };
      box.appendChild(b); });
    if(M1.s.pick){
      const ok=M1.s.pick===q.ans, fb=document.getElementById("qfb");
      const why={seg:`It has two endpoints and stops at both, so it is a segment, ${ntSeg(q.a,q.b)}.`,
        ray:`It starts at ${q.a} and goes on forever through ${q.b}. A ray is named endpoint first: ${ntRay(q.a,q.b)}.`,
        rayR:`The endpoint is ${q.b} and it passes through ${q.a}. A ray is named endpoint first: ${ntRay(q.b,q.a)}.`,
        line:`Arrows at both ends: it extends forever both ways, so it is ${ntLine(q.a,q.b)}.`,
        angle:`The vertex is ${q.b}, and the vertex is always the middle letter: ∠${q.a}${q.b}${q.c}.`}[q.type];
      fb.innerHTML=`<div class="verdict ${ok?"good":"bad"}"><b>${ok?"Correct.":"Not quite."}</b> ${why}</div>`;
    }
    document.getElementById("qnext").onclick=()=>{M1.newQuiz(); M1.panel(true);};
    M1.live();
  }
};

    else v=`<div class="verdict bad"><b>Neither.</b> ${s1.vert||s2.vert?"One slope is undefined and the other line is not horizontal.":"The slopes differ, and their product is "+fx(s1.m*s2.m)+", not −1."}</div>`;

slope before  = b/a ${Math.abs(a)>1e-9?"= "+fx(b/a):"(undefined)"}
slope after   = a/(−b) ${Math.abs(b)>1e-9?"= "+fx(a/(-b)):"(undefined)"}${Math.abs(a)>1e-9&&Math.abs(b)>1e-9?"\nproduct       = (b/a)(−a/b) = −1":""}<small>${Math.abs(a)<1e-9||Math.abs(b)<1e-9?"Here one slope is 0 and the other is undefined — a horizontal and a vertical line.":"Turn on “Show 90° rotation” to see triangle and image."}</small></div></div></div>`+

function parseExpr(str){
  const s=String(str).replace(/−/g,"-").replace(/×/g,"*").replace(/÷/g,"/").replace(/\s+/g,"").toLowerCase().replace(/sqrt/g,"√");
  if(!s)return NaN;
  let i=0;
  const peek=()=>s[i];
  function expr(){ let v=term(); while(peek()==="+"||peek()==="-"){ const o=s[i++]; const r=term(); v=o==="+"?v+r:v-r; } return v; }
  function term(){ let v=unary(); for(;;){ const c=peek();
      if(c==="*"||c==="/"){ i++; const r=unary(); v=c==="*"?v*r:v/r; }
      else if(c==="√"||c==="("){ v*=unary(); }
      else break; } return v; }
  function unary(){ if(peek()==="-"){i++;return -unary();} if(peek()==="+"){i++;return unary();} return power(); }
  function power(){ const b=atom(); if(peek()==="^"){i++;return Math.pow(b,unary());} return b; }
  function atom(){ const c=peek();
    if(c==="("){ i++; const v=expr(); if(peek()!==")")throw 0; i++; return v; }
    if(c==="√"){ i++; return Math.sqrt(power()); }
    const m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(i)); if(!m)throw 0; i+=m[0].length; return parseFloat(m[0]); }
  try{ const v=expr(); if(i!==s.length)return NaN; return v; }catch(_){ return NaN; }
}

      const tol=pr.tol||0.051, ok=vals.every((v,i)=>Math.abs(v-pr.ans[i])<=tol);
      if(ok){
        M6.s.state="right"; if(M6.s.tries===0&&!M6.s.reveal){ M6.s.streak++; M6.s.best=Math.max(M6.s.best,M6.s.streak); } M6.s.solved++; M6.upStreak();
        clear(); M6.draw();
        showSol(`<div class="verdict good"><b>Correct!</b> ${M6.s.tries||M6.s.reveal?"Got there — the streak counts first-try answers only.":"Streak "+M6.s.streak+"."} Here is the full work to compare with yours. Press <b>New problem</b> for another.</div>`);
        ins.forEach(x=>x.disabled=true);
      } else {
        M6.s.tries++; M6.s.streak=0; M6.upStreak();
        const which=pr.fields.length>1? pr.fields.filter((_,i)=>Math.abs(vals[i]-pr.ans[i])>tol).join(" and ") : "";
        fb.innerHTML=`<div class="verdict bad"><b>Not quite${which?" — check "+which:""}.</b> ${hintText(pr)}</div>`;
      }
    };
    document.getElementById("chk").onclick=check;
    ins.forEach(x=>x.addEventListener("keydown",e=>{ if(e.key==="Enter")check(); }));
    document.getElementById("sol").onclick=()=>{ M6.s.reveal=true; if(M6.s.state!=="right"){M6.s.streak=0;M6.upStreak();} clear(); M6.draw(); showSol(`<div class="verdict bad" style="background:rgba(255,217,61,.10);border-color:rgba(255,217,61,.35);color:#FBEFC9"><b>Worked solution.</b> Study it, then press <b>New problem</b> and try one on your own.</div>`); };
  }
};

/* ══════════════════════ controller ══════════════════════ */
const MODS=[M1,M2,M3,M4,M5,M6];
function setFS(){ FS=(window.innerWidth<=560)?1.55:1; }
window.addEventListener("resize",()=>{ const o=FS; setFS(); if(o!==FS)update(); });
function update(){ setFS(); const M=MODS[cur]; clear(); M.draw(); M.panel(false); }
function render(){
  setFS(); const M=MODS[cur];
  document.documentElement.style.setProperty("--accent",M.accent||"var(--cyan)");
  bTitle.textContent=M.title(); bLesson.textContent=M.lesson;
  cv.setAttribute("aria-label",M.tab+" — "+M.title());
  if(M===M6&&!M6.s.pr)M6.newProb();
  bar.innerHTML=""; M.bar();
  clear(); M.draw(); M.panel(true);
  [...tabsEl.children].forEach((b,i)=>{ b.setAttribute("aria-selected",String(i===cur)); b.tabIndex=i===cur?0:-1; });
}
function go(i,push){ cur=clamp(i,0,MODS.length-1); if(push){ try{history.replaceState(null,"","#tab-"+(cur+1));}catch(_){location.hash="tab-"+(cur+1);} } render(); }
MODS.forEach((M,i)=>{
  const b=document.createElement("button"); b.type="button"; b.setAttribute("role","tab"); b.id="tabbtn-"+(i+1);
  b.innerHTML='<span class="n">'+String(i+1).padStart(2,"0")+'</span>'+M.tab;
  b.onclick=()=>go(i,true);
  b.onkeydown=e=>{ if(e.key==="ArrowRight"||e.key==="ArrowLeft"){ e.preventDefault(); const j=(cur+(e.key==="ArrowRight"?1:-1)+MODS.length)%MODS.length; go(j,true); tabsEl.children[j].focus(); } };
  tabsEl.appendChild(b);
});
M1.init();
const fromHash=()=>{ const m=/^#tab-(\d+)$/.exec(location.hash); return m? clamp(+m[1]-1,0,MODS.length-1) : 0; };
window.addEventListener("hashchange",()=>{ const i=fromHash(); if(i!==cur)go(i,false); });
go(fromHash(),false);
})();
</script>
