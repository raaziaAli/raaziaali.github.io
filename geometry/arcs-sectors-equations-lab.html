<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcs, Sectors &amp; Circle Equations — Geometry Unit 3</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A0A1F'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%2300E5FF' stroke-width='5'/%3E%3Cpath d='M32 32 L52 32 A20 20 0 0 0 42 14.7 Z' fill='%23FF3D8A'/%3E%3C/svg%3E">

<style>
  :root{
    --bg:#0A0A1F; --bg-lift:#13132B; --card:#1C1C3A; --card-2:#242449;
    --cyan:#00E5FF; --magenta:#FF3D8A; --yellow:#FFD93D; --lavender:#C4B5FD;
    --coral:#FF6B6B; --mint:#5EEAD4;
    --accent:var(--cyan);
    --text:#F8F9FF; --dim:#A5A5C9; --edge:rgba(196,181,253,.20);

    --board:#FFFFFF; --grid:#DCE6F7;
    --ink:#14213D; --graphite:#22314F;
    --vert:#7C3AED; --lin:#EA580C; --corr:#0284C7; --alt:#059669;
    --altx:#DB2777; --same:#DC2626; --samex:#0891B2;
    --unk:#E11D48; --hand:#FF6B35;

    --display:"Unbounded","Trebuchet MS",system-ui,sans-serif;
    --ui:"DM Sans",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);font-family:var(--ui);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;position:relative;min-height:100vh;overflow-x:hidden;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse at 12% 8%,rgba(0,229,255,.13),transparent 55%),
               radial-gradient(ellipse at 88% 22%,rgba(255,61,138,.12),transparent 55%),
               radial-gradient(ellipse at 50% 105%,rgba(196,181,253,.10),transparent 60%);}
  .wrap{max-width:1220px;margin:0 auto;padding:26px 20px 70px;position:relative;z-index:1}

  header.masthead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .mark{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.6vw,38px);margin:0;letter-spacing:-.01em;
    background:linear-gradient(92deg,var(--cyan),var(--lavender) 55%,var(--magenta));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .eyebrow{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .masthead .eyebrow{margin-left:auto;text-align:right;
    border:1px solid var(--edge);border-radius:100px;padding:7px 15px;background:rgba(255,255,255,.03)}

  nav.tabs{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:20px}
  nav.tabs button{
    font-family:var(--ui);font-size:15px;font-weight:500;
    background:var(--card);color:var(--dim);border:1px solid var(--edge);border-radius:100px;
    padding:11px 19px;cursor:pointer;transition:transform .16s,color .16s,box-shadow .16s,background .16s;
  }
  nav.tabs button:hover{color:#fff;transform:translateY(-2px);background:var(--card-2)}
  nav.tabs button[aria-selected="true"]{
    color:#0A0A1F;background:var(--accent);border-color:var(--accent);font-weight:700;
    box-shadow:0 0 26px -4px var(--accent);
  }
  nav.tabs button .n{font-family:var(--mono);font-size:12px;font-weight:700;opacity:.6;margin-right:9px}
  nav.tabs button:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

  .stage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(330px,1fr);gap:22px;align-items:start}
  @media (max-width:960px){.stage{grid-template-columns:minmax(0,1fr)}}

  .board{background:var(--card);border:1px solid var(--edge);border-radius:20px;overflow:hidden;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.8)}
  .board-head{display:flex;align-items:center;gap:12px;padding:16px 20px;flex-wrap:wrap;
    background:linear-gradient(90deg,var(--card-2),var(--card));border-bottom:1px solid var(--edge)}
  .board-head h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0;color:#fff;line-height:1.3}
  .board-head .lsn{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em;
    color:var(--accent);border:1px solid var(--accent);border-radius:100px;padding:5px 13px;white-space:nowrap}
  svg.canvas{display:block;width:100%;height:auto;background:linear-gradient(170deg,#FFFFFF 0%,#EEF4FF 100%);touch-action:none;user-select:none;-webkit-user-select:none}

  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:15px 20px;background:var(--card-2);border-top:1px solid var(--edge)}
  .bar button,.seg button{font-family:var(--ui);font-size:14.5px;font-weight:600;border:1px solid var(--edge);
    background:rgba(255,255,255,.06);color:var(--text);padding:10px 17px;border-radius:100px;cursor:pointer;transition:.16s}
  .bar button:hover,.seg button:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
  .bar button.primary{background:var(--accent);color:#0A0A1F;border-color:var(--accent);box-shadow:0 0 22px -6px var(--accent)}
  .bar button:focus-visible,.seg button:focus-visible,.go:focus-visible,.ghost:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  .seg{display:inline-flex;gap:6px}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#0A0A1F;border-color:var(--accent);font-weight:700}
  .bar label.chk{display:inline-flex;align-items:center;gap:9px;font-size:14.5px;color:var(--text);cursor:pointer;
    background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:100px;padding:9px 16px}
  .bar label.chk:hover{background:rgba(255,255,255,.1)}
  .bar label.chk input{accent-color:var(--accent);width:17px;height:17px}
  .bar select{width:auto;max-width:260px;padding:9px 12px;border-radius:100px}
  .bar .spacer{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--dim)}
  .bar label.rng{display:inline-flex;align-items:center;gap:10px;font-size:14.5px;color:var(--text);
    background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:100px;padding:7px 16px}
  .bar label.rng input{accent-color:var(--accent);width:150px;max-width:38vw}
  .bar label.rng b{font-family:var(--mono);font-size:13.5px;min-width:58px;color:#fff}

  .panel{border:1px solid var(--edge);border-radius:18px;background:var(--card);margin-bottom:16px;overflow:hidden}
  .panel h3{margin:0;padding:15px 20px;font-family:var(--display);font-weight:600;font-size:14px;
    letter-spacing:.01em;color:#fff;background:linear-gradient(90deg,var(--card-2),transparent);
    border-bottom:1px solid var(--edge)}
  .pad{padding:16px 20px;font-size:15px;color:#CFCFEA}
  .pad p{margin:0 0 11px} .pad p:last-child{margin-bottom:0}
  .pad b{color:#fff;font-weight:700}
  .term{font-weight:700;color:var(--accent)}

  .eq{font-family:var(--mono);font-size:14.5px;font-weight:600;color:#fff;background:rgba(0,0,0,.28);
    border:1px solid var(--edge);border-left:4px solid var(--accent);padding:13px 15px;margin:12px 0;
    border-radius:0 12px 12px 0;overflow-x:auto;white-space:pre-wrap;line-height:1.75}
  .eq small{display:block;font-family:var(--ui);font-size:13px;font-weight:400;color:var(--dim);margin-top:7px}

  .rel{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;
    padding:13px 20px;border-bottom:1px solid rgba(196,181,253,.12);font-size:15px}
  .rel:last-child{border-bottom:none}
  .rel .dot{width:13px;height:13px;border-radius:13px}
  .rel .nm{color:#fff;font-weight:500}
  .rel .nm em{font-style:normal;color:var(--dim);font-size:13px;display:block;font-weight:400}
  .rel .val{font-family:var(--mono);font-size:13.5px;font-weight:600;white-space:nowrap}
  .ok{color:var(--mint)} .no{color:var(--coral)}

  select,input[type=number],input[type=text]{
    font-family:var(--ui);font-size:15px;background:#0F0F26;color:#fff;
    border:1px solid var(--edge);border-radius:12px;padding:12px 13px;width:100%;}
  select:focus,input:focus{outline:3px solid var(--accent);outline-offset:1px}
  label.fld{display:block;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.1em;
    text-transform:uppercase;color:var(--accent);margin:16px 20px 7px}
  .fldwrap{padding:0 20px}
  .go{width:100%;font-family:var(--ui);font-size:16px;font-weight:700;background:var(--accent);color:#0A0A1F;
    border:none;padding:14px;border-radius:100px;cursor:pointer;box-shadow:0 0 26px -6px var(--accent);transition:.16s}
  .go:hover{transform:translateY(-2px)}
  .ghost{font-family:var(--ui);font-size:15px;font-weight:600;background:transparent;color:var(--dim);
    border:1px solid var(--edge);padding:14px 18px;border-radius:100px;cursor:pointer}
  .ghost:hover{color:#fff}
  .verdict{margin:16px 20px;padding:14px 16px;border-radius:14px;font-size:15px;line-height:1.6}
  .verdict.good{background:rgba(94,234,212,.13);border:1px solid rgba(94,234,212,.45);color:#D7FBF3}
  .verdict.bad{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.4);color:#FFDCDA}
  .verdict b{color:#fff}
  .verdict .eq{margin:10px 0 2px;font-size:13.5px}

  /* lab-specific */
  .grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:0 20px}
  .grid4 label{display:block;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent);margin-bottom:5px;letter-spacing:.06em}
  .grid4 input{padding:10px 9px}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 20px}
  .grid2 label{display:block;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent);margin-bottom:5px;letter-spacing:.06em}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;padding:14px 20px 18px}
  .btnrow .go{width:auto;flex:1 1 140px;padding:12px}
  .btnrow .ghost{flex:1 1 120px;padding:12px}
  .conv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:0 20px 6px}
  .conv .out{font-family:var(--mono);font-size:14px;font-weight:700;color:#fff;white-space:nowrap}
  .steplist{list-style:none;margin:0;padding:6px 0 8px}
  .steplist li{padding:12px 20px;border-bottom:1px solid rgba(196,181,253,.11)}
  .steplist li:last-child{border-bottom:none}
  .steplist li .h{font-size:13.5px;color:var(--dim);display:block;margin-bottom:4px}
  .steplist li .h b{color:var(--accent);font-family:var(--mono);margin-right:6px}
  .steplist li .m{font-family:var(--mono);font-size:14px;font-weight:600;color:#fff;overflow-x:auto;white-space:pre-wrap}
  .steplist li.hidden{opacity:.35}
  .steplist li.hidden .m{filter:blur(4px)}
  .prompt{font-size:16px;color:#E8E8FA;line-height:1.6}
  .prompt .q{font-family:var(--mono);font-weight:700;color:#fff;font-size:15.5px;display:block;margin-top:8px;overflow-x:auto}
  .hint{font-size:13px;color:var(--dim);padding:6px 20px 0}
  table.kv{width:100%;border-collapse:collapse;font-size:14.5px}
  table.kv td{padding:9px 20px;border-bottom:1px solid rgba(196,181,253,.11)}
  table.kv td:last-child{text-align:right;font-family:var(--mono);font-weight:700;color:#fff;white-space:nowrap}
  table.kv tr:last-child td{border-bottom:none}
  table.kv .sw{display:inline-block;width:11px;height:11px;border-radius:11px;margin-right:9px;vertical-align:-1px}

  /* ── drawing ── */
  .line{stroke:var(--graphite);stroke-width:2.8;fill:none;stroke-linecap:round}
  .thin{stroke:var(--graphite);stroke-width:1.8;fill:none}
  .aux{stroke:var(--corr);stroke-width:2.4;fill:none;stroke-dasharray:9 6}
  .mk{font-family:var(--display);font-weight:600;font-size:20px;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
  .num{font-family:var(--mono);font-weight:700;font-size:16px;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
  .sm{font-family:var(--mono);font-weight:600;font-size:13px;paint-order:stroke;stroke:#fff;stroke-width:4;stroke-linejoin:round}
  .tick{font-family:var(--mono);font-weight:600;font-size:11px;fill:#64748B;paint-order:stroke;stroke:#fff;stroke-width:3}
  .dot{fill:var(--ink);stroke:#fff;stroke-width:2}
  .grab{fill:rgba(255,107,53,.20);stroke:var(--hand);stroke-width:2;stroke-dasharray:4 3;cursor:grab}
  .grab:hover{fill:rgba(255,107,53,.35)}
  .rt{stroke:var(--graphite);stroke-width:1.8;fill:none;opacity:.9}
  .gl{stroke:#DCE6F7;stroke-width:1}
  .ax{stroke:#7C8BA8;stroke-width:1.6}
  footer.foot{margin-top:30px;padding-top:18px;border-top:1px solid var(--edge);font-size:14px;color:var(--dim)}
  footer.foot a{color:var(--cyan);text-decoration:none;font-weight:600}
  footer.foot a:hover{text-decoration:underline}
  footer.foot .links{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}

  body.embed header.masthead, body.embed footer.foot{display:none}
  body.embed .wrap{padding:10px}
  @media (max-width:600px){
    .wrap{padding:18px 12px 50px}
    .masthead .eyebrow{margin-left:0;text-align:left}
    nav.tabs button{padding:9px 14px;font-size:14px}
    .board-head .lsn{margin-left:0}
    .bar{padding:12px 14px}
    .bar .spacer{margin-left:0;width:100%}
    .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
</style>

<div class="wrap">
  <header class="masthead">

<script>
(function(){
"use strict";
/* ══════════════════════ helpers ══════════════════════ */
const NS="http://www.w3.org/2000/svg";
const VW=700, VH=460;
const cv=document.getElementById("cv"), bar=document.getElementById("bar"),
      side=document.getElementById("side"), tabsEl=document.getElementById("tabs"),
      bTitle=document.getElementById("bTitle"), bLesson=document.getElementById("bLesson");
if(new URLSearchParams(location.search).has("embed")) document.body.classList.add("embed");

const PI=Math.PI, TAU=2*Math.PI, D2R=PI/180;
const norm=d=>((d%360)+360)%360;
const PT=(c,r,deg)=>[c[0]+r*Math.cos(deg*D2R), c[1]-r*Math.sin(deg*D2R)];
const angOf=(c,p)=>norm(Math.atan2(-(p[1]-c[1]), p[0]-c[0])/D2R);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t*t*(3-2*t);
const MINUS="−";
// number → display string, up to d decimals, trailing zeros trimmed, typographic minus
function fx(v,d){
  if(d===undefined)d=1;
  const m=Math.pow(10,d); let s=(Math.round(v*m)/m).toFixed(d);
  if(s.indexOf(".")>=0)s=s.replace(/0+$/,"").replace(/\.$/,"");
  if(s==="-0")s="0";
  return s.replace("-",MINUS);
}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a||1;}
function toRat(x,maxDen){
  maxDen=maxDen||2000;
  for(let d=1;d<=maxDen;d++){const n=Math.round(x*d); if(Math.abs(n-x*d)<1e-7*d){const g=gcd(n,d);return [n/g,d/g];}}
  return null;
}
function fracStr(n,d){const g=gcd(n,d);n/=g;d/=g;if(d<0){n=-n;d=-d;}return d===1? fx(n,0) : fx(n,0)+"/"+d;}
// coefficient c → "cπ" written exactly
function piStr(c){
  const r=toRat(c);
  if(!r) return fx(c,3)+"π";
  const n=r[0], d=r[1];
  if(n===0) return "0";
  const an=Math.abs(n);
  return (n<0?MINUS:"")+(an===1?"":an)+"π"+(d>1?"/"+d:"");
}
// exact radical for √v (v ≥ 0)
function rootStr(v){
  if(v<0) return null;
  const n=Math.round(v);
  if(Math.abs(v-n)<1e-9){
    const s=Math.round(Math.sqrt(n)); if(s*s===n) return String(s);
    let out=1, inn=n;
    for(let f=2;f*f<=inn;f++){while(inn%(f*f)===0){inn/=f*f;out*=f;}}
    return (out>1?out:"")+"√"+inn;
  }
  const r=toRat(v,100);
  if(r){ const sq=Math.round(Math.sqrt(r[1])); if(sq*sq===r[1]){ const a=rootStr(r[0]); if(a) return (a.indexOf("√")<0? fracStr(+a,sq) : "("+a+")/"+sq); } }
  return fx(Math.sqrt(v),3);
}
const isSq=v=>{const s=Math.round(Math.sqrt(Math.max(0,v)));return Math.abs(s*s-v)<1e-9;};
// (x − c)²
function sqTerm(v,c){
  if(Math.abs(c)<1e-9) return v+"²";
  return "("+v+(c>0?" "+MINUS+" ":" + ")+fx(Math.abs(c),3)+")²";
}
// polynomial from [coef, var] pairs
function poly(terms){
  let s="";
  terms.forEach(([c,v])=>{
    if(Math.abs(c)<1e-9) return;
    const a=Math.abs(c), body=(v && Math.abs(a-1)<1e-9)? v : fx(a,3)+v;
    if(!s) s=(c<0?MINUS:"")+body;
    else s+=(c<0?" "+MINUS+" ":" + ")+body;
  });
  return s||"0";
}
const pt2=(x,y)=>"("+fx(x,2)+", "+fx(y,2)+")";

function E(tag,attrs){const n=document.createElementNS(NS,tag);for(const k in attrs)n.setAttribute(k,attrs[k]);return n;}
function clear(){while(cv.firstChild)cv.removeChild(cv.firstChild);}
function bg(noGrid){
  const d=E("defs");
  d.innerHTML='<pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">'+
    '<path d="M32 0H0V32" fill="none" stroke="var(--grid)" stroke-width="1" opacity="0.75"/></pattern>'+
    '<clipPath id="fr"><rect width="'+VW+'" height="'+VH+'"/></clipPath>';
  cv.appendChild(d);
  if(!noGrid) cv.appendChild(E("rect",{width:VW,height:VH,fill:"url(#g)"}));
  const g=E("g",{"clip-path":"url(#fr)"}); cv.appendChild(g); return g;
}
function seg(g,p,q,cls,extra){ const l=E("line",{x1:p[0],y1:p[1],x2:q[0],y2:q[1],class:cls||"line"}); if(extra)for(const k in extra)l.setAttribute(k,extra[k]); g.appendChild(l); return l;}
function dot(g,p,r,fill){ const c=E("circle",{cx:p[0],cy:p[1],r:r||5,class:"dot"}); if(fill)c.setAttribute("fill",fill); g.appendChild(c); return c;}
function txt(g,p,s,cls,color,anchor){
  const t=E("text",{x:p[0],y:p[1],class:cls||"mk","text-anchor":anchor||"middle","dominant-baseline":"middle"});
  if(color)t.setAttribute("fill",color);
  t.textContent=s; g.appendChild(t); return t;
}
function grab(g,p,id,fill){ g.appendChild(E("circle",{cx:p[0],cy:p[1],r:17,class:"grab","data-drag":id})); const d=dot(g,p,5.5,fill); d.setAttribute("data-drag",id); d.style.cursor="grab"; }
// arc path (ccw in math sense) from a1 to a2 degrees
function arcD(c,r,a1,a2,move){
  let sw=a2-a1;
  if(sw>=359.999){
    const m=PT(c,r,a1+180), s=PT(c,r,a1);
    return (move===false?"L ":"M ")+s[0]+" "+s[1]+" A "+r+" "+r+" 0 0 0 "+m[0]+" "+m[1]+" A "+r+" "+r+" 0 0 0 "+s[0]+" "+s[1];
  }
  const s=PT(c,r,a1), e=PT(c,r,a2);

/* ── expression parser: numbers, π/pi, sqrt/√, x, y, + − × ÷ ^ ( ) and implicit multiplication ── */
function tokenize(src){
  let s=String(src).toLowerCase()
    .replace(/[−–—]/g,"-").replace(/[×·⋅]/g,"*").replace(/÷/g,"/")
    .replace(/°/g," ")
    .replace(/\b(cm|in|ft|m|units?)(\^2|²)?(?![a-z])/g," ")
    .replace(/\b(degrees?|deg|radians?|rads?|sq)\b/g," ")
    .replace(/π/g," pi ").replace(/√/g," sqrt ").replace(/²/g,"^2").replace(/³/g,"^3");
  const toks=[], re=/\s*(\d+\.?\d*|\.\d+|pi|sqrt|x|y|[-+*/^()=])/y;
  re.lastIndex=0;
  while(re.lastIndex<s.length){
    if(/^\s*$/.test(s.slice(re.lastIndex)))break;
    const m=re.exec(s); if(!m) throw new Error("bad");
    toks.push(m[1]);
  }
  // implicit multiplication
  const out=[]; const val=t=>/^[\d.]/.test(t)||t==="pi"||t==="x"||t==="y"||t===")";
  const start=t=>/^[\d.]/.test(t)||t==="pi"||t==="x"||t==="y"||t==="("||t==="sqrt";
  toks.forEach((t,i)=>{ if(i>0&&val(toks[i-1])&&start(t)) out.push("*"); out.push(t); });
  return out;
}
function parseTokens(t){
  let i=0;
  const peek=()=>t[i], next=()=>t[i++];
  function expr(){ let a=term(); while(peek()==="+"||peek()==="-"){const op=next(), b=term(), A=a; a= op==="+"? (e=>A(e)+b(e)) : (e=>A(e)-b(e));} return a; }
  function term(){ let a=unary(); while(peek()==="*"||peek()==="/"){const op=next(), b=unary(), A=a; a= op==="*"? (e=>A(e)*b(e)) : (e=>A(e)/b(e));} return a; }
  function unary(){ if(peek()==="-"){next();const a=unary();return e=>-a(e);} if(peek()==="+"){next();return unary();} return power(); }
  function power(){ const a=primary(); if(peek()==="^"){next();const b=unary();return e=>Math.pow(a(e),b(e));} return a; }
  function primary(){
    const k=next();
    if(k===undefined) throw new Error("end");
    if(/^[\d.]/.test(k)){const v=parseFloat(k); if(isNaN(v))throw new Error("num"); return ()=>v;}
    if(k==="pi") return ()=>PI;
    if(k==="x") return e=>e.x;
    if(k==="y") return e=>e.y;
    if(k==="sqrt"){ const a=power(); return e=>Math.sqrt(a(e)); }
    if(k==="("){ const a=expr(); if(next()!==")") throw new Error("paren"); return a; }
    throw new Error("tok");
  }
  const f=expr();
  if(i!==t.length) throw new Error("trail");
  return f;
}
function evalNum(src){
  try{ const t=tokenize(src); if(!t.length||t.indexOf("=")>=0||t.indexOf("x")>=0||t.indexOf("y")>=0) return NaN;
    const v=parseTokens(t)({}); return isFinite(v)? v : NaN; }catch(e){ return NaN; }
}
function parseEquation(src){
  try{
    const t=tokenize(src); const k=t.indexOf("=");
    if(k<0||t.indexOf("=",k+1)>=0) return null;
    const L=parseTokens(t.slice(0,k)), R=parseTokens(t.slice(k+1));
    return e=>L(e)-R(e);
  }catch(e){ return null; }
}

/* ══════════════════════ drag plumbing ══════════════════════ */
let dragId=null;
function svgPt(e){
  const m=cv.getScreenCTM(); if(!m) return [0,0];
  const p=cv.createSVGPoint(); p.x=e.clientX; p.y=e.clientY;
  const q=p.matrixTransform(m.inverse()); return [q.x,q.y];
}
cv.addEventListener("pointerdown",e=>{
  const id=e.target.getAttribute&&e.target.getAttribute("data-drag"); if(!id)return;
  dragId=id; try{cv.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault();
  if(M().dragStart) M().dragStart(id);
});

});
["pointerup","pointercancel"].forEach(ev=>cv.addEventListener(ev,()=>{dragId=null;}));

/* ══════════════════════ animation ══════════════════════ */
let animTok=0;
function stopAnim(){animTok++;}
function tween(dur,step,done){
  const tok=++animTok, t0=performance.now();
  function f(now){ if(tok!==animTok)return; const t=Math.min(1,(now-t0)/dur); step(t); if(t<1)requestAnimationFrame(f); else if(done)done(); }
  requestAnimationFrame(f);
}
function loop(step){
  const tok=++animTok; let last=performance.now();
  function f(now){ if(tok!==animTok)return; step(Math.min(.05,(now-last)/1000)); last=now; requestAnimationFrame(f); }
  requestAnimationFrame(f);
}

      work:`s = (θ/360)·2πr = (${th}/360)·2π(${r}) = ${f}·${piStr(2*r)} = ${piStr(th*r/180)} ≈ ${fx(ans,2)} cm`};
  }

    prompt:`In a circle of radius <b>${r} cm</b>, a central angle measures <b>${radStr(q)} radians</b>. How long is the intercepted arc?`,
    inputs:[{label:"arc length (cm)",ph:"e.g. 4π or 12.57"}], check:numCheck(ans),
    answer:`${piStr(r*q[0]/q[1])} ≈ ${fx(ans,2)} cm`,

function genSector(){

function genConvert(){

function genEquation(){

  let r2, given, fig;
  const mode=pick(["r","r","root","pt"]);
  if(mode==="r"){ const r=rnd(1,5); r2=r*r; given=`center <b>(${fx(h,0)}, ${fx(k,0)})</b> and radius <b>${r}</b>`; fig={type:"grid",h:h,k:k,r:r}; }

  else { const v=pick([[3,4],[4,3],[-3,4],[4,-3],[0,5],[-4,-3],[2,1],[1,-2],[-2,3],[3,0],[2,2],[-1,3]]); const P=[h+v[0],k+v[1]]; r2=v[0]*v[0]+v[1]*v[1];
    given=`center <b>(${fx(h,0)}, ${fx(k,0)})</b> that passes through the point <b>(${fx(P[0],0)}, ${fx(P[1],0)})</b>`; fig={type:"grid",h:h,k:k,P:P}; }
  const std=sqTerm("x",h)+" + "+sqTerm("y",k)+" = "+r2;

      const P=[[0.37,1.91],[-2.3,0.7],[4.1,-3.3],[1.7,5.2],[-6.1,-2.9],[9.3,4.4]];

      P.forEach(([x,y])=>{ const gv=g(x,y); if(Math.abs(gv)<1e-3) return; const fv=f({x:x,y:y}); if(!isFinite(fv)){ok=false;return;} const qq=fv/gv; if(q===null)q=qq; else if(Math.abs(qq-q)>1e-6*Math.max(1,Math.abs(q))) ok=false; });

      : `Substitute h = ${fx(h,0)}, k = ${fx(k,0)}, r² = ${r2} into (x − h)² + (y − k)² = r². Careful with signs: x − (${fx(h,0)}) ${h<0?"becomes x + "+(-h):""}. So ${std}.`};
}
function genGeneral(){

      txt(g,[C[0]+R/2,C[1]+16],"r = "+f.r,"num","var(--graphite)");
      const mid=th/2;
      txt(g,PT(C,f.show==="sec"?R*0.66:R+26,f.show==="sec"&&th<50?mid:mid),f.show==="sec"?"A = ?":"s = ?","num",f.show==="sec"?"var(--alt)":"var(--lin)",f.show==="sec"?"middle":(mid>100&&mid<260)?"end":(mid<80||mid>280)?"start":"middle");
      dot(g,C,4.5);
    } else {
      const R=150, th=f.th, turns=Math.floor((th-0.001)/360);
      g.appendChild(E("circle",{cx:C[0],cy:C[1],r:R,class:"thin",opacity:.4}));
      seg(g,C,PT(C,R+20,0),"line"); seg(g,C,PT(C,R+20,th),"line");
      const t=th-turns*360;
      path(g,arcD(C,48,0,t),{fill:"none",stroke:"var(--vert)","stroke-width":3});
      if(turns>0) path(g,arcD(C,62,0,359.99),{fill:"none",stroke:"var(--vert)","stroke-width":2,"stroke-dasharray":"4 4"});
      txt(g,PT(C,92,Math.max(t,20)/2),f.lab+" = ?","num","var(--vert)");
      dot(g,C,4.5);
    }
  },
  panel(){
    const p=this.s.p;
    side.innerHTML=`<div class="panel"><h3>${p.kind}</h3>
      <div class="pad"><div class="prompt">${p.prompt}</div></div>
      ${p.inputs.map((inp,i)=>`<label class="fld" for="ans${i}">${inp.label}</label><div class="fldwrap"><input type="text" id="ans${i}" placeholder="${inp.ph}" autocomplete="off" spellcheck="false"></div>`).join("")}
      <div class="btnrow"><button type="button" class="go" id="chk">Check my answer</button><button type="button" class="ghost" id="reveal">Show solution</button></div>
      <div id="fb"></div></div>
      <div class="panel"><h3>Typing answers</h3><div class="pad">
        <p>Exact or decimal both work. For π type <b>π</b> or <b>pi</b>: <b>6pi</b>, <b>6π</b>, <b>3π/2</b>, <b>(5/4)pi</b>. Decimals within about half a percent are accepted, so round to the hundredth.</p>
        <p>Square roots: <b>sqrt(13)</b> or <b>√13</b>. Equations: <b>(x-3)^2 + (y+2)^2 = 25</b> — any equivalent form counts, even general form.</p>
      </div></div>
      <div class="panel"><h3>Formula card</h3><div class="pad"><div class="eq" style="margin:0">s = (θ/360)·2πr = rθ
A = (θ/360)·πr² = ½r²θ
π rad = 180°
(x − h)² + (y − k)² = r²<small>θ written with "rad" means radians.</small></div></div></div>`;
    const go=()=>this.check();
    $("chk").onclick=go;
    $("reveal").onclick=()=>{
      if(!this.s.checked){ this.s.checked=true; this.s.tries++; this.s.streak=0; this.updScore(); }
      $("fb").innerHTML=`<div class="verdict bad"><b>Solution:</b> ${p.answer}<div class="eq">${p.work}</div>Press <b>New problem</b> for another.</div>`;
      redraw();
    };
    p.inputs.forEach((_,i)=>$("ans"+i).addEventListener("keydown",e=>{if(e.key==="Enter")go();}));
  },
  updScore(){ const sp=bar.querySelector(".spacer"); if(sp) sp.textContent=this.score(); },
  check(){
    const s=this.s, p=s.p, vals=p.inputs.map((_,i)=>$("ans"+i).value.trim());
    if(vals.some(v=>!v)){ $("fb").innerHTML='<div class="verdict bad">Type an answer in every box first.</div>'; return; }
    const r=p.check(vals);
    if(r.err){ $("fb").innerHTML=`<div class="verdict bad">${r.err}</div>`; return; }
    if(!s.checked){ s.checked=true; s.tries++; if(r.ok){s.right++;s.streak++;s.best=Math.max(s.best,s.streak);} else s.streak=0; this.updScore(); }
    if(r.ok) s.solved=true;
    let extra="";
    if(!r.ok&&r.part){ const nm=["h","k","r"]; extra=" Correct so far: "+nm.filter((_,i)=>r.part[i]).join(", ")+(r.part.some(x=>x)?"":"none")+"."; }
    $("fb").innerHTML= r.ok
      ? `<div class="verdict good"><b>Correct!</b> ${p.answer}.<div class="eq">${p.work}</div></div>`
      : `<div class="verdict bad"><b>Not yet.</b>${extra} Here is the method:<div class="eq">${p.work}</div>The answer is <b>${p.answer}</b>. Try the next one!</div>`;
    redraw();
  }
};

/* ══════════════════════ controller ══════════════════════ */
const MODS=[T1,T2,T3,T4,T5,T6];
let cur=0;
const M=()=>MODS[cur];
function redraw(){ clear(); M().draw(); if(M().live) M().live(); }
function render(){
  stopAnim(); dragId=null;
  const m=M();
  if(m===T1){ T1.s.u=T1.s.target; }
  if(m===T2&&T2.s.wrap&&T2.s.w<7){ T2.s.w=7; }
  if(m===T4) T4.s.play=false;
  if(m===T6&&!T6.s.p) T6.newP();
  document.documentElement.style.setProperty("--accent",m.accent||"var(--cyan)");
  bTitle.textContent=m.title(); bLesson.textContent=m.lsn;
  cv.setAttribute("aria-label",m.aria);
  bar.innerHTML=""; m.bar();
  side.innerHTML=""; m.panel();
  redraw();
  [...tabsEl.children].forEach((b,i)=>{b.setAttribute("aria-selected",i===cur);b.tabIndex=i===cur?0:-1;});
}
MODS.forEach((m,i)=>{
  const b=document.createElement("button"); b.type="button"; b.setAttribute("role","tab");
  b.innerHTML='<span class="n">'+String(i+1).padStart(2,"0")+'</span>'+m.tab;
  b.onclick=()=>{ cur=i; try{history.replaceState(null,"","#tab-"+(i+1));}catch(e){location.hash="tab-"+(i+1);} render(); };
  b.addEventListener("keydown",e=>{
    if(e.key==="ArrowRight"||e.key==="ArrowLeft"){ const n=(i+(e.key==="ArrowRight"?1:MODS.length-1))%MODS.length; tabsEl.children[n].click(); tabsEl.children[n].focus(); }
  });
  tabsEl.appendChild(b);
});
function fromHash(){ const m=/tab-(\d+)/.exec(location.hash); if(m){ const n=clamp(parseInt(m[1],10)-1,0,MODS.length-1); if(n!==cur||!bar.firstChild){cur=n;render();return true;} } return false; }
window.addEventListener("hashchange",fromHash);
if(!fromHash()) render();
})();
</script>
