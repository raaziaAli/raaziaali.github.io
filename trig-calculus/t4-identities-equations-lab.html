<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Identities &amp; Equations Lab — Trigonometry Unit 4</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A0A1F'/%3E%3Cpath d='M10 50L54 14' stroke='%2300E5FF' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='10' cy='50' r='6' fill='%23FF3D8A'/%3E%3Ccircle cx='54' cy='14' r='6' fill='%23FFD93D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A1F; --bg-lift:#13132B; --card:#1C1C3A; --card-2:#242449;
    --cyan:#00E5FF; --magenta:#FF3D8A; --yellow:#FFD93D; --lavender:#C4B5FD;
    --coral:#FF6B6B; --mint:#5EEAD4;
    --accent:var(--cyan);
    --text:#F8F9FF; --dim:#A5A5C9; --edge:rgba(196,181,253,.20);

    --board:#FFFFFF; --grid:#DCE6F7;
    --ink:#14213D; --graphite:#22314F;
    --vert:#7C3AED; --lin:#EA580C; --corr:#0284C7; --alt:#059669;
    --altx:#DB2777; --same:#DC2626; --samex:#0891B2;
    --unk:#E11D48; --hand:#FF6B35;

    --display:"Unbounded","Trebuchet MS",system-ui,sans-serif;
    --ui:"DM Sans",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);font-family:var(--ui);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;position:relative;min-height:100vh;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse at 12% 8%,rgba(0,229,255,.13),transparent 55%),
               radial-gradient(ellipse at 88% 22%,rgba(255,61,138,.12),transparent 55%),
               radial-gradient(ellipse at 50% 105%,rgba(196,181,253,.10),transparent 60%);}
  .wrap{max-width:1220px;margin:0 auto;padding:26px 20px 70px;position:relative;z-index:1}

  header.masthead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .mark{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.6vw,38px);margin:0;letter-spacing:-.01em;
    background:linear-gradient(92deg,var(--cyan),var(--lavender) 55%,var(--magenta));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .eyebrow{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .masthead .eyebrow{margin-left:auto;text-align:right;
    border:1px solid var(--edge);border-radius:100px;padding:7px 15px;background:rgba(255,255,255,.03)}

  nav.tabs{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:20px}
  nav.tabs button{
    font-family:var(--ui);font-size:15px;font-weight:500;
    background:var(--card);color:var(--dim);border:1px solid var(--edge);border-radius:100px;
    padding:11px 19px;cursor:pointer;transition:transform .16s,color .16s,box-shadow .16s,background .16s;
  }
  nav.tabs button:hover{color:#fff;transform:translateY(-2px);background:var(--card-2)}
  nav.tabs button[aria-selected="true"]{
    color:#0A0A1F;background:var(--accent);border-color:var(--accent);font-weight:700;
    box-shadow:0 0 26px -4px var(--accent);
  }
  nav.tabs button .n{font-family:var(--mono);font-size:12px;font-weight:700;opacity:.6;margin-right:9px}
  nav.tabs button:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

  .stage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(330px,1fr);gap:22px;align-items:start}
  @media (max-width:960px){.stage{grid-template-columns:1fr}}

  .board{background:var(--card);border:1px solid var(--edge);border-radius:20px;overflow:hidden;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.8)}
  .board-head{display:flex;align-items:center;gap:12px;padding:16px 20px;flex-wrap:wrap;
    background:linear-gradient(90deg,var(--card-2),var(--card));border-bottom:1px solid var(--edge)}
  .board-head h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0;color:#fff;line-height:1.3}
  .board-head .lsn{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em;
    color:var(--accent);border:1px solid var(--accent);border-radius:100px;padding:5px 13px;white-space:nowrap}
  svg.canvas{display:block;width:100%;height:auto;background:linear-gradient(170deg,#FFFFFF 0%,#EEF4FF 100%);touch-action:none}

  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:15px 20px;background:var(--card-2);border-top:1px solid var(--edge)}
  .bar button,.seg button{font-family:var(--ui);font-size:14.5px;font-weight:600;border:1px solid var(--edge);
    background:rgba(255,255,255,.06);color:var(--text);padding:10px 17px;border-radius:100px;cursor:pointer;transition:.16s}
  .bar button:hover,.seg button:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
  .bar button.primary{background:var(--accent);color:#0A0A1F;border-color:var(--accent);box-shadow:0 0 22px -6px var(--accent)}
  .seg{display:inline-flex;gap:6px}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#0A0A1F;border-color:var(--accent);font-weight:700}
  .bar label.chk{display:inline-flex;align-items:center;gap:9px;font-size:14.5px;color:var(--text);cursor:pointer;
    background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:100px;padding:9px 16px}
  .bar label.chk:hover{background:rgba(255,255,255,.1)}
  .bar label.chk input{accent-color:var(--accent);width:17px;height:17px}
  .bar .spacer{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--dim)}
  .bar select{width:auto;max-width:340px}
  .chiprow{display:flex;flex-wrap:wrap;gap:7px;width:100%;margin-bottom:2px}
  .chiprow button{font-family:var(--ui);font-size:13.5px;font-weight:600;cursor:pointer;
    padding:8px 14px;border-radius:100px;background:rgba(255,255,255,.05);
    border:1.5px solid var(--c);color:#E7E9FA;transition:.15s;display:flex;align-items:center;gap:8px}
  .chiprow button::before{content:"";width:10px;height:10px;border-radius:10px;background:var(--c)}
  .chiprow button:hover{background:rgba(255,255,255,.12)}
  .chiprow button[aria-pressed="true"]{background:var(--c);color:#0A0A1F;font-weight:700}
  .chiprow button[aria-pressed="true"]::before{background:rgba(10,10,31,.55)}
  .rel[data-pair]{cursor:pointer}
  .rel[data-pair]:hover{background:rgba(255,255,255,.05)}
  .rel.active{background:rgba(255,255,255,.09);box-shadow:inset 3px 0 0 var(--accent)}
  .note{margin:0 20px 16px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.55;
    background:rgba(255,217,61,.10);border:1px solid rgba(255,217,61,.35);color:#FBEFC9}
  .note b{color:#fff}

  .panel{border:1px solid var(--edge);border-radius:18px;background:var(--card);margin-bottom:16px;overflow:hidden}
  .panel h3{margin:0;padding:15px 20px;font-family:var(--display);font-weight:600;font-size:14px;
    letter-spacing:.01em;color:#fff;background:linear-gradient(90deg,var(--card-2),transparent);
    border-bottom:1px solid var(--edge)}
  .pad{padding:16px 20px;font-size:15px;color:#CFCFEA}
  .pad p{margin:0 0 11px} .pad p:last-child{margin-bottom:0}
  .pad b{color:#fff;font-weight:700}
  .term{font-weight:700;color:var(--accent)}

  .eq{font-family:var(--mono);font-size:14.5px;font-weight:600;color:#fff;background:rgba(0,0,0,.28);
    border:1px solid var(--edge);border-left:4px solid var(--accent);padding:13px 15px;margin:12px 0;
    border-radius:0 12px 12px 0;overflow-x:auto;white-space:pre-wrap;line-height:1.75}
  .eq small{display:block;font-family:var(--ui);font-size:13px;font-weight:400;color:var(--dim);margin-top:7px}

  .rel{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;
    padding:13px 20px;border-bottom:1px solid rgba(196,181,253,.12);font-size:15px}
  .rel:last-child{border-bottom:none}
  .rel .dot{width:13px;height:13px;border-radius:13px}
  .rel .nm{color:#fff;font-weight:500}
  .rel .nm em{font-style:normal;color:var(--dim);font-size:13px;display:block;font-weight:400}
  .rel .val{font-family:var(--mono);font-size:13.5px;font-weight:600;white-space:nowrap}
  .ok{color:var(--mint)} .no{color:var(--coral)}

  select,input[type=number],input[type=text]{
    font-family:var(--ui);font-size:15px;background:#0F0F26;color:#fff;
    border:1px solid var(--edge);border-radius:12px;padding:12px 13px;width:100%;}
  select:focus,input:focus{outline:3px solid var(--accent);outline-offset:1px}
  label.fld{display:block;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.1em;
    text-transform:uppercase;color:var(--accent);margin:16px 20px 7px}
  .fldwrap{padding:0 20px}
  .go{width:100%;font-family:var(--ui);font-size:16px;font-weight:700;background:var(--accent);color:#0A0A1F;
    border:none;padding:14px;border-radius:100px;cursor:pointer;box-shadow:0 0 26px -6px var(--accent);transition:.16s}
  .go:hover{transform:translateY(-2px)}
  .ghost{font-family:var(--ui);font-size:15px;font-weight:600;background:transparent;color:var(--dim);
    border:1px solid var(--edge);padding:14px 18px;border-radius:100px;cursor:pointer}
  .ghost:hover{color:#fff}
  .verdict{margin:16px 20px;padding:14px 16px;border-radius:14px;font-size:15px;line-height:1.6}
  .verdict.good{background:rgba(94,234,212,.13);border:1px solid rgba(94,234,212,.45);color:#D7FBF3}
  .verdict.bad{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.4);color:#FFDCDA}
  .verdict b{color:#fff}

  table.facts{width:100%;border-collapse:collapse;font-size:14.5px}
  table.facts td{padding:12px 20px;border-bottom:1px solid rgba(196,181,253,.11);vertical-align:top}
  table.facts .ab{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--accent);white-space:nowrap}
  table.facts .st{color:#DDDDF2}
  table.facts .st i{display:block;color:var(--dim);font-style:normal;font-size:13px;margin-top:4px}
  .cathead{padding-top:18px!important;padding-bottom:6px!important;font-family:var(--display);font-weight:600;
    font-size:13px;letter-spacing:.02em;color:var(--yellow);border-bottom:none!important}
  .chip{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.09em;
    text-transform:uppercase;padding:4px 10px;border-radius:100px;margin-right:9px}
  .chip.assume{background:rgba(255,217,61,.18);color:var(--yellow)}
  .chip.proved{background:rgba(94,234,212,.16);color:var(--mint)}
  ol.chain{margin:0;padding:6px 20px 18px 38px;font-size:15px;color:#CFCFEA}
  ol.chain li{padding:8px 0} ol.chain li::marker{color:var(--accent);font-weight:700}
  ol.chain li b{color:#fff}

  .steps{width:100%;border-collapse:collapse;font-size:15px}
  .steps td{padding:12px 20px;border-bottom:1px solid rgba(196,181,253,.11);vertical-align:middle}
  .steps .stmt{font-family:var(--mono);font-size:14px;font-weight:600;color:#fff;white-space:nowrap}
  .steps .why{width:56%}
  .steps tr.right .stmt{color:var(--mint)}
  .steps tr.right select{border-color:rgba(94,234,212,.6)}
  .steps tr.wrong select{border-color:var(--coral)}

  /* ── drawing ── */
  .line{stroke:var(--graphite);stroke-width:2.8;fill:none;stroke-linecap:round}
  .thin{stroke:var(--graphite);stroke-width:1.8;fill:none}
  .aux{stroke:var(--corr);stroke-width:2.4;fill:none;stroke-dasharray:9 6}
  .wedge{stroke-width:2.4;fill-opacity:.17;cursor:pointer}
  .wedge.flat{cursor:default}
  .mk{font-family:var(--display);font-weight:600;font-size:20px;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
  .num{font-family:var(--mono);font-weight:700;font-size:16px;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
  .dot{fill:var(--ink);stroke:#fff;stroke-width:2}
  .grab{fill:rgba(255,107,53,.20);stroke:var(--hand);stroke-width:2;stroke-dasharray:4 3;cursor:grab}
  .grab:hover{fill:rgba(255,107,53,.35)}
  .rt{stroke:var(--graphite);stroke-width:1.8;fill:none;opacity:.9}
  footer.foot{margin-top:30px;padding-top:18px;border-top:1px solid var(--edge);font-size:14px;color:var(--dim)}

  /* ── Coordinate Line Lab additions ── */
  body.embed header.masthead, body.embed footer.foot{display:none}
  body.embed .wrap{padding:10px}
  footer.foot a{color:var(--cyan);text-decoration:none;font-weight:600}
  footer.foot a:hover{text-decoration:underline}
  footer.foot .links{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}
  .bar button:focus-visible,.seg button:focus-visible,.chiprow button:focus-visible,.go:focus-visible,.ghost:focus-visible,.choice:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  .rng{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:14px;font-weight:600;color:var(--text);
    background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:100px;padding:7px 15px}
  .rng input{accent-color:var(--accent);width:110px}
  .rng output{min-width:16px;text-align:right;color:var(--accent)}
  svg.canvas{-webkit-user-select:none;user-select:none}
  svg.canvas text{pointer-events:none}
  @media (max-width:560px){ svg.canvas .sm{font-size:21px;stroke-width:5} svg.canvas .mk{font-size:27px} svg.canvas .num{font-size:22px} svg.canvas .ax{font-size:16px} }
  .sm{font-family:var(--mono);font-weight:600;font-size:13.5px;paint-order:stroke;stroke:#fff;stroke-width:4;stroke-linejoin:round}
  .ax{font-family:var(--mono);font-size:11px;fill:#7C8AAB}
  .leg{stroke-width:3;fill:none;stroke-dasharray:8 5;stroke-linecap:round}
  .tick{stroke:var(--graphite);stroke-width:2.2}
  .ghostdot{fill:#9AA8C7;stroke:#fff;stroke-width:2}
  .nt{position:relative;display:inline-block;padding-top:.42em;line-height:1.05;font-family:var(--mono);font-weight:700;color:#fff;white-space:nowrap}
  .nt::before{content:"";position:absolute;left:.06em;right:.06em;top:.2em;border-top:2px solid currentColor}
  .nt.ray::after,.nt.line::after{content:"";position:absolute;right:-.12em;top:calc(.2em - 3.5px);border-left:7px solid currentColor;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
  .nt.line .la{position:absolute;left:-.12em;top:calc(.2em - 3.5px);border-right:7px solid currentColor;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
  .uterms{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
  .uterms span{font-family:var(--mono);font-size:12px;font-weight:600;padding:5px 11px;border-radius:100px;
    border:1px solid var(--edge);color:var(--dim);opacity:.55}
  .uterms span.on{opacity:1;color:#0A0A1F;background:var(--accent);border-color:var(--accent)}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 20px}
  .choice{font-family:var(--ui);font-size:15px;font-weight:600;background:rgba(255,255,255,.06);color:var(--text);
    border:1px solid var(--edge);border-radius:14px;padding:13px 12px;cursor:pointer;text-align:left;line-height:1.5;transition:.15s}
  .choice:hover{background:rgba(255,255,255,.12)}
  .choice.right{border-color:var(--mint);background:rgba(94,234,212,.16)}
  .choice.wrong{border-color:var(--coral);background:rgba(255,107,107,.14)}
  .choice small{display:block;font-weight:400;color:var(--dim);font-size:12.5px}
  .stepl{list-style:none;margin:0;padding:6px 0}
  .stepl li{padding:10px 20px;border-left:3px solid transparent;color:var(--dim);font-size:14.5px}
  .stepl li.on{border-left-color:var(--accent);background:rgba(255,255,255,.05);color:#fff}
  .stepl li.done{color:#CFCFEA}
  .stepl li .sn{color:var(--accent);font-family:var(--mono);font-weight:700;margin-right:8px}
  .stepl li b{color:#fff}
  .ansrow{display:flex;gap:12px;padding:0 20px;flex-wrap:wrap}
  .ansrow > div{flex:1 1 120px}
  .ansrow label.fld{margin:14px 0 7px}
  .prob{font-size:15.5px;color:#E7E9FA}
  .prob b{color:#fff}
  @media (max-width:560px){
    .choices{grid-template-columns:1fr}
    .masthead .eyebrow{margin-left:0;text-align:left}
    .rng input{width:84px}
    .bar{padding:13px 14px}
    .pad{padding:14px 16px}
  }

  /* ── Identities & Equations Lab additions ── */
  .wk{list-style:none;margin:0;padding:4px 0 8px}
  .wk li{padding:10px 20px;border-bottom:1px solid rgba(196,181,253,.11);font-size:14.5px;color:#CFCFEA}
  .wk li:last-child{border-bottom:none}
  .wk li .ex{display:block;font-family:var(--mono);font-size:14.5px;font-weight:600;color:#fff;word-break:break-word}
  .wk li .rs{display:block;font-size:13px;color:var(--dim);margin-top:3px}
  .wk li .rs b{color:var(--accent)}
  .wk li.fin .ex{color:var(--mint)}
  .moves{display:flex;flex-wrap:wrap;gap:8px;padding:14px 20px}
  .moves button{font-family:var(--ui);font-size:13.5px;font-weight:600;background:rgba(255,255,255,.06);color:var(--text);
    border:1px solid var(--edge);border-radius:100px;padding:9px 14px;cursor:pointer;transition:.15s}
  .moves button:hover{background:rgba(255,255,255,.13)}
  .moves button:disabled{opacity:.4;cursor:default}
  .moves button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  .six{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 20px}
  .six div{background:rgba(0,0,0,.25);border:1px solid var(--edge);border-radius:12px;padding:8px 10px;text-align:center}
  .six div span{display:block;font-family:var(--mono);font-size:11.5px;color:var(--dim);letter-spacing:.06em}
  .six div b{font-family:var(--mono);font-size:14px;color:#fff;word-break:break-word}
  .gtitle{font-family:var(--display);font-weight:600;font-size:14px;fill:var(--ink)}
  .fn{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px}
  .two label.fld{margin:14px 0 7px}
  .cmp{width:100%;border-collapse:collapse;font-size:14px}
  .cmp td{padding:9px 20px;border-bottom:1px solid rgba(196,181,253,.11);font-family:var(--mono);color:#fff}
  .cmp td:first-child{font-family:var(--ui);color:#CFCFEA}
  .cmp td:last-child{text-align:right;white-space:nowrap}
  .bar select{max-width:100%;min-width:0;text-overflow:ellipsis}
  .yn{display:flex;gap:10px;padding:14px 20px}
  .yn .choice{flex:1;text-align:center}
  @media (max-width:560px){ .six{grid-template-columns:repeat(2,1fr)} .two{grid-template-columns:1fr} svg.canvas .gtitle{font-size:19px} }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1 class="mark">Identities &amp; Equations Lab</h1>
    <div class="eyebrow">Trigonometry · Unit 4 · Identities &amp; Equations</div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Lessons"></nav>
  <div class="stage">
    <section class="board" role="tabpanel">
      <div class="board-head">
        <h2 id="bTitle">—</h2>
        <span class="lsn" id="bLesson"></span>
      </div>
      <svg class="canvas" id="cv" viewBox="0 0 700 460" role="img" aria-label="Trigonometry figure"></svg>
      <div class="bar" id="bar"></div>
    </section>
    <aside id="side"></aside>
  </div>
  <footer class="foot">Every figure is live and every number is computed from the drawing — drag a point and the work follows. Standards: Common Core HS Functions, Trigonometric Functions (F-TF).
    <div class="links"><a href="/trig-calculus/">← Trig &amp; Calculus courses</a><a href="/math/#trig-calculus">Mrs. Ali's Classroom</a></div>
  </footer>
</div>

<script>
(function(){
"use strict";
/* ══════════════════════ helpers ══════════════════════ */
const NS="http://www.w3.org/2000/svg";
const VW=700, VH=460, PI=Math.PI, TAU=2*Math.PI;
const cv=document.getElementById("cv"), bar=document.getElementById("bar"),

function ratApprox(v,maxd){ maxd=maxd||600; const cands=[1,2,3,4,5,6,8,9,10,12,13,15,16,17,18,20,24,25,32,36,49,50,64,72,81,100,144,169,225,289,576,625,841,961,1225,1681,2401,4096]; for(const d of cands){ if(d>maxd)break; const n=Math.round(v*d); if(Math.abs(n/d-v)<1e-9*Math.max(1,Math.abs(v)))return [n,d]; } for(let d=1;d<=maxd;d++){ const n=Math.round(v*d); if(Math.abs(n/d-v)<1e-9*Math.max(1,Math.abs(v)))return [n,d]; } return null; }
function sqExact(w){

function R1L(){ return 216; }
function sixFrom(fn,str,quad){
  const v=evalNum(str); if(!isFinite(v)||hasX(str))return {err:"<b>I can't read that value.</b> Try a fraction like 3/5, a decimal, or a radical like −√5/3 (type sqrt(5) or √5)."};
  const sx=(quad===1||quad===4)?1:-1, sy=(quad===1||quad===2)?1:-1;
  const nameQ="Quadrant "+QN[quad-1];
  let x,y,work="";
  const vs=exA(v);
  const need=(cond,msg)=>{ if(!cond)throw msg; };
  try{
    if(fn==="sin"||fn==="csc"){
      const sv=fn==="sin"?v:1/v;
      need(fn==="sin"?Math.abs(v)<=1:Math.abs(v)>=1, fn==="sin"?"sin θ must be between −1 and 1.":"csc θ must be ≤ −1 or ≥ 1.");
      need(Math.sign(sv)===sy||sv===0,`sin θ is ${sy>0?"positive":"negative"} in ${nameQ}, so this value can't happen there.`);
      y=sv; x=sx*Math.sqrt(Math.max(0,1-sv*sv));
      if(fn==="csc")work+=`sin θ = 1/csc θ = ${exA(sv)}\n`;
      work+=`cos²θ = 1 − sin²θ = 1 − (${sqExact(sv)})² = ${frac(1-sv*sv,600)||num(1-sv*sv,4)}\ncos θ = ${sx>0?"+":"−"}√(${frac(1-sv*sv,600)||num(1-sv*sv,4)}) = ${exA(x)}   (cos is ${sx>0?"+":"−"} in ${nameQ})`;
    } else if(fn==="cos"||fn==="sec"){
      const cv_=fn==="cos"?v:1/v;
      need(fn==="cos"?Math.abs(v)<=1:Math.abs(v)>=1, fn==="cos"?"cos θ must be between −1 and 1.":"sec θ must be ≤ −1 or ≥ 1.");
      need(Math.sign(cv_)===sx||cv_===0,`cos θ is ${sx>0?"positive":"negative"} in ${nameQ}, so this value can't happen there.`);
      x=cv_; y=sy*Math.sqrt(Math.max(0,1-cv_*cv_));
      if(fn==="sec")work+=`cos θ = 1/sec θ = ${exA(cv_)}\n`;
      work+=`sin²θ = 1 − cos²θ = 1 − (${sqExact(cv_)})² = ${frac(1-cv_*cv_,600)||num(1-cv_*cv_,4)}\nsin θ = ${sy>0?"+":"−"}√(${frac(1-cv_*cv_,600)||num(1-cv_*cv_,4)}) = ${exA(y)}   (sin is ${sy>0?"+":"−"} in ${nameQ})`;
    } else if(fn==="tan"){
      need(Math.sign(v)===sx*sy||v===0,`tan θ is ${sx*sy>0?"positive":"negative"} in ${nameQ}, so this value can't happen there.`);
      const sec=sx*Math.sqrt(1+v*v); x=1/sec; y=v*x;
      work+=`sec²θ = 1 + tan²θ = 1 + (${sqExact(v)})² = ${frac(1+v*v,600)||num(1+v*v,4)}\nsec θ = ${sx>0?"+":"−"}√(${frac(1+v*v,600)||num(1+v*v,4)}) = ${exA(sec)}   (cos, so sec, is ${sx>0?"+":"−"} in ${nameQ})\ncos θ = 1/sec θ = ${exA(x)},  sin θ = tan θ · cos θ = ${exA(y)}`;
    } else {
      need(Math.sign(v)===sx*sy||v===0,`cot θ is ${sx*sy>0?"positive":"negative"} in ${nameQ}, so this value can't happen there.`);
      const csc=sy*Math.sqrt(1+v*v); y=1/csc; x=v*y;
      work+=`csc²θ = 1 + cot²θ = 1 + (${sqExact(v)})² = ${frac(1+v*v,600)||num(1+v*v,4)}\ncsc θ = ${sy>0?"+":"−"}√(${frac(1+v*v,600)||num(1+v*v,4)}) = ${exA(csc)}   (sin, so csc, is ${sy>0?"+":"−"} in ${nameQ})\nsin θ = 1/csc θ = ${exA(y)},  cos θ = cot θ · sin θ = ${exA(x)}`;
    }
  }catch(msg){ return {err:"<b>No angle fits.</b> "+msg}; }
  if(Math.abs(x)<1e-12||Math.abs(y)<1e-12) return {err:"<b>That value puts θ on an axis</b> (a quadrantal angle), so it is not inside a quadrant. Try a value strictly between the extremes."};
  work+=`\ntan θ = sin θ / cos θ,  then reciprocals:\ncsc θ = 1/sin θ,  sec θ = 1/cos θ,  cot θ = 1/tan θ`;
  const vals={sin:exA(y),cos:exA(x),tan:exA(y/x),csc:exA(1/y),sec:exA(1/x),cot:exA(x/y)};
  return {vals,work,x,y,deg:Math.round(norm(Math.atan2(y,x)/D2R)*10)/10};
}

const STD=[0,30,45,60,90,120,135,150,180,210,225,240,270,300,315,330];
const TANX={0:"0",30:"√3/3",45:"1",60:"√3",120:"−√3",135:"−1",150:"−√3/3",180:"0",210:"√3/3",225:"1",240:"√3",300:"−√3",315:"−1",330:"−√3/3"};
function decompose(th){ // θ = a ± b with a, b standard; prefer small values
  const cand=[];
  const A=[30,45,60,90,120,135,150,180,210,225,240,270,300,315], B=[30,45,60];
  A.forEach(a=>B.forEach(b=>{ if(a+b===th)cand.push([a,b,1]); if(a-b===th)cand.push([a,b,-1]); }));
  cand.sort((u,v)=>(u[0]+u[1])-(v[0]+v[1])||(v[2]-u[2]));
  return cand[0]||null;
}
function sumSteps(fn,th){
  const dcp=decompose(th); if(!dcp)return null;
  const [a,b,sg]=dcp, op=sg>0?"+":"−", opp=sg>0?"−":"+";
  const sa=baseSC("sin",a), ca=baseSC("cos",a), sb=baseSC("sin",b), cb=baseSC("cos",b);
  const P=s=>{ const t=qstr(s); return /^−|\s/.test(t)?"("+t+")":t; };
  let t=`${th}° = ${a}° ${op} ${b}°\n`, res;
  if(fn==="sin"){
    t+=`sin(${a}° ${op} ${b}°) = sin ${a}° cos ${b}° ${op} cos ${a}° sin ${b}°\n`;
    t+=`  = ${P(sa)}·${P(cb)} ${op} ${P(ca)}·${P(sb)}\n`;
    const m1=qmul(sa,cb), m2=qmul(ca,sb); res=qadd(m1,m2,sg);
    t+=`  = ${qstr(m1,true)} ${op} ${P(m2)}\n  = ${qstr(res)}`;
  } else if(fn==="cos"){
    t+=`cos(${a}° ${op} ${b}°) = cos ${a}° cos ${b}° ${opp} sin ${a}° sin ${b}°\n`;
    t+=`  = ${P(ca)}·${P(cb)} ${opp} ${P(sa)}·${P(sb)}\n`;
    const m1=qmul(ca,cb), m2=qmul(sa,sb); res=qadd(m1,m2,-sg);
    t+=`  = ${qstr(m1,true)} ${opp} ${P(m2)}\n  = ${qstr(res)}`;
  } else {
    const ta=TANX[a], tb=TANX[b];
    if(ta==null){ // a = 90 or 270: use sin/cos instead
      t+=`tan ${a}° is undefined, so use tan θ = sin θ / cos θ.\n`;
      return {text:t+`sin ${th}° = ${exact15("sin",th)},  cos ${th}° = ${exact15("cos",th)}\ntan ${th}° = ${exact15("tan",th)}`,ans:Math.tan(th*D2R)};
    }
    const w=s=>/^−|\s/.test(s)?"("+s+")":s;
    t+=`tan(${a}° ${op} ${b}°) = (tan ${a}° ${op} tan ${b}°) / (1 ${opp} tan ${a}° tan ${b}°)\n`;
    t+=`  = (${ta} ${op} ${w(tb)}) / (1 ${opp} ${w(ta)}·${w(tb)})\n`;
    t+=`  = ${exact15("tan",th)}   (rationalize: multiply by the conjugate)`;
    return {text:t,ans:Math.tan(th*D2R)};
  }
  return {text:t,ans:qval(res)};
}

// general solver for f(b·x) = c on [0, 2π)
function solveBasic(fn,b,c){
  const out={fn,b,c,base:[],xs:[],per:fn==="tan"?PI:TAU,ref:null,none:false};
  if(fn!=="tan"&&Math.abs(c)>1+1e-12){ out.none=true; return out; }
  const cc=fn==="tan"?c:clamp(c,-1,1);
  if(fn==="sin"){ const a=Math.asin(cc); out.ref=Math.asin(Math.abs(cc)); out.base=Math.abs(Math.abs(cc)-1)<1e-12?[norm2(a)]:[norm2(a),norm2(PI-a)]; }
  else if(fn==="cos"){ const a=Math.acos(cc); out.ref=Math.acos(Math.abs(cc)); out.base=(Math.abs(Math.abs(cc)-1)<1e-12)?[norm2(a)]:[norm2(a),norm2(TAU-a)]; }
  else { const a=Math.atan(cc); out.ref=Math.atan(Math.abs(cc)); out.base=[a<0?a+PI:a]; }
  out.base=uniq(out.base.sort((u,v)=>u-v));
  const xs=[]; out.base.forEach(u=>{ for(let k=-2;k<b*2+3;k++){ const x=(u+k*out.per)/b; if(x>-1e-9&&x<TAU-1e-9)xs.push(Math.abs(x)<1e-9?0:x); } });
  out.xs=uniq(xs.sort((u,v)=>u-v));
  return out;
}
function norm2(a){ a=a%TAU; if(a<0)a+=TAU; if(Math.abs(a-TAU)<1e-12)a=0; return a; }
function uniq(a){ const r=[]; a.forEach(v=>{ if(!r.some(w=>Math.abs(w-v)<1e-7))r.push(v); }); return r; }
const per=(b,p)=>{ const f=piFrac(p/b); return f==="π"?"πk":f==="2π"?"2πk":f.replace("π","πk"); };
const cStr=c=>{ const f=frac(c); if(f)return f; return sqExact(c); };
function basicText(S,arg){ // text for solving f(arg) = c
  const F=S.fn, ex=v=>{ const p=piFrac(v,36); return p?p+(Math.abs(v)>1e-9?" ≈ "+num(v,4):""):num(v,4); };
  let t="";
  if(S.none)return `${F} ${arg} = ${cStr(S.c)} has no solution: ${F} is always between −1 and 1.`;
  const exact=S.base.every(u=>piFrac(u,36)!=null);
  if(S.ref!=null){
    t+= exact? `reference angle: ${F}⁻¹(${cStr(Math.abs(S.c))}) = ${piFrac(S.ref,36)||num(S.ref,4)}\n` : `reference angle (calculator): ${F}⁻¹(${num(Math.abs(S.c),4)}) ≈ ${num(S.ref,4)} rad\n`;
  }
  const where={sin:S.c>0?"I and II (sin > 0)":S.c<0?"III and IV (sin < 0)":"on the x-axis",cos:S.c>0?"I and IV (cos > 0)":S.c<0?"II and III (cos < 0)":"on the y-axis",tan:S.c>0?"I and III (tan > 0)":S.c<0?"II and IV (tan < 0)":"on the x-axis"}[F];
  if(Math.abs(Math.abs(S.c)-1)>1e-12||F==="tan")t+=`${F} is ${S.c===0?"0":S.c>0?"positive":"negative"} → angles ${where}\n`;
  t+=`${arg} = ${S.base.map(ex).join(",  ")}   (+ ${F==="tan"?"πk":"2πk"})`;
  return t;
}

      if(M6.s.state==="right")return;
      const yes=b.dataset.yn==="1";
      if(yes===pr.yes){ b.classList.add("right"); win(); }
      else { b.classList.add("wrong"); lose(pr.yes?"It is an identity, so the graphs coincide everywhere.":"It is not. Look for one x where the two sides differ."); }
    });
    document.getElementById("sol").onclick=()=>{ M6.s.reveal=true; if(M6.s.state!=="right"){M6.s.streak=0;M6.upStreak();} clear(); M6.draw();
      showSol(`<div class="verdict bad" style="background:rgba(255,217,61,.10);border-color:rgba(255,217,61,.35);color:#FBEFC9"><b>Worked solution.</b> Study it, then press <b>New problem</b> and try one on your own.</div>`); };
  }
};

/* ══════════════════════ controller ══════════════════════ */
const MODS=[M1,M2,M3,M4,M5,M6];
let cur=0;
function setFS(){ FS=(window.innerWidth<=560)?1.55:1; }
window.addEventListener("resize",()=>{ const o=FS; setFS(); if(o!==FS)update(); });
function update(){ setFS(); const M=MODS[cur]; clear(); M.draw(); M.panel(false); }
function render(){
  setFS(); const M=MODS[cur];
  document.documentElement.style.setProperty("--accent",M.accent||"var(--cyan)");
  if(M===M6&&!M6.s.pr)M6.newProb();
  bTitle.textContent=M.title(); bLesson.textContent=M.lesson;
  cv.setAttribute("aria-label",M.tab+" — "+M.title());
  bar.innerHTML=""; M.bar();
  clear(); M.draw(); M.panel(true);
  [...tabsEl.children].forEach((b,i)=>{ b.setAttribute("aria-selected",String(i===cur)); b.tabIndex=i===cur?0:-1; });
}
function go(i,push){ cur=clamp(i,0,MODS.length-1); if(push){ try{history.replaceState(null,"","#tab-"+(cur+1));}catch(_){location.hash="tab-"+(cur+1);} } render(); }
MODS.forEach((M,i)=>{
  const b=document.createElement("button"); b.type="button"; b.setAttribute("role","tab"); b.id="tabbtn-"+(i+1);
  b.innerHTML='<span class="n">'+String(i+1).padStart(2,"0")+'</span>'+M.tab;
  b.onclick=()=>go(i,true);
  b.onkeydown=e=>{ if(e.key==="ArrowRight"||e.key==="ArrowLeft"){ e.preventDefault(); const j=(cur+(e.key==="ArrowRight"?1:-1)+MODS.length)%MODS.length; go(j,true); tabsEl.children[j].focus(); } };
  tabsEl.appendChild(b);
});
const fromHash=()=>{ const m=/^#tab-(\d+)$/.exec(location.hash); return m? clamp(+m[1]-1,0,MODS.length-1) : 0; };
window.addEventListener("hashchange",()=>{ const i=fromHash(); if(i!==cur)go(i,false); });
go(fromHash(),false);
})();
</script>
