<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Lines &amp; Functions Lab — Algebra 1 Unit 3</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A0A1F'/%3E%3Cpath d='M10 50L54 14' stroke='%2300E5FF' stroke-width='6' stroke-linecap='round'/%3E%3Cpath d='M22 40H38V27' stroke='%23FFD93D' stroke-width='4' fill='none'/%3E%3Ccircle cx='10' cy='50' r='6' fill='%23FF3D8A'/%3E%3C/svg%3E">

<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A1F; --bg-lift:#13132B; --card:#1C1C3A; --card-2:#242449;
    --cyan:#00E5FF; --magenta:#FF3D8A; --yellow:#FFD93D; --lavender:#C4B5FD;
    --coral:#FF6B6B; --mint:#5EEAD4;
    --accent:var(--cyan);
    --text:#F8F9FF; --dim:#A5A5C9; --edge:rgba(196,181,253,.20);

    --board:#FFFFFF; --grid:#DCE6F7;
    --ink:#14213D; --graphite:#22314F;
    --vert:#7C3AED; --lin:#EA580C; --corr:#0284C7; --alt:#059669;
    --altx:#DB2777; --same:#DC2626; --samex:#0891B2;
    --unk:#E11D48; --hand:#FF6B35;

    --display:"Unbounded","Trebuchet MS",system-ui,sans-serif;
    --ui:"DM Sans",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);font-family:var(--ui);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;position:relative;min-height:100vh;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse at 12% 8%,rgba(0,229,255,.13),transparent 55%),
               radial-gradient(ellipse at 88% 22%,rgba(255,61,138,.12),transparent 55%),
               radial-gradient(ellipse at 50% 105%,rgba(196,181,253,.10),transparent 60%);}
  .wrap{max-width:1220px;margin:0 auto;padding:26px 20px 70px;position:relative;z-index:1}

  header.masthead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .mark{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.6vw,38px);margin:0;letter-spacing:-.01em;
    background:linear-gradient(92deg,var(--cyan),var(--lavender) 55%,var(--magenta));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .eyebrow{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .masthead .eyebrow{margin-left:auto;text-align:right;
    border:1px solid var(--edge);border-radius:100px;padding:7px 15px;background:rgba(255,255,255,.03)}

  nav.tabs{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:20px}
  nav.tabs button{
    font-family:var(--ui);font-size:15px;font-weight:500;
    background:var(--card);color:var(--dim);border:1px solid var(--edge);border-radius:100px;
    padding:11px 19px;cursor:pointer;transition:transform .16s,color .16s,box-shadow .16s,background .16s;
  }
  nav.tabs button:hover{color:#fff;transform:translateY(-2px);background:var(--card-2)}
  nav.tabs button[aria-selected="true"]{
    color:#0A0A1F;background:var(--accent);border-color:var(--accent);font-weight:700;
    box-shadow:0 0 26px -4px var(--accent);
  }
  nav.tabs button .n{font-family:var(--mono);font-size:12px;font-weight:700;opacity:.6;margin-right:9px}
  nav.tabs button:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

  .stage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(330px,1fr);gap:22px;align-items:start}
  @media (max-width:960px){.stage{grid-template-columns:1fr}}

  .board{background:var(--card);border:1px solid var(--edge);border-radius:20px;overflow:hidden;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.8)}
  .board-head{display:flex;align-items:center;gap:12px;padding:16px 20px;flex-wrap:wrap;
    background:linear-gradient(90deg,var(--card-2),var(--card));border-bottom:1px solid var(--edge)}
  .board-head h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0;color:#fff;line-height:1.3}
  .board-head .lsn{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em;
    color:var(--accent);border:1px solid var(--accent);border-radius:100px;padding:5px 13px;white-space:nowrap}
  svg.canvas{display:block;width:100%;height:auto;background:linear-gradient(170deg,#FFFFFF 0%,#EEF4FF 100%);touch-action:none}

  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:15px 20px;background:var(--card-2);border-top:1px solid var(--edge)}
  .bar button,.seg button{font-family:var(--ui);font-size:14.5px;font-weight:600;border:1px solid var(--edge);
    background:rgba(255,255,255,.06);color:var(--text);padding:10px 17px;border-radius:100px;cursor:pointer;transition:.16s}
  .bar button:hover,.seg button:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
  .bar button.primary{background:var(--accent);color:#0A0A1F;border-color:var(--accent);box-shadow:0 0 22px -6px var(--accent)}
  .seg{display:inline-flex;gap:6px;flex-wrap:wrap}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#0A0A1F;border-color:var(--accent);font-weight:700}
  .bar label.chk{display:inline-flex;align-items:center;gap:9px;font-size:14.5px;color:var(--text);cursor:pointer;
    background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:100px;padding:9px 16px}
  .bar label.chk:hover{background:rgba(255,255,255,.1)}
  .bar label.chk input{accent-color:var(--accent);width:17px;height:17px}
  .bar .spacer{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--dim)}
  .bar select{width:auto;max-width:340px}
  .chiprow{display:flex;flex-wrap:wrap;gap:7px;width:100%;margin-bottom:2px}
  .chiprow button{font-family:var(--ui);font-size:13.5px;font-weight:600;cursor:pointer;
    padding:8px 14px;border-radius:100px;background:rgba(255,255,255,.05);
    border:1.5px solid var(--c);color:#E7E9FA;transition:.15s;display:flex;align-items:center;gap:8px}
  .chiprow button::before{content:"";width:10px;height:10px;border-radius:10px;background:var(--c)}
  .chiprow button:hover{background:rgba(255,255,255,.12)}
  .chiprow button[aria-pressed="true"]{background:var(--c);color:#0A0A1F;font-weight:700}
  .chiprow button[aria-pressed="true"]::before{background:rgba(10,10,31,.55)}
  .note{margin:0 20px 16px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.55;
    background:rgba(255,217,61,.10);border:1px solid rgba(255,217,61,.35);color:#FBEFC9}
  .note b{color:#fff}

  .panel{border:1px solid var(--edge);border-radius:18px;background:var(--card);margin-bottom:16px;overflow:hidden}
  .panel h3{margin:0;padding:15px 20px;font-family:var(--display);font-weight:600;font-size:14px;
    letter-spacing:.01em;color:#fff;background:linear-gradient(90deg,var(--card-2),transparent);
    border-bottom:1px solid var(--edge)}
  .pad{padding:16px 20px;font-size:15px;color:#CFCFEA}
  .pad p{margin:0 0 11px} .pad p:last-child{margin-bottom:0}
  .pad b{color:#fff;font-weight:700}
  .term{font-weight:700;color:var(--accent)}

  .eq{font-family:var(--mono);font-size:14.5px;font-weight:600;color:#fff;background:rgba(0,0,0,.28);
    border:1px solid var(--edge);border-left:4px solid var(--accent);padding:13px 15px;margin:12px 0;
    border-radius:0 12px 12px 0;overflow-x:auto;white-space:pre-wrap;line-height:1.75}
  .eq small{display:block;font-family:var(--ui);font-size:13px;font-weight:400;color:var(--dim);margin-top:7px}

  .rel{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;
    padding:13px 20px;border-bottom:1px solid rgba(196,181,253,.12);font-size:15px}
  .rel:last-child{border-bottom:none}
  .rel .dot{width:13px;height:13px;border-radius:13px}
  .rel .nm{color:#fff;font-weight:500}
  .rel .nm em{font-style:normal;color:var(--dim);font-size:13px;display:block;font-weight:400}
  .rel .val{font-family:var(--mono);font-size:13.5px;font-weight:600;white-space:normal;text-align:right}
  .ok{color:var(--mint)} .no{color:var(--coral)}

  select,input[type=number],input[type=text]{
    font-family:var(--ui);font-size:15px;background:#0F0F26;color:#fff;
    border:1px solid var(--edge);border-radius:12px;padding:12px 13px;width:100%;}
  select:focus,input:focus{outline:3px solid var(--accent);outline-offset:1px}
  label.fld{display:block;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.1em;
    text-transform:uppercase;color:var(--accent);margin:16px 20px 7px}
  .fldwrap{padding:0 20px}
  .go{width:100%;font-family:var(--ui);font-size:16px;font-weight:700;background:var(--accent);color:#0A0A1F;
    border:none;padding:14px;border-radius:100px;cursor:pointer;box-shadow:0 0 26px -6px var(--accent);transition:.16s}
  .go:hover{transform:translateY(-2px)}
  .ghost{font-family:var(--ui);font-size:15px;font-weight:600;background:transparent;color:var(--dim);
    border:1px solid var(--edge);padding:14px 18px;border-radius:100px;cursor:pointer}
  .ghost:hover{color:#fff}
  .verdict{margin:16px 20px;padding:14px 16px;border-radius:14px;font-size:15px;line-height:1.6}
  .verdict.good{background:rgba(94,234,212,.13);border:1px solid rgba(94,234,212,.45);color:#D7FBF3}
  .verdict.bad{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.4);color:#FFDCDA}
  .verdict.info{background:rgba(255,217,61,.10);border:1px solid rgba(255,217,61,.35);color:#FBEFC9}
  .verdict b{color:#fff}

  /* ── drawing ── */
  .mk{font-family:var(--display);font-weight:600;font-size:20px;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
  .num{font-family:var(--mono);font-weight:700;font-size:16px;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
  .grab{fill:rgba(255,107,53,.20);stroke:var(--hand);stroke-width:2;stroke-dasharray:4 3;cursor:grab}
  .grab:hover{fill:rgba(255,107,53,.35)}
  .rt{stroke:var(--graphite);stroke-width:1.8;fill:none;opacity:.9}
  footer.foot{margin-top:30px;padding-top:18px;border-top:1px solid var(--edge);font-size:14px;color:var(--dim)}

  body.embed header.masthead, body.embed footer.foot{display:none}
  body.embed .wrap{padding:10px}
  footer.foot a{color:var(--cyan);text-decoration:none;font-weight:600}
  footer.foot a:hover{text-decoration:underline}
  footer.foot .links{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}
  .bar button:focus-visible,.seg button:focus-visible,.chiprow button:focus-visible,.go:focus-visible,.ghost:focus-visible,.choice:focus-visible,.del:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  .rng{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:14px;font-weight:600;color:var(--text);
    background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:100px;padding:7px 15px}
  .rng input{accent-color:var(--accent);width:120px}
  .rng output{min-width:34px;text-align:right;color:var(--accent)}
  svg.canvas{-webkit-user-select:none;user-select:none}
  svg.canvas text{pointer-events:none}
  .sm{font-family:var(--mono);font-weight:600;font-size:13.5px;paint-order:stroke;stroke:#fff;stroke-width:4;stroke-linejoin:round}
  .ax{font-family:var(--mono);font-size:11px;fill:#7C8AAB}
  .axt{font-family:var(--ui);font-size:14px;font-weight:700;fill:#4B5B7C}
  .mv{font-family:var(--mono);font-weight:700;font-size:22px;fill:var(--ink)}
  .mh{font-family:var(--display);font-weight:600;font-size:15px;fill:var(--graphite)}
  .mhs{font-family:var(--mono);font-size:12px;font-weight:600;fill:#7C8AAB;letter-spacing:.08em}
  .tv{font-family:var(--mono);font-weight:700;font-size:22px;fill:var(--ink)}
  .bn{font-family:var(--mono);font-weight:700;font-size:20px;fill:var(--ink)}
  .bdg{font-family:var(--display);font-weight:600;font-size:15px}
  @media (max-width:560px){ svg.canvas .sm{font-size:21px;stroke-width:5} svg.canvas .mk{font-size:27px} svg.canvas .num{font-size:22px} svg.canvas .ax{font-size:17px} svg.canvas .axt{font-size:20px}
    svg.canvas .mv,svg.canvas .tv{font-size:30px} svg.canvas .mh{font-size:22px} svg.canvas .mhs{font-size:17px} svg.canvas .bn{font-size:28px} svg.canvas .bdg{font-size:22px} }
  .uterms{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
  .uterms span{font-family:var(--mono);font-size:12px;font-weight:600;padding:5px 11px;border-radius:100px;
    border:1px solid var(--edge);color:var(--dim);opacity:.55}
  .uterms span.on{opacity:1;color:#0A0A1F;background:var(--accent);border-color:var(--accent)}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 20px}
  .choice{font-family:var(--ui);font-size:15px;font-weight:600;background:rgba(255,255,255,.06);color:var(--text);
    border:1px solid var(--edge);border-radius:14px;padding:13px 12px;cursor:pointer;text-align:left;line-height:1.5;transition:.15s}
  .choice:hover{background:rgba(255,255,255,.12)}
  .choice.right{border-color:var(--mint);background:rgba(94,234,212,.16)}
  .choice.wrong{border-color:var(--coral);background:rgba(255,107,107,.14)}
  .choice small{display:block;font-weight:400;color:var(--dim);font-size:12.5px}
  .stepl{list-style:none;margin:0;padding:6px 0}
  .stepl li{padding:10px 20px;border-left:3px solid transparent;color:var(--dim);font-size:14.5px}
  .stepl li.on{border-left-color:var(--accent);background:rgba(255,255,255,.05);color:#fff}
  .stepl li.done{color:#CFCFEA}
  .stepl li .sn{color:var(--accent);font-family:var(--mono);font-weight:700;margin-right:8px}
  .stepl li b{color:#fff}
  .ansrow{display:flex;gap:12px;padding:0 20px;flex-wrap:wrap}
  .ansrow > div{flex:1 1 140px}
  .ansrow label.fld{margin:14px 0 7px}
  .prob{font-size:15.5px;color:#E7E9FA}
  .prob b{color:#fff;font-family:var(--mono)}
  .fmt{font-size:13px;color:var(--dim);padding:8px 20px 0}

  /* ── Lines & Functions Lab additions ── */
  .wk{display:flex;flex-direction:column;gap:2px;margin:12px 0;border-left:4px solid var(--accent);background:rgba(0,0,0,.28);
    border-radius:0 12px 12px 0;border-top:1px solid var(--edge);border-right:1px solid var(--edge);border-bottom:1px solid var(--edge);padding:8px 0}
  .wk .wr{padding:6px 15px}
  .wk .st{display:block;font-family:var(--mono);font-size:14.5px;font-weight:600;color:#fff;overflow-wrap:anywhere}
  .wk .rs{display:block;font-size:12.5px;color:var(--dim);margin-top:1px}
  .wk .wr.hl .st{color:var(--mint)}
  .wk .sub{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);padding:8px 15px 0}
  table.dt{width:100%;border-collapse:collapse;font-size:14.5px}
  table.dt th{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--accent);text-align:left;padding:10px 8px 6px;font-weight:700}
  table.dt td{padding:5px 8px;border-bottom:1px solid rgba(196,181,253,.11);font-family:var(--mono);font-weight:600;color:#E7E9FA;white-space:nowrap}
  table.dt th:first-child,table.dt td:first-child{padding-left:20px}
  table.dt th:last-child,table.dt td:last-child{padding-right:20px}
  table.dt input{padding:8px 9px;border-radius:9px;font-family:var(--mono);font-weight:600;min-width:58px}
  table.dt tr.badrow td{background:rgba(255,107,107,.12)}
  table.dt td.okc{color:var(--mint)} table.dt td.noc{color:var(--coral)} table.dt td.dimc{color:var(--dim)}
  .del{background:transparent;border:1px solid var(--edge);color:var(--dim);border-radius:100px;width:34px;height:34px;cursor:pointer;font-size:14px}
  .del:hover{color:#fff;background:rgba(255,255,255,.08)}
  .big{font-family:var(--mono);font-size:19px;font-weight:700;color:#fff}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  @media (max-width:560px){
    .choices{grid-template-columns:1fr}
    .masthead .eyebrow{margin-left:0;text-align:left}
    .rng input{width:92px}
    .bar{padding:13px 14px}
    .pad{padding:14px 16px}
    .bar .spacer{margin-left:0;width:100%}
    table.dt th:first-child,table.dt td:first-child{padding-left:14px}
    table.dt th:last-child,table.dt td:last-child{padding-right:14px}
    table.dt td,table.dt th{padding-left:5px;padding-right:5px}
    table.dt input{min-width:48px;padding:7px 6px}
  }
</style>

<body>
<div class="wrap">
  <header class="masthead">
    <h1 class="mark">Lines &amp; Functions Lab</h1>
    <div class="eyebrow">Algebra 1 · Unit 3 · Graphing Lines &amp; Functions</div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Lessons"></nav>
  <div class="stage">
    <section class="board" role="tabpanel">
      <div class="board-head">
        <h2 id="bTitle">—</h2>
        <span class="lsn" id="bLesson"></span>
      </div>
      <svg class="canvas" id="cv" viewBox="0 0 700 460" role="img" aria-label="Graph of lines and functions"></svg>
      <div class="bar" id="bar"></div>
    </section>
    <aside id="side"></aside>
  </div>
  <footer class="foot">Every graph is live and every number is computed from the drawing — drag a point or move a slider and the work follows. Vocabulary follows Common Core / Eureka Math (EngageNY) Algebra I.
    <div class="links"><a href="/algebra/">← Algebra courses</a><a href="/math/#algebra">Mrs. Ali's Classroom</a></div>
  </footer>
</div>

<script>
(function(){
"use strict";
/* ══════════════════════ helpers ══════════════════════ */
const NS="http://www.w3.org/2000/svg";
const VW=700, VH=460, S=30, OX=350, OY=230;
const cv=document.getElementById("cv"), bar=document.getElementById("bar"),
      side=document.getElementById("side"), tabsEl=document.getElementById("tabs"),
      bTitle=document.getElementById("bTitle"), bLesson=document.getElementById("bLesson");
if(new URLSearchParams(location.search).has("embed")) document.body.classList.add("embed");

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const near=(a,b,e)=>Math.abs(a-b)<(e||1e-9);
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a||1;};
const lcm=(a,b)=>Math.abs(a*b)/gcd(a,b);
const minus=s=>String(s).replace(/-/g,"−");
function num(v,dp){ dp=(dp==null?1:dp); const f=Math.pow(10,dp); let s=Math.round(v*f)/f; if(Object.is(s,-0)||Math.abs(s)<1e-12)s=0; return minus(String(s)); }
function fracND(v){
  if(!isFinite(v))return null;
  for(let d=1;d<=1000;d++){ const n=Math.round(v*d); if(Math.abs(n/d-v)<1e-9*Math.max(1,Math.abs(v))){ const g=gcd(n,d); return [n/g,d/g]; } }
  return null;
}
// exact fraction when the denominator is small, otherwise a decimal
function fx(v){ if(Math.abs(v)<1e-12)return "0"; const f=fracND(v); if(f&&f[1]<=60) return f[1]===1? minus(f[0]) : minus(f[0]+"/"+f[1]); return num(v,2); }
function fxa(v){ const s=fx(v); return s.indexOf("/")>=0? s+" ≈ "+num(v,2) : s; }
const nm=v=>num(v,2);
const pt=p=>"("+nm(p[0])+", "+nm(p[1])+")";
const ptx=p=>"("+fx(p[0])+", "+fx(p[1])+")";
const par=v=>v<-1e-12? "("+nm(v)+")" : nm(v);
const same=(p,q)=>near(p[0],q[0],1e-9)&&near(p[1],q[1],1e-9);
const sub=(p,q)=>[p[0]-q[0],p[1]-q[1]];
const add=(p,q)=>[p[0]+q[0],p[1]+q[1]];
const mul=(p,k)=>[p[0]*k,p[1]*k];
const len=v=>Math.hypot(v[0],v[1]);

/* ── line-equation formatting ── */
function coefX(m,v){ v=v||"x";

const slopeInt=(m,b)=>"y = "+exprMX(m,b);
const vsub=(v,name)=> Math.abs(v)<1e-12? name : (v<0? `${name} + ${fx(-v)}` : `${name} − ${fx(v)}`);

function toStd(a,b,c){ // integer A,B,C with A ≥ 0 for ax + by = c

}

function stepsSI2Std(m,b){
  const R=[[slopeInt(m,b),"slope-intercept form"]];

  const st=toStd(-m,1,b);

function stepsStd2SI(A,B,C){
  const R=[[stdStr(A,B,C),"standard form Ax + By = C"]];

/* ── answer / equation parser (linear expressions in x and y) ── */
function tokenize(s){

    if(ch==="x"||ch==="y"){T.push({t:"v",v:ch});i++;continue;}
    if("+-*/()=".indexOf(ch)>=0){T.push({t:ch});i++;continue;}
    throw new Error("char");
  }
  return T;
}
function parseLinear(T){

  const scale=(a,k)=>L(a.x*k,a.y*k,a.c*k);
  const mulL=(a,b)=>{ if(isC(a))return scale(b,a.c); if(isC(b))return scale(a,b.c); throw new Error("nonlinear"); };
  function primary(){ const p=next(); if(!p)throw new Error("end");
    if(p.t==="n")return L(0,0,p.v); if(p.t==="v")return p.v==="x"?L(1,0,0):L(0,1,0);
    if(p.t==="("){ const a=expr(); const q=next(); if(!q||q.t!==")")throw new Error("paren"); return a; }
    throw new Error("tok"); }
  function unary(){ const p=peek(); if(p&&(p.t==="-"||p.t==="+")){ next(); const a=unary(); return p.t==="-"?scale(a,-1):a; } return primary(); }
  function term(){ let a=unary();
    for(;;){ const p=peek(); if(!p)break;
      if(p.t==="*"||p.t==="/"){ next(); const b=unary(); if(p.t==="*")a=mulL(a,b); else { if(!isC(b)||Math.abs(b.c)<1e-12)throw new Error("div"); a=scale(a,1/b.c); } }
      else if(p.t==="n"||p.t==="v"||p.t==="("){ a=mulL(a,primary()); }
      else break; }
    return a; }
  function expr(){ let a=term(); while(peek()&&(peek().t==="+"||peek().t==="-")){ const op=next().t, b=term(); const k=op==="+"?1:-1; a=L(a.x+k*b.x,a.y+k*b.y,a.c+k*b.c); } return a; }
  const r=expr(); if(i!==T.length)throw new Error("trail"); return r;
}
function parseEq(s){ // → {x,y,c} meaning x·X + y·Y + c = 0, or null
  try{ const T=tokenize(s); const k=T.findIndex(t=>t.t==="="); if(k<1||k===T.length-1||T.slice(k+1).some(t=>t.t==="="))return null;
    const l=parseLinear(T.slice(0,k)), r=parseLinear(T.slice(k+1)); const E={x:l.x-r.x,y:l.y-r.y,c:l.c-r.c};
    if(Math.abs(E.x)<1e-12&&Math.abs(E.y)<1e-12)return null; return E; }catch(_){ return null; }
}
const eqLine=E=> Math.abs(E.y)>1e-12? {vert:false,m:-E.x/E.y,b:-E.c/E.y} : {vert:true,k:-E.c/E.x};
function parseNum(s){
  s=String(s).trim(); if(!s)return {bad:true};
  if(/^(undefined|undef|none|no slope|dne|no)$/i.test(s))return {undef:true};
  const m=/^\(\s*([^,]+)\s*,\s*([^,]+)\s*\)$/.exec(s);
  if(m){ const a=parseNum(m[1]), b=parseNum(m[2]); if(a.v!=null&&b.v!=null)return {pt:[a.v,b.v]}; return {bad:true}; }

}

function relInfo(pairs){
  const mp=new Map(); pairs.forEach(p=>{ const k=+p[0]; if(!mp.has(k))mp.set(k,new Set()); mp.get(k).add(+p[1]); });
  const bad=[...mp].filter(e=>e[1].size>1).map(e=>e[0]);
  const dom=[...mp.keys()].sort((a,b)=>a-b), ran=[...new Set(pairs.map(p=>+p[1]))].sort((a,b)=>a-b);
  return {mp,bad,isFn:bad.length===0,dom,ran};
}
const setStr=a=>"{"+a.map(nm).join(", ")+"}";
function drawMapping(pairs,bad){

  const cy=258, yD=i=>cy+(i-(D.length-1)/2)*gap, yR=i=>cy+(i-(R.length-1)/2)*gap, ry=n*gap/2+30, LX=205, RX=495;
  [[LX,"INPUT x","Domain"],[RX,"OUTPUT y","Range"]].forEach(([x,a,b])=>{
    cv.appendChild(E("ellipse",{cx:x,cy,rx:78,ry,style:"fill:#F5F8FF;stroke:#9DB0D6","stroke-width":2}));
    const t=E("text",{x,y:cy-ry-30*FS,class:"mh","text-anchor":"middle"}); t.textContent=b; cv.appendChild(t);
    const u=E("text",{x,y:cy-ry-12,class:"mhs","text-anchor":"middle"}); u.textContent=a; cv.appendChild(u);
  });
  const g=E("g",{}); cv.appendChild(g); const seen=new Set();
  pairs.forEach(p=>{ const k=p[0]+","+p[1]; if(seen.has(k))return; seen.add(k);
    const i=D.indexOf(+p[0]), j=R.indexOf(+p[1]), isBad=bad&&bad.has(+p[0]);
    const a=[LX+34,yD(i)], b=[RX-36,yR(j)], d=unit(sub(b,a));
    sarrow(g,add(a,mul(d,4)),b,isBad?"#E11D48":"var(--corr)",isBad?3.2:2.4);

  D.forEach((v,i)=>{ const isBad=bad&&bad.has(v); stext(cv,[LX,yD(i)],nm(v),"mv",isBad?"#E11D48":null); });
  R.forEach((v,j)=>stext(cv,[RX,yR(j)],nm(v),"mv"));

function drawPairsSvg(pairs,bad){

const CURVES={
  line:{label:"Line",fn:true,rule:"f(x) = −(1/2)x + 2",dom:"all real numbers",ran:"all real numbers",ys:x=>[-0.5*x+2]},
  para:{label:"Parabola",fn:true,rule:"f(x) = (1/2)x² − 5",dom:"all real numbers",ran:"y ≥ −5",ys:x=>[0.5*x*x-5]},
  abs:{label:"Absolute value",fn:true,rule:"f(x) = |x − 1| − 3",dom:"all real numbers",ran:"y ≥ −3",ys:x=>[Math.abs(x-1)-3]},
  root:{label:"Square root",fn:true,rule:"f(x) = 2√(x + 4)",dom:"x ≥ −4",ran:"y ≥ 0",ys:x=>x>=-4-1e-9?[2*Math.sqrt(Math.max(0,x+4))]:[]},
  circle:{label:"Circle",fn:false,rule:"x² + y² = 25",dom:"−5 ≤ x ≤ 5",ran:"−5 ≤ y ≤ 5",wit:0,
    ys:x=>{ const r=25-x*x; if(r<-1e-9)return []; const y=Math.sqrt(Math.max(0,r)); return y<1e-9?[0]:[y,-y]; },
    paths:()=>{ const a=[]; for(let i=0;i<=200;i++){const t=i/200*2*Math.PI; a.push([5*Math.cos(t),5*Math.sin(t)]);} return [a]; }},
  side:{label:"Sideways parabola",fn:false,rule:"x = (1/2)y² − 4",dom:"x ≥ −4",ran:"all real numbers",wit:4,
    ys:x=>{ const r=2*(x+4); if(r<-1e-9)return []; const y=Math.sqrt(Math.max(0,r)); return y<1e-9?[0]:[y,-y]; },
    paths:()=>{ const a=[]; for(let y=-8;y<=8.001;y+=0.1)a.push([0.5*y*y-4,y]); return [a]; }}
};
function curvePaths(C){
  if(C.paths)return C.paths(); const out=[]; let curp=[];
  for(let x=-12;x<=12.001;x+=0.04){ const ys=C.ys(x); if(ys.length&&Math.abs(ys[0])<40){curp.push([x,ys[0]]);} else { if(curp.length>1)out.push(curp); curp=[]; } }

}

function tblInfo(xs,ys){
  const n=xs.length, dx=[],dy=[],r=[];
  for(let i=1;i<n;i++){ dx.push(xs[i]-xs[i-1]); dy.push(ys[i]-ys[i-1]); r.push(near(xs[i],xs[i-1])?NaN:(ys[i]-ys[i-1])/(xs[i]-xs[i-1])); }

  return {dx,dy,r,eqDx,lin,dupX,incX,ratios,expo,quad,d2};
}

const KINDS=[["mix","Mixed practice"],["slope","Slope from two points"],["mb","Slope & intercept from an equation"],["eq","Equation through two points"],["int","x- and y-intercepts"],["eval","Evaluate f(x)"],["fn","Function or not?"]];

function subPoly(f,x0){ // e.g. 2(−3)² − 4(−3) + 1

    let h=`<div class="panel"><h3>Problem</h3><div class="pad"><p class="prob" id="prob" data-given='${JSON.stringify(giv)}'>${pr.q}</p></div>`;
    if(pr.choice) h+=`<div class="choices"><button type="button" class="choice" id="cyes">Yes — a function<small>each input has exactly one output</small></button><button type="button" class="choice" id="cno">No — not a function<small>some input has two outputs</small></button></div>`;
    else h+=`<div class="ansrow">${pr.fields.map((f,i)=>`<div style="${pr.isEq?"flex-basis:100%":""}"><label class="fld" for="ans${i}">${f}</label><input type="text" id="ans${i}" autocomplete="off" spellcheck="false" placeholder="${pr.ph[i]}"></div>`).join("")}</div>
      <p class="fmt">${pr.isEq?"Any correct form works: y = mx + b, point-slope y − y₁ = m(x − x₁), or standard Ax + By = C. Fractions like 2/3 are fine; use x = k for a vertical line."
        : pr.kind==="slope"?"Type an integer, a fraction like −5/3, or a decimal. Type <b>undefined</b> for a vertical line."
        : "Integers, fractions like −7/2, or decimals (to the nearest hundredth)."+(pr.kind==="int"||pr.kind==="mb"?" A point like (0, 5) also works.":"")}</p>
      <div class="fldwrap" style="margin:14px 0 4px;display:flex;gap:10px;flex-wrap:wrap">
        <button id="chk" class="go" type="button" style="flex:1 1 140px">Check answer</button>
        <button id="sol" class="ghost" type="button">Show solution</button></div>`;
    h+=`<div id="fb6"></div><div style="height:4px"></div></div>`;
    h+=panelH("How it works",`<div class="pad"><p>Answers are checked by value, so 0.5, 1/2 and 2/4 are all accepted. Equations are compared by <b>slope and y-intercept</b>, so any equivalent form counts.</p><p>A first-try correct answer grows your streak. A wrong answer resets it and gives a hint — you can try again.</p></div>`);
    return h;
  },
  wire(){
    const pr=M6.s.pr, fb=$("fb6");
    const right=(msg)=>{ const s=M6.s; s.state="right"; if(s.tries===0&&!s.reveal){ s.streak++; s.best=Math.max(s.best,s.streak); } s.solved++; M6.upStreak(); clear(); M6.draw();
      fb.innerHTML=`<div class="verdict good"><b>Correct!</b> ${msg||""} ${s.tries||s.reveal?"The streak counts first-try answers only.":"Streak "+s.streak+"."} Press <b>New problem</b> for another.</div>`+solText(pr); };
    const wrong=(msg)=>{ M6.s.tries++; M6.s.streak=0; M6.upStreak(); fb.innerHTML=`<div class="verdict bad">${msg}</div>`; };
    if(pr.choice){
      [["cyes",true],["cno",false]].forEach(([id,v])=>{ $(id).onclick=()=>{ if(M6.s.state==="right")return;
        if(v===pr.isFn){ $(id).classList.add("right"); right(""); }
        else { $(id).classList.add("wrong"); wrong(`<b>Not quite.</b> ${pr.rep==="curve"?"Imagine sliding a vertical line across the graph. Does it ever cross the graph twice?":"Look for an input x that appears more than once. Does it go to <b>different</b> outputs each time? (Different inputs sharing an output is fine.)"}`); } }; });
      return;
    }
    const ins=pr.fields.map((_,i)=>$("ans"+i));
    const check=()=>{
      if(M6.s.state==="right")return;
      if(pr.isEq){
        const Eq=parseEq(ins[0].value);
        if(!Eq){ fb.innerHTML=`<div class="verdict bad"><b>I can't read that equation.</b> Use one "=" with x, y, numbers, fractions, + − and parentheses, e.g. y − 2 = 3(x + 1).</div>`; return; }
        const U=eqLine(Eq), T=pr.L;
        const ok= T.vert? (U.vert&&near(U.k,T.k,1e-6)) : (!U.vert&&near(U.m,T.m,1e-6)&&near(U.b,T.b,1e-6));
        if(ok){ right(`Your line has ${T.vert?"x = "+fx(T.k):"slope "+fx(T.m)+" and y-intercept "+fx(T.b)} — the same line.`); ins[0].disabled=true; return; }
        const on=P=>Math.abs(Eq.x*P[0]+Eq.y*P[1]+Eq.c)<1e-6;
        const oa=on(pr.A), ob=on(pr.B);
        wrong(`<b>Not quite.</b> ${oa&&!ob?`A${pt(pr.A)} is on your line, but B${pt(pr.B)} isn't — check your slope.`:!oa&&ob?`B${pt(pr.B)} is on your line, but A${pt(pr.A)} isn't — check your slope or intercept.`:`Neither point satisfies your equation.`} Your line has ${U.vert?"undefined slope":"slope "+fx(U.m)}. ${T.vert?"Look at the x-coordinates of A and B.":"Find m = (y₂ − y₁)/(x₂ − x₁) first, then use point-slope with either point."}`);
        return;
      }
      const vals=ins.map((x,i)=>{ const r=parseNum(x.value); if(r.pt){ return {v:pr.kind==="int"? r.pt[i===0?0:1] : r.pt[1]}; } return r; });
      if(vals.some(v=>v.bad)){ fb.innerHTML=`<div class="verdict bad"><b>I can't read that.</b> Use integers, fractions like 7/3, or decimals${pr.kind==="slope"?", or the word undefined":""}.</div>`; return; }
      let exp;
      if(pr.kind==="slope") exp=[pr.L.vert?"undef":pr.L.m];
      if(pr.kind==="mb") exp=[pr.m,pr.b];
      if(pr.kind==="int") exp=[pr.xi,pr.yi];
      if(pr.kind==="eval") exp=[pr.ans];
      const okEach=vals.map((v,i)=> exp[i]==="undef"? !!v.undef : (v.v!=null&&Math.abs(v.v-exp[i])<=0.011));
      if(okEach.every(Boolean)){ right(""); ins.forEach(x=>x.disabled=true); }
      else { const which=pr.fields.length>1? pr.fields.filter((_,i)=>!okEach[i]).join(" and ") : "";
        let extra="";
        if(pr.kind==="slope"&&vals[0].v!=null&&!pr.L.vert&&near(vals[0].v,-pr.L.m,1e-6)&&!near(pr.L.m,0)) extra=" Your answer has the wrong sign — did you subtract in different orders?";
        if(pr.kind==="slope"&&vals[0].v!=null&&!pr.L.vert&&near(vals[0].v,1/pr.L.m,1e-6)&&!near(Math.abs(pr.L.m),1)) extra=" You may have computed run/rise — slope is rise/run.";
        if(pr.kind==="slope"&&pr.L.vert&&!vals[0].undef) extra=" Look at the x-coordinates: the run is 0.";
        if(pr.kind==="slope"&&vals[0].undef&&!pr.L.vert) extra=" The x-coordinates differ, so the run isn't 0.";
        wrong(`<b>Not quite${which?" — check the "+which:""}.</b>${extra} ${hintText(pr)}`); }
    };
    $("chk").onclick=check;
    ins.forEach(x=>x.addEventListener("keydown",e=>{ if(e.key==="Enter")check(); }));
    $("sol").onclick=()=>{ M6.s.reveal=true; if(M6.s.state!=="right"){M6.s.streak=0;M6.upStreak();} clear(); M6.draw(); fb.innerHTML=`<div class="verdict info"><b>Worked solution.</b> Study it, then press <b>New problem</b> and try one on your own.</div>`+solText(pr); };
  },
  live(){}
};

/* ══════════════════════ controller ══════════════════════ */
const MODS=[M1,M2,M3,M4,M5,M6];
function setFS(){ FS=(window.innerWidth<=560)?1.55:1; }
window.addEventListener("resize",()=>{ const o=FS; setFS(); if(o!==FS)update(); });
function update(){ setFS(); const M=MODS[cur]; clear(); M.draw(); if(M.live)M.live(); bTitle.textContent=M.title(); }
function render(){
  setFS(); const M=MODS[cur];
  document.documentElement.style.setProperty("--accent",M.accent||"var(--cyan)");
  bTitle.textContent=M.title(); bLesson.textContent=M.lesson;
  cv.setAttribute("aria-label",M.tab+" — "+M.title());
  if(M===M6&&!M6.s.pr)M6.newProb();
  bar.innerHTML=""; M.bar();
  clear(); M.draw();
  side.innerHTML=M.side(); if(M.wire)M.wire(); if(M.live)M.live();
  bTitle.textContent=M.title();
  [...tabsEl.children].forEach((b,i)=>{ b.setAttribute("aria-selected",String(i===cur)); b.tabIndex=i===cur?0:-1; });
}
function go(i,push){ cur=clamp(i,0,MODS.length-1); if(push){ try{history.replaceState(null,"","#tab-"+(cur+1));}catch(_){location.hash="tab-"+(cur+1);} } render(); }
MODS.forEach((M,i)=>{
  const b=document.createElement("button"); b.type="button"; b.setAttribute("role","tab"); b.id="tabbtn-"+(i+1);
  b.innerHTML='<span class="n">'+String(i+1).padStart(2,"0")+'</span>'+M.tab;
  b.onclick=()=>go(i,true);
  b.onkeydown=e=>{ if(e.key==="ArrowRight"||e.key==="ArrowLeft"){ e.preventDefault(); const j=(cur+(e.key==="ArrowRight"?1:-1)+MODS.length)%MODS.length; go(j,true); tabsEl.children[j].focus(); } };
  tabsEl.appendChild(b);
});
const fromHash=()=>{ const m=/^#tab-(\d+)$/.exec(location.hash); return m? clamp(+m[1]-1,0,MODS.length-1) : 0; };
window.addEventListener("hashchange",()=>{ const i=fromHash(); if(i!==cur)go(i,false); });
go(fromHash(),false);
})();
</script>
</body>
