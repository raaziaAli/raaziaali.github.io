<head>

<title>Unit Circle &amp; Trig Graphs Lab — Algebra 2 Unit 8</title>

<style>
  :root{
    --bg:#0A0A1F; --bg-lift:#13132B; --card:#1C1C3A; --card-2:#242449;
    --cyan:#00E5FF; --magenta:#FF3D8A; --yellow:#FFD93D; --lavender:#C4B5FD;
    --coral:#FF6B6B; --mint:#5EEAD4;
    --accent:var(--cyan);
    --text:#F8F9FF; --dim:#A5A5C9; --edge:rgba(196,181,253,.20);

    --board:#FFFFFF; --grid:#DCE6F7;
    --ink:#14213D; --graphite:#22314F;
    --vert:#7C3AED; --lin:#EA580C; --corr:#0284C7; --alt:#059669;
    --altx:#DB2777; --same:#DC2626; --samex:#0891B2;
    --unk:#E11D48; --hand:#FF6B35;

    --display:"Unbounded","Trebuchet MS",system-ui,sans-serif;
    --ui:"DM Sans",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);font-family:var(--ui);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;position:relative;min-height:100vh;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse at 12% 8%,rgba(0,229,255,.13),transparent 55%),
               radial-gradient(ellipse at 88% 22%,rgba(255,61,138,.12),transparent 55%),
               radial-gradient(ellipse at 50% 105%,rgba(196,181,253,.10),transparent 60%);}
  .wrap{max-width:1220px;margin:0 auto;padding:26px 20px 70px;position:relative;z-index:1}

  header.masthead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .mark{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.6vw,38px);margin:0;letter-spacing:-.01em;
    background:linear-gradient(92deg,var(--cyan),var(--lavender) 55%,var(--magenta));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .eyebrow{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

  nav.tabs{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:20px}
  nav.tabs button{
    font-family:var(--ui);font-size:15px;font-weight:500;
    background:var(--card);color:var(--dim);border:1px solid var(--edge);border-radius:100px;
    padding:11px 19px;cursor:pointer;transition:transform .16s,color .16s,box-shadow .16s,background .16s;
  }
  nav.tabs button:hover{color:#fff;transform:translateY(-2px);background:var(--card-2)}
  nav.tabs button[aria-selected="true"]{
    color:#0A0A1F;background:var(--accent);border-color:var(--accent);font-weight:700;
    box-shadow:0 0 26px -4px var(--accent);
  }
  nav.tabs button .n{font-family:var(--mono);font-size:12px;font-weight:700;opacity:.6;margin-right:9px}
  nav.tabs button:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

  .stage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(330px,1fr);gap:22px;align-items:start}
  @media (max-width:960px){.stage{grid-template-columns:1fr}}

  .board{background:var(--card);border:1px solid var(--edge);border-radius:20px;overflow:hidden;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.8)}
  .board-head{display:flex;align-items:center;gap:12px;padding:16px 20px;flex-wrap:wrap;
    background:linear-gradient(90deg,var(--card-2),var(--card));border-bottom:1px solid var(--edge)}

  .board-head .lsn{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em;
    color:var(--accent);border:1px solid var(--accent);border-radius:100px;padding:5px 13px;white-space:nowrap}
  svg.canvas{display:block;width:100%;height:auto;background:linear-gradient(170deg,#FFFFFF 0%,#EEF4FF 100%);touch-action:none}

  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:15px 20px;background:var(--card-2);border-top:1px solid var(--edge)}

  .bar button:hover,.seg button:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
  .bar button.primary{background:var(--accent);color:#0A0A1F;border-color:var(--accent);box-shadow:0 0 22px -6px var(--accent)}
  .seg{display:inline-flex;gap:6px;flex-wrap:wrap}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#0A0A1F;border-color:var(--accent);font-weight:700}
  .bar label.chk{display:inline-flex;align-items:center;gap:9px;font-size:14.5px;color:var(--text);cursor:pointer;

  .bar select{width:auto;max-width:340px}
  .note{margin:0 20px 16px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.55;
    background:rgba(255,217,61,.10);border:1px solid rgba(255,217,61,.35);color:#FBEFC9}
  .note b{color:#fff}

  .panel{border:1px solid var(--edge);border-radius:18px;background:var(--card);margin-bottom:16px;overflow:hidden}
  .panel h3{margin:0;padding:15px 20px;font-family:var(--display);font-weight:600;font-size:14px;
    letter-spacing:.01em;color:#fff;background:linear-gradient(90deg,var(--card-2),transparent);
    border-bottom:1px solid var(--edge)}
  .pad{padding:16px 20px;font-size:15px;color:#CFCFEA}
  .pad p{margin:0 0 11px} .pad p:last-child{margin-bottom:0}
  .pad b{color:#fff;font-weight:700}
  .term{font-weight:700;color:var(--accent)}

  .eq small{display:block;font-family:var(--ui);font-size:13px;font-weight:400;color:var(--dim);margin-top:7px}

  .ok{color:var(--mint)} .no{color:var(--coral)}

    border:1px solid var(--edge);border-radius:12px;padding:12px 13px;width:100%;}

  label.fld{display:block;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.1em;
    text-transform:uppercase;color:var(--accent);margin:16px 20px 7px}
  .fldwrap{padding:0 20px}
  .go{width:100%;font-family:var(--ui);font-size:16px;font-weight:700;background:var(--accent);color:#0A0A1F;
    border:none;padding:14px;border-radius:100px;cursor:pointer;box-shadow:0 0 26px -6px var(--accent);transition:.16s}
  .go:hover{transform:translateY(-2px)}
  .ghost{font-family:var(--ui);font-size:15px;font-weight:600;background:transparent;color:var(--dim);
    border:1px solid var(--edge);padding:14px 18px;border-radius:100px;cursor:pointer}
  .ghost:hover{color:#fff}

  .verdict.info{background:rgba(255,217,61,.10);border:1px solid rgba(255,217,61,.35);color:#FBEFC9}
  .verdict b{color:#fff}

  table.facts{width:100%;border-collapse:collapse;font-size:14.5px}
  table.facts td,table.facts th{padding:9px 12px;border-bottom:1px solid rgba(196,181,253,.11);vertical-align:top;text-align:left}
  table.facts th{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.06em}
  table.facts td{font-family:var(--mono);font-size:13.5px;color:#E7E9FA;white-space:nowrap}
  table.facts tr.on td{background:rgba(255,255,255,.08);color:#fff}

  footer.foot{margin-top:30px;padding-top:18px;border-top:1px solid var(--edge);font-size:14px;color:var(--dim)}

  .rt{stroke:var(--graphite);stroke-width:1.8;fill:none;opacity:.9}
  .grab{fill:rgba(255,107,53,.20);stroke:var(--hand);stroke-width:2;stroke-dasharray:4 3;cursor:grab}

  .mk{font-family:var(--display);font-weight:600;font-size:20px;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}

  /* ── Unit Circle Lab additions (shared with Coordinate Line Lab) ── */
  body.embed header.masthead, body.embed footer.foot{display:none}
  body.embed .wrap{padding:10px}
  footer.foot a{color:var(--cyan);text-decoration:none;font-weight:600}
  footer.foot a:hover{text-decoration:underline}
  footer.foot .links{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}
  .bar button:focus-visible,.seg button:focus-visible,.go:focus-visible,.ghost:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  .rng{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:14px;font-weight:600;color:var(--text);
    background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:100px;padding:7px 15px}
  .rng input{accent-color:var(--accent);width:110px}
  .rng output{min-width:44px;text-align:right;color:var(--accent)}
  svg.canvas{-webkit-user-select:none;user-select:none}
  svg.canvas text{pointer-events:none}
  .sm{font-family:var(--mono);font-weight:600;font-size:13.5px;paint-order:stroke;stroke:#fff;stroke-width:4;stroke-linejoin:round}
  .lg{font-family:var(--mono);font-weight:700;font-size:16px;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
  .xs{font-family:var(--mono);font-weight:600;font-size:11.5px;paint-order:stroke;stroke:#fff;stroke-width:3.5;stroke-linejoin:round}
  .ax{font-family:var(--mono);font-size:11px;fill:#7C8AAB;paint-order:stroke;stroke:#F4F8FF;stroke-width:3}
  @media (max-width:560px){ svg.canvas .sm{font-size:20px;stroke-width:5} svg.canvas .lg{font-size:22px} svg.canvas .xs{font-size:16px} svg.canvas .mk{font-size:26px} svg.canvas .ax{font-size:16px} }
  .ansrow{display:flex;gap:12px;padding:0 20px;flex-wrap:wrap}
  .ansrow > div{flex:1 1 120px}
  .ansrow label.fld{margin:14px 0 7px}
  .prob{font-size:15.5px;color:#E7E9FA}
  .prob b{color:#fff}
  .fmt{font-size:13px;color:var(--dim);padding:8px 20px 0}
  .conv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .conv .out{font-family:var(--mono);font-size:13.5px;color:var(--mint);margin-top:6px;min-height:22px}
  .astc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
  .astc div{border:1px solid var(--edge);border-radius:12px;padding:8px 10px;font-size:13.5px;color:var(--dim)}
  .astc div b{display:block;font-family:var(--mono);color:#fff}
  .astc div.on{border-color:var(--accent);background:rgba(255,255,255,.08);color:#fff}
  .tblwrap{overflow-x:auto}
  @media (max-width:560px){
    .masthead .eyebrow{margin-left:0;text-align:left}
    .rng input{width:84px}
    .bar{padding:13px 14px}
    .pad{padding:14px 16px}
    .conv{grid-template-columns:1fr}
  }
</style>

<script>
(function(){

function radFrac(P,Q,sign){

}
const QN=["","I","II","III","IV"];
function quadOf(d){ d=norm(d); const e=1e-7; if(near(d,0,e)||near(d,90,e)||near(d,180,e)||near(d,270,e)||near(d,360,e))return 0; return 1+Math.floor(d/90); }
function axisName(d){ d=Math.round(norm(d)); return {0:"positive x-axis",90:"positive y-axis",180:"negative x-axis",270:"negative y-axis",360:"positive x-axis"}[d]||""; }
function refAngle(d){ d=norm(d); if(d<=90)return d; if(d<=180)return 180-d; if(d<=270)return d-180; return 360-d; }
const SPEC={0:["1","0","0"],30:["√3/2","1/2","√3/3"],45:["√2/2","√2/2","1"],60:["1/2","√3/2","√3"],90:["0","1","undefined"]};

  if(!near(deg,Math.round(deg),1e-7))return null;

const add=(p,q)=>[p[0]+q[0],p[1]+q[1]];

const len=v=>Math.hypot(v[0],v[1]);
const unit=v=>{const l=len(v)||1;return [v[0]/l,v[1]/l];};

const PT=(c,r,deg)=>[c[0]+r*Math.cos(deg*D2R), c[1]-r*Math.sin(deg*D2R)];

function sseg(g,p,q,style,w,dash,op){
  const a={x1:p[0],y1:p[1],x2:q[0],y2:q[1],style:"stroke:"+(style||"var(--graphite)"),"stroke-width":w||2.8,"stroke-linecap":"round",fill:"none"};
  if(dash)a["stroke-dasharray"]=dash; if(op)a.opacity=op; const n=E("line",a); g.appendChild(n); return n;
}
function sdot(g,p,color,r){ g.appendChild(E("circle",{cx:p[0],cy:p[1],r:r||5,style:"fill:"+(color||"var(--ink)"),stroke:"#fff","stroke-width":2,"pointer-events":"none"})); }
function sgrab(g,p,id,color){ g.appendChild(E("circle",{cx:p[0],cy:p[1],r:FS>1?26:16,class:"grab","data-drag":id})); sdot(g,p,color,6); }

/* answers: numbers, fractions, radicals, π, "undefined" */
function parseExpr(s){
  if(!s)return NaN;
  let i=0;
  const peek=()=>s[i];
  function expr(){ let v=term(); while(peek()==="+"||peek()==="-"){ const o=s[i++]; const r=term(); v=o==="+"?v+r:v-r; } return v; }
  function term(){ let v=unary(); for(;;){ const c=peek();
      if(c==="*"||c==="/"){ i++; const r=unary(); v=c==="*"?v*r:v/r; }
      else if(c==="√"||c==="("||c==="π"){ v*=power(); }
      else break; } return v; }
  function unary(){ if(peek()==="-"){i++;return -unary();} if(peek()==="+"){i++;return unary();} return power(); }
  function power(){ const b=atom(); if(peek()==="^"){i++;return Math.pow(b,unary());} return b; }
  function atom(){ const c=peek();
    if(c==="("){ i++; const v=expr(); if(peek()!==")")throw 0; i++; return v; }
    if(c==="√"){ i++; return Math.sqrt(power()); }
    if(c==="π"){ i++; return PI; }
    const m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(i)); if(!m)throw 0; i+=m[0].length; return parseFloat(m[0]); }
  try{ const v=expr(); if(i!==s.length)return NaN; return v; }catch(_){ return NaN; }
}
function parseAns(str){
  let s=String(str||"").trim().toLowerCase();
  if(/^(undefined|undef|und|dne|none|does not exist|no value|∞|infinity|inf)$/.test(s)) return {undef:true,v:NaN,raw:s};
  s=s.replace(/[−–]/g,"-").replace(/[×·]/g,"*").replace(/÷/g,"/").replace(/\s+/g,"")
     .replace(/^(y|x|h|θ|t)=/,"").replace(/radians?|rad/g,"").replace(/°|degrees?|deg/g,"")
     .replace(/sqrt/g,"√").replace(/pi/g,"π");
  return {undef:false,v:parseExpr(s),raw:s};
}
function parseSign(str){
  const s=String(str||"").trim().toLowerCase().replace(/[−–]/g,"-");
  if(/^(\+|pos|positive|\+ ?positive)$/.test(s))return 1;
  if(/^(-|neg|negative)$/.test(s))return -1;
  return 0;
}

const O3=[66,418], U3=150;
const TRIPLES=[[3,4,5],[5,12,13],[8,15,17],[7,24,25],[20,21,29]];
function genGiven(){
  const kind=pick(["sin","cos","tan"]); let X2,Y2,R2;
  if(Math.random()<.65){ const t=pick(TRIPLES), sw=Math.random()<.5; const p=sw?t[1]:t[0], q=sw?t[0]:t[1]; Y2=p*p; X2=q*q; R2=t[2]*t[2]; }
  else if(kind==="tan"){ let a,b; do{a=rnd(1,6);b=rnd(1,6);}while(gcd(a,b)!==1||a===b); Y2=a*a;X2=b*b;R2=a*a+b*b; }
  else { let a,c; do{c=rnd(3,9);a=rnd(1,c-1);}while(gcd(a,c)!==1||(2*a===c));
    if(kind==="sin"){Y2=a*a;R2=c*c;X2=c*c-a*a;} else {X2=a*a;R2=c*c;Y2=c*c-a*a;} }
  const q=rnd(1,4), sx=(q===1||q===4)?1:-1, sy=(q<=2)?1:-1;
  const G={kind,X2,Y2,R2,q,sx,sy};
  G.val={sin:radFrac(Y2,R2,sy),cos:radFrac(X2,R2,sx),tan:radFrac(Y2,X2,sx*sy)};
  G.num={sin:sy*Math.sqrt(Y2/R2),cos:sx*Math.sqrt(X2/R2),tan:sx*sy*Math.sqrt(Y2/X2)};
  G.others=["sin","cos","tan"].filter(k=>k!==kind);
  return G;
}
function givenSteps(G){
  const xs=(G.sx<0?"−":"")+rootStr(G.X2), ys=(G.sy<0?"−":"")+rootStr(G.Y2), rs=rootStr(G.R2);
  const par=s=>s.startsWith("−")?"("+s+")":s;
  let t="";
  if(G.kind==="sin"){ t+=`sin θ = y/r = ${G.val.sin}  →  y = ${ys}, r = ${rs}\n`;
    t+=`x² + y² = r²  →  x² = ${G.R2} − ${G.Y2} = ${G.X2}  →  x = ±${rootStr(G.X2)}\n`;
    t+=`Quadrant ${QN[G.q]}: x is ${G.sx>0?"positive":"negative"}, so x = ${xs}\n`; }
  if(G.kind==="cos"){ t+=`cos θ = x/r = ${G.val.cos}  →  x = ${xs}, r = ${rs}\n`;
    t+=`x² + y² = r²  →  y² = ${G.R2} − ${G.X2} = ${G.Y2}  →  y = ±${rootStr(G.Y2)}\n`;
    t+=`Quadrant ${QN[G.q]}: y is ${G.sy>0?"positive":"negative"}, so y = ${ys}\n`; }
  if(G.kind==="tan"){ t+=`tan θ = y/x = ${G.val.tan}, Quadrant ${QN[G.q]}\n  → x ${G.sx>0?">":"<"} 0 and y ${G.sy>0?">":"<"} 0, so x = ${xs}, y = ${ys}\n`;
    t+=`r² = x² + y² = ${G.X2} + ${G.Y2} = ${G.R2}  →  r = ${rs}  (r > 0)\n`; }
  G.others.forEach(k=>{
    if(k==="sin")t+=`sin θ = y/r = ${ys}/${rs} = ${G.val.sin}\n`;
    if(k==="cos")t+=`cos θ = x/r = ${xs}/${rs} = ${G.val.cos}\n`;
    if(k==="tan")t+=`tan θ = y/x = ${par(ys)}/${par(xs)} = ${G.val.tan}\n`;
  });
  t+=`Check: sin²θ + cos²θ = ${G.Y2}/${G.R2} + ${G.X2}/${G.R2} = 1 ✓`;
  return t;
}

    ins.forEach(x=>x.addEventListener("keydown",e=>{ if(e.key==="Enter")check(); }));
    document.getElementById("sol").onclick=()=>{ M6.s.reveal=true; if(M6.s.state!=="right"){M6.s.streak=0;M6.upStreak();} clear(); M6.draw(); showSol(`<div class="verdict info"><b>Worked solution.</b> Study it, then press <b>New problem</b> and try one on your own.</div>`); };
  }
};

/* ══════════════════════ controller ══════════════════════ */
const MODS=[M1,M2,M3,M4,M5,M6];
function setFS(){ FS=(window.innerWidth<=560)?1.5:1; }
window.addEventListener("resize",()=>{ const o=FS; setFS(); if(o!==FS)update(); });
function update(){ setFS(); const M=MODS[cur]; bTitle.textContent=M.title(); clear(); M.draw(); M.panel(false); }
function panelFull(){ MODS[cur].panel(true); }
function render(){
  setFS(); const M=MODS[cur];
  if(M!==M4&&M4.s.play)stopAnim();
  document.documentElement.style.setProperty("--accent",M.accent||"var(--cyan)");
  bTitle.textContent=M.title(); bLesson.textContent=M.lesson;
  cv.setAttribute("aria-label",M.tab+" — "+M.title());
  if(M===M6&&!M6.s.pr)M6.newProb();
  bar.innerHTML=""; M.sl&&(M.sl={}); M.bar();
  clear(); M.draw(); M.panel(true);
  [...tabsEl.children].forEach((b,i)=>{ b.setAttribute("aria-selected",String(i===cur)); b.tabIndex=i===cur?0:-1; });
}
function go(i,push){ cur=clamp(i,0,MODS.length-1); if(push){ try{history.replaceState(null,"","#tab-"+(cur+1));}catch(_){location.hash="tab-"+(cur+1);} } render(); }
MODS.forEach((M,i)=>{
  const b=document.createElement("button"); b.type="button"; b.setAttribute("role","tab"); b.id="tabbtn-"+(i+1);
  b.innerHTML='<span class="n">'+String(i+1).padStart(2,"0")+'</span>'+M.tab;
  b.onclick=()=>go(i,true);
  b.onkeydown=e=>{ if(e.key==="ArrowRight"||e.key==="ArrowLeft"){ e.preventDefault(); const j=(cur+(e.key==="ArrowRight"?1:-1)+MODS.length)%MODS.length; go(j,true); tabsEl.children[j].focus(); } };
  tabsEl.appendChild(b);
});
M3.init(); M5.newCtx("ferris");
const fromHash=()=>{ const m=/^#tab-(\d+)$/.exec(location.hash); return m? clamp(+m[1]-1,0,MODS.length-1) : 0; };
window.addEventListener("hashchange",()=>{ const i=fromHash(); if(i!==cur)go(i,false); });
window.__trigLab={M6,MODS,parseAns};
go(fromHash(),false);
})();
</script>
