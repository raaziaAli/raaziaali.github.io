<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expressions Lab — Algebra 1 Unit 1</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A0A1F'/%3E%3Crect x='10' y='10' width='26' height='26' rx='3' fill='%2360A5FA'/%3E%3Crect x='40' y='10' width='10' height='26' rx='2' fill='%2334D399'/%3E%3Crect x='40' y='42' width='10' height='10' rx='2' fill='%23FCD34D'/%3E%3Crect x='10' y='42' width='26' height='10' rx='2' fill='%23F87171'/%3E%3C/svg%3E">

<style>
  :root{
    --bg:#0A0A1F; --bg-lift:#13132B; --card:#1C1C3A; --card-2:#242449;
    --cyan:#00E5FF; --magenta:#FF3D8A; --yellow:#FFD93D; --lavender:#C4B5FD;
    --coral:#FF6B6B; --mint:#5EEAD4;
    --accent:var(--cyan);
    --text:#F8F9FF; --dim:#A5A5C9; --edge:rgba(196,181,253,.20);

    --board:#FFFFFF; --grid:#DCE6F7;
    --ink:#14213D; --graphite:#22314F;
    --vert:#7C3AED; --lin:#EA580C; --corr:#0284C7; --alt:#059669;
    --altx:#DB2777; --same:#DC2626; --samex:#0891B2;
    --unk:#E11D48; --hand:#FF6B35;

    --display:"Unbounded","Trebuchet MS",system-ui,sans-serif;
    --ui:"DM Sans",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);font-family:var(--ui);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;position:relative;min-height:100vh;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse at 12% 8%,rgba(0,229,255,.13),transparent 55%),
               radial-gradient(ellipse at 88% 22%,rgba(255,61,138,.12),transparent 55%),
               radial-gradient(ellipse at 50% 105%,rgba(196,181,253,.10),transparent 60%);}
  .wrap{max-width:1220px;margin:0 auto;padding:26px 20px 70px;position:relative;z-index:1}

  header.masthead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .mark{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.6vw,38px);margin:0;letter-spacing:-.01em;
    background:linear-gradient(92deg,var(--cyan),var(--lavender) 55%,var(--magenta));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .eyebrow{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .masthead .eyebrow{margin-left:auto;text-align:right;
    border:1px solid var(--edge);border-radius:100px;padding:7px 15px;background:rgba(255,255,255,.03)}

  nav.tabs{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:20px}
  nav.tabs button{
    font-family:var(--ui);font-size:15px;font-weight:500;
    background:var(--card);color:var(--dim);border:1px solid var(--edge);border-radius:100px;
    padding:11px 19px;cursor:pointer;transition:transform .16s,color .16s,box-shadow .16s,background .16s;
  }
  nav.tabs button:hover{color:#fff;transform:translateY(-2px);background:var(--card-2)}
  nav.tabs button[aria-selected="true"]{
    color:#0A0A1F;background:var(--accent);border-color:var(--accent);font-weight:700;
    box-shadow:0 0 26px -4px var(--accent);
  }
  nav.tabs button .n{font-family:var(--mono);font-size:12px;font-weight:700;opacity:.6;margin-right:9px}
  nav.tabs button:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

  .stage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(330px,1fr);gap:22px;align-items:start}
  @media (max-width:960px){.stage{grid-template-columns:1fr}}

  .board{background:var(--card);border:1px solid var(--edge);border-radius:20px;overflow:hidden;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.8)}
  .board-head{display:flex;align-items:center;gap:12px;padding:16px 20px;flex-wrap:wrap;
    background:linear-gradient(90deg,var(--card-2),var(--card));border-bottom:1px solid var(--edge)}
  .board-head h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0;color:#fff;line-height:1.3}
  .board-head .lsn{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em;
    color:var(--accent);border:1px solid var(--accent);border-radius:100px;padding:5px 13px;white-space:nowrap}
  svg.canvas{display:block;width:100%;height:auto;background:linear-gradient(170deg,#FFFFFF 0%,#EEF4FF 100%);touch-action:none}

  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:15px 20px;background:var(--card-2);border-top:1px solid var(--edge)}
  .bar button,.seg button{font-family:var(--ui);font-size:14.5px;font-weight:600;border:1px solid var(--edge);
    background:rgba(255,255,255,.06);color:var(--text);padding:10px 17px;border-radius:100px;cursor:pointer;transition:.16s}
  .bar button:hover,.seg button:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
  .bar button.primary{background:var(--accent);color:#0A0A1F;border-color:var(--accent);box-shadow:0 0 22px -6px var(--accent)}
  .bar button:disabled{opacity:.4;cursor:default;transform:none}
  .seg{display:inline-flex;gap:6px;flex-wrap:wrap}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#0A0A1F;border-color:var(--accent);font-weight:700}
  .bar label.chk{display:inline-flex;align-items:center;gap:9px;font-size:14.5px;color:var(--text);cursor:pointer;
    background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:100px;padding:9px 16px}
  .bar label.chk:hover{background:rgba(255,255,255,.1)}
  .bar label.chk input{accent-color:var(--accent);width:17px;height:17px}
  .bar .spacer{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--dim)}
  .bar select{width:auto;max-width:340px}
  .note{margin:0 20px 16px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.55;
    background:rgba(255,217,61,.10);border:1px solid rgba(255,217,61,.35);color:#FBEFC9}
  .note b{color:#fff}

  .panel{border:1px solid var(--edge);border-radius:18px;background:var(--card);margin-bottom:16px;overflow:hidden}
  .panel h3{margin:0;padding:15px 20px;font-family:var(--display);font-weight:600;font-size:14px;
    letter-spacing:.01em;color:#fff;background:linear-gradient(90deg,var(--card-2),transparent);
    border-bottom:1px solid var(--edge)}
  .pad{padding:16px 20px;font-size:15px;color:#CFCFEA}
  .pad p{margin:0 0 11px} .pad p:last-child{margin-bottom:0}
  .pad b{color:#fff;font-weight:700}
  .term{font-weight:700;color:var(--accent)}

  .eq{font-family:var(--mono);font-size:14.5px;font-weight:600;color:#fff;background:rgba(0,0,0,.28);
    border:1px solid var(--edge);border-left:4px solid var(--accent);padding:13px 15px;margin:12px 0;
    border-radius:0 12px 12px 0;overflow-x:auto;white-space:pre-wrap;line-height:1.75}
  .eq small{display:block;font-family:var(--ui);font-size:13px;font-weight:400;color:var(--dim);margin-top:7px}

  .rel{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;
    padding:13px 20px;border-bottom:1px solid rgba(196,181,253,.12);font-size:15px}
  .rel:last-child{border-bottom:none}
  .rel .dot{width:13px;height:13px;border-radius:13px}
  .rel .nm{color:#fff;font-weight:500}
  .rel .nm em{font-style:normal;color:var(--dim);font-size:13px;display:block;font-weight:400}
  .rel .val{font-family:var(--mono);font-size:13.5px;font-weight:600;white-space:nowrap}
  .ok{color:var(--mint)} .no{color:var(--coral)}

  select,input[type=number],input[type=text]{
    font-family:var(--ui);font-size:15px;background:#0F0F26;color:#fff;
    border:1px solid var(--edge);border-radius:12px;padding:12px 13px;width:100%;}
  select:focus,input:focus{outline:3px solid var(--accent);outline-offset:1px}
  label.fld{display:block;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.1em;
    text-transform:uppercase;color:var(--accent);margin:16px 20px 7px}
  .fldwrap{padding:0 20px}
  .go{width:100%;font-family:var(--ui);font-size:16px;font-weight:700;background:var(--accent);color:#0A0A1F;
    border:none;padding:14px;border-radius:100px;cursor:pointer;box-shadow:0 0 26px -6px var(--accent);transition:.16s}
  .go:hover{transform:translateY(-2px)}
  .ghost{font-family:var(--ui);font-size:15px;font-weight:600;background:transparent;color:var(--dim);
    border:1px solid var(--edge);padding:14px 18px;border-radius:100px;cursor:pointer}
  .ghost:hover{color:#fff}
  .verdict{margin:16px 20px;padding:14px 16px;border-radius:14px;font-size:15px;line-height:1.6}
  .verdict.good{background:rgba(94,234,212,.13);border:1px solid rgba(94,234,212,.45);color:#D7FBF3}
  .verdict.bad{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.4);color:#FFDCDA}
  .verdict.info{background:rgba(255,217,61,.10);border:1px solid rgba(255,217,61,.35);color:#FBEFC9}
  .verdict b{color:#fff}

  table.facts{width:100%;border-collapse:collapse;font-size:14.5px}
  table.facts td{padding:10px 20px;border-bottom:1px solid rgba(196,181,253,.11);vertical-align:top}
  table.facts .ab{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--accent);white-space:nowrap}
  table.facts .st{color:#DDDDF2}

  .line{stroke:var(--graphite);stroke-width:2.8;fill:none;stroke-linecap:round}
  .mk{font-family:var(--display);font-weight:600;font-size:20px;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
  .num{font-family:var(--mono);font-weight:700;font-size:16px;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
  .grab{fill:rgba(255,107,53,.20);stroke:var(--hand);stroke-width:2;stroke-dasharray:4 3;cursor:grab}
  .grab:hover{fill:rgba(255,107,53,.35)}
  footer.foot{margin-top:30px;padding-top:18px;border-top:1px solid var(--edge);font-size:14px;color:var(--dim)}

  /* ── Expressions Lab additions ── */
  body.embed header.masthead, body.embed footer.foot{display:none}
  body.embed .wrap{padding:10px}
  footer.foot a{color:var(--cyan);text-decoration:none;font-weight:600}
  footer.foot a:hover{text-decoration:underline}
  footer.foot .links{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}
  .bar button:focus-visible,.seg button:focus-visible,.go:focus-visible,.ghost:focus-visible,.choice:focus-visible,.mini:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  .rng{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:14px;font-weight:600;color:var(--text);
    background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:100px;padding:7px 15px}
  .rng input{accent-color:var(--accent);width:110px}
  .rng output{min-width:26px;text-align:right;color:var(--accent)}
  svg.canvas{-webkit-user-select:none;user-select:none}
  svg.canvas text{pointer-events:none}
  .sm{font-family:var(--mono);font-weight:600;font-size:13.5px;paint-order:stroke;stroke:#fff;stroke-width:4;stroke-linejoin:round}
  .ax{font-family:var(--mono);font-size:11px;fill:#7C8AAB}
  .ex{font-family:var(--mono);font-weight:600}
  .lab{font-family:var(--ui);font-weight:700;font-size:13px;fill:#5B6B8C;letter-spacing:.04em}
  .cap{font-family:var(--ui);font-size:15px;fill:var(--ink)}
  .capb{font-family:var(--ui);font-size:16px;font-weight:700;fill:var(--ink)}
  .tl{font-family:var(--mono);font-weight:700;fill:#14213D}
  .hit{fill:transparent;cursor:pointer}
  .hit:hover{fill:rgba(124,58,237,.10)}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 20px}
  .choice{font-family:var(--mono);font-size:16px;font-weight:600;background:rgba(255,255,255,.06);color:var(--text);
    border:1px solid var(--edge);border-radius:14px;padding:13px 12px;cursor:pointer;text-align:left;line-height:1.5;transition:.15s}
  .choice:hover{background:rgba(255,255,255,.12)}
  .choice.right{border-color:var(--mint);background:rgba(94,234,212,.16)}
  .choice.wrong{border-color:var(--coral);background:rgba(255,107,107,.14)}
  .stepl{list-style:none;margin:0;padding:6px 0;max-height:420px;overflow-y:auto}
  .stepl li{padding:10px 20px;border-left:3px solid transparent;color:var(--dim);font-size:14.5px}
  .stepl li.on{border-left-color:var(--accent);background:rgba(255,255,255,.05);color:#fff}
  .stepl li.done{color:#CFCFEA}
  .stepl li .sn{color:var(--accent);font-family:var(--mono);font-weight:700;margin-right:8px}
  .stepl li .xp{font-family:var(--mono);font-weight:600;color:#fff;display:block;font-size:15px;margin-bottom:3px}
  .stepl li b{color:#fff}
  mark{background:rgba(255,107,53,.38);color:#fff;border-radius:4px;padding:0 2px}
  mark.res{background:rgba(94,234,212,.28)}
  .ansrow{display:flex;gap:12px;padding:0 20px;flex-wrap:wrap}
  .ansrow > div{flex:1 1 120px}
  .ansrow label.fld{margin:14px 0 7px}
  .prob{font-size:15.5px;color:#E7E9FA}
  .prob b{color:#fff}
  .xm{font-family:var(--mono);font-weight:600;color:#fff;white-space:nowrap}
  .hint{font-size:13px;color:var(--dim);margin-top:7px}
  .rowbtn{display:flex;gap:10px;flex-wrap:wrap;padding:12px 20px 4px}
  .mini{font-family:var(--ui);font-size:13.5px;font-weight:600;border:1px solid var(--edge);background:rgba(255,255,255,.06);
    color:var(--text);padding:8px 13px;border-radius:100px;cursor:pointer}
  .mini:hover{background:rgba(255,255,255,.13)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
  .kv dt{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding-top:2px}
  .kv dd{margin:0;color:#E7E9FA}
  @media (max-width:560px){
    .choices{grid-template-columns:1fr}
    .masthead .eyebrow{margin-left:0;text-align:left}
    .rng input{width:84px}
    .bar{padding:13px 14px}
    .pad{padding:14px 16px}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1 class="mark">Expressions Lab</h1>
    <div class="eyebrow">Algebra 1 · Unit 1 · Foundations &amp; Expressions</div>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Lessons"></nav>
  <div class="stage">
    <section class="board" role="tabpanel">
      <div class="board-head">
        <h2 id="bTitle">—</h2>
        <span class="lsn" id="bLesson"></span>
      </div>
      <svg class="canvas" id="cv" viewBox="0 0 700 460" role="img" aria-label="Expressions figure"></svg>
      <div class="bar" id="bar"></div>
    </section>
    <aside id="side"></aside>
  </div>
  <footer class="foot">Every step is computed live from the expression you type or build — change it and the work follows. Vocabulary follows Common Core / Eureka Math (EngageNY) Algebra I.
    <div class="links"><a href="/algebra/">← Algebra courses</a><a href="/math/#algebra">Mrs. Ali's Classroom</a></div>
  </footer>
</div>

<script>
(function(){

/* ══════════════════════ helpers ══════════════════════ */

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const rnz=(a,b)=>{let v;do{v=rnd(a,b);}while(v===0);return v;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a||1;};

}
const SUPD="⁰¹²³⁴⁵⁶⁷⁸⁹";
const supStr=s=>String(s).replace(/[0-9]/g,c=>SUPD[+c]).replace(/[-−]/g,"⁻");
const par=v=>v<0?"("+minus(v)+")":minus(v);
let FS=1, cur=0;

}

  w.forEach(x=>{ if((line+" "+x).trim().length>maxChars&&line){out.push(line);line=x;} else line=(line+" "+x).trim(); }); if(line)out.push(line); return out; }

/* ══════════════════════ exact rational arithmetic ══════════════════════ */
function R(n,d){ if(d===undefined)d=1; if(d===0)throw "Division by zero is undefined.";

  if(Math.abs(n)>1e15||d>1e15) throw "The numbers got too big for this tool."; return {n,d}; }
const rAdd=(a,b)=>R(a.n*b.d+b.n*a.d,a.d*b.d), rSub=(a,b)=>R(a.n*b.d-b.n*a.d,a.d*b.d),
      rMul=(a,b)=>R(a.n*b.n,a.d*b.d), rNeg=a=>R(-a.n,a.d);
function rDiv(a,b){ if(b.n===0)throw "Division by zero is undefined — you can’t divide by 0."; return R(a.n*b.d,a.d*b.n); }
function rPow(a,b){
  if(b.d!==1)throw "This tool only handles whole-number exponents.";
  let e=b.n; if(Math.abs(e)>12)throw "That exponent is too big for this tool.";
  if(e===0&&a.n===0)throw "0⁰ is undefined.";

function rStr(v,dec){ if(dec&&v.d!==1){ return minus(String(+(v.n/v.d).toFixed(4))); } return v.d===1? minus(String(v.n)) : minus(v.n+"/"+v.d); }

/* ══════════════════════ expression parser (AST) ══════════════════════ */
const T0={"+":1,"-":1,"*":2,"/":2},   // correct order of operations
      TM1={"+":2,"-":2,"*":1,"/":1},  // mistake: + − before × ÷
      TM2={"-":1,"+":2,"/":3,"*":4};  // mistake: "PEMDAS" read literally — × before ÷, + before −
let NID=1;

      else boxRect(g,b,"none","#B6C2DA","5 4"); }
    drawToks(g,st.T,xs,y,fs);
    if(!st.step&&i===k&&opt.final)opt.final(g,xs+Ly.W,y,fs);

const TL=76, TU=22, TRAYW=178;

const TDIM={x2:[TL,TL],x:[TL,TU],"1":[TU,TU]};
const TCOL={x2:["#60A5FA","#1D4ED8"],x:["#34D399","#047857"],"1":["#FCD34D","#B45309"]}, NCOL=["#F87171","#B91C1C"];

let TID=1;
const P2={tiles:[],target:null,showSimp:true,flash:[],msg:""};
let raf=0;
function animStart(){ if(REDUCED){ while(animTick()){} if(cur===1)update(); return; } if(!raf)raf=requestAnimationFrame(animStep); }
function animTick(){
  let busy=false;
  P2.tiles.forEach(t=>{
    if(t.tx!=null){ const dx=t.tx-t.x, dy=t.ty-t.y; if(Math.hypot(dx,dy)<0.8||REDUCED){t.x=t.tx;t.y=t.ty;t.tx=t.ty=null;} else {t.x+=dx*.2;t.y+=dy*.2;busy=true;} }
    else if(t.dying!=null){ t.dying-=REDUCED?1:0.06; if(t.dying>0)busy=true; }
  });
  const gone=P2.tiles.filter(t=>t.dying!=null&&t.dying<=0);
  if(gone.length){ gone.forEach(t=>{ if(t.sgn>0)P2.flash.push({x:t.x+TDIM[t.type][0]/2,y:t.y+TDIM[t.type][1]/2,a:1}); }); P2.tiles=P2.tiles.filter(t=>!(t.dying!=null&&t.dying<=0)); }
  P2.flash.forEach(f=>{f.a-=REDUCED?1:0.035;}); P2.flash=P2.flash.filter(f=>f.a>0); if(P2.flash.length)busy=true;
  return busy;
}
function animStep(){ raf=0; const busy=animTick(); if(cur===1&&!dragId)update(); if(busy)animStart(); }
const live=()=>P2.tiles.filter(t=>t.dying==null);
function counts(){ const c={x2:[0,0],x:[0,0],"1":[0,0]}; live().forEach(t=>c[t.type][t.sgn>0?0:1]++); return c; }
function overlap(a,b){ const [aw,ah]=TDIM[a.type],[bw,bh]=TDIM[b.type];
  const ix=Math.max(0,Math.min(a.x+aw,b.x+bw)-Math.max(a.x,b.x)), iy=Math.max(0,Math.min(a.y+ah,b.y+bh)-Math.max(a.y,b.y));
  return ix*iy/Math.min(aw*ah,bw*bh); }
function pairUp(a,b){ const mx=(a.x+b.x)/2, my=(a.y+b.y)/2; a.dying=b.dying=1; a.tx=b.tx=mx; a.ty=b.ty=my; }
function removePairs(){
  let n=0; ["x2","x","1"].forEach(tp=>{ const P=live().filter(t=>t.type===tp&&t.sgn>0), N=live().filter(t=>t.type===tp&&t.sgn<0);
    for(let i=0;i<Math.min(P.length,N.length);i++){ pairUp(P[i],N[i]); n++; } });
  P2.msg=n?`Removed ${n} zero pair${n>1?"s":""}: each positive tile and its matching negative tile add to 0.`:"No zero pairs to remove — no type has both a positive and a negative tile.";
  animStart();
}
function layoutFlow(groups,startY){ // groups: [[tile,...],...] each laid out left to right with gaps; returns positions
  let x=MAT.x+12, y=startY, rowH=0;
  groups.forEach(gr=>{ if(!gr.length)return; gr.forEach(t=>{ const [w,h]=TDIM[t.type];
      if(x+w>MAT.x+MAT.w-8){ x=MAT.x+12; y+=rowH+8; rowH=0; }
      t.tx=x; t.ty=y; x+=w+(t.type==="1"?6:8); rowH=Math.max(rowH,h); });
    x+=26; });
  return y+rowH;
}
function combine(){
  let y=MAT.y+14;
  ["x2","x","1"].forEach(tp=>{ const P=live().filter(t=>t.type===tp&&t.sgn>0), N=live().filter(t=>t.type===tp&&t.sgn<0);
    if(!P.length&&!N.length)return; y=layoutFlow([P,N],y)+16; });
  P2.tiles=live().sort((a,b)=>"x2x1".indexOf(a.type)-"x2x1".indexOf(b.type)||b.sgn-a.sgn).concat(P2.tiles.filter(t=>t.dying!=null));

function addTiles(type,sgn,n,arr){ for(let i=0;i<n;i++){ const t={id:TID++,type,sgn,x:MAT.x+MAT.w/2,y:MAT.y+MAT.h/2}; P2.tiles.push(t); if(arr)arr.push(t);} }
function randomExpr2(){

      <div class="panel"><h3>Reading the words</h3><div class="pad">
      <p>Translate one piece at a time, and watch for words that <b>reverse the order</b>: “5 less than x” is <b>x − 5</b>, and “5 subtracted from x” is also <b>x − 5</b>.</p>
      <p>“The difference of a and b” and “the quotient of a and b” keep the order as written: a − b and a ÷ b.</p>
      <p>Words like <b>times the sum</b> or <b>square of the sum</b> act on a whole quantity, so they need parentheses.</p>
      <div class="eq">5 less than twice a number  →  2n − 5<small>Check by testing a number: if n = 10, twice it is 20, and 5 less is 15. 2(10) − 5 = 15 ✓</small></div></div></div>`+
      tryPanel(`<p>1. Write a phrase of your own whose expression is <b>3(n − 4)</b>, and another for <b>3n − 4</b>.</p><p>2. Explain to a partner why “7 less than n” and “7 − n” are different. Test with n = 10.</p>`);
    side.innerHTML=h;
    const right=()=>{ if(P5.state==="open"){ P5.streak++; P5.best=Math.max(P5.best,P5.streak); } P5.state="right"; };
    const wrong=()=>{ if(P5.state==="open")P5.streak=0; if(P5.state!=="right")P5.state="tried"; };
    side.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
      if(P5.state==="right"||P5.state==="shown")return;
      const c=it.choices[+b.dataset.i]; P5.picked=+b.dataset.i;
      if(c.ok){ right(); P5.msg=`<div class="verdict good"><b>Correct!</b> ${exprHTML(c.r)} matches “${esc(it.p)}”. Press <b>New phrase</b> for another.</div>`; }
      else { wrong(); P5.msg=`<div class="verdict bad"><b>Not quite.</b> ${esc(c.w||"")} Try another choice.</div>`; P5.picked=+b.dataset.i; }
      render(); });
    const typed=()=>{
      if(P5.state==="right"||P5.state==="shown")return;
      const v=$("w5").value; let r;
      try{ r=parse(v).root; }catch(e){ $("fb5").innerHTML=`<div class="verdict bad"><b>Can’t read that.</b> ${e}</div>`; return; }
      const vs=[...varsOf(r)]; if(vs.length>1){ $("fb5").innerHTML=`<div class="verdict bad">Use just one letter for the number (n).</div>`; return; }
      if(equiv(r,it.A,true)){ right(); P5.msg=`<div class="verdict good"><b>Correct!</b> ${exprHTML(r)} is equivalent to ${exprHTML(it.A)}.</div>`; P5.picked=it.choices.findIndex(c=>c.ok); render(); return; }
      wrong(); const tr=it.choices.find(c=>!c.ok&&equiv(c.r,r,true));
      P5.msg=`<div class="verdict bad"><b>Not quite.</b> ${tr?esc(tr.w):"Test your expression with a number, like n = 10, and compare it with the words."}</div>`; $("fb5").innerHTML=P5.msg; M5.sp.textContent="Streak "+P5.streak+" · Best "+P5.best;
    };
    $("c5").onclick=typed; $("w5").addEventListener("keydown",e=>{ if(e.key==="Enter")typed(); });
    $("s5").onclick=()=>{ if(P5.state!=="right"){ P5.streak=0; P5.state="shown"; P5.picked=it.choices.findIndex(c=>c.ok);
      P5.msg=`<div class="verdict info"><b>Answer:</b> ${exprHTML(it.A)}. Read the key words on the board, then try a new phrase.</div>`; render(); } };
  }
};

/* ══════════════════════ TAB 6 · challenge ══════════════════════ */
const KINDS6=[["mix","Mix"],["ooo","Order of operations"],["simp","Combine like terms"],["dist","Distribute"],["eval","Evaluate"],["words","Words → expression"]];
function genOOO(){
  const a=rnd(2,9), b=rnd(2,9), c=rnd(2,9), d=rnd(2,6), e=rnd(2,5);
  const s=rnd(2,5), dv=pick([1,s,s*s].filter(v=>v>1)), q=rnd(2,4);
  return pick([`${a+3} + ${b} × ${c}`,`(${a} + ${b}) × ${c} − ${d}`,`${a} × ${b} − ${c*d} ÷ ${d}`,`${a*3} − ${e}² + ${c}`,`${d*e*q} ÷ ${d} × ${q}`,
    `${a} × [${b} + (${c+d} − ${d+1})]`,`${a} + ${b}(${d+e} − ${d})²`,`−${e}² + ${b*3}`,`${a+10} − ${b} + ${c}`,`(${s+b} − ${b})² ÷ ${dv}`,`${q*q*a} ÷ ${q}² × ${e}`,`${a}² − 2(${b} + ${c})`]);
}
function simpTerms(){ let t; for(;;){ t=[]; const n=rnd(4,6); for(let i=0;i<n;i++)t.push([pick(["x2","x","x","1","1"]),rnz(-7,7)]);
  const ty=["x2","x","1"].filter(k=>t.filter(q=>q[0]===k).length>=2); if(ty.length>=1&&new Set(t.map(q=>q[0])).size>=2)return t; } }
function termsStr(t){ return t.map(([tp,c],i)=>{ const a=Math.abs(c), v=tp==="x2"?"x²":(tp==="x"?"x":""), body=(a===1&&v?"":a)+v; return i===0?(c<0?"−":"")+body:(c<0?" − ":" + ")+body; }).join(""); }
function genProblem(kind){
  if(kind==="mix")kind=pick(["ooo","simp","dist","eval","words"]);
  const pr={kind};
  if(kind==="ooo"){
    let src,S,v; do{ src=genOOO(); const p=parse(src); S=runSeq(p.root,T0,false,"ok"); v=seqValue(S); }while(!v||v.d!==1||Math.abs(v.n)>500);
    pr.src=src; pr.S=S; pr.ans=v.n/v.d;
    const alt=t=>{ try{ const p=parse(src,t); const r=seqValue(runSeq(p.root,t,false,"ok")); return r?r.n/r.d:NaN; }catch(_){return NaN;} };
    pr.m1=alt(TM1); pr.m2=alt(TM2);
    pr.q=`Evaluate using the order of operations: <span class="xm">${srcHTML(src)}</span>`; pr.ph="e.g. 17"; pr.fmt="Type a number (fractions like 7/2 are fine).";
  }
  if(kind==="simp"){
    const t=simpTerms(); pr.src=termsStr(t); pr.root=parse(pr.src).root;
    pr.c=[0,0,0]; t.forEach(([tp,c])=>pr.c[tp==="x2"?2:(tp==="x"?1:0)]+=c);
    pr.q=`Simplify by combining like terms: <span class="xm">${esc(pr.src)}</span>`; pr.ph="e.g. 2x^2 − 3x + 4"; pr.fmt="Type an expression in x. Use ^ for exponents (x^2). Any order of terms is fine.";
  }
  if(kind==="dist"){
    const a=rnz(-6,6), b=rnd(1,5), c=rnz(-9,9), d=rnz(-6,6);
    const inner=`${b===1?"":b}x ${c<0?"−":"+"} ${Math.abs(c)}`;
    const form=pick(["a","a","ad","ac","neg","x"]);
    const A=a===1?"":(a===-1?"−":minus(a));
    if(form==="a"){ pr.src=`${A}(${inner})`; pr.c=[a*c,a*b,0]; }
    if(form==="ad"){ pr.src=`${A}(${inner}) ${d<0?"−":"+"} ${Math.abs(d)===1?"":Math.abs(d)}x`; pr.c=[a*c,a*b+d,0]; }
    if(form==="ac"){ pr.src=`${A}(${inner}) ${d<0?"−":"+"} ${Math.abs(d)}`; pr.c=[a*c+d,a*b,0]; }
    if(form==="neg"){ pr.src=`−(${inner})`; pr.c=[-c,-b,0]; }
    if(form==="x"){ pr.src=`x(${inner})`; pr.c=[0,c,b]; }
    pr.root=parse(pr.src).root; pr.a=form==="neg"?-1:(form==="x"?null:a); pr.b=b; pr.cc=c; pr.form=form;
    pr.q=`Use the distributive property to expand and simplify: <span class="xm">${srcHTML(pr.src)}</span>`; pr.ph="e.g. 6x − 15"; pr.fmt="Type an expression in x with no parentheses, like terms combined.";
  }
  if(kind==="eval"){
    const a=rnd(2,6), b=rnd(2,7), c=rnd(1,9);
    pr.src=pick([`${a}x^2 − ${b}y`,`${a}(x + ${b}) − y`,`x^2 + ${a}xy − ${b}`,`(x − y)^2 + ${a}`,`${a}x − ${b}y + ${c}`,`−x^2 + ${a}y`,`${a}y − x^2 + ${c}`,`(x + ${a})(y − ${b})`]);
    pr.x=rnz(-5,5); pr.y=rnz(-5,5); pr.root=parse(pr.src).root;
    pr.S=runSeq(normalize(subst(pr.root,{x:R(pr.x),y:R(pr.y)})),T0,false,"ok"); const v=seqValue(pr.S); pr.ans=v.n/v.d;
    pr.q=`Evaluate <span class="xm">${srcHTML(pr.src)}</span> for <b>x = ${minus(pr.x)}</b> and <b>y = ${minus(pr.y)}</b>.`; pr.ph="e.g. −14"; pr.fmt="Type a number.";
  }
  if(kind==="words"){
    const it=makeItem(Math.random()<.4); pr.it=it; pr.A=it.A;
    pr.q=`Write an algebraic expression for: <b>${esc(it.p)}</b> (use n for the number).`; pr.ph="e.g. 2n − 5"; pr.fmt="Type an expression using n. Any equivalent expression is accepted.";
  }
  return pr;
}
function polyAns(pr){ return polyStr(pr.c); }
function solHTML(pr){
  if(pr.kind==="ooo"||pr.kind==="eval")return ladderHTML(pr.S,null,false);
  if(pr.kind==="simp"){ const T=termsOf(pr.root); const grp=k=>T.filter(t=>monoKey(t.n)===k).map(t=>(t.sign<0?"−":"+")+" "+exprHTML(t.n)).join(" ").replace(/^\+ /,"");
    return `<div class="pad"><div class="eq">x² terms:  ${grp("x2")||"none"}  →  ${esc(polyStr([0,0,pr.c[2]]))}
x terms:   ${grp("x1")||"none"}  →  ${esc(polyStr([0,pr.c[1]]))}
constants: ${grp("")||"none"}  →  ${esc(polyStr([pr.c[0]]))}

Simplified:  ${esc(polyAns(pr))}<small>Add the coefficients of like terms; the variable part stays the same.</small></div></div>`; }
  if(pr.kind==="dist"){ const out=pr.form==="x"?"x":minus(pr.a);
    return `<div class="pad"><div class="eq">${srcHTML(pr.src)}
= ${esc(out)}·${esc(pr.b===1?"x":pr.b+"x")} + ${esc(out)}·${esc(par(pr.cc))}${pr.form==="ad"||pr.form==="ac"?" + …":""}
= ${esc(polyAns(pr))}<small>Multiply the outside factor by <b>every</b> term inside the parentheses, watch the signs, then combine like terms.</small></div></div>`; }
  if(pr.kind==="words"){ const tr=pr.it; return `<div class="pad"><div class="eq">${exprHTML(tr.A)}<small>${tr.kw.map(([k,m])=>"“"+k+"” → "+m).join(" · ")}</small></div></div>`; }
}
function hint6(pr,r,val){
  if(pr.kind==="ooo"){
    if(Math.abs(val-pr.m1)<1e-9&&pr.m1!==pr.ans)return "It looks like you added or subtracted before multiplying or dividing. × and ÷ come first.";
    if(Math.abs(val-pr.m2)<1e-9&&pr.m2!==pr.ans)return "It looks like you multiplied before dividing (or added before subtracting). Those pairs are ties — go left to right.";
    return "Work one operation at a time: grouping symbols, then exponents, then × ÷ left to right, then + − left to right.";
  }
  if(pr.kind==="eval")return "Substitute each value in parentheses, e.g. x = −3 gives (−3)² = 9. Then follow the order of operations.";
  if(pr.kind==="simp"||pr.kind==="dist"){
    const c=quadCoefs(t=>evalF(r,{x:t})); if(!c)return "Your expression doesn’t have the right form — the answer should be a polynomial in x of degree 2 or less.";
    const bad=[]; if(c[2]!==pr.c[2])bad.push("x² term"); if(c[1]!==pr.c[1])bad.push("x term"); if(c[0]!==pr.c[0])bad.push("constant term");
    let extra="";
    if(pr.kind==="dist"&&pr.form==="a"){ if(c[1]===pr.a*pr.b&&c[0]===pr.cc)extra=" Remember to multiply the outside factor by the second term too."; else if(c[1]===pr.c[1]&&c[0]===-pr.c[0])extra=" Check the sign of the constant term: a negative times a negative is positive."; }
    return "Check your "+bad.join(" and ")+"."+extra;
  }
  if(pr.kind==="words"){ const tr=pr.it.choices.find(c=>!c.ok&&equiv(c.r,r,true)); return tr?tr.w:"Test your expression with n = 10 and compare it with the words."; }
}
const P6={kind:"mix",pr:null,streak:0,best:0,solved:0,tries:0,state:"open",reveal:false};
const M6={
  tab:"Challenge", lesson:"A-SSE.A.1–2 · A-CED.A.1", accent:"var(--coral)",
  title:()=>"Practice: "+({ooo:"order of operations",simp:"combine like terms",dist:"distributive property",eval:"evaluate an expression",words:"words to an expression"}[P6.pr?P6.pr.kind:"ooo"]),
  newProb(){ P6.pr=genProblem(P6.kind); P6.state="open"; P6.reveal=false; P6.tries=0; },
  bar(){

    selectBox(KINDS6,P6.kind,v=>{P6.kind=v;M6.newProb();render();},"Problem type");
    M6.sp=spacer(""); M6.up();
  },
  up(){ if(M6.sp)M6.sp.textContent="Streak "+P6.streak+" · Best "+P6.best+" · Solved "+P6.solved; },
  draw(){
    if(!P6.pr)M6.newProb();
    const g=E("g",{}); cv.appendChild(g); const pr=P6.pr, show=P6.state==="right"||P6.reveal;
    const lab={ooo:"EVALUATE",simp:"SIMPLIFY",dist:"EXPAND (DISTRIBUTE)",eval:"EVALUATE FOR x = "+minus(pr.x)+", y = "+minus(pr.y),words:"WRITE AN EXPRESSION"}[pr.kind];
    stext(g,[30,28],lab,"lab","#BE123C","start");
    if(pr.kind==="words"){
      const words=phraseSegs(pr.it.p.charAt(0).toUpperCase()+pr.it.p.slice(1),[]);
      wtext(g,30,90,words.map(w=>w.w).join(" "),FS>1?28:40,40,"cap","#14213D","start",FS>1?30:28);
      if(show){ stext(g,[30,300],"ANSWER","lab","#047857","start"); drawToks(g,toks(pr.A).T,30,350,34); }
      return;
    }
    if((pr.kind==="ooo"||pr.kind==="eval")){
      if(show){ drawLadder(g,pr.S,pr.S.length-1,44,450,{fsMax:26,final:(gg,x,y,fs)=>stext(gg,[Math.min(x+16,660),y-fs*.3],"✓","ex","#059669","start",fs)}); }
      else { const T=pr.kind==="eval"?toks(pr.root).T:pr.S[0].T, Ly=layToks(T,1), fs=clamp(600/Ly.W,18,46); drawToks(g,T,350-Ly.W*fs/2,200,fs);
        if(pr.kind==="eval")stext(g,[350,280],"x = "+minus(pr.x)+"     y = "+minus(pr.y),"ex","#7C3AED","middle",26); }
      return;
    }
    const T=toks(pr.root).T, Ly=layToks(T,1), fs=clamp(600/Ly.W,18,42);
    drawToks(g,T,350-Ly.W*fs/2,show?120:200,fs);
    if(show){ stext(g,[350,220],"=","ex","#5B6B8C","middle",30); const A=parse(polyAns(pr)).root, T2=toks(A).T, L2=layToks(T2,1), f2=clamp(560/L2.W,18,40);
      drawToks(g,T2,350-L2.W*f2/2,300,f2); stext(g,[350,370],"✓ simplified","capb","#047857","middle",16); }
  },
  panel(full){
    const pr=P6.pr;
    if(!full&&$("chk6"))return;
    side.innerHTML=`<div class="panel"><h3>Problem</h3><div class="pad"><p class="prob" id="prob6" data-kind="${pr.kind}" data-src="${esc(pr.src||"")}" data-x="${pr.x!=null?pr.x:""}" data-y="${pr.y!=null?pr.y:""}" data-ans="${esc(pr.kind==="words"?pr.it.ans:(pr.ans!=null?String(pr.ans):polyAns(pr)))}">${pr.q}</p></div>
      <div class="ansrow"><div><label class="fld" for="ans6">Your answer</label><input type="text" id="ans6" autocomplete="off" spellcheck="false" placeholder="${esc(pr.ph)}"><div class="hint">${pr.fmt}</div></div></div>
      <div class="fldwrap" style="margin:16px 0 4px;display:flex;gap:10px;flex-wrap:wrap">
        <button id="chk6" class="go" type="button" style="flex:1 1 140px">Check answer</button>
        <button id="sol6" class="ghost" type="button">Show solution</button></div>
      <div id="fb6"></div><div style="height:4px"></div></div>
      <div class="panel"><h3>How answers are checked</h3><div class="pad">
      <p>Numbers can be integers, decimals or fractions like <b>−7/2</b>. Expressions can be typed with ^ for exponents: <b>3x^2 − x + 4</b>.</p>
      <p>Expressions are checked by <b>evaluating both at several random values</b> of x — so any equivalent form (any order of terms) counts. For “simplify” and “distribute”, your answer must also have no parentheses and no like terms left to combine.</p>
      <p>A first-try correct answer grows your streak. A wrong answer resets it and gives a hint.</p></div></div>`;
    const inp=$("ans6"), fb=$("fb6");
    const showSol=good=>{ fb.innerHTML=(good||"")+solHTML(pr); };
    const check=()=>{
      if(P6.state==="right")return;
      let r; try{ r=parse(inp.value).root; }catch(e){ fb.innerHTML=`<div class="verdict bad"><b>I can’t read that.</b> ${e}</div>`; return; }
      let ok=false, val=NaN, msg="";
      if(pr.kind==="ooo"||pr.kind==="eval"){
        if(varsOf(r).size){ fb.innerHTML=`<div class="verdict bad">Type a single number — no variables.</div>`; return; }
        val=evalF(r,{}); ok=Math.abs(val-pr.ans)<1e-9||(Math.abs(val-pr.ans)<0.006&&String(inp.value).includes("."));
      } else if(pr.kind==="simp"||pr.kind==="dist"){
        const vs=[...varsOf(r)]; if(vs.some(v=>v!=="x")){ fb.innerHTML=`<div class="verdict bad">Use the variable x only.</div>`; return; }
        const target=parse(polyAns(pr)).root;
        if(equiv(r,target,false)){ const si=isSimplified(r); if(si.ok)ok=true; else msg=`<div class="verdict info"><b>Equivalent — but not finished.</b> ${si.why}</div>`; }
      } else {
        if(varsOf(r).size>1){ fb.innerHTML=`<div class="verdict bad">Use one letter (n) for the number.</div>`; return; }
        ok=equiv(r,pr.A,true);
      }
      if(ok){
        if(P6.tries===0&&!P6.reveal){ P6.streak++; P6.best=Math.max(P6.best,P6.streak); }
        P6.state="right"; P6.solved++; M6.up(); clear(); M6.draw();
        showSol(`<div class="verdict good"><b>Correct!</b> ${P6.tries||P6.reveal?"Got there — the streak counts first-try answers only.":"Streak "+P6.streak+"."} Compare with the worked solution, then press <b>New problem</b>.</div>`);
        inp.disabled=true;

      else { P6.tries++; P6.streak=0; M6.up(); fb.innerHTML=`<div class="verdict bad"><b>Not quite.</b> ${esc(hint6(pr,r,val))}</div>`; }
    };
    $("chk6").onclick=check; inp.addEventListener("keydown",e=>{ if(e.key==="Enter")check(); });

  }
};
