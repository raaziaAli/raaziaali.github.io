<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sequences &amp; Series Lab — Algebra 2 Unit 7</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A0A1F'/%3E%3Cpath d='M10 50L54 14' stroke='%2300E5FF' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='10' cy='50' r='6' fill='%23FF3D8A'/%3E%3Ccircle cx='54' cy='14' r='6' fill='%23FFD93D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A1F; --bg-lift:#13132B; --card:#1C1C3A; --card-2:#242449;
    --cyan:#00E5FF; --magenta:#FF3D8A; --yellow:#FFD93D; --lavender:#C4B5FD;
    --coral:#FF6B6B; --mint:#5EEAD4;
    --accent:var(--cyan);
    --text:#F8F9FF; --dim:#A5A5C9; --edge:rgba(196,181,253,.20);

    --board:#FFFFFF; --grid:#DCE6F7;
    --ink:#14213D; --graphite:#22314F;
    --vert:#7C3AED; --lin:#EA580C; --corr:#0284C7; --alt:#059669;
    --altx:#DB2777; --same:#DC2626; --samex:#0891B2;
    --unk:#E11D48; --hand:#FF6B35;

    --display:"Unbounded","Trebuchet MS",system-ui,sans-serif;
    --ui:"DM Sans",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);font-family:var(--ui);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;position:relative;min-height:100vh;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse at 12% 8%,rgba(0,229,255,.13),transparent 55%),
               radial-gradient(ellipse at 88% 22%,rgba(255,61,138,.12),transparent 55%),
               radial-gradient(ellipse at 50% 105%,rgba(196,181,253,.10),transparent 60%);}
  .wrap{max-width:1220px;margin:0 auto;padding:26px 20px 70px;position:relative;z-index:1}

  header.masthead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .mark{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.6vw,38px);margin:0;letter-spacing:-.01em;
    background:linear-gradient(92deg,var(--cyan),var(--lavender) 55%,var(--magenta));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .eyebrow{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .masthead .eyebrow{margin-left:auto;text-align:right;
    border:1px solid var(--edge);border-radius:100px;padding:7px 15px;background:rgba(255,255,255,.03)}

  nav.tabs{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:20px}
  nav.tabs button{
    font-family:var(--ui);font-size:15px;font-weight:500;
    background:var(--card);color:var(--dim);border:1px solid var(--edge);border-radius:100px;
    padding:11px 19px;cursor:pointer;transition:transform .16s,color .16s,box-shadow .16s,background .16s;
  }
  nav.tabs button:hover{color:#fff;transform:translateY(-2px);background:var(--card-2)}
  nav.tabs button[aria-selected="true"]{
    color:#0A0A1F;background:var(--accent);border-color:var(--accent);font-weight:700;
    box-shadow:0 0 26px -4px var(--accent);
  }
  nav.tabs button .n{font-family:var(--mono);font-size:12px;font-weight:700;opacity:.6;margin-right:9px}
  nav.tabs button:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

  .stage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(330px,1fr);gap:22px;align-items:start}
  @media (max-width:960px){.stage{grid-template-columns:1fr}}

  .board{background:var(--card);border:1px solid var(--edge);border-radius:20px;overflow:hidden;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.8)}
  .board-head{display:flex;align-items:center;gap:12px;padding:16px 20px;flex-wrap:wrap;
    background:linear-gradient(90deg,var(--card-2),var(--card));border-bottom:1px solid var(--edge)}
  .board-head h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0;color:#fff;line-height:1.3}
  .board-head .lsn{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em;
    color:var(--accent);border:1px solid var(--accent);border-radius:100px;padding:5px 13px;white-space:nowrap}
  svg.canvas{display:block;width:100%;height:auto;background:linear-gradient(170deg,#FFFFFF 0%,#EEF4FF 100%);touch-action:none}

  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:15px 20px;background:var(--card-2);border-top:1px solid var(--edge)}
  .bar button,.seg button{font-family:var(--ui);font-size:14.5px;font-weight:600;border:1px solid var(--edge);
    background:rgba(255,255,255,.06);color:var(--text);padding:10px 17px;border-radius:100px;cursor:pointer;transition:.16s}
  .bar button:hover,.seg button:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
  .bar button.primary{background:var(--accent);color:#0A0A1F;border-color:var(--accent);box-shadow:0 0 22px -6px var(--accent)}
  .seg{display:inline-flex;gap:6px}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#0A0A1F;border-color:var(--accent);font-weight:700}
  .bar label.chk{display:inline-flex;align-items:center;gap:9px;font-size:14.5px;color:var(--text);cursor:pointer;
    background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:100px;padding:9px 16px}
  .bar label.chk:hover{background:rgba(255,255,255,.1)}
  .bar label.chk input{accent-color:var(--accent);width:17px;height:17px}
  .bar .spacer{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--dim)}
  .bar select{width:auto;max-width:340px}
  .chiprow{display:flex;flex-wrap:wrap;gap:7px;width:100%;margin-bottom:2px}
  .chiprow button{font-family:var(--ui);font-size:13.5px;font-weight:600;cursor:pointer;
    padding:8px 14px;border-radius:100px;background:rgba(255,255,255,.05);
    border:1.5px solid var(--c);color:#E7E9FA;transition:.15s;display:flex;align-items:center;gap:8px}
  .chiprow button::before{content:"";width:10px;height:10px;border-radius:10px;background:var(--c)}
  .chiprow button:hover{background:rgba(255,255,255,.12)}
  .chiprow button[aria-pressed="true"]{background:var(--c);color:#0A0A1F;font-weight:700}
  .chiprow button[aria-pressed="true"]::before{background:rgba(10,10,31,.55)}
  .rel[data-pair]{cursor:pointer}
  .rel[data-pair]:hover{background:rgba(255,255,255,.05)}
  .rel.active{background:rgba(255,255,255,.09);box-shadow:inset 3px 0 0 var(--accent)}
  .note{margin:0 20px 16px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.55;
    background:rgba(255,217,61,.10);border:1px solid rgba(255,217,61,.35);color:#FBEFC9}
  .note b{color:#fff}

  .panel{border:1px solid var(--edge);border-radius:18px;background:var(--card);margin-bottom:16px;overflow:hidden}
  .panel h3{margin:0;padding:15px 20px;font-family:var(--display);font-weight:600;font-size:14px;
    letter-spacing:.01em;color:#fff;background:linear-gradient(90deg,var(--card-2),transparent);
    border-bottom:1px solid var(--edge)}
  .pad{padding:16px 20px;font-size:15px;color:#CFCFEA}
  .pad p{margin:0 0 11px} .pad p:last-child{margin-bottom:0}
  .pad b{color:#fff;font-weight:700}
  .term{font-weight:700;color:var(--accent)}

  .eq{font-family:var(--mono);font-size:14.5px;font-weight:600;color:#fff;background:rgba(0,0,0,.28);
    border:1px solid var(--edge);border-left:4px solid var(--accent);padding:13px 15px;margin:12px 0;
    border-radius:0 12px 12px 0;overflow-x:auto;white-space:pre-wrap;line-height:1.75}
  .eq small{display:block;font-family:var(--ui);font-size:13px;font-weight:400;color:var(--dim);margin-top:7px}

  .rel{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;
    padding:13px 20px;border-bottom:1px solid rgba(196,181,253,.12);font-size:15px}
  .rel:last-child{border-bottom:none}
  .rel .dot{width:13px;height:13px;border-radius:13px}
  .rel .nm{color:#fff;font-weight:500}
  .rel .nm em{font-style:normal;color:var(--dim);font-size:13px;display:block;font-weight:400}
  .rel .val{font-family:var(--mono);font-size:13.5px;font-weight:600;white-space:nowrap}
  .ok{color:var(--mint)} .no{color:var(--coral)}

  select,input[type=number],input[type=text]{
    font-family:var(--ui);font-size:15px;background:#0F0F26;color:#fff;
    border:1px solid var(--edge);border-radius:12px;padding:12px 13px;width:100%;}
  select:focus,input:focus{outline:3px solid var(--accent);outline-offset:1px}
  label.fld{display:block;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.1em;
    text-transform:uppercase;color:var(--accent);margin:16px 20px 7px}
  .fldwrap{padding:0 20px}
  .go{width:100%;font-family:var(--ui);font-size:16px;font-weight:700;background:var(--accent);color:#0A0A1F;
    border:none;padding:14px;border-radius:100px;cursor:pointer;box-shadow:0 0 26px -6px var(--accent);transition:.16s}
  .go:hover{transform:translateY(-2px)}
  .ghost{font-family:var(--ui);font-size:15px;font-weight:600;background:transparent;color:var(--dim);
    border:1px solid var(--edge);padding:14px 18px;border-radius:100px;cursor:pointer}
  .ghost:hover{color:#fff}
  .verdict{margin:16px 20px;padding:14px 16px;border-radius:14px;font-size:15px;line-height:1.6}
  .verdict.good{background:rgba(94,234,212,.13);border:1px solid rgba(94,234,212,.45);color:#D7FBF3}
  .verdict.bad{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.4);color:#FFDCDA}
  .verdict b{color:#fff}

  table.facts{width:100%;border-collapse:collapse;font-size:14.5px}
  table.facts td{padding:12px 20px;border-bottom:1px solid rgba(196,181,253,.11);vertical-align:top}
  table.facts .ab{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--accent);white-space:nowrap}
  table.facts .st{color:#DDDDF2}
  table.facts .st i{display:block;color:var(--dim);font-style:normal;font-size:13px;margin-top:4px}
  .cathead{padding-top:18px!important;padding-bottom:6px!important;font-family:var(--display);font-weight:600;
    font-size:13px;letter-spacing:.02em;color:var(--yellow);border-bottom:none!important}
  .chip{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.09em;
    text-transform:uppercase;padding:4px 10px;border-radius:100px;margin-right:9px}
  .chip.assume{background:rgba(255,217,61,.18);color:var(--yellow)}
  .chip.proved{background:rgba(94,234,212,.16);color:var(--mint)}
  ol.chain{margin:0;padding:6px 20px 18px 38px;font-size:15px;color:#CFCFEA}
  ol.chain li{padding:8px 0} ol.chain li::marker{color:var(--accent);font-weight:700}
  ol.chain li b{color:#fff}

  .steps{width:100%;border-collapse:collapse;font-size:15px}
  .steps td{padding:12px 20px;border-bottom:1px solid rgba(196,181,253,.11);vertical-align:middle}
  .steps .stmt{font-family:var(--mono);font-size:14px;font-weight:600;color:#fff;white-space:nowrap}
  .steps .why{width:56%}
  .steps tr.right .stmt{color:var(--mint)}
  .steps tr.right select{border-color:rgba(94,234,212,.6)}
  .steps tr.wrong select{border-color:var(--coral)}

  /* ── drawing ── */
  .line{stroke:var(--graphite);stroke-width:2.8;fill:none;stroke-linecap:round}
  .thin{stroke:var(--graphite);stroke-width:1.8;fill:none}
  .aux{stroke:var(--corr);stroke-width:2.4;fill:none;stroke-dasharray:9 6}
  .wedge{stroke-width:2.4;fill-opacity:.17;cursor:pointer}
  .wedge.flat{cursor:default}
  .mk{font-family:var(--display);font-weight:600;font-size:20px;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
  .num{font-family:var(--mono);font-weight:700;font-size:16px;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}
  .dot{fill:var(--ink);stroke:#fff;stroke-width:2}
  .grab{fill:rgba(255,107,53,.20);stroke:var(--hand);stroke-width:2;stroke-dasharray:4 3;cursor:grab}
  .grab:hover{fill:rgba(255,107,53,.35)}
  .rt{stroke:var(--graphite);stroke-width:1.8;fill:none;opacity:.9}
  footer.foot{margin-top:30px;padding-top:18px;border-top:1px solid var(--edge);font-size:14px;color:var(--dim)}

  /* ── shared lab additions ── */
  body.embed header.masthead, body.embed footer.foot{display:none}
  body.embed .wrap{padding:10px}
  footer.foot a{color:var(--cyan);text-decoration:none;font-weight:600}
  footer.foot a:hover{text-decoration:underline}
  footer.foot .links{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}
  .bar button:focus-visible,.seg button:focus-visible,.chiprow button:focus-visible,.go:focus-visible,.ghost:focus-visible,.choice:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  .rng{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:14px;font-weight:600;color:var(--text);
    background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:100px;padding:7px 15px}
  .rng input{accent-color:var(--accent);width:110px}
  .rng output{min-width:16px;text-align:right;color:var(--accent)}
  svg.canvas{-webkit-user-select:none;user-select:none}
  svg.canvas text{pointer-events:none}
  @media (max-width:560px){ svg.canvas .sm{font-size:21px;stroke-width:5} svg.canvas .mk{font-size:27px} svg.canvas .num{font-size:22px} svg.canvas .ax{font-size:16px} }
  .sm{font-family:var(--mono);font-weight:600;font-size:13.5px;paint-order:stroke;stroke:#fff;stroke-width:4;stroke-linejoin:round}
  .ax{font-family:var(--mono);font-size:11px;fill:#7C8AAB}
  .leg{stroke-width:3;fill:none;stroke-dasharray:8 5;stroke-linecap:round}
  .tick{stroke:var(--graphite);stroke-width:2.2}
  .ghostdot{fill:#9AA8C7;stroke:#fff;stroke-width:2}
  .nt{position:relative;display:inline-block;padding-top:.42em;line-height:1.05;font-family:var(--mono);font-weight:700;color:#fff;white-space:nowrap}
  .nt::before{content:"";position:absolute;left:.06em;right:.06em;top:.2em;border-top:2px solid currentColor}
  .nt.ray::after,.nt.line::after{content:"";position:absolute;right:-.12em;top:calc(.2em - 3.5px);border-left:7px solid currentColor;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
  .nt.line .la{position:absolute;left:-.12em;top:calc(.2em - 3.5px);border-right:7px solid currentColor;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
  .uterms{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
  .uterms span{font-family:var(--mono);font-size:12px;font-weight:600;padding:5px 11px;border-radius:100px;
    border:1px solid var(--edge);color:var(--dim);opacity:.55}
  .uterms span.on{opacity:1;color:#0A0A1F;background:var(--accent);border-color:var(--accent)}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 20px}
  .choice{font-family:var(--ui);font-size:15px;font-weight:600;background:rgba(255,255,255,.06);color:var(--text);
    border:1px solid var(--edge);border-radius:14px;padding:13px 12px;cursor:pointer;text-align:left;line-height:1.5;transition:.15s}
  .choice:hover{background:rgba(255,255,255,.12)}
  .choice.right{border-color:var(--mint);background:rgba(94,234,212,.16)}
  .choice.wrong{border-color:var(--coral);background:rgba(255,107,107,.14)}
  .choice small{display:block;font-weight:400;color:var(--dim);font-size:12.5px}
  .stepl{list-style:none;margin:0;padding:6px 0}
  .stepl li{padding:10px 20px;border-left:3px solid transparent;color:var(--dim);font-size:14.5px}
  .stepl li.on{border-left-color:var(--accent);background:rgba(255,255,255,.05);color:#fff}
  .stepl li.done{color:#CFCFEA}
  .stepl li .sn{color:var(--accent);font-family:var(--mono);font-weight:700;margin-right:8px}
  .stepl li b{color:#fff}
  .ansrow{display:flex;gap:12px;padding:0 20px;flex-wrap:wrap}
  .ansrow > div{flex:1 1 120px}
  .ansrow label.fld{margin:14px 0 7px}
  .prob{font-size:15.5px;color:#E7E9FA}
  .prob b{color:#fff}
  @media (max-width:560px){
    .choices{grid-template-columns:1fr}
    .masthead .eyebrow{margin-left:0;text-align:left}
    .rng input{width:84px}
    .bar{padding:13px 14px}
    .pad{padding:14px 16px}
  }

  /* ── Sequences & Series Lab additions ── */
  .twin{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .twin .eq{margin:6px 0}
  .twin h4{margin:0;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
  @media (max-width:430px){.twin{grid-template-columns:1fr}}
  .stage>*{min-width:0}
  .seqt{overflow-x:auto;margin:10px 0 2px;max-width:100%}
  .seqt table{border-collapse:collapse;font-family:var(--mono);font-size:13px}
  .seqt th,.seqt td{padding:6px 9px;border:1px solid rgba(196,181,253,.16);text-align:center;white-space:nowrap}
  .seqt th{color:var(--accent);font-weight:700;background:rgba(255,255,255,.04)}
  .seqt td{color:#fff}
  .seqt td.hi{background:rgba(255,255,255,.12);box-shadow:inset 0 -3px 0 var(--accent)}
  .mini{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;padding:4px 20px 14px}
  .mini label{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
  .mini input{padding:9px 11px}
  .out{font-family:var(--mono);font-size:13.5px;color:#fff;white-space:pre-wrap;line-height:1.7;padding:0 20px 14px}
  .out .no{font-family:var(--ui)}
  details.q{border-top:1px solid rgba(196,181,253,.12);padding:12px 20px}
  details.q summary{cursor:pointer;color:#fff;font-weight:600;list-style-position:outside}
  details.q summary:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  details.q .eq{margin:10px 0 2px}
  .sigrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 20px 12px;font-family:var(--mono);font-size:14px;color:#fff}
  .sigrow input{width:70px;padding:9px 10px}
  .sigrow input.wide{width:150px;flex:1 1 150px}
  .dv{font-family:var(--mono);font-weight:700;font-size:17px;paint-order:stroke;stroke:#fff;stroke-width:4;stroke-linejoin:round}
  .dvn{font-family:var(--mono);font-weight:600;font-size:13px;fill:#5B6B8C}
  .big{font-family:var(--display);font-weight:600;font-size:22px;fill:var(--ink)}
  @media (max-width:560px){ svg.canvas .dv{font-size:22px} svg.canvas .dvn{font-size:18px} svg.canvas .big{font-size:28px} }
  details.q summary::marker{color:var(--accent)}
  .bar .rng input{width:120px}
  @media (max-width:560px){ .bar .rng input{width:92px} }
  .sig{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 5px 0 2px}
  .sig .S{font-size:1.85em;line-height:1}
  .sig small{font-size:.72em;color:var(--dim)}
  .xbtn{font-family:var(--ui);font-size:13.5px;font-weight:600;background:rgba(255,255,255,.06);color:var(--text);
    border:1px solid var(--edge);padding:8px 14px;border-radius:100px;cursor:pointer}
  .xbtn:hover{background:rgba(255,255,255,.13)}
  .xbtn:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 12px}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1 class="mark">Sequences &amp; Series Lab</h1>
    <div class="eyebrow">Algebra 2 · Unit 7 · Sequences &amp; Series</div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Lessons"></nav>
  <div class="stage">
    <section class="board" role="tabpanel">
      <div class="board-head">
        <h2 id="bTitle">—</h2>
        <span class="lsn" id="bLesson"></span>
      </div>
      <svg class="canvas" id="cv" viewBox="0 0 700 460" role="img" aria-label="Sequence graph"></svg>
      <div class="bar" id="bar"></div>

function geoKind(a1,r){
  if(r===1)return "constant — every term equals a₁";
  if(r===-1)return "alternating — the terms flip sign but keep the same size";
  if(r<0)return Math.abs(r)>1? "alternating and growing in size (|r| > 1)" : "alternating and shrinking toward 0 (|r| < 1)";
  return r>1? "growing — exponential growth (r > 1)" : "decaying toward 0 — exponential decay (0 < r < 1)";
}
function findTermNumber(a1,r,v){
  if(!isFinite(v))return `<span class="no">Type a number.</span>`;
  if(Math.abs(v)<1e-12)return `<span class="no">0 is never a term: a₁·rⁿ⁻¹ is never 0 when a₁ ≠ 0 and r ≠ 0.</span>`;
  const q=v/a1;
  let w=`${fm(a1)}·${par(r)}<sup>n−1</sup> = ${fm(v)}\n${par(r)}<sup>n−1</sup> = ${fm(v)} ÷ ${par(a1)} = ${fm(q)}\n`;
  if(Math.abs(r)===1){
    if(Math.abs(q-1)<1e-9)return w+(r===1?`Every term equals ${fm(v)}.`:`n − 1 is even, so every odd n: n = 1, 3, 5, …`);
    if(r===-1&&Math.abs(q+1)<1e-9)return w+`n − 1 is odd, so every even n: n = 2, 4, 6, …`;
    return w+`<span class="no">Not a term of this sequence.</span>`;
  }
  if(r>0&&q<=0)return w+`<span class="no">Not a term: with r &gt; 0, every term has the same sign as a₁.</span>`;
  const m=Math.log(Math.abs(q))/Math.log(Math.abs(r));
  w+=`n − 1 = log|${fm(q)}| ÷ log|${fm(r)}| ≈ ${dec(m,6)}\n`;
  const mi=Math.round(m);
  if(Math.abs(m-mi)>1e-6||mi<0)return w+`<span class="no">Not a whole number, so ${fm(v)} is not a term${mi>=0&&m>0?` (it falls between term ${Math.floor(m)+1} and term ${Math.floor(m)+2})`:""}.</span>`;
  if(Math.abs(a1*Math.pow(r,mi)-v)>1e-9*Math.max(1,Math.abs(v)))return w+`<span class="no">The size matches term ${mi+1}, but the sign doesn't (r &lt; 0 makes the signs alternate), so it is not a term.</span>`;
  return w+`n = ${mi} + 1 = <b>${mi+1}</b>  ✓  ${A(mi+1)} = ${fm(v)}`;
}

  }

  ["Subtract the shifted copy","Line up matching terms and compute S<sub>n</sub> − rS<sub>n</sub>"],

function annCalc(){
  const A=S4.ann, i=A.rate/100/12, n=A.yrs*12;
  if(A.type==="save"){ const P=A.P, bal=m=>i? P*(Math.pow(1+i,m)-1)/i : P*m; return {i,n,P,FV:bal(n),bal,dep:m=>P*m}; }

}

function classify(t){
  const d=t.slice(1).map((v,i)=>v-t[i]), arith=d.every(x=>Math.abs(x-d[0])<1e-9);

    for(let n=1;n<=6;n++){
      if(w==="sq")terms.push(n*n+c); if(w==="tri")terms.push(n*(n+1)/2); if(w==="quad")terms.push(2*n*n-n+c);
      if(w==="alt")terms.push(c+(Math.floor(n/2))*2+Math.floor((n-1)/2)*5);

}

  if(kind==="asum"){ const a1=rnd(-10,20), d=pick([-4,-3,-2,2,3,4,5,6,7]), n=rnd(10,40), an=a1+(n-1)*d;
    Object.assign(P,{a1,d,n,an,type:"a",terms:[0,1,2,3].map(i=>a1+i*d),ans:n*(a1+an)/2});
    P.q=Math.random()<.5? `Find the sum of the first <b>${n}</b> terms of the arithmetic series <b>${P.terms.map(v=>fm(v)).join(" + ")} + ⋯</b>` : `Find the sum <b>${P.terms.slice(0,3).map(v=>fm(v)).join(" + ")} + ⋯ + ${fm(an)}</b>`;
    P.showLast=P.q.indexOf("first")<0; }
  if(kind==="gsum"){ const {a1,r}=geoPick(), n=Math.abs(r)>=3?rnd(4,6):rnd(5,8);
    Object.assign(P,{a1,r,n,type:"g",terms:[0,1,2,3].map(i=>cl6(a1*Math.pow(r,i))),ans:gsum(a1,r,n)});
    P.q=`Find S<sub>${n}</sub>, the sum of the first <b>${n}</b> terms of the geometric series <b>${P.terms.map(v=>fm(v)).join(" + ")} + ⋯</b>`; }
  if(kind==="inf"){
    const div=Math.random()<.28;
    const o=div? pick([[2,1],[-2,1],[3,2],[-3,2],[5,4],[-1,1]]) : pick([[1,2],[1,3],[2,3],[1,4],[3,4],[-1,2],[-1,3],[2,5],[3,5],[-2,3]]);
    const r=o[0]/o[1], a1=pick([1,2,3,-1,2])*Math.pow(o[1],3);
    Object.assign(P,{a1,r,type:"g",div,terms:[0,1,2,3].map(i=>cl6(a1*Math.pow(r,i))),ans:div?NaN:a1/(1-r)});
    P.q=`Find the sum of the infinite geometric series <b>${P.terms.map(v=>fm(v)).join(" + ")} + ⋯</b>, or type <b>diverges</b> if it has no sum.`; P.allowDiv=true; }
  if(kind==="sigma"){
    const v=pick(["k","n","i"]);
    if(Math.random()<.55){ const m=pick([2,3,4,5,-2,-3,6]), b=rnd(-6,8), lo=pick([1,1,1,2,3,0]), hi=lo+rnd(5,18);
      P.ex=(m+v)+(b?(b>0?"+"+b:String(b)):""); P.ex=P.ex.replace(/^1(?=[a-z])/,""); Object.assign(P,{lo,hi,v,sub:"a"}); }
    else { const c=pick([1,2,3,5,-2]), r=pick([2,3,-2]), hi=Math.abs(r)===3?rnd(4,5):rnd(5,7);
      P.ex=(c===1?"":c===-2?"-2*":c+"*")+(r<0?"("+r+")":r)+"^("+v+"-1)"; Object.assign(P,{lo:1,hi,v,sub:"g",c,r}); }
    P.vals=[]; for(let k=P.lo;k<=P.hi;k++)P.vals.push(parseE(P.ex,k)); P.ans=P.vals.reduce((s,x)=>s+x,0);
    P.q=`Evaluate &nbsp;<span style="font-family:var(--mono);font-size:18px">${sigHTML(P.lo,P.hi,v,"("+pretty(P.ex)+")")}</span>`; }
  return P;
}
function solText(P){
  const t=P.terms;
  if(P.kind==="nth")return `d = ${fm(t[1])} − ${par(t[0])} = ${fm(P.d)}\na<sub>n</sub> = a<sub>1</sub> + (n − 1)d\n${A(P.n)} = ${fm(P.a1)} + (${P.n} − 1)${par(P.d)}\n    = ${fm(P.a1)} + ${fm((P.n-1)*P.d)} = <b>${fm(P.ans)}</b>`;
  if(P.kind==="nthg")return `r = ${fm(t[1])} ÷ ${par(t[0])} = ${fm(P.r)}\na<sub>n</sub> = a<sub>1</sub>·r<sup>n−1</sup>\n${A(P.n)} = ${fm(P.a1)}·${par(P.r)}<sup>${P.n-1}</sup> = ${fm(P.a1)}·${par(Math.pow(P.r,P.n-1))} = <b>${fm(P.ans,4096)}</b>`;
  if(P.kind==="formula")return P.type==="a"? `Differences are all ${fm(P.d)} → arithmetic, a<sub>1</sub> = ${fm(P.a1)}, d = ${fm(P.d)}\na<sub>n</sub> = ${fm(P.a1)} + (n − 1)${par(P.d)}\na<sub>n</sub> = <b>${linStr(P.d,P.a1-P.d)}</b>`
      : `Ratios are all ${fm(P.r)} → geometric, a<sub>1</sub> = ${fm(P.a1)}, r = ${fm(P.r)}\na<sub>n</sub> = <b>${fm(P.a1)}·${par(P.r)}<sup>n−1</sup></b>\n(type it as ${fm(P.a1)}(${fm(P.r)})^(n−1))`;
  if(P.kind==="asum"){ let s=`a<sub>1</sub> = ${fm(P.a1)}, d = ${fm(P.d)}`;
    if(P.showLast)s+=`\nnumber of terms: ${fm(P.an)} = ${fm(P.a1)} + (n − 1)${par(P.d)} → n − 1 = ${P.n-1} → n = ${P.n}`;
    else s+=`\na<sub>${P.n}</sub> = ${fm(P.a1)} + ${P.n-1}${par(P.d)} = ${fm(P.an)}`;
    return s+`\nS<sub>n</sub> = n(a<sub>1</sub> + a<sub>n</sub>)/2 = ${P.n}(${fm(P.a1)} + ${par(P.an)})/2 = <b>${fm(P.ans)}</b>`; }
  if(P.kind==="gsum")return `a<sub>1</sub> = ${fm(P.a1)}, r = ${fm(P.r)}, n = ${P.n}\nS<sub>n</sub> = a<sub>1</sub>(1 − r<sup>n</sup>)/(1 − r)\nS<sub>${P.n}</sub> = ${fm(P.a1)}(1 − ${par(Math.pow(P.r,P.n))})/(1 − ${par(P.r)}) = <b>${fx(P.ans)}</b>`;
  if(P.kind==="inf")return P.div? `r = ${fm(t[1])} ÷ ${par(t[0])} = ${fm(P.r)}\n|r| = ${fm(Math.abs(P.r))} ≥ 1, so the terms don't shrink to 0.\nThe series <b>diverges</b> (no finite sum).`
      : `r = ${fm(t[1])} ÷ ${par(t[0])} = ${fm(P.r)}, and |r| &lt; 1 so it converges\nS = a<sub>1</sub>/(1 − r) = ${fm(P.a1)}/(1 − ${par(P.r)}) = ${fm(P.a1)}/${par(1-P.r)} = <b>${fx(P.ans)}</b>`;
  if(P.kind==="sigma"){ const cnt=P.hi-P.lo+1;
    let s=`${P.v} = ${P.lo}, …, ${P.hi}: ${cnt} terms\n= ${P.vals.length<=8?P.vals.map(x=>fm(x)).map((x,i)=>i&&x[0]==="−"?"("+x+")":x).join(" + "):P.vals.slice(0,3).map(x=>fm(x)).join(" + ")+" + ⋯ + "+fm(P.vals[cnt-1])}`;
    if(P.sub==="a")s+=`\narithmetic: S = ${cnt}(${fm(P.vals[0])} + ${fm(P.vals[cnt-1])})/2`;
    else s+=`\ngeometric: a<sub>1</sub> = ${fm(P.c)}, r = ${fm(P.r)}: S = ${fm(P.c)}(1 − ${par(P.r)}<sup>${cnt}</sup>)/(1 − ${par(P.r)})`;
    return s+` = <b>${fm(P.ans)}</b>`; }
}
function hintText(P){
  if(P.kind==="nth")return `Find d by subtracting consecutive terms, then use a<sub>n</sub> = a<sub>1</sub> + (n − 1)d. Remember it is (n − 1)d, not nd.`;
  if(P.kind==="nthg")return `Find r by dividing a term by the one before it, then use a<sub>n</sub> = a<sub>1</sub>·r<sup>n−1</sup>. Keep the parentheses around a negative r.`;
  if(P.kind==="formula")return P.type==="a"?`The differences are constant, so it's arithmetic: start from a<sub>1</sub> + (n − 1)d.`:`The ratios are constant, so it's geometric: a<sub>1</sub>·r^(n−1). Type the exponent in parentheses: 3(2)^(n−1).`;
  if(P.kind==="asum")return P.showLast?`First find how many terms there are: solve a<sub>n</sub> = a<sub>1</sub> + (n − 1)d for n. Then use S<sub>n</sub> = n(a<sub>1</sub> + a<sub>n</sub>)/2.`:`Find the last term a<sub>${P.n}</sub> first, then pair: S<sub>n</sub> = n(a<sub>1</sub> + a<sub>n</sub>)/2.`;
  if(P.kind==="gsum")return `Use S<sub>n</sub> = a<sub>1</sub>(1 − r<sup>n</sup>)/(1 − r) with r = (second term) ÷ (first term).`;
  if(P.kind==="inf")return `Find r first. If |r| &lt; 1 use S = a<sub>1</sub>/(1 − r); if |r| ≥ 1 the series diverges.`;
  if(P.kind==="sigma")return `Plug in ${P.v} = ${P.lo}, ${P.lo+1}, …, ${P.hi} one at a time and add. The terms form a${P.sub==="a"?"n arithmetic":" geometric"} sequence, so the matching sum formula also works.`;
}
const M6={
  tab:"Challenge", lesson:"F-BF.A.2 · F-LE.A.2 · A-SSE.B.4", accent:"var(--coral)",
  title:()=>"Practice: "+({nth:"nth term (arithmetic)",nthg:"nth term (geometric)",formula:"explicit formula",asum:"arithmetic series",gsum:"geometric series",inf:"infinite geometric series",sigma:"sigma notation"}[M6.s.pr?M6.s.pr.kind:"nth"]),
  s:{kind:"mix",pr:null,streak:0,best:0,solved:0,tries:0,state:"open",reveal:false},
  streakEl:null,
  newProb(){ M6.s.pr=genProblem(M6.s.kind); M6.s.state="open"; M6.s.reveal=false; M6.s.tries=0; },
  bar(){
    btn("New problem",()=>{M6.newProb();render();},"primary");
    const sel=document.createElement("select"); sel.setAttribute("aria-label","Problem type");
    KINDS.forEach(([k,l])=>{const o=document.createElement("option");o.value=k;o.textContent=l;sel.appendChild(o);});
    sel.value=M6.s.kind; sel.onchange=()=>{M6.s.kind=sel.value;M6.newProb();render();}; bar.appendChild(sel);
    M6.streakEl=spacer(""); M6.upStreak();
  },
  upStreak(){ if(M6.streakEl)M6.streakEl.textContent="Streak "+M6.s.streak+" · Best "+M6.s.best+" · Solved "+M6.s.solved; },
  draw(){
    if(!M6.s.pr)M6.newProb();
    const g=root(), P=M6.s.pr, show=M6.s.state==="right"||M6.s.reveal;
    if(P.kind==="sigma"){
      T(g,200,200,"Σ","big","var(--ink)","middle",{style:"font-size:120px;fill:var(--ink)"});
      T(g,200,108,String(P.hi),"big"); T(g,200,288,P.v+" = "+minus(P.lo),"big");
      T(g,268,200,"("+P.ex.replace(/\*/g,"·").replace(/-/g,"−").replace(/\^\(([^()]*)\)/g,(m,e)=>sups(e.replace(/−/g,"-"))).replace(/\^(\d)/g,(m,e)=>sups(e))+")","big","var(--vert)","start");
      if(show){ const cnt=P.vals.length, s=cnt<=7?P.vals.map(x=>fm(x)).join(" + "):P.vals.slice(0,4).map(x=>fm(x)).join(" + ")+" + ⋯ + "+fm(P.vals[cnt-1]);
        T(g,VW/2,368,"= "+s,"sm","var(--ink)"); T(g,VW/2,404,"= "+fm(P.ans),"big","#047857"); }
      return;
    }
    const t=P.terms, n0=t.length, sum=P.kind==="asum"||P.kind==="gsum"||P.kind==="inf";
    const N=sum&&show? Math.min(P.kind==="inf"?12:P.n,15) : n0+2;
    const all=[]; for(let n=1;n<=N;n++)all.push(P.type==="a"?P.a1+(n-1)*P.d:P.a1*Math.pow(P.r,n-1));
    const ps=[]; all.reduce((s,x,i)=>(ps[i]=s+x),0);
    const vals=all.concat(sum&&show?ps:[]).concat(sum&&show&&P.kind==="inf"&&!P.div?[P.ans]:[]);
    const F=frame(g,{N,vals,ylab:sum&&show?"aₙ, Sₙ":"aₙ"}), pg=F.pg;
    if(sum&&show){ if(P.kind==="inf"&&!P.div){ const y=F.Y(P.ans); L(pg,F.Lm,y,VW-F.Rm,y,"var(--alt)",2.2,"9 6"); T(g,VW-F.Rm-6,clamp(y-12,F.Tm+8,VH-F.Bm-8),"S = "+fm(P.ans),"sm","#047857","end"); }
      ps.forEach((v,i)=>pdot(pg,F,i+1,v,"var(--magenta)",{r:5})); T(g,F.Lm+8,F.Tm+12,"● Sₙ partial sums","dvn","#BE185D","start"); }
    all.forEach((v,i)=>{ const given=i<n0, p=pdot(pg,F,i+1,v,"var(--vert)",{ghost:!given&&!show});
      if(given&&N<=8)vlab(pg,F,p[0],p[1],v,fm(v),"#6D28D9"); else if(!given&&!show&&N<=8)T(pg,p[0],clamp(p[1]-15,F.Tm+8,VH-F.Bm-8),"?","dvn","#6D28D9"); });
  },
  panel(full){
    const P=M6.s.pr;
    if(!full&&document.getElementById("chk"))return;
    const fmtHelp=P.expr?`Type an expression in <b>n</b>, e.g. <b>4n − 1</b>, <b>3(2)^(n−1)</b> or <b>96(1/2)^(n−1)</b>. Any equivalent form is accepted — it is checked at n = 1 to 7.`
      : P.allowDiv?`Type a number or a fraction like <b>27/2</b>, or the word <b>diverges</b>.`
      : `Type an integer, a decimal, or a fraction like <b>−3/8</b>. Decimals rounded to the nearest hundredth are accepted.`;
    side.innerHTML=`<div class="panel"><h3>Problem</h3><div class="pad"><p class="prob" id="prob" data-given='${JSON.stringify({kind:P.kind,a1:P.a1,d:P.d,r:P.r,n:P.n,div:!!P.div,ans:isFinite(P.ans)?P.ans:null,ex:P.ex||null,lo:P.lo,hi:P.hi,terms:P.terms||null})}'>${P.q}</p></div>
      <label class="fld" for="ans0">${P.expr?"a<sub>n</sub> =":"Answer"}</label><div class="fldwrap"><input type="text" id="ans0" autocomplete="off" spellcheck="false" placeholder="${P.expr?"e.g. 5n − 2":P.allowDiv?"number or diverges":"e.g. 42 or 7/2"}"></div>
      <div class="fldwrap" style="margin:16px 0 4px;display:flex;gap:10px;flex-wrap:wrap">
        <button id="chk" class="go" type="button" style="flex:1 1 140px">Check answer</button>
        <button id="sol" class="ghost" type="button">Show solution</button>
      </div><div id="fb6"></div><div style="height:4px"></div></div>
      <div class="panel"><h3>How answers are checked</h3><div class="pad"><p>${fmtHelp}</p>
      <p>Get one right on the first try to grow your streak. A wrong answer resets it, gives you a hint, and lets you try again.</p></div></div>`;
    const inp=document.getElementById("ans0"), fb=document.getElementById("fb6");
    const showSol=good=>{ fb.innerHTML=(good||"")+`<div class="fldwrap"><div class="eq">${solText(P)}</div></div>`; };
    const check=()=>{
      if(M6.s.state==="right")return;
      const raw=inp.value.trim(); let ok=false;
      if(!raw){ fb.innerHTML=`<div class="verdict bad"><b>Type an answer first.</b></div>`; return; }
      if(P.allowDiv&&/diverg|dne|none|no sum|infinit|∞|undefined/i.test(raw)) ok=!!P.div;
      else if(P.expr){
        const vs=[1,2,3,4,5,6,7].map(n=>parseE(raw,n));
        if(vs.some(v=>!isFinite(v))){ fb.innerHTML=`<div class="verdict bad"><b>I can't read that.</b> Use n, numbers, + − * / ^ and parentheses, e.g. 3(2)^(n−1).</div>`; return; }
        ok=vs.every((v,i)=>{ const e=P.f(i+1); return Math.abs(v-e)<=1e-6*Math.max(1,Math.abs(e)); });
      } else {
        const v=parseE(raw);
        if(!isFinite(v)){ fb.innerHTML=`<div class="verdict bad"><b>I can't read that.</b> Use an integer, a decimal, or a fraction like 7/2${P.allowDiv?", or the word diverges":""}.</div>`; return; }
        ok=!P.div&&Math.abs(v-P.ans)<=0.0051+1e-9*Math.abs(P.ans);
      }
      if(ok){
        M6.s.state="right"; if(M6.s.tries===0&&!M6.s.reveal){ M6.s.streak++; M6.s.best=Math.max(M6.s.best,M6.s.streak); } M6.s.solved++; M6.upStreak();
        clear(); M6.draw();
        showSol(`<div class="verdict good"><b>Correct!</b> ${M6.s.tries||M6.s.reveal?"Got there — the streak counts first-try answers only.":"Streak "+M6.s.streak+"."} Compare your work with the solution, then press <b>New problem</b>.</div>`);
        inp.disabled=true;
      } else {
        M6.s.tries++; M6.s.streak=0; M6.upStreak();
        fb.innerHTML=`<div class="verdict bad"><b>Not quite.</b> ${P.div&&!/diverg/i.test(raw)?"Look at the size of r before you use a formula. ":""}${hintText(P)}</div>`;
      }
    };
    document.getElementById("chk").onclick=check;
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter")check(); });
    document.getElementById("sol").onclick=()=>{ M6.s.reveal=true; if(M6.s.state!=="right"){M6.s.streak=0;M6.upStreak();} clear(); M6.draw(); showSol(`<div class="verdict bad" style="background:rgba(255,217,61,.10);border-color:rgba(255,217,61,.35);color:#FBEFC9"><b>Worked solution.</b> Study it, then press <b>New problem</b> and try one on your own.</div>`); };
  }
};

/* ══════════════════════ controller ══════════════════════ */
const MODS=[M1,M2,M3,M4,M5,M6];
function setFS(){ FS=(window.innerWidth<=560)?1.55:1; }
window.addEventListener("resize",()=>{ const o=FS; setFS(); if(o!==FS)update(); });
function update(){ setFS(); const M=MODS[cur]; sliders.forEach(f=>f()); bTitle.textContent=M.title(); clear(); M.draw(); M.panel(false); }
function render(){
  setFS(); const M=MODS[cur];
  document.documentElement.style.setProperty("--accent",M.accent||"var(--cyan)");
  bTitle.textContent=M.title(); bLesson.textContent=M.lesson;
  cv.setAttribute("aria-label",M.tab+" — "+M.title());
  if(M===M6&&!M6.s.pr)M6.newProb();
  bar.innerHTML=""; sliders=[]; playB=null; M.bar();
  clear(); M.draw(); M.panel(true);
  [...tabsEl.children].forEach((b,i)=>{ b.setAttribute("aria-selected",String(i===cur)); b.tabIndex=i===cur?0:-1; });
}
function go(i,push){
  stopPlay(); if(animId){cancelAnimationFrame(animId);animId=null;}
  cur=clamp(i,0,MODS.length-1);
  if(push){ try{history.replaceState(null,"","#tab-"+(cur+1));}catch(_){location.hash="tab-"+(cur+1);} }
  render();
}
MODS.forEach((M,i)=>{
  const b=document.createElement("button"); b.type="button"; b.setAttribute("role","tab"); b.id="tabbtn-"+(i+1);
  b.innerHTML='<span class="n">'+String(i+1).padStart(2,"0")+'</span>'+M.tab;
  b.onclick=()=>go(i,true);
  b.onkeydown=e=>{ if(e.key==="ArrowRight"||e.key==="ArrowLeft"){ e.preventDefault(); const j=(cur+(e.key==="ArrowRight"?1:-1)+MODS.length)%MODS.length; go(j,true); tabsEl.children[j].focus(); } };
  tabsEl.appendChild(b);
});
const fromHash=()=>{ const m=/^#tab-(\d+)$/.exec(location.hash); return m? clamp(+m[1]-1,0,MODS.length-1) : 0; };
window.addEventListener("hashchange",()=>{ const i=fromHash(); if(i!==cur)go(i,false); });
go(fromHash(),false);
})();
