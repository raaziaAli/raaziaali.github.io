<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chalkline — Mrs. Ali's Classroom</title>
<style>
:root{
  --paper:#F0EDE4; --paper-2:#E6E2D6; --ink:#22202B; --ink-soft:#5F5A6B;
  --ditto:#5B3EA6; --ditto-soft:#DED2F5; --flag:#C2412B; --true:#2C7A5F; --rule:#C7C1B2;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding:0 0 72px}
.wrap{max-width:660px;margin:0 auto;padding:0 20px}
.hide{display:none !important}

/* masthead */
.masthead{padding:28px 0 0}
.title{font-family:var(--mono);font-size:15px;letter-spacing:.42em;text-transform:uppercase;color:var(--ditto);font-weight:700;margin:0}
.sub{font-size:13px;color:var(--ink-soft);margin:6px 0 16px}
.fields{display:flex;flex-wrap:wrap;gap:4px 20px;border-top:1.5px solid var(--ink);border-bottom:1px solid var(--rule);
  padding:9px 0;margin-bottom:24px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.fields b{color:var(--ink);font-weight:600}
.void{color:var(--ditto);text-decoration:line-through 1.5px}

/* tabs */
.tabs{display:flex;gap:8px;margin-bottom:26px}
.tab{flex:1;padding:13px 10px;background:transparent;cursor:pointer;border:1.5px solid var(--rule);border-radius:2px;
  font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);transition:all .15s ease}
.tab:hover{border-color:var(--ditto);color:var(--ditto)}
.tab[data-on="1"]{background:var(--ditto);border-color:var(--ditto);color:var(--paper);font-weight:700}

/* blocks */
.card{border:1.5px solid var(--rule);border-radius:3px;padding:20px;background:rgba(255,255,255,.42)}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ditto);font-weight:700;margin-bottom:10px}
.lede{font-size:16.5px;line-height:1.55;margin:0 0 14px}
.note{font-size:13.5px;line-height:1.6;color:var(--ink-soft);margin:0 0 10px}
.btn{display:inline-block;border:1.5px solid var(--ditto);background:var(--ditto);color:var(--paper);font-family:var(--mono);
  font-size:12.5px;letter-spacing:.13em;text-transform:uppercase;padding:14px 22px;border-radius:2px;cursor:pointer;transition:transform .12s ease,background .12s ease}
.btn:hover{background:#4B3190}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:default}
.ghost{background:transparent;color:var(--ditto)}
.ghost:hover{background:var(--ditto-soft)}
.sm{padding:9px 14px;font-size:11px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button:focus-visible,input:focus-visible{outline:2.5px solid var(--flag);outline-offset:2px}

/* progress */
.ticks{display:flex;gap:3px;margin-bottom:22px}
.tick{height:5px;flex:1;background:var(--paper-2);border-radius:1px}
.tick[data-s="done"]{background:var(--ditto)}
.tick[data-s="now"]{background:var(--flag)}

/* question */
.qmeta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:18px}
.qnum{color:var(--ditto);font-weight:700}
.statement{font-size:clamp(21px,5.2vw,27px);line-height:1.35;font-weight:500;letter-spacing:-.011em;margin:0 0 34px;min-height:132px;animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{padding:26px 14px;background:transparent;cursor:pointer;border:1.5px solid var(--ink);border-radius:3px;
  font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);font-weight:600;transition:background .12s,color .12s,transform .12s}
.choice:hover{background:var(--ink);color:var(--paper)}
.choice:active{transform:translateY(1px)}
.back{background:none;border:none;cursor:pointer;padding:14px 0 0;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.back:hover{color:var(--ditto)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1.5px solid var(--rule);margin-bottom:30px}
.stat{background:var(--paper);padding:15px 12px}
.stat-n{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--ditto);font-variant-numeric:tabular-nums;line-height:1}
.stat-l{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);margin-top:7px}

/* histogram */
.hist{display:flex;align-items:flex-end;gap:2px;height:116px;border-bottom:1.5px solid var(--ink);margin-bottom:6px}
.bar{flex:1;background:var(--ditto-soft);border:1.5px solid var(--ditto);border-bottom:none;border-radius:2px 2px 0 0;min-height:2px;position:relative;transition:height .5s ease}
.bar b{position:absolute;top:-17px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:9.5px;color:var(--ditto)}
.hist-x{display:flex;gap:2px;font-family:var(--mono);font-size:9px;color:var(--ink-soft)}
.hist-x span{flex:1;text-align:center}

/* result rows */
.qrow{padding:20px 0;border-bottom:1px solid var(--rule)}
.qrow:last-child{border-bottom:none}
.qtext{font-size:15.5px;line-height:1.5;margin:6px 0 18px}
.line{position:relative;height:34px;margin-bottom:9px}
.axis{position:absolute;top:15px;left:0;right:0;height:3px;background:var(--paper-2);border-radius:2px}
.zone{position:absolute;top:15px;height:3px;background:var(--true);opacity:.34;border-radius:2px}
.mark{position:absolute;top:6px;width:3px;height:21px;background:var(--ditto);transform:translateX(-50%);transition:left .6s cubic-bezier(.2,.7,.2,1)}
.mark::after{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:13px;height:13px;border-radius:50%;background:var(--ditto);border:2.5px solid var(--paper)}
.ends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft)}
.read{font-family:var(--mono);font-size:11.5px;margin-top:11px;color:var(--ink-soft);line-height:1.7}
.read b{color:var(--ink)}
.badge{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;border-radius:2px;margin-right:7px;font-weight:700}
.badge[data-t="solid"]{background:var(--true);color:var(--paper)}
.badge[data-t="split"]{background:var(--flag);color:var(--paper)}
.badge[data-t="flip"]{background:var(--ink);color:var(--paper)}
.why{font-size:13.5px;line-height:1.6;color:var(--ink-soft);border-left:2.5px solid var(--ditto-soft);padding-left:13px;margin-top:12px}

.h{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);font-weight:700;
  border-bottom:1.5px solid var(--ink);padding-bottom:8px;margin:36px 0 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.h button{background:none;border:none;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--ditto);padding:0}
.input{font-family:var(--mono);font-size:13px;padding:11px 12px;border:1.5px solid var(--rule);border-radius:2px;background:var(--paper);color:var(--ink);width:170px}
.you{border:1.5px solid var(--ditto);border-radius:3px;padding:18px;margin-bottom:26px;background:var(--ditto-soft)}
.you-n{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--ditto);font-variant-numeric:tabular-nums}
.mini{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.flagtext{color:var(--flag)}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-soft);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot button{background:none;border:none;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--ink-soft);padding:0}
.foot button:hover{color:var(--ditto)}
.link{font-family:var(--mono);font-size:11px;word-break:break-all;color:var(--ditto);background:var(--paper-2);padding:8px 10px;border-radius:2px;display:block;margin:8px 0}
@media (max-width:430px){.stats{grid-template-columns:1fr 1fr}.statement{min-height:108px}}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1 class="title">Chalkline</h1>
    <p class="sub">Statements to agree or disagree with. No grade, no names.</p>
    <div class="fields">
      <span>Name <span class="void">not collected</span></span>
      <span>Class <b id="f-class">—</b></span>
      <span>Session <b id="f-session">—</b></span>
      <span>Responses <b id="f-count">—</b></span>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>
  <p class="note flagtext hide" id="status" role="status"></p>

  <section id="view-intro"></section>
  <section id="view-poll" class="hide"></section>
  <section id="view-results" class="hide"></section>
  <section id="view-teacher" class="hide"></section>

  <footer class="foot">
    <span>No names · no accounts · no sign-in</span>
    <button id="teacher-toggle">Teacher</button>
  </footer>
</div>

<script>
/* ==========================================================================
   CHALKLINE — first-day thinking check for Algebra 1 and Geometry
   Mrs. Ali's Classroom
   --------------------------------------------------------------------------
   SETUP: paste your Google Apps Script /exec URL into ENDPOINT below,
   and change TEACHER_CODE. Everything else works as-is.
   Session labels come from the link:  chalkline.html?class=geo&session=P3
   ========================================================================== */

const ENDPOINT = "https://script.google.com/macros/s/AKfycbx0O-DC68x_MnOQZWYg3QbV60Y3dyKHRovwqj8ywxGbC-Wp3pdmTX4TqnEYDtGBGbY7/exec";              // <-- paste your Apps Script Web App URL here
const TEACHER_CODE = "CHALK-2026"; // <-- change this
const DEFAULT_SESSION = "DAY1";

/* ---------------------------- QUESTION BANK ---------------------------- */

const SUBJECTS = { alg:{code:"alg",label:"Algebra 1"}, geo:{code:"geo",label:"Geometry"} };

const QUESTIONS = {
alg:[
 {unit:"1 · Expressions & equations", text:"3x + 4 is the same as 7x.", key:"d",
  why:"3x and 4 count different things, so they can't be combined. Test x = 2: 3x + 4 is 10, but 7x is 14."},
 {unit:"1 · Expressions & equations", text:"2(x + 3) and 2x + 6 give the same value for every x.", key:"a",
  why:"Different form, same value. Distributing rewrites an expression without changing what it equals."},
 {unit:"1 · Expressions & equations", text:"The expression −x always stands for a negative number.", key:"d",
  why:"The sign means \u201Cthe opposite of x.\u201D If x = −5, then −x = 5."},
 {unit:"1 · Expressions & equations", text:"To solve 2x + 5 = 15 you have to subtract 5 before you divide by 2.", key:"d",
  why:"Subtracting first is easier, not required. Dividing everything by 2 first gives x + 2.5 = 7.5, and x = 5 either way."},
 {unit:"1 · Expressions & equations", text:"5 − 2(x + 3) is the same as 3(x + 3).", key:"d",
  why:"You can't subtract 5 − 2 before distributing. It becomes 5 − 2x − 6, which is −2x − 1."},

 {unit:"2 · Inequalities", text:"−2x > 10 has exactly the same solutions as x > −5.", key:"d",
  why:"Dividing by a negative flips the sign: x < −5. Check x = 0 in the original — it fails."},
 {unit:"2 · Inequalities", text:"If x > 5, then x has to be a positive number.", key:"a",
  why:"Everything to the right of 5 on the number line is also to the right of 0."},
 {unit:"2 · Inequalities", text:"The solution to an inequality is usually a whole set of numbers, not one number.", key:"a",
  why:"An equation typically pins down a value; an inequality describes a region of the number line."},
 {unit:"2 · Inequalities", text:"x + 4 > x + 1 has no solution.", key:"d",
  why:"It simplifies to 4 > 1, which is true no matter what x is. Every real number works."},

 {unit:"3 · Linear functions & graphing", text:"The line y = 3x − 2 is steeper than the line y = −4x + 1.", key:"d",
  why:"Steepness is the size of the slope, ignoring direction. |−4| beats |3|, so the second line is steeper."},
 {unit:"3 · Linear functions & graphing", text:"The point (2, 5) is on the line y = 2x + 1.", key:"a",
  why:"Substituting x = 2 gives 2(2) + 1 = 5. A point is on a line exactly when it makes the equation true."},
 {unit:"3 · Linear functions & graphing", text:"Two different-looking equations can graph the very same line.", key:"a",
  why:"y = 2x + 1 and 2y = 4x + 2 draw one line. Form and graph are different questions."},
 {unit:"3 · Linear functions & graphing", text:"Every straight line drawn on a coordinate plane is a function.", key:"d",
  why:"A vertical line assigns many outputs to one input, so it fails the vertical line test."},

 {unit:"4 · Exponents & polynomials", text:"(x + 3)² simplifies exactly to x² + 9.", key:"d",
  why:"Squaring a sum is not squaring the parts. It's x² + 6x + 9 — try x = 1 and you get 16, not 10."},
 {unit:"4 · Exponents & polynomials", text:"x² + x² is equal to 2x².", key:"a",
  why:"Adding two of the same term doubles it. Only multiplying the terms would touch the exponent."},
 {unit:"4 · Exponents & polynomials", text:"x⁵ · x² is equal to x¹⁰.", key:"d",
  why:"Same base multiplied means exponents add: x⁷. Multiplying exponents is the power-to-a-power rule."},
 {unit:"4 · Exponents & polynomials", text:"Any number or variable raised to the power of 0 equals 0.", key:"d",
  why:"It equals 1 for every nonzero base. Follow the pattern down: x³, x², x¹, x⁰ — each step divides by x."},

 {unit:"5 · Quadratic functions", text:"A quadratic equation always has two real solutions.", key:"d",
  why:"It can have two, one, or none, depending on where the parabola sits relative to the x-axis."},
 {unit:"5 · Quadratic functions", text:"If (x − 2)(x + 5) = 0, the solutions are x = 2 and x = −5.", key:"a",
  why:"A product is zero only when a factor is zero. That property is the whole reason factoring solves equations."},
 {unit:"5 · Quadratic functions", text:"A parabola can cross the x-axis exactly once.", key:"a",
  why:"When the vertex sits on the axis there's one repeated solution — the graph touches and turns."}
],
geo:[
 {unit:"1 · Congruence, constructions & proof", text:"Sliding, turning, or flipping a figure leaves every side length and angle exactly the same.", key:"a",
  why:"Translations, rotations and reflections preserve distance and angle. That's what makes them the basis of congruence."},
 {unit:"1 · Congruence, constructions & proof", text:"Two triangles with the same three angle measures must be congruent.", key:"d",
  why:"Equal angles fix the shape, not the size — that's similarity. AAA is not a congruence criterion."},
 {unit:"1 · Congruence, constructions & proof", text:"A figure and its mirror image can't be congruent, because they face opposite ways.", key:"d",
  why:"A reflection preserves every length and angle, so a figure and its mirror image are congruent."},
 {unit:"1 · Congruence, constructions & proof", text:"When two compass arcs cross, that crossing point is exactly the same distance from both centers.", key:"a",
  why:"Every point on a circle sits one radius from its center, so a crossing point inherits both distances. Constructions are arguments, not drawings."},

 {unit:"2 · Similarity & right-triangle trig", text:"Doubling every side length of a rectangle doubles its area.", key:"d",
  why:"Scaling sides by 2 scales area by 2², so it quadruples. Volume would scale by 2³."},
 {unit:"2 · Similarity & right-triangle trig", text:"Every circle is similar to every other circle.", key:"a",
  why:"Any circle can be scaled onto any other. Same shape, different size."},
 {unit:"2 · Similarity & right-triangle trig", text:"If two figures are similar, matching angles are equal but matching sides usually are not.", key:"a",
  why:"Similarity keeps angles and scales lengths by a constant factor."},
 {unit:"2 · Similarity & right-triangle trig", text:"The sine of an angle depends on how big the right triangle is.", key:"d",
  why:"Sine is a ratio of two sides. All right triangles with that angle are similar, so the ratio never changes."},

 {unit:"3 · Extending to three dimensions", text:"Two containers with completely different shapes can hold exactly the same amount.", key:"a",
  why:"Volume measures space filled, not appearance. Cavalieri's principle makes this precise later."},
 {unit:"3 · Extending to three dimensions", text:"Slicing a cylinder straight down through the middle gives a circular cross-section.", key:"d",
  why:"A vertical slice gives a rectangle. Only horizontal slices give circles."},
 {unit:"3 · Extending to three dimensions", text:"A cone and a cylinder with the same base and the same height hold the same amount.", key:"d",
  why:"The cone holds one third as much. That 1/3 is the fact to hold on to — and later, to justify."},
 {unit:"3 · Extending to three dimensions", text:"Spinning a rectangle around one of its sides sweeps out a cylinder.", key:"a",
  why:"Rotating a flat shape traces a solid. This is where cylinders, cones and spheres come from."},

 {unit:"4 · Coordinates & algebraic geometry", text:"If a quadrilateral on a grid has four equal sides, it must be a square.", key:"d",
  why:"A rhombus also has four equal sides. You need a right angle — or perpendicular slopes — to pin down a square."},
 {unit:"4 · Coordinates & algebraic geometry", text:"Two lines are perpendicular when their slopes are opposite reciprocals, like 2/3 and −3/2.", key:"a",
  why:"Their product is −1. This is how you prove a right angle on a grid without a protractor."},
 {unit:"4 · Coordinates & algebraic geometry", text:"You can find the distance between two grid points using the Pythagorean theorem.", key:"a",
  why:"The horizontal and vertical gaps are the legs of a right triangle; the distance is the hypotenuse."},
 {unit:"4 · Coordinates & algebraic geometry", text:"Two lines with the same slope are always the same line.", key:"d",
  why:"Equal slopes with different intercepts give parallel lines that never meet."},

 {unit:"5 · Circles", text:"The distance around a circle is a little more than three times its diameter — for every circle.", key:"a",
  why:"That ratio is π, and it's identical for a coin and a stadium."},
 {unit:"5 · Circles", text:"A tangent line touches a circle at exactly one point, and meets the radius there at a right angle.", key:"a",
  why:"That right angle is the workhorse of nearly every tangent problem you'll see."},
 {unit:"5 · Circles", text:"An angle at the center of a circle and an angle drawn on the circle opening to the same arc have equal measure.", key:"d",
  why:"The inscribed angle is half the central angle. This one surprises almost everyone the first time."},
 {unit:"5 · Circles", text:"A chord of a circle can be longer than the diameter.", key:"d",
  why:"The diameter is the longest chord there is — it's the only one passing through the center."}
]};

/* ------------------------------ PLUMBING ------------------------------ */

const params = new URLSearchParams(location.search);
const SESSION = clean(params.get("session")) || DEFAULT_SESSION;
const LOCKED = SUBJECTS[params.get("class")] ? params.get("class") : null;

const MODE = ENDPOINT ? "remote" : (window.storage ? "artifact" : "local");

const S = {
  subject: LOCKED || "alg",
  view: "intro",
  step: 0,
  answers: [],
  mine: {},
  responses: [],
  loading: false,
  sortBy: "order",
  teacherOK: false,
  timer: null
};

function clean(v){ return String(v||"").toUpperCase().replace(/[^A-Z0-9-]/g,"").slice(0,12); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function $(id){ return document.getElementById(id); }

/* --- local flags: remembers this browser already answered (no identity) --- */
function localGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function localSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

/* --- storage adapter: remote endpoint / artifact storage / this browser --- */
const store = {
  async submit(subject, answers){
    if (MODE === "remote"){
      const key = QUESTIONS[subject].map(q => q.key).join("");
      const body = JSON.stringify({action:"submit", subject, session:SESSION, answers, key});
      const opts = {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body}; // simple request: no preflight
      try {
        const r = await fetch(ENDPOINT, opts);
        const t = await r.text();
        if (t.indexOf('"ok":true') !== -1) return {confirmed:true};
        if (t.indexOf("accounts.google.com") !== -1 || t.indexOf("<html") !== -1)
          return {confirmed:false, hint:"The endpoint asked for a Google sign-in. Redeploy the Web app with access set to Anyone."};
        return {confirmed:false, hint:"The endpoint replied but didn't confirm the save. Run ?action=ping on your /exec URL."};
      } catch(e){
        await fetch(ENDPOINT, {...opts, mode:"no-cors"}); // fallback: fire and forget
        return {confirmed:false, hint:"Sent, but the endpoint didn't reply. Check the Sheet before the next class."};
      }
    }
    if (MODE === "artifact"){
      const tag = Math.random().toString(36).slice(2,9);
      await window.storage.set(`cl${Math.floor(Math.random()*5)}:${subject}:${SESSION}:${answers}:${tag}`, "1", true);
      return {confirmed:true};
    }
    const k = `cl:demo:${subject}:${SESSION}`;
    const all = JSON.parse(localGet(k) || "[]");
    all.push(answers); localSet(k, JSON.stringify(all));
    return {confirmed:true};
  },
  async results(subject){
    if (MODE === "remote"){
      const url = `${ENDPOINT}?action=results&subject=${subject}&session=${encodeURIComponent(SESSION)}`;
      const r = await fetch(url);
      const j = await r.json();
      return (j.answers || []);
    }
    if (MODE === "artifact"){
      const out = [];
      for (let s=0; s<5; s++){
        const res = await window.storage.list(`cl${s}:${subject}:`, true);
        ((res && res.keys) || []).forEach(k => {
          const p = k.split(":");
          if (p.length === 5 && p[2] === SESSION && /^[ad]+$/.test(p[3])) out.push(p[3]);
        });
      }
      return out;
    }
    return JSON.parse(localGet(`cl:demo:${subject}:${SESSION}`) || "[]");
  }
};

/* ------------------------------ SCORING ------------------------------ */

function scoreOf(ans, subject){
  const qs = QUESTIONS[subject]; let n = 0;
  for (let i=0;i<qs.length;i++) if (ans[i] === qs[i].key) n++;
  return n;
}

function summarize(list, subject){
  const qs = QUESTIONS[subject];
  const per = qs.map(()=>({a:0,d:0}));
  const dist = new Array(qs.length+1).fill(0);
  let correct = 0;
  const valid = list.filter(a => typeof a === "string" && a.length === qs.length && /^[ad]+$/.test(a));
  valid.forEach(a => {
    for (let i=0;i<qs.length;i++) a[i] === "a" ? per[i].a++ : per[i].d++;
    const s = scoreOf(a, subject); dist[s]++; correct += s;
  });
  const n = valid.length;
  const rows = qs.map((q,i)=>{
    const t = per[i].a + per[i].d || 1;
    const withKey = q.key === "a" ? per[i].a : per[i].d;
    return {...q, index:i, agree:per[i].a, disagree:per[i].d,
            pctAgree:(per[i].a/t)*100, pctCorrect:(withKey/t)*100};
  });
  return {n, rows, dist, mean: n ? correct/n : 0, acc: n ? (correct/(n*qs.length))*100 : 0};
}

/* ------------------------------ RENDER ------------------------------ */

function setStatus(msg, show){
  const el = $("status"); el.textContent = msg || ""; el.classList.toggle("hide", !show);
}

function renderChrome(sum){
  $("f-class").textContent = SUBJECTS[S.subject].label;
  $("f-session").textContent = SESSION;
  $("f-count").textContent = sum && sum.n ? sum.n : "—";
  const tabs = $("tabs");
  tabs.classList.toggle("hide", S.view === "poll" || !!LOCKED);
  if (!tabs.dataset.built){
    tabs.innerHTML = Object.values(SUBJECTS).map(s =>
      `<button class="tab" data-code="${s.code}">${s.label}</button>`).join("");
    tabs.dataset.built = "1";
    tabs.querySelectorAll(".tab").forEach(b => b.onclick = () => {
      S.subject = b.dataset.code; S.responses = []; S.view = "intro"; draw(); load();
    });
  }
  tabs.querySelectorAll(".tab").forEach(b => b.dataset.on = b.dataset.code === S.subject ? "1" : "0");
}

function draw(){
  const sum = summarize(S.responses, S.subject);
  renderChrome(sum);
  ["intro","poll","results","teacher"].forEach(v =>
    $("view-"+v).classList.toggle("hide", v !== S.view));
  if (S.view === "intro") drawIntro();
  if (S.view === "poll") drawPoll();
  if (S.view === "results") drawResults(sum);
  if (S.view === "teacher") drawTeacher(sum);
}

function drawIntro(){
  const label = SUBJECTS[S.subject].label;
  const n = QUESTIONS[S.subject].length;
  const done = !!S.mine[S.subject];
  $("view-intro").innerHTML = `
    <div class="card">
      <div class="eyebrow">${label} · Day one</div>
      <p class="lede">${n} statements about ${label.toLowerCase()}. Some are true. Some sound true.
        Say whether you agree or disagree.</p>
      <p class="note">This isn't a test and it isn't graded. It shows your teacher what the room already
        knows, so class starts in the right place. Your answers go in without your name attached.</p>
      ${done
        ? `<div class="row" style="margin-top:16px"><button class="btn" id="go-results">See the class results</button>
           <span class="mini">You've already answered</span></div>`
        : `<button class="btn" id="go-start" style="margin-top:16px">Start · ${n} statements</button>`}
    </div>`;
  if (done) $("go-results").onclick = () => { S.view = "results"; draw(); load(); };
  else $("go-start").onclick = () => { S.answers = []; S.step = 0; S.view = "poll"; draw(); };
}

function drawPoll(){
  const qs = QUESTIONS[S.subject], q = qs[S.step];
  $("view-poll").innerHTML = `
    <div class="ticks" aria-hidden="true">
      ${qs.map((_,i)=>`<div class="tick" data-s="${i<S.answers.length?"done":i===S.step?"now":"todo"}"></div>`).join("")}
    </div>
    <div class="qmeta">
      <span class="qnum">${String(S.step+1).padStart(2,"0")} / ${qs.length}</span>
      <span>${esc(q.unit)}</span>
    </div>
    <p class="statement">${esc(q.text)}</p>
    <div class="choices">
      <button class="choice" data-v="a">Agree</button>
      <button class="choice" data-v="d">Disagree</button>
    </div>
    ${S.step>0 ? `<button class="back" id="undo">← Change my last answer</button>` : ""}`;
  $("view-poll").querySelectorAll(".choice").forEach(b => b.onclick = () => answer(b.dataset.v));
  if (S.step>0) $("undo").onclick = () => { S.answers.pop(); S.step = S.answers.length; draw(); };
}

function answer(v){
  const qs = QUESTIONS[S.subject];
  S.answers.push(v);
  if (S.answers.length === qs.length) submit(S.answers.join(""));
  else { S.step = S.answers.length; draw(); }
}

async function submit(str){
  setStatus("Sending your answers…", true);
  $("view-poll").querySelectorAll(".choice").forEach(b => b.disabled = true);
  try {
    const res = await store.submit(S.subject, str);
    S.mine[S.subject] = str;
    localSet(`cl:done:${S.subject}:${SESSION}`, str);
    if (res && res.confirmed) setStatus("", false);
    else setStatus(res && res.hint ? res.hint : "Sent, but not confirmed.", true);
  } catch(e){
    setStatus("That didn't send: " + e.message, true);
  }
  S.view = "results"; draw(); load();
}

function drawResults(sum){
  const qs = QUESTIONS[S.subject];
  const mine = S.mine[S.subject];
  const el = $("view-results");

  if (!sum.n && !S.loading){
    el.innerHTML = `<div class="card"><div class="eyebrow">Class results</div>
      <p class="lede">Nothing in yet.</p>
      <p class="note">Results appear here as the class answers. This refreshes on its own every 25 seconds.</p>
      <button class="btn sm ghost" id="rf">Refresh now</button></div>`;
    $("rf").onclick = load; return;
  }

  const maxBar = Math.max(1, ...sum.dist);
  const rows = S.sortBy === "gap" ? [...sum.rows].sort((a,b)=>a.pctCorrect-b.pctCorrect) : sum.rows;

  el.innerHTML = `
    ${mine ? `<div class="you">
      <div class="eyebrow" style="margin-bottom:6px">Your answers — on your screen only</div>
      <div class="you-n">${scoreOf(mine,S.subject)} <span style="font-size:15px">of ${qs.length}</span></div>
      <p class="note" style="margin:8px 0 0">Nobody else sees this number, and it goes in no gradebook.</p>
    </div>` : ""}

    <div class="stats">
      <div class="stat"><div class="stat-n">${sum.n}</div><div class="stat-l">Responses in</div></div>
      <div class="stat"><div class="stat-n">${Math.round(sum.acc)}%</div><div class="stat-l">Matched the key</div></div>
      <div class="stat"><div class="stat-n">${sum.mean.toFixed(1)}</div><div class="stat-l">Average of ${qs.length}</div></div>
    </div>

    <div class="h"><span>How the class scored</span></div>
    <div class="hist">${sum.dist.map(c=>
      `<div class="bar" style="height:${(c/maxBar)*100}%">${c?`<b>${c}</b>`:""}</div>`).join("")}</div>
    <div class="hist-x">${sum.dist.map((_,i)=>`<span>${i}</span>`).join("")}</div>
    <p class="note" style="margin-top:10px">Each column counts the people who matched the key that many times.
      A wide spread means the room is starting from very different places.</p>

    <div class="h"><span>Where the class landed</span>
      <button id="sortbtn">${S.sortBy==="order"?"Trickiest first ↓":"In order ↓"}</button></div>

    ${rows.map(r => {
      const tone = r.pctCorrect>=75?"solid":r.pctCorrect>=45?"split":"flip";
      const word = tone==="solid"?"Settled":tone==="split"?"Split":"Worth a day";
      return `<div class="qrow">
        <div class="qmeta" style="margin-bottom:0">
          <span class="qnum">${String(r.index+1).padStart(2,"0")}</span><span>${esc(r.unit)}</span></div>
        <p class="qtext">${esc(r.text)}</p>
        <div class="line">
          <div class="axis"></div>
          <div class="zone" style="${r.key==="a"?"left:50%;right:0":"left:0;width:50%"}"></div>
          <div class="mark" style="left:${r.pctAgree}%"></div>
        </div>
        <div class="ends"><span>Disagree</span><span>Agree</span></div>
        <div class="read"><span class="badge" data-t="${tone}">${word}</span>
          <b>${Math.round(r.pctCorrect)}%</b> matched the key · ${r.agree} agreed, ${r.disagree} disagreed ·
          key: <b>${r.key==="a"?"Agree":"Disagree"}</b>${mine?` · you: ${mine[r.index]==="a"?"Agree":"Disagree"}`:""}</div>
        <p class="why">${esc(r.why)}</p>
      </div>`;
    }).join("")}

    <div class="row" style="margin-top:26px">
      <button class="btn sm ghost" id="rf2">${S.loading?"Refreshing…":"Refresh"}</button>
      <span class="mini">Updates every 25s</span>
    </div>`;

  $("sortbtn").onclick = () => { S.sortBy = S.sortBy==="order"?"gap":"order"; draw(); };
  $("rf2").onclick = load;
}

function drawTeacher(sum){
  const el = $("view-teacher");
  if (!S.teacherOK){
    el.innerHTML = `<div class="card"><div class="eyebrow">Teacher panel</div>
      <p class="note">Enter the class code.</p>
      <div class="row"><input class="input" id="code" placeholder="Class code" aria-label="Class code" />
      <button class="btn sm" id="unlock">Unlock</button></div></div>`;
    $("unlock").onclick = () => {
      if ($("code").value.trim().toUpperCase() === TEACHER_CODE){ S.teacherOK = true; setStatus("",false); draw(); }
      else setStatus("That code doesn't match.", true);
    };
    return;
  }
  const base = location.origin + location.pathname;
  el.innerHTML = `
    <div class="card">
      <div class="eyebrow">Links for each period</div>
      <p class="note">Each link keeps its own set of responses. Share the matching link with each class —
        one QR code per period on the board works well.</p>
      <div class="row" style="margin-bottom:10px">
        <input class="input" id="per" placeholder="P3" aria-label="Period label" />
        <button class="btn sm" id="mk">Build links</button>
      </div>
      <div id="links"></div>
      <div class="eyebrow" style="margin-top:22px">This session</div>
      <p class="note">${SUBJECTS[S.subject].label} · ${SESSION} · ${sum.n} responses ·
        average ${sum.mean.toFixed(1)} of ${QUESTIONS[S.subject].length}</p>
      <div class="row">
        <button class="btn sm ghost" id="csv">Copy results as CSV</button>
        <button class="btn sm ghost" id="ping">Test connection</button>
        <button class="btn sm ghost" id="sync">Send questions to Sheet</button>
      </div>
      <p class="note" id="pingout" style="margin-top:12px"></p>
    </div>`;
  $("mk").onclick = () => {
    const p = clean($("per").value) || "DAY1";
    $("links").innerHTML = Object.values(SUBJECTS).map(s =>
      `<span class="mini">${s.label}</span><code class="link">${base}?class=${s.code}&session=${p}</code>`).join("");
  };
  $("sync").onclick = async () => {
    const out = $("pingout");
    if (!ENDPOINT){ out.textContent = "No endpoint set."; return; }
    out.textContent = "Sending…";
    try {
      for (const code of Object.keys(SUBJECTS)){
        const list = QUESTIONS[code].map(q => ({unit:q.unit, text:q.text, key:q.key}));
        await fetch(ENDPOINT, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
          body: JSON.stringify({action:"questions", subject:code, questions:list})});
      }
      out.textContent = "Statements sent. In the Sheet, use Classroom ▸ Build / refresh analysis tabs.";
    } catch(e){ out.textContent = "Couldn't send the statements: " + e.message; }
  };
  $("ping").onclick = async () => {
    const out = $("pingout");
    if (!ENDPOINT){ out.textContent = "No endpoint set. Paste your Apps Script /exec URL into ENDPOINT near the top of this file."; return; }
    out.textContent = "Testing…";
    try {
      const r = await fetch(ENDPOINT + "?action=ping");
      const t = await r.text();
      if (t.indexOf('"ok":true') !== -1){
        const d = JSON.parse(t);
        out.textContent = `Connected to "${d.spreadsheet}" · tab "${d.tab}" · ${d.rows} rows stored.`;
      } else if (t.indexOf("accounts.google.com") !== -1 || t.indexOf("<html") !== -1){
        out.textContent = "The endpoint asked for a Google sign-in. Redeploy the Web app with access set to Anyone.";
      } else {
        out.textContent = "Endpoint replied, but not as expected: " + t.slice(0,120);
      }
    } catch(e){
      out.textContent = "Couldn't reach the endpoint. Check the URL ends in /exec and the deployment is live.";
    }
  };
  $("csv").onclick = () => {
    const lines = ["#,unit,key,agree,disagree,pct_with_key,statement"].concat(
      sum.rows.map(r => `${r.index+1},"${r.unit}",${r.key==="a"?"Agree":"Disagree"},${r.agree},${r.disagree},${Math.round(r.pctCorrect)},"${r.text.replace(/"/g,"'")}"`));
    const text = `Chalkline,${SUBJECTS[S.subject].label},${SESSION},${sum.n} responses\n` + lines.join("\n");
    if (navigator.clipboard) navigator.clipboard.writeText(text);
    setStatus("Results copied. Paste into a spreadsheet.", true);
    setTimeout(()=>setStatus("",false), 3000);
  };
}

/* ------------------------------ LOADING ------------------------------ */

async function load(){
  S.loading = true;
  try {
    S.responses = await store.results(S.subject);
    if (MODE === "local") setStatus("Demo mode — responses stay in this browser. Add your endpoint to collect from the class.", true);
  } catch(e){
    setStatus("Couldn't reach the response store. Tap Refresh in a moment.", true);
  }
  S.loading = false;
  draw();
}

function boot(){
  ["alg","geo"].forEach(c => {
    const v = localGet(`cl:done:${c}:${SESSION}`);
    if (v && /^[ad]+$/.test(v) && v.length === QUESTIONS[c].length) S.mine[c] = v;
  });
  $("teacher-toggle").onclick = () => {
    S.view = S.view === "teacher" ? "intro" : "teacher";
    $("teacher-toggle").textContent = S.view === "teacher" ? "Back to poll" : "Teacher";
    draw(); if (S.view === "teacher") load();
  };
  draw(); load();
  setInterval(() => { if (S.view === "results" || S.view === "teacher") load(); }, 25000);
}
boot();
</script>
</body>
</html>
